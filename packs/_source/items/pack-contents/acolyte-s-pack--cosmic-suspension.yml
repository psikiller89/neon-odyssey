      with throwing a flask of Cosmic Suspension. Target one creature you can see within 20 feet of yourself. The target must succeed on a Dexterity saving throw (DC 8 plus your Dexterity modifier and Proficiency
      Bonus) or take 2d8 Radiant damage if it is an Aberration, a Fiend, or an Undead.</p>
