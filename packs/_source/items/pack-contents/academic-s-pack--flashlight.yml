  description:
    value: <p>A Flashlight is a handheld device that uses a Power Cell to produce light. You can turn the light on or off (no action required) once on your turn. A Power Cell powers a Flashlight for 10
      hours of use.</p><p>The Flashlight has three modes, which you can switch as a Bonus Action.</p><p><strong>Ambient.</strong> The light produces Bright Light in a 30-foot radius and Dim Light for an
      additional 30 feet.</p><p><strong>Spotlight.</strong> The light produces Bright Light in a 60-foot Cone and Dim Light for an additional 60 feet.</p><p><strong>Subtle.</strong> The light produces Dim
      Light in a 5-foot radius.</p>
