  description:
    value: <p>An Enviro Suit is a bulky garment that includes a helmet, gloves that seal each seam, and removable mag boots that allow you to walk on metal surfaces in zero gravity. The suit takes 10 minutes
      to don and 5 minutes to doff. While wearing the suit, you have Disadvantage on Dexterity (Stealth) checks. While sealed inside the suit, you have Advantage on saving throws against dangerous environments,
      and you automatically succeed on saving throws against extreme cold or extreme heat. The suit holds 24 hours of breathable atmosphere.</p><p>You can refill the suit’s atmosphere using Gas Canisters
      or by connecting it to a functioning life support system (such as those in starships).</p>
