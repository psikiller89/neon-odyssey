  description:
    value: <p>A Tiny device that detects movement within 5 feet of its front. You can activate or deactivate it as a Utilize action, and it has an adhesive pad on the back that allows it to be affixed to
      a surface as part of the same action. While activated, when a Small or larger creature or object moves within 5 feet of the sensor’s front, it emits a sound that can be heard up to 60 feet away. It
      can operate for 24 hours before needing to be recharged (which takes 1 hour connected to a power source), or it can be wired into a power source for continuous function.</p>
