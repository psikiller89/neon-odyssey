  description:
    value: <p>Power Cells are compact energy storage devices compatible with a wide spectrum of equipment. A standard Power Cell can’t be recharged. A Power Cell is empty when first crafted and can be charged
      to full once by connecting it to a power supply for 24 hours.</p><p><strong>Energy Weapons.</strong> A Power Cell powers a Ranged weapon that uses it for ammunition or a Melee weapon with the Powered
      property. A weapon’s Reload property lists how many shots or attacks a cell can power.</p><p><strong>Powered Devices.</strong> The description of a piece of equipment that requires a Power Cell to
      operate notes how long the cell can power it. You can exchange a Power Cell in a device as an action or a Bonus Action.</p>
