  description:
    value: <p>A 50-foot length of synthetic fiber rope. As a Utilize action, you can tie a knot with Synth Line if you succeed on a DC 10 Dexterity (Sleight of Hand) check. The Synth Line can be burst with
      a successful DC 20 Strength (Athletics) check as an action.</p><p>You can bind an unwilling creature with the Synth Line only if the creature has the Grappled, Incapacitated, or Restrained condition.
      If the creature’s legs are bound, the creature has the Restrained condition until it escapes. Escaping the Synth Line requires the creature to make a successful DC 15 Dexterity (Athletics) check as
      an action.</p>
