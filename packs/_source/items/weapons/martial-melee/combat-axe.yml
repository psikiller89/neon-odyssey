  description:
    value: '<p><em>1d8 Slashing; Powered (1d10; 1d12), Versatile (1d10); Mastery: Topple</em></p><p><strong>Powered.</strong> You can activate a Powered weapon that has a charged Power Cell when you make
      an attack with it. On a hit while activated, the weapon’s damage die changes to the value noted with the property. If a damage type is also noted, the weapon deals damage of that type when activated.
      If the weapon also has the Versatile property, the Powered property has a second notation for the activated damage when wielded with two hands. A full Power Cell powers the weapon for 25 attacks.
      You can exchange the cell as an action or a Bonus Action.</p>'
