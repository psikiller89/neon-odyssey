  description:
    value: '<p><em>1d6 Piercing; Ammunition (Range 150/600; Bullets), Burst, Reload (25 Shots), Versatile (1d8); Mastery: Push</em></p><p><strong>Burst.</strong> As an action, or in place of one attack
