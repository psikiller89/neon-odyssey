  description:
    value: '<p><em>2d6 Piercing; Ammunition (Range 80/320; Shells), Braced, Burst, Heavy, Reload (20 shots), Two Handed; Mastery: Cleave</em></p><p><strong>Braced.</strong> When making an attack with a
      Braced weapon, use your Strength modifier for the attack and damage rolls. If the weapon has the Heavy property, use your Strength score to determine if you can use it without Disadvantage.</p><p><strong>Burst.</strong>
      As an action, or in place of one attack when you take the Attack action, you can expend 3 shots of a Burst weapon’s ammunition and make an attack with the weapon. On a hit or a miss, a second target
      within 5 feet of the first must make a DC 15 Dexterity saving throw or take the weapon’s damage, but you don’t add your ability modifier to that damage unless it is negative.</p><p><strong>Reload.</strong>
      A Reload weapon’s ammunition is held in a magazine or a Power Cell. After the number of shots noted in the property, you must reload the weapon as an action or a Bonus Action.</p>'
