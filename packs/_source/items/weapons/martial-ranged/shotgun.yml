  description:
    value: '<p><em>1d10 Piercing; Ammunition (Range 60/240; Shells), Close Quarters, Finesse, Reload (10 Shots), Scatter (15 ft.); Mastery: Vex</em></p><p><strong>Close Quarters.</strong> Being within 5
      feet of an enemy doesn’t impose Disadvantage on your ranged attack rolls with a Close Quarters weapon.</p><p><strong>Reload.</strong> A Reload weapon’s ammunition is held in a magazine or a Power
      Cell. After the number of shots noted in the property, you must reload the weapon as an action or a Bonus Action.</p><p><strong>Scatter.</strong> As an action, you can expend 2 shots from the weapon
      to fire it in a Cone with the specified area. Each creature in that area must succeed on a DC 15 Dexterity saving throw or take damage. Roll the weapon’s damage once and apply it to each creature
      that failed the save.</p>'
