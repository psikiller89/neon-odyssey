  description:
    value: <p>As a Utilize action, you can use Handcuffs to bind an unwilling Small or Medium creature within 5 feet of yourself that has the Grappled, Incapacitated, or Restrained condition if you succeed
      on a DC 13 Dexterity (Sleight of Hand) check. While bound, a creature has Disadvantage on attack rolls, and the creature has the Restrained condition if the Handcuffs are attached to something fixed
      in place. As an action, a creature can escape the Handcuffs with a successful DC 20 Dexterity (Sleight of Hand) check or burst them with a successful DC 25 Strength (Athletics) check.</p>
