  description:
    value: <p>A Flamethrower is a pistol-like device with a pressure nozzle and an igniter beneath it. When you take the Attack action, you can replace one of your attacks with firing the Flamethrower.
      Each creature in a 15-foot Cone must succeed on a Dexterity saving throw (DC 8 plus your Dexterity modifier and Proficiency Bonus) or take 2d4 Fire damage. Flammable objects in the Cone that aren’t
      being worn or carried start burning (see the <em>D&amp;D Beyond </em> <em>Basic Rules</em>). After three uses, you must reload the Flamethrower with a Fuel Oil flask as an action or a Bonus Action.</p>
