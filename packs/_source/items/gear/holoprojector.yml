  description:
    value: <p>A Holoprojector is a compact, portable holo emitter with limited storage, about the size of a deck of cards. You can activate or deactivate it with a Utilize action, and you can select a new
      stored image as part of the same action. While activated, it projects a holographic image up to 5 feet away from it. The projector can store up to 10 images. An image can be an object, a creature,
      or a scene such as a photograph, and it can be animated with one round worth of movement or apparent actions, which can loop. The projector has enough power to operate for 10 minutes before needing
      to be recharged (which takes 1 hour connected to a power source), or it can be wired into a power source for continuous function.</p><p>Physical contact reveals the hologram for what it is. A creature
      can take the Study action to examine the image, and determines its true nature with a successful DC 13 Intelligence (Investigation) check.</p>
