    value: <p>Camo Netting is a thin mesh with multicolored swatches attached to it used to camouflage vehicles and similar sized objects. The netting is large enough to cover a Gargantuan object up to
      a 20-foot Cube. With 1 minute of work, you can cover a Huge or smaller object with the netting. Covering a Gargantuan object that fits under the net takes 10 minutes of work. Once the object is covered,
      make a Dexterity (Stealth) check to hide the object, as if you were taking the Hide action for yourself.</p>
