      lb.</td></tr><tr><td>Frag Grenade</td><td>1 lb.</td></tr><tr><td>Incendiary Grenade</td><td>2 lb.</td></tr><tr><td>Smoke Grenade</td><td>3 lb.</td></tr><tr><td>Plasma Grenade</td><td>1 1b.</td></tr></tbody></table>
