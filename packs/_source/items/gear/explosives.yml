  description:
    value: <p>Explosive devices with various effects and applications abound.</p><p><strong>Breaching Charge.</strong> Breaching Charges are blocks or satchels of explosives shaped to penetrate doors, or
      reinforced walls. You can attach a charge to a surface and arm it as a Utilize action. When you arm the charge, you can set a timer up to 1 hour, or set it to receive a signal from a transmitter or
      Communicator. You can signal a charge to explode as a Utilize action. When the charge detonates, the surface it’s attached to takes damage determined by the charge type. <strong>Small Breaching Charge.</strong>
      8d10 Force damage. Creatures within a 20-foot-radius Sphere make a DC 15 Constitution saving throw, taking 4d10 Thunder damage on a failure or half as much damage on a success. <strong>Large Breaching
      Charge.</strong> 20d10 Force damage. Creatures within a 50-foot-radius Sphere make a DC 15 Constitution saving throw, taking 10d10 Thunder damage on a failure or half as much damage on a success.</p><p><strong>Using
      Grenades.</strong> When you take the Attack action, you can replace one of your attacks with throwing a Grenade at a point up to 60 feet away or using a Grenade Launcher to fire one at a point up
      to 1,000 feet away. The Grenade explodes at that point, creating an effect in a 20-foot-radius Sphere. You can load and fire a Grenade Launcher once per action, even if you can make multiple attacks.</p><p><strong>EMP
      Grenade.</strong> Each creature in the Sphere makes a DC 15 Constitution saving throw. On a failed save, all powered devices carried by the creature don’t function for 1 minute. A Construct that fails
      the save has the Incapacitated condition for the duration. The creature repeats the save at the end of each of its turns, ending the effect on itself on a success.</p><p>A Power Cell or powered device
      in the Sphere that isn’t being worn or carried doesn’t function for 1 minute.</p><p><strong>Flashbang Grenade.</strong> Each creature in the Sphere must succeed on a DC 15 Constitution saving throw
      or have the Blinded and Deafened conditions. The creature repeats the save at the end of each of its turns, ending the effect on itself on a success. After 1 minute it succeeds automatically.</p><p><strong>Frag
      Grenade.</strong> Each creature in the Sphere makes a DC 15 Dexterity saving throw, taking 14 (4d6) Piercing damage on a failed save or half as much damage on a successful one.</p><p><strong>Incendiary
      Grenade.</strong> Each creature in the Sphere makes a DC 15 Dexterity saving throw, taking 14 (4d6) Fire damage on a failed save and starts burning, or takes half as much damage only on a successful
      one. Flammable objects in the area that aren’t being worn or carried start burning.</p><p><strong>Smoke Grenade.</strong> The Sphere is Heavily Obscured by smoke for 1 minute. A strong wind disperses
      the smoke.</p><p><strong>Plasma Grenade.</strong> Each creature in the sphere makes a DC 15 Dexterity saving throw, taking 17 (5d6) Lightning damage and can’t take Reactions until the start of its
      next turn on a failed save, or half as much damage on a successful one. Breaching Charge (Small) 1 lb. $7,500 Breaching Charge (Large) 20 lb. $25,000 Grenade Launcher 7 lb. $3,000 EMP Grenade 3 lb.
      $1,000 Flashbang Grenade 1 lb. $1,000 Frag Grenade 1 lb. $1,000 Incendiary Grenade 2 lb. $2,500 Smoke Grenade 3 lb. $250 Plasma Grenade 1 1b. $2,500</p><table><tbody><tr><td>Breaching Charge (Small)</td><td>1
