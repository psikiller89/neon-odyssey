  description:
    value: <p>A <em>Spell Chip</em> is a hypertech version of a <em>Spell Scroll</em>. A <em>Spell </em> <em>Chip</em> (Cantrip) or <em>Spell Chip</em> (Level 1) is a magic item that bears the words of
      a cantrip or level 1 spell, respectively, determined by the chip’s creator. If the spell is on your class’s spell list, you can read the spell stored on the chip (a simple reader is included, or the
      chip can be inserted in a computer or Datapad) and cast the spell using its normal casting time and without providing any Material components.</p><p>If the spell requires a saving throw or an attack
      roll, the spell save DC is 13, and the attack bonus is +5. The chip (and its included reader if any) disintegrates when the casting is completed.</p>
