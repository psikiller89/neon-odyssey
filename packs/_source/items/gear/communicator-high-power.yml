  description:
    value: <p>A High Power Communicator includes a backpack central unit with a compact antenna, and a headset or hand transceiver. It can also be easily mounted in a vehicle. A High Power Communicator
      can connect to a communication network, or it can directly connect to another comm device in a range up to 25 miles with direct line of sight. It can store comm codes or select frequencies. If you
      use the comm in an area of jamming, if you succeed on a DC 15 Intelligence (Computers) check, the comm functions until the start of your next turn. A Power Cell powers the unit for 24 hours of use.</p><p>If
      you aren’t maintaining a Lifestyle, the communicator can’t connect to a comm network.</p>
