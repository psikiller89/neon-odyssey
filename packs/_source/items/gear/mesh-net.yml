  description:
    value: <p>When you take the Attack action, you can replace one of your attacks with throwing a Mesh Net. Target a creature you can see within 15 feet of yourself. The target must succeed on a Dexterity
      saving throw (DC 8 plus your Dexterity modifier and Proficiency Bonus) or have the Restrained condition until it escapes. The target succeeds automatically if it is Huge or larger.</p><p>To escape,
      the target or a creature within 5 feet of it must take an action to make a DC 10 Strength (Athletics) check, freeing the Restrained creature on a success. Destroying the Mesh Net (AC 10; 5 HP; Immunity
      to Bludgeoning, Poison, and Psychic damage) also frees the target.</p>
