  description:
    value: <p>A Breath Mask is an adjustable face mask with airtight seals and an internal supply of breathable air. You can breathe for 2 hours using the mask’s supply. The mask’s supply can be refilled
      from any functioning life support system, such as those on starships.</p><p>The Breath Mask has a connection for an external atmosphere supply to allow for longer breathing time, and a valve tube
      that fits standard Canteens to allow drinking without removing the mask. As a Utilize action, you can attach or remove a breathing supply such as a Gas Canister or life support line, or a Canteen
      for drinking.</p>
