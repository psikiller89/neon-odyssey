  description:
    value: <p>You can douse a creature, object, or space with Fuel Oil or use it as fuel, as detailed below. A flask holds 1 pint of Fuel Oil.</p><p><strong>Dousing a Creature or Object.</strong> When you
      take the Attack action, you can replace one of your attacks with throwing a Fuel Oil flask. Target one creature or object within 20 feet of yourself. The target must succeed on a Dexterity saving
      throw (DC 8 plus your Dexterity modifier and Proficiency Bonus) or be covered in oil. If the target takes Fire damage before the oil dries (after 1 minute), the target takes an extra 5 Fire damage
      from the burning oil.</p><p><strong>Dousing a Space.</strong> You can take the Utilize action to pour a Fuel Oil flask on level ground to cover a 5-foot-square area within 5 feet of yourself. If lit,
      the oil burns until the end of the turn 2 rounds from when the oil was lit (or 12 seconds) and deals 5 Fire damage to any creature that enters the area or ends its turn there. A creature takes this
      damage only once per turn.</p><p><strong>Fuel.</strong> Fuel Oil serves as fuel for any fire-based light source or combustion engine device. Once ignited, a flask of Fuel Oil provides 6 hours of burning
      for wick combustion, 1 hour of operation for a Generator or similar-sized engine, or 8 minutes of operation for a Light Planetary vehicle (roughly 8 miles of travel) or the equivalent.</p>
