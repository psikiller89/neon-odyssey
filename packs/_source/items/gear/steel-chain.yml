  description:
    value: <p>A 10-foot length of steel links. As a Utilize action, you can wrap a Steel Chain around an unwilling creature within 5 feet of yourself that has the Grappled, Incapacitated, or Restrained
      condition if you succeed on a DC 13 Strength (Athletics) check. If the creature’s legs are bound, the creature has the Restrained condition until it escapes. Escaping the chain requires the creature
      to make a successful DC 18 Dexterity (Acrobatics) check as an action. Bursting the Steel Chain requires a successful DC 25 Strength (Athletics) check as an action.</p>
