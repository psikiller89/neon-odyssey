system:
  description:
    value: <p>You can use any mushroom as a Spellcasting Focus, and you know the <em>Acid Splash</em> cantrip. Additionally, starting at character level 3, you always have the <em>Jump</em> spell prepared,
      and starting at character level 5, you always have the <em>Enlarge/Reduce</em> spell prepared. You can cast each spell once without a spell slot, and you regain the ability to cast each spell in that
      way when you finish a Long Rest. You can also cast the spell using any spell slots you have of the appropriate level. Intelligence, Wisdom, or Charisma is your spellcasting ability for the spells
      you cast with this trait (choose the ability when you select this species).</p>
