system:
  description:
    value: <p>As a Bonus Action, you magically gain the Invisible condition until the start of your next turn or until you make a damage roll or force someone to make a saving throw. When the Invisible
      condition on you from this trait ends, you treat Half Cover as Three-Quarters Cover until the end of your next turn. You can use this Bonus Action a number of times equal to your Proficiency Bonus,
      and you regain all expended uses when you finish a Long Rest.</p>
