system:
  description:
    value: <p>When an attack roll hits you and its damage includes Bludgeoning, Piercing, or Slashing damage, you can take a Reaction to add your Proficiency bonus to your AC, possibly causing it to miss.
      If you make an attack miss this way, choose a creature you can see within 30 feet of you that isn’t behind Total Cover. The target takes 1d10 Force damage. You can take this Reaction a number of times
      equal to your Proficiency Bonus, and you regain all expended uses when you finish a Long Rest.</p>
