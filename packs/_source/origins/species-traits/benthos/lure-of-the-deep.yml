  description:
    value: <p>You know the <em>Dimness</em>* cantrip.</p><p>Additionally, starting at character level 3, you always have the <em>Dissonant Whispers</em> spell prepared, and starting at character level 5,
      you always have the <em>Web</em> spell prepared (the webs are spun shadow). You can cast each spell once without a spell slot, and you regain the ability to cast the spells in that way when you finish
      a Long Rest. You can also cast the spells using any spell slots you have of the appropriate level.</p><p>You can make a target that fails its saving throw against your <em>Dissonant Whispers</em>
      move toward you instead of away.</p><p>Intelligence, Wisdom, or Charisma is your spellcasting ability for the spells you cast with this trait (choose the ability when you select the species).</p>
