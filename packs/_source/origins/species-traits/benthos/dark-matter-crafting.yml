system:
  description:
    value: <p>While not in Bright Light, you can take a Magic action to shape shadows into one Small or smaller nonmagical item of your choice worth no more than $1,000. The item must appear in your hand,
      or in your space on a surface that can support it. The item disappears after a number of hours equal to your Proficiency Bonus or when it is reduced to 0 Hit Points. A creature that examines the object
      can discern its true nature with a successful Intelligence (Investigation) check. The DC is 8 plus your Proficiency Bonus and the ability modifier you chose for Lure of the Deep.</p><p>Once you create
      an item with this trait, you can’t do so again until you finish a Long Rest.</p>
