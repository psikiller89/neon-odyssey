      and you continue to gain 1 Exhaustion level every 24 hours that pass. This trait can’t cause your Exhaustion level to rise higher than 5.</p><p>If you reduce a creature to 0 Hit Points using <em>Chill
      Touch</em>, you remove all Exhaustion levels gained from this trait.</p>
