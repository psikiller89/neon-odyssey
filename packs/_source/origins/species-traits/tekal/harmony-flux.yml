system:
  description:
    value: '<p>The essence of Harmony fills you. You know the <em>Culling</em>* and <em>Druidcraft</em> cantrips. Additionally, starting at character level 3, you can cast the following spells without a
      spell slot: <em>Cure Wounds</em> or <em>Ray of </em> <em>Sickness</em>. Once you cast one of these spells, you can’t cast either of them in this way again until you finish a Long Rest. Starting at
      character level 5, you can cast the following spells without a spell slot: <em>Blindness/Deafness</em> or <em>Lesser </em> <em>Restoration</em>. Once you cast one of these spells, you can’t cast either
      of them again in this way until you finish a Long Rest. You always have these spells prepared, and you can also cast them using any spell slots you have of the appropriate level. Intelligence, Wisdom,
      or Charisma is your spellcasting ability for these spells (choose the ability when you select this species).</p>'
