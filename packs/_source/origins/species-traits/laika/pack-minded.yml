system:
  description:
    value: <p>When an ally you can see within 30 feet of yourself fails a D20 Test, you can take a Reaction to encourage that ally. The target adds 1d6 to the total, possibly turning the failure into a
      success. You can use this trait a number of times equal to your Proficiency Bonus, and you regain all expended uses when you finish a Long Rest. Starting at character level 3, you and the target gain
      an additional benefit determined by your Laika Lineage. You have Advantage on Intelligence, Wisdom, and Charisma saving throws. You and the ally you help each gain a number of Temporary Hit Points
      equal to three times your Proficiency Bonus. When a creature damages you or your allies, you have Advantage on the next attack roll you make against that creature before the end of your next turn.
      The next time you or the ally you help take damage within 1 minute, the target gains Resistance against that damage. Your Speed increases to 35 feet. You and the ally you help each have Advantage
      on the next ability check or attack roll either of you make within the next minute.</p>
