system:
  description:
    value: <p>You always have the <em>Misty Step</em> spell prepared. You can cast it without a spell slot a number of times equal to your Proficiency Bonus, and you regain all expended uses when you finish
      a Long Rest. You can also cast it using any spell slots you have of the appropriate level.</p><p>When you cast the spell using this trait while you are within 5 feet of a power or data connection,
      if your destination space is also within 5 feet of that connection, you don’t expend a use of this trait.</p><p>Intelligence, Wisdom, or Charisma is your spellcasting ability for it (choose the ability
      when you select this species).</p>
