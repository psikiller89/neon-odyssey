system:
  description:
    value: <p>Choose one of the options below; when you finish a Long Rest, you can choose a new option. Your chosen option can change your skin, hair, or eye color. As a Bonus Action, for the next minute,
      you shed Bright Light in a 10-foot Emanation originating from you and Dim Light for an additional 10 feet. You infuse the light with your chosen color and emotion to provide its benefit, and you can
      change your chosen color as part of the Bonus Action. You can use this Bonus Action a number of times equal to your Proficiency Bonus, and you regain all expended uses when you finish a Long Rest.</p>
