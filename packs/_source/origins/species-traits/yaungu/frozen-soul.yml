  description:
    value: <p>As a Magic action, you create ice, freeze water, or shape existing ice that fills up to a 5-foot Cube. You can decide the shape the ice takes, though the forms are simple or crude unless you
      have proficiency in appropriate tools to create intricate or complex shapes. Unless the environment is freezing cold, the ice lasts for 1 minute and then melts or vanishes. Once you use this trait,
      you can’t use it again until you finish a Short or Long Rest.</p>
