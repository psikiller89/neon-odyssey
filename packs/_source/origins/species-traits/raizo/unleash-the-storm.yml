system:
  description:
    value: '<p>When you reach character level 3, you can release your inner storm as a Bonus Action, using one of the options below (choose each time you use this trait). The storm lasts for 1 minute or
      until you end it (no action required). Once you take this Bonus Action, you can’t do so again until you finish a Long Rest. For the duration, you create a storm in a 10-foot Emanation originating
      from you, and once on each of your turns, when you deal damage with an attack or a spell, you can deal extra damage to one target of a type determined by the storm options. The extra damage equals
      your Proficiency Bonus. Here are the storm options: <strong>Lightning Spirit (Lightning Damage).</strong> At the end of each of your turns, each creature of your choice in the Emanation takes Lightning
      damage equal to your Proficiency Bonus. <strong>Tempest Born (Cold Damage). </strong>You and your allies in the Emanation have Half Cover from ranged attacks. <strong>Thunder Soul (Thunder Damage).</strong>
      At the start of each of your turns, each creature of your choice in the Emanation must succeed on a Strength saving throw (DC 8 plus your Proficiency Bonus and the ability modifier you chose for Storm
      Magic) or be pushed up to 10 feet away from you. A creature that fails the save by 5 or more has the Prone condition.</p>'
