system:
  description:
    value: <p>When you drop to 0 Hit Points but aren’t killed outright, you can choose to ignore the effects of the Unconscious condition until you regain any Hit Points. You must still make Death Saving
      Throws until you regain any Hit Points or become Stable. If you take an action while you are at 0 Hit Points, you suffer a Death Saving Throw failure unless that action stabilizes you or restores
      you to 1 Hit Point or more. Once you ignore the Unconscious condition with this trait, you can’t do so again until you finish a Long Rest.</p>
