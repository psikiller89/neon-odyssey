system:
  description:
    value: <p>You have a built-in compartment that conceals a weapon, a tool, a Shield, or a piece of outrunning gear of your choice. If the chosen item has a proficiency associated with it, you gain that
      proficiency. The chosen item must weight 8 lb. or less, and a weapon must have the Light property. The item remains hidden until you deploy it as a Bonus Action (DC 20 to detect while stowed). You
      must have a free hand, and you hold the item or don the Shield as part of the Bonus Action. You stow the item (doffing a Shield) back in its compartment using another Bonus Action.</p>
