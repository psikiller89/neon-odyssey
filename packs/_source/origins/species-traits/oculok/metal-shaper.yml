system:
  description:
    value: <p>You know the <em>Mending</em> cantrip. If you target a metal object, you can change the casting time to a Bonus Action. Intelligence, Wisdom, or Charisma is your spellcasting ability for it
      (choose the ability when you select this species).</p><p>Additionally, as a Magic action, you can touch a metal object (or part of a larger metal object or structure) no larger than a 5-foot Cube.
      The target gains Resistance or Vulnerability to all damage (your choice) for 1 minute. Once you use this action, you can’t use it again until you finish a Short or Long Rest.</p>
