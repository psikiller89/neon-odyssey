  description:
    value: <p>You know the <em>Minor Illusion</em> and <em>Vicious </em> <em>Mockery</em> cantrips.</p><p>Additionally, starting at character level 3, you always have the <em>Hideous Laughter</em> spell
      prepared, and starting at character level 5, you always have the <em>Suggestion</em> spell prepared. You can cast each of these spells once without a spell slot, and you regain the ability to cast
      them in that way when you finish a Long Rest. You can also cast them using any spell slots you have of the appropriate level.</p><p>Intelligence, Wisdom, or Charisma is your spellcasting ability for
      the spells you cast with this trait (choose the ability when you select this species).</p>
