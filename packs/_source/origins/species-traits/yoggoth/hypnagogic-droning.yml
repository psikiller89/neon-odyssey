system:
  description:
    value: <p>As a Bonus Action, you can create a vibration that resonates with your most alien dreams in a 20-foot Emanation originating from you. The droning lasts for 1 minute or until you lose your
      Concentration. When you create the Emanation, and at the start of each of your turns for the duration, each creature of your choice in that area must succeed on a Wisdom saving throw (DC 8 plus your
      Constitution modifier and Proficiency Bonus) or subtract 1d4 from ability checks and attack rolls until the start of your next turn. Once you use this Bonus Action, you can’t use it again until you
      finish a Long Rest.</p>
