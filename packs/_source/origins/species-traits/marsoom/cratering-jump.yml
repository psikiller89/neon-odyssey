system:
  description:
    value: <p>As a Bonus Action, you can unleash your inner strength to jump up to your Speed to an unoccupied space. When you land, you can unleash a shockwave in a 10foot Emanation originating from you.
      Each creature in that area must make a Constitution saving throw (DC 8 plus your Constitution modifier and Proficiency Bonus). On a failed save, a creature takes 1d10 Thunder damage and is pushed
      or pulled (your choice) up to 10 feet toward or away from you. You can use this trait a number of times equal to your Proficiency Bonus, and you regain all expended uses when you finish a Long Rest.</p>
