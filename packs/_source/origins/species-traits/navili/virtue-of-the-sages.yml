system:
  description:
    value: <p>You gain some traits based on the ideal you embody. Choose a virtue from the Virtues of the Sages table. You gain the level 1 benefit of that ideal.</p><p>When you reach character levels 3
      and 5, you learn a spell as shown on the table. You always have that spell prepared. You can cast it once without a spell slot, and you regain the ability to cast it in that way when you finish a
      Long Rest. You can also cast those spells using any spell slots you have of the appropriate level.</p><p>Intelligence, Wisdom, or Charisma is your spellcasting ability for these spells when you cast
      them with this trait (choose the ability when you select this species). Clarity You know the <em>Message</em> cantrip. Additionally, you have Advantage on Intelligence saving throws and you have proficiency
      in Perception. <em>Detect Magic</em> <em>Zone </em> <em>of Truth</em> Might You know the <em>Thunder Blast</em>* cantrip. Additionally, you have Advantage on Strength saving throws, and you can use
      your Fly Speed while wearing Medium or Heavy armor. <em>Divine Favor</em> <em>Magic </em> <em>Weapon</em> Valor You know the <em>Resistance</em> cantrip. In addition, you have Advantage on Charisma
      saving throws and on saving throws to avoid or end the Frightened condition. While you have the Frightened condition, you can still move closer to the source of your fear. <em>Heroism</em> <em>Aid</em></p>
