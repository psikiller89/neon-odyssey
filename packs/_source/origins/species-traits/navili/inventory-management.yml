system:
  description:
    value: <p>You can store and retrieve items from a digital inventory. With a Utilize Action, you can digitize an item you are wearing or carrying and store it in your inventory, or retrieve a digitized
      item into your hand and return it to normal. Your inventory can hold a number of items equal to your Proficiency Bonus. Digitized items appear in your space when you die.</p><p><strong>Look! Listen!</strong>
      You have proficiency in the Insight, Investigation, or Perception skill.</p>
