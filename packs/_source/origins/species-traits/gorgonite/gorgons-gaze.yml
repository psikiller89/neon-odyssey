system:
  description:
    value: <p>As a Bonus Action, you can fix your gaze on a creature you can see within 30 feet of yourself. The target is subjected to the effects of one of the options below (choose when you use the trait).
      The save DC is 8 plus your Proficiency Bonus and your Intelligence, Wisdom, or Charisma modifier (choose the ability when you select this species). You can use this Bonus Action a number of times
      equal to your Proficiency Bonus, and you regain all expended uses when you finish a Long Rest.</p><p><em>Click Beam, Hypnotic or Petrifying to use the gaze. When you add the species you choose Intelligence,
      Wisdom or Charisma for the save DC.</em></p>
