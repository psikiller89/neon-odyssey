    value: <p>You know the <em>Befriend</em>* cantrip.</p><p>Additionally, starting at character level 3, you always have the <em>Fog Cloud</em> spell prepared, and starting at character level 5, you always
      have the <em>Gust of Wind</em> spell prepared. You can cast each one once without a spell slot, and you regain the ability to cast them in that way when you finish a Long Rest. You can also cast the
      spells using any spell slots you have of the appropriate level.</p><p>Intelligence, Wisdom, or Charisma is your spellcasting ability for the spells you cast with this trait (choose the ability when
      you select this species).</p>
