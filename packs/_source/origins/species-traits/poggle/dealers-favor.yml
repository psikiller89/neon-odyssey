system:
  description:
    value: <p>You have 4 Luck Dice which are d6s, and you regain 1d4 expended Luck Dice when you finish a Long Rest. When you or a creature you can see within 10 feet of you makes a D20 Test, you can take
      a Reaction to expend and roll 1 Luck Die and apply it as a bonus or penalty (your choice) to the total.</p><p>The maximum number of Luck Dice you have increases at levels 5 (6 dice), 11 (8 dice),
      and 17 (10 dice). Additionally, the number of expended Luck Dice you regain increases when you reach levels 5 (1d6), 11 (1d8), and 17 (1d10).</p>
