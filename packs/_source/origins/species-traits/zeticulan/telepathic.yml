      always have the <em>Detect Thoughts</em> spell prepared. You can cast each of these spells once without a spell slot, and you regain the ability to cast them in that way when you finish a Long Rest.
      You can also cast them using any spell slots you have of the appropriate level.</p><p>Intelligence, Wisdom, or Charisma is your spellcasting ability for the spells you cast using this trait (choose
      the ability when you select this species).</p>
