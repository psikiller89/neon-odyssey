system:
  description:
    value: '<p><em>Origin Feat (Prerequisite: Starry or Temporal Homeworld)</em></p><p>You have absorbed the essence of your home’s cosmically charged nature or world soul, gaining the following benefits.</p><p><strong>Cosmic
      Understanding.</strong> You have proficiency in the Arcana, History, or Religion skill.</p><p><strong>Foretelling.</strong> You can cast <em>Augury</em> once without a spell slot and requiring no
      Material components, and you regain the ability to do so when you finish a Long Rest. You can also cast the spell using spell slots you have of the appropriate level. Intelligence, Wisdom, or Charisma
      is your spellcasting ability for it (choose when you select this feat).</p><p>When you cast <em>Augury</em> with this feat, your premonition is accompanied by an image of a constellation (Starry)
      or swirling sand (Temporal).</p>'
