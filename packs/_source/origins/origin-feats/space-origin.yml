  description:
    value: '<p><em>Origin Feat (Prerequisite: Space Homeworld)</em></p><p>You have absorbed the essence of your home’s space-bound nature or world soul, gaining the following benefits.</p><p><strong>Aetheric
      Metabolism.</strong> You subsist on minute amounts of aether in the environment. You can go without food or water for twice the usual time before you need to make saving throws against dehydration
      or malnutrition.</p><p><strong>Aetheric Resilience.</strong> If you fail a saving throw against Exhaustion, you can choose to succeed instead. You can use this benefit a number of times equal to your
      Proficiency Bonus, and you regain all expended uses when you finish a Long Rest.</p>'
