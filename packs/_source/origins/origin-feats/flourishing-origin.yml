  description:
    value: '<p><em>Origin Feat (Prerequisite: Harmonic, Idyllic, or Verdant Homeworld)</em></p><p>You have absorbed the essence of your home’s abundant nature or world soul, gaining the following benefits.</p><p><strong>Regrowth.</strong>
      The first time you would expend a Hit Point Die to regain Hit Points, you don’t expend it. Once you use this benefit, you can’t use it again until you finish a Long Rest.</p><p><strong>Sure Step.</strong>
