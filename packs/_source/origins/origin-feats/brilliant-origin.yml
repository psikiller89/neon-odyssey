system:
  description:
    value: '<p><em>Origin Feat (Prerequisite: Luminous or Starry Homeworld)</em></p><p>You have absorbed the essence of your home’s shining nature or world soul, gaining the following benefits.</p><p><strong>Radiant
      Deflection.</strong> When you take Radiant damage, you can take a Reaction to gain Resistance to Radiant damage until the end of the turn. You can use this Reaction a number of times equal to your
      Proficiency Bonus, and you regain all expended uses when you finish a Long Rest.</p><p><strong>Soothing Light.</strong> As a Magic action, you can magically infuse a source of Bright Light you are
      holding with peace and serenity. A number of creatures up to your Proficiency Bonus who spend 1 minute in the infused light gain Heroic Inspiration. If the light goes out or you drop the source, the
      effect is wasted. Once you use this benefit, you can’t use it again until you finish a Short or Long Rest.</p>'
