  description:
    value: <p><img src="modules/neon-odyssey/icons/species/terminox-art.webp" style="max-height:420px;float:right;margin-left:8px"></p><p>Terminox <em>(TER-mi-noks)</em> are a bio-mechanical people reforged
      by the discordant tone of Progress through the hyper-logical denial of emotion to build structures of control around their pain. Their indomitable bodies are designed to neither cease nor slow in
      the face of whatever obstacle stands before them.</p><p>Typically driven to achieve perfection in the areas of their obsession, terminox are always seeking the next step of optimization. While some
      uphold an advancement of the self, finding a solitary path or embedding in a small unit, many assimilate into the collective and join the never-ending march of Progress.</p><p>Terminox are a species
      built of fiendish metal with cables of synthetic flesh that cling to their frame like muscle. Their heads appear approximately skeletal, sometimes connected to cords that resemble hair. The parts
      that make up their construction are typically colored in shades of gray or red.</p>
