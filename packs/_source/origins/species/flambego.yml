  description:
    value: <p><img src="modules/neon-odyssey/icons/species/flambego-art.webp" style="max-height:420px;float:right;margin-left:8px"></p><p>Flambego <em>(flahm-BAY-goh) </em>are a colorful avian species that
      hail from idyllic tropical islands where life is leisurely. Bearing a mystical bond with the revelry god Xavrius the Celebrant, they are an easygoing people who prioritize relaxation and fun as major
      virtues.</p><p>Empowered by the magic of the party, most flambego seek to spread the carefree joy within them to people across the galaxy. They are often drawn to vacation destinations, but they won’t
      shy away from danger, especially when it threatens their chill vibes.</p><p>Flambego possess the traits of all manner of tropical birds, sporting vibrant, colorful plumage and wings that line each
      of their arms. Their proportions can vary, and while many have long legs, necks, and beaks, others are compact and round.</p>
