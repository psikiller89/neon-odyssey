  description:
    value: <p><img src="modules/neon-odyssey/icons/species/yoggoth-art.webp" style="max-height:420px;float:right;margin-left:8px"></p><p>Yoggoths <em>(YAW-goth)</em> are a strange species rumored to have
      been birthed from the eldritch dreams of the mysterious elder beings of the galaxy. Hailing from a remote homeworld scattered with the ruins of their creators, they experience otherworldly dreams
      said to be an echo of what brought their people into being.</p><p>As the ultimate survivors, yoggoths are extremely resourceful and prone to recycling everything they possibly can. Many are drawn
      to salvaging operations, but some are driven to uncover the mysteries of their dreams and eldritch origins, not stopping until they discover the answers they seek.</p><p>Yoggoths appear like alien
      flies in a bipedal humanoid shape with both leathery and chitinous hides that are typically earthy in color. They have large glassy eyes, four nostrils on their elongated snouts, and fleshy tendrils
      that can grow from their head or chin. Two pairs of leathery wings grow from their shoulders, from which they emit their infamous drone.</p>
