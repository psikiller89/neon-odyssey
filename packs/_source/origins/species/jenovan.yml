  description:
    value: <p><img src="modules/neon-odyssey/icons/species/jenovan-art.webp" style="max-height:420px;float:right;margin-left:8px"></p><p>Jenovans <em>(jeh-NOH-vin)</em> are the descendants of an artificial
      psionic species created through genetic experimentation to achieve a perfected lifeform. For eons, these bio-engineered creations intermingled with their creators until nothing but the jenovans remained,
      beings of enhanced physicality and fearsome telekinetic power.</p><p>Whatever homeworld they once had was lost to legend, so jenovans became a nomadic people who wander across the galaxy and settle
      numerous planets in tight-knit communities. They often strive to perfect themselves within and without, pushing their abilities to the limit and beyond. Many seek mightier challenges and opponents
      to test their skills and train against.</p><p>Jenovans have an appearance that betrays their genetically engineered origin, with unnaturally smooth skin in tones of gray, green, and purple. Their
      bodies are adorned with plates of natural armor as well as crystalline protrusions that focus their telekinesis. All jenovans bear either a prominent tail or a head tendril, though many have both.</p>
