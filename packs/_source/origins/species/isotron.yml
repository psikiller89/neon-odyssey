  description:
    value: <p><img src="modules/neon-odyssey/icons/species/isotron-art.webp" style="max-height:420px;float:right;margin-left:8px"></p><p>Isotrons <em>(EYE-soh-tron)</em> are wholly digital beings brought
      to life by a synthetic soul called a hyperspark. Originating from the digital realm of the Hypergrid, they are comprised of code that can be compiled into physical forms of hard light. This grants
      them an innate ability to interface with computers and manipulate software with a touch.</p><p>Many isotrons live their entire lives within the Hypergrid, but others venture into physical reality
      to discover new experiences across the Stardust Rhapsody. In such a technological galaxy, isotrons have no trouble finding ways to put their inherent skills to use.</p><p>Isotron bodies vary in shape,
      size, and color, and they are often bedecked with bold or saturated hues that glow from the code within them. Their heads are typically humanoid with built-in visors, but some are entirely flat with
      a digital face projected upon it.</p>
