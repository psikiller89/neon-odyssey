  description:
    value: <p><img src="modules/neon-odyssey/icons/species/volcar-art.webp" style="max-height:420px;float:right;margin-left:8px"></p><p>Volcar <em>(VOAL-car) </em>are a species of earth and fire, with fully
      elemental bodies of lava that they can melt and solidify at will. Able to sustain themselves entirely on minerals, they are a hearty people who thrive on their volcanic homeworld.</p><p>Many volcar
      are fascinated by and study cycles, especially the relationship between destruction and renewal. They are often nomadic, following seasons, currents, patterns, and other natural phases. Some prefer
      more social or political cycles, getting involved in governments or militaries.</p><p>Their rocky hide runs a variety of earthen shades from dark obsidian to pale limestone, with a humanoid visage
      that appears like a chiseled statue or a natural rock formation. Glowing lava forms lines and patterns in their exterior and can ignite at a moment’s notice, turning their whole form redhot and malleable.</p>
