  description:
    value: <p><img src="modules/neon-odyssey/icons/species/navili-art.webp" style="max-height:420px;float:right;margin-left:8px"></p><p>Navili <em>(nuh-VEE-lee) </em>are an ethereal folk who first stepped
      out of Arcadia and found a home in the Stardust Rhapsody. Their time among the mortal species changed them, but they never lost touch with the mystic power of their enchanted origin.</p><p>All navili
      embody a primary ideal—valor, might, or clarity— tracing back to the virtues of the sages that first guided them from Arcadia. Drawn to opportunities for heroism and to embody their chosen ideal,
      navili regularly seek secrets and relics within ancient ruins or lost temples.</p><p>They are typically willowy and graceful with skin that ranges from muted tones of nature to the brilliant blues,
      pinks, and greens of Arcadia, often marked with intricate runic patterns. Navili have shimmering eyes, broad noses, and leaf-like ears with several delicate points. A pair of prismatic, polygonal
      wings drift behind their backs.</p>
