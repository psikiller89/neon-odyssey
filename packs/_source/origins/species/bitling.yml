  description:
    value: <p><img src="modules/neon-odyssey/icons/species/bitling-art.webp" style="max-height:420px;float:right;margin-left:8px"></p><p>Bitlings <em>(BIT-ling)</em> are a widely varied species that hail
      from the video game realm of Arcadia. The imaginative creativity and bombastic energy of the arcade plane infuse them with whimsical powers that change based on their inherent archetype—strong, swift,
      or soaring.</p><p>Bitlings often travel through Arcadia and the galaxy beyond seeking shiny collectibles that power their magic. Many set out on grand quests seeking fun adventures, sidekicks to befriend,
      and loot to add to their collection.</p><p>Unified by bright colors and exaggerated proportions, a bitlings’s appearance is only limited by one’s imagination. Their most common form is a bipedal animal
      of any variety, but there are those who resemble toy-like humanoids, walking inanimate objects, or even bizarre oblong shapes.</p>
