  description:
    value: <p><img src="modules/neon-odyssey/icons/species/benthos-art.webp" style="max-height:420px;float:right;margin-left:8px"></p><p>Benthos <em>(BEN-thoess)</em> are a people forever changed by the
      eldritch power of the Abyssal Void. Eons ago, their homeworld was ripped into a black hole and lost to the Wyrmways, the border dimension between the galaxy and the Void. They irrevocably transformed
      to survive the alien environment, taking on traits of the Void creatures known as the Deep. In time, they learned to harness dark matter, shaping it to their will and utilizing it in their magic and
      technology.</p><p>Benthos are diminutive people with features reminiscent of deep sea fish and skin in shades of the Void. They typically lack color outside their glowing circular eyes and lamp-like
      lures at the end of the flexible stalk that grows from their head. Their mouths are especially wide and can unhinge indefinitely.</p>
