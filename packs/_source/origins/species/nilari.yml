system:
  description:
    value: <p>Nilari <em>(nih-LAR-ee)</em> are the people of the void wyrm, which has granted them various draconic features that make them well suited to resisting the horrors of the Abyssal Void. While
      they were once the same progenitor species as the solari eons ago, the people who would become nilari chose to escape the doom of their homeworld by slipping into the Wyrmways and fusing their biology
      with the native creatures within. All nilari have the blood of the wyrm, with many of them embracing this draconic lineage to steel their body and mind against all that would seek to corrupt and destroy
      them. Some take this further and pursue might in all its forms to stand against the darkness of the void. Nilari are typically broader and beefier than their solari relatives, with physical traits
      of the void wyrm that manifest in varying ways, including pointed, fin-like ears, fleshy tendrils that grow along the jawline, jagged horns, plate-like scales, and claw-like hands. Their skin tends
      to have muted shades of purple, blue, or grayscale.</p>
