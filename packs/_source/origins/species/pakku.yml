  description:
    value: <p><img src="modules/neon-odyssey/icons/species/pakku-art.webp" style="max-height:420px;float:right;margin-left:8px"></p><p>Pakku <em>(PAH-koo)</em> are a species of sapient plants with the combined
      elements of cacti and carnivorous flora. To survive their deadly, venomous homeworld, they have developed a variety of adaptations to overcome both predators and prey.</p><p>Favoring the more lawless
      corners of the galaxy, pakku usually seek their fortune through grit and resolve. Many of them have a strong interest in the crafting and handling of weapons, especially firearms, striving to master
      the art of the duel with their implement of choice.</p><p>Widely varied in shape and size, pakku appear as bipedal plants with spiny cactus bodies that are usually a shade of green. Their heads are
      typically topped with hair-like vines or colorful, exotic flowers with extra-wide, toothy mouths that resemble carnivorous plants.</p>
