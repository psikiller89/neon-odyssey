  description:
    value: <p><img src="modules/neon-odyssey/icons/species/murexian-art.webp" style="max-height:420px;float:right;margin-left:8px"></p><p>Murexians <em>(mer-EX-ee-in) </em>are an aquatic species of mollusklike
      humanoids that emerged from the dark depths of an ocean world. Legend holds that they were created by Karkosa, the enigmatic proto-god of change, who imbued them with the ability to rapidly evolve
      to best survive the treacherous deep. Evolution is core to all murexians, and they develop additional adaptations throughout their life to best suit them for their home environment and the galaxy
      beyond. This allows them to be equally comfortable on land as they are in the water. Many murexians have no fear of the future, trusting that they will adapt to whatever comes. Murexians have mollusk-shell
      heads with tentacled faces that resemble cephalopods such as cuttlefish, and their rubbery skin can rapidly change in color and pattern to aid in communication. As they evolve and gain new adaptations,
      they can take on the physical characteristics of crustaceans and other invertebrates of the sea.</p>
