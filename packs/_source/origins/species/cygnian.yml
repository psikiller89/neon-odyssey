  description:
    value: <p><img src="modules/neon-odyssey/icons/species/cygnian-art.webp" style="max-height:420px;float:right;margin-left:8px"></p><p>Cygnians <em>(SIG-nee-in)</em> are the star-touched of Agathos, once
      mortal beings remade by the will of the gods. Some were heroes who lived by the tenets of their favored deity so completely that they were chosen to ascend and begin their journey anew as a Celestial.
      Others were selected at birth due to prophecies of greatness in the stars, discovered places or relics of divine import, or caught the eye of a god on a whim.</p><p>While some live their new immortal
      lives in the heavenly realm of Agathos, many return to the galaxy to serve the god that reforged them</p><p>The physical form of cygnians is comprised of starstuff, with resilient skin and flowy hair
      that evoke the night sky and statues of sacred stone and metal. They typically share a humanoid visage adorned by star shapes with distinct features that reflect their god, but some retain traits
      of their original species.</p>
