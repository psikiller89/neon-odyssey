  description:
    value: <p><img src="modules/neon-odyssey/icons/species/skettik-art.webp" style="max-height:420px;float:right;margin-left:8px"></p><p>Skettiks <em>(SKEH-tik)</em> are a flightless avian species suffused
      with innate necromantic energy, the remnants of a cataclysmic ritual that killed and reanimated the world soul of their homeworld. These warped carrion-eaters use their necrotic magic to craft personal
      minions or strange relics from bone.</p><p>Many skettiks are reclusive, shying away from places touched by garish sunlight, and often find themselves operating in the galaxy’s criminal underworld.
      Others find great success in business and as merchants, utilizing their shrewdness and skepticism to score the best deals.</p><p>Skettiks resemble wingless vultures in a humanoid shape with scaly
      skin and sparse patches of feathers that range from grayscale to drab shades of other colors. They have long claws on their hands and feet that they use for climbing the huge trees of their homeworld,
      and their jagged beaks are filled with sharp teeth for cracking bone.</p>
