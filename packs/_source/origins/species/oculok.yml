  description:
    value: <p><img src="modules/neon-odyssey/icons/species/oculok-art.webp" style="max-height:420px;float:right;margin-left:8px"></p><p>Oculoks <em>(AHK-yoo-lahk)</em> are a cyclopean species that hails
      from a vast underground civilization. They are highly adapted to subterranean life with enhanced monocular vision that can see through inorganic matter and a magnetic touch that can manipulate metal
      to their needs.</p><p>Seeking opportunities to put their metal-bending to use, many oculoks possess a keen interest in building, from structures to vehicles. Their societies typically favor cooperation
      and rigid structure, and most citizens find purpose in contributing to a collective of any scale.</p><p>Oculoks have sturdy bodies covered in scaly, earth-toned skin and protruding armored nodules.
      Their heads are broad with lateral ridges and a spiked crown, with the most prominent feature being a large, singular eye. Their tails act as a built-in defense mechanism, ending in either a club
      or spikes.</p>
