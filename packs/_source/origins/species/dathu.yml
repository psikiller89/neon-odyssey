  description:
    value: <p><img src="modules/neon-odyssey/icons/species/dathu-art.webp" style="max-height:420px;float:right;margin-left:8px"></p><p>Dathu <em>(DAH-thoo) </em>are a ferocious people who have been transformed
      by the discordant tone of Instinct through their wrath and desire to tear down the perceived source of their pain. Despite this corruption, they remain free and can choose to restrain their aggressive
      urges or focus their rage on something rather than their impulse to commit mindless acts of destruction.</p><p>Many dathu follow pursuits that allow them to give in to their destructive nature, favoring
      groups and organizations they can link to their personal hivemind. Others surrender to their corruption and join the endless skittering swarms of cacophony.</p><p>Dathu possess insectile traits found
      in the forces of Instinct, with scaly skin and chitinous carapaces, often streaked with amber-colored resin. Their jaws are split into mandibles lined with jagged teeth that drip with corrosive acid.</p>
