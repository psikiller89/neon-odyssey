  description:
    value: <p><img src="modules/neon-odyssey/icons/species/marsoom-art.webp" style="max-height:420px;float:right;margin-left:8px"></p><p>Marsoom <em>(mar-SOOM) </em>are a bovine species with especially
      alien biology that grants them psionic prescience and highly tuned danger sense. They have adapted to the strange red planet they call home, making their physical prowess no less formidable.</p><p>Most
      marsoom believe that strength and safety come through unity, and they are typically welcoming to people of all creeds and origins. While they normally engage in diplomatic pursuits, marsoom are prepared
      to fight to defend what they value most.</p><p>They appear as sturdy bipedal cattle but have large, dark, oblong eyes with a third on their forehead. A pair of antennae sprouts from between their
      horns, their tails are split into two bushy ends, and their skin, hair, and tufts of fur come in a wide variety of vivid, unnatural colors.</p>
