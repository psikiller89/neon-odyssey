  description:
    value: <p><img src="modules/neon-odyssey/icons/species/zeticulan-art.webp" style="max-height:420px;float:right;margin-left:8px"></p><p>Zeticulans <em>(zeh-TIK-yoo-lin) </em>are one of the oldest and
      most enigmatic species of the Stardust Rhapsody, with some theorizing that they impossibly arrived from outside the galaxy. Their minds are so expansive that they have unlocked a psionic power that
      emanates past their own bodies and allows them to pierce into the minds of others using telepathy.</p><p>Many zeticulans crave k nowledge above all else, desiring to study, understand, and catalog
      every aspect of existence down to its last atom. They are drawn to any opportunity to conduct experiments of all varieties or the chance to expand their mental databases. While many remain elusive
      and mysterious, there are some who venture to mingle with other peoples of the galaxy to learn through new and unpredictable life experiences. njjjjh ]</p><p>Varying in size and shape, zeticulans
      are alien humanoids with smooth skin that is typically gray or green. They have thin, elongated necks, oversized, bulbous craniums, and large, dark eyes with slit-like pupils. Among the hairless majority,
      a few can grow shocks of vibrant, nearly neon hair atop their heads.</p>
