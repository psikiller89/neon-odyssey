  description:
    value: <p><img src="modules/neon-odyssey/icons/species/zephursa-art.webp" style="max-height:420px;float:right;margin-left:8px"></p><p>Zephursa <em>(zeh-FUR-suh)</em> are a small, ursine species that
      hail from floating cities atop a sea of clouds. They bear a special connection to the skies, allowing them to call the wind and even puff up in a cloudy form. They value the power of friendship, which
      they can genuinely manifest and harness to overcome challenges.</p><p>With a spark of ingenuity and a clever knack for invention, many Zephursa are drawn to tinkering with gizmos and developing new
      ways of approaching daily tasks. Many zephursa are most comfortable soaring through the skies of worlds across the galaxy, but there are those who stay more grounded and find their joy in the community
      that surrounds them.</p><p>Zephursa are little humanoid bears with colorful fur, often with pastel hues although more natural colors do appear. They have swirling cloud patterns somewhere on their
      coat that sometimes grow into bushier tufts of fluff. The clouds that encircle them when they puff up usually take on the prismatic color of their fur.</p>
