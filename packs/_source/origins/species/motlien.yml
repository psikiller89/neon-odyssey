  description:
    value: <p><img src="modules/neon-odyssey/icons/species/motlien-art.webp" style="max-height:420px;float:right;margin-left:8px"></p><p>Motliens <em>(MOT-lee-in)</em> are an absurd people twisted by the
      discordant tone of Thrill through their indulgence in sensory overload to drown out their pain. They relish in antics and folly that spark maximum excitement, pleasure, and pain, all of which fuel
      their cartoonish and reality-warping magic.</p><p>Driven to be thrill seekers at heart, many Motliens crave the most dangerous or bombastic environments they can find. Others turn to sharing their
      laughter, fighting their darker impulses lest they join the hellish circus of Thrill.</p><p>Motliens resemble fools, jesters, and clowns, with rubbery, colorful skin marked with strange psychedelic
      or motley patterns. Their heads sprout fleshy tendrils that resemble a cap and bells, and they often have honkable noses, razorsharp teeth, and long, slithery tongues.</p>
