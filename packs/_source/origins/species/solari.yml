  description:
    value: <p><img src="modules/neon-odyssey/icons/species/solari-art.webp" style="max-height:420px;float:right;margin-left:8px"></p><p>Solari (<em>soh-LAH-ree</em>) are the people of the solar phoenix,
      which has imbued them with the essence of the sun and an inherent connection to the cycle of rebirth. While they were once the same progenitor species as the nilari eons ago, the people who would
      become solari chose to accept their fate when their homeworld’s sun exploded and turned the planet to ash. However, once they were consumed by the blazing radiance, they were reborn as an entirely
      new species by the will of Alara the Lightbringer. They typically exhibit the unbound passion of the Lightbringer, pursuing that which they value and love with vivacious zeal. Many solari seek to
      share their inner light and passion with people across the galaxy, guiding them toward lofty achievement. Solari tend to be gracefully built, with especially long, pointed ears and floating hair that
      spans a gradient of vibrant hues. Their soft skin can have the tone of any of the galaxy’s countless suns, ranging broadly from typical oranges, yellows, reds, and pinks to rarer blues, violets, and
      beyond.</p>
