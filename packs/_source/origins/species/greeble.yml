  description:
    value: <p><img src="modules/neon-odyssey/icons/species/greeble-art.webp" style="max-height:420px;float:right;margin-left:8px"></p><p>Greebles (<em>GREE-bull</em>) are a worm-like species driven by an
      innate desire to voyage across the galaxy. Said to be blessed by Pelogos the Navigator, they possess a supernatural ability to always sense the stars and navigate by their light.</p><p>Many greebles
      are drawn to space travel of all varieties, whether as transport pilots, explorers, or anything in between. This extrasensory power and internal cosmic compass is so strong that none can doubt the
      navigation skills of the greeble.</p><p>Despite their segmented worm biology, Greebles have a humanoid shape with nearly universally thin legs. They have pointed noses, disproportionately large eyes,
      and soft skin in shades of pink to more earthy tones.</p>
