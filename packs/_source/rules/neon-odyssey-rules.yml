  name: Computers & Technology Skills, Backgrounds, Languages
  type: text
  sort: 100000
  title:
    show: true
    level: 1
  text:
    format: 1
    content: '<p><strong>P</strong> <strong>l</strong> <strong>a</strong> <strong>y</strong> <strong>i</strong> <strong>n</strong> <strong>g</strong></p><h2>Neon Odyssey</h2><p>You can playtest Neon Odyssey
      in whatever format works best for your table. If you want to play a series of one-shots or even begin a campaign, you are welcome to do so. Alternatively, you can simply run combat encounters following
      CR guidance included in the D&amp;D Beyond Basic Rules and collect feedback on how the characters and monsters feel to play and run respectively.</p><h2>Creating Your Character</h2><p>To create your
      Neon Odyssey character, form-fillable character sheets have been provided, also available in the Digital Downloads section of your Backerkit Survey. You can create your character following the same
      process as outlined in the D&amp;D Beyond Basic Rules, but you should use the materials in the playtest wherever possible.</p><h3>New Skill: Computers (Intelligence)</h3><p>The Computers skill governs
      knowledge, use, and creation of software to run on computers or other electronic devices. Use Computers for tasks relating to manipulating software or operating systems. Some tasks involving the Computers
      skill require a Utilize action, but many are more involved and take more time to perform.</p><h4>Research</h4><p>Using computer databases or Hypergrid browsers for a simple, public information search
      doesn’t require an ability check. Such searches usually only require a Utilize action, but more protected information takes longer to locate, as shown in the Computer Research table. At the end of
      that time, the character locates the desired Information with a successful Intelligence (Computers or Investigation) check using access to an appropriate database. The obscurity of the information
      sets the DC, as shown on the Computer Research table.</p><p>Information ranges from general to protected. General information is readily available and usually doesn’t require an ability check. Specific
      information could be personal details such as a date of birth. Restricted information is more sensitive such as a home address or personal comm frequency. Protected information is the most difficult
      to locate, such as financial data or non-public legal records. <strong>Computer Research</strong> <strong>Type of Information</strong> <strong>Time</strong> <strong>DC</strong> General 1 minute —
      Specific 1 hour 15 Restricted 1 hour 20 Protected 1 day 25</p><h4>Ship Systems</h4><p>Some starship or other vehicle systems operate using the crew’s proficiency in the Computers skill. For example,
      scanning with a starship’s sensors might require a Wisdom check using the ship’s Wisdom score and the operator’s Computers skill proficiency.</p><h3>New Skill: Technology (Intelligence)</h3><p>The
      Technology skill governs knowledge, use, and creation or repair of technological hardware and machines. This skill can also be used to identify and operate hypertech.</p><h4>Repairs</h4><p>Repairing
      damage to vehicles or ending mishaps on them or a Spiking Deck uses a character’s proficiency in the Technology skill.</p><h4>Technical Knowledge</h4><p>A character’s proficiency in the Technology
      skill can be used to understand the purpose and functions of a machine or component of a larger physical system.</p><h3>Backgrounds</h3><p>For Character Background, we recommend you create your own
      using the following guidance.</p><p>•2 Skill Proficiencies</p><p>•1 Tool Proficiency</p><p>•Proficiency in your choice of the Computers or Technology Skill</p><p>•2 Vehicle Proficiencies (Light Planetary
      Recommended)</p><p>•Common and 2 other languages</p><p>•$2,500 to spend on equipment</p><p>•+2 in One Ability Score and +1 in Another Ability Score of Your Choice -OR- +1 in Three Ability Scores of
      Your Choice</p><p>•Origin Feat of Your Choice</p><p>•Alternatively, use any background in the D&amp;D Beyond Basic Rules.</p><h3>Languages</h3><p>When selecting your additional language, choose from
      the tables below. <strong>Galactic &amp; Realm Languages</strong> <strong>Location / Realm</strong> <strong>Languages</strong> Galaxy Common, Common Sign Language Criminal Underworld Smuggler’s Slang
      Abyssal Void Hadalic Agathos Sideric Arcadia Pixlish Cacophony/Fiends Dissonant Eldest Ryliath Harmony/Giants Lyric Hypergrid/Programs/Bots SIGNAL World Souls/Elementals Clysmic <strong>World Languages</strong>
      <strong>World</strong> <strong>Homeworld Species</strong> <strong>Languages</strong> Adonia Solari Promean Astrovega Laika Astronian Bortuun Yaungu Boru, Lyric Cabaret — Dissonant Caldoa Volcar Clysmic,
      Magmari Cicero Prime — Dissonant Ferrox — — Goro Clawderan, Raizo Typhan Kharabis Jozza, Murexian Hadalic, Selash Krayta Saurian, Tekal Zoic K’Thar Yoggoth Ryliath Lythora — Lyric, Zoic Mavros Marsoom,
      Zeticulan Rosidian Megadyne Anitron, Isotron SIGNAL Morzebe Oculok Morlith Neo-Edifex — — Noxilus — Dissonant Polygonia Bitling, Navili Pixlish Prismara Flambego, Glowblin, Poggle Chroma Sethreen
      Amanite, Gorgonite, Pakku Phytoss Shensaati Zamani Shensi Sleema Greeble, Nematoan Sleemese <strong>World</strong> <strong>Homeworld Species</strong> <strong>Languages</strong> Tibbulus Oozoid, Zephursa
      Nimboo Titan IX Aetheron, Rangor Khora Uthen — Sideric Uulzoth — Ryliath Val’Shai Benthos, Nilari Hadalic, Promean Viridar — Zoic Vulx Skettik, Zorbrak Ossik Zartoga — Selash</p><h3>Homeworld Origin
      Feats</h3><p>This section presents new homeworld themed Origin feats. Characters who hail from a world—or its equivalent such as a space station—that matches a given feat’s prerequisite can choose
      that for their Origin feat.</p><h4>Adamant Origin</h4><p>Origin Feat (Prerequisite: Rocky Homeworld) You have absorbed the essence of your home’s stoney nature or world soul, gaining the following
      benefits.</p><p><strong>Solid Foundation.</strong> You have Advantage on saving throws against being moved against your will and against the Prone condition.</p><p><strong>Stone’s Toughness.</strong>
      You know the Deflection* cantrip and you don’t require spell components for it. Intelligence, Wisdom, or Charisma is your spellcasting ability for it (chosen when you select this feat).</p><h4>Airy
      Origin</h4><p>Origin Feat (Prerequisite: Airy or Storming Homeworld) You have absorbed the essence of your home’s airy nature or world soul, gaining the following benefits.</p><p><strong>Damage Resistance.</strong>
      You have Resistance to falling damage, Lightning damage, or Thunder damage (chosen when you select this feat).</p><p><strong>Lasting Breath.</strong> You can hold your breath for a number of hours
      equal to 3 plus your Constitution modifier (minimum of +1).</p><h4>Aquatic Origin</h4><p>Origin Feat (Prerequisite: Oceanic Homeworld) You have absorbed the essence of your home’s aquatic nature or
      world soul, gaining the following benefits.</p><p><strong>Amphibious.</strong> You can breathe air and water.</p><p><strong>Swim Speed.</strong> You have a Swim Speed equal to your Speed. If you already
      have a Swim Speed, it increases by 10 feet.</p><h4>Awakened Mind Origin</h4><p>Origin Feat (Prerequisite: Eldritch or Psychic Homeworld) You have absorbed the essence of your home’s psychically awakened
      nature or world soul, gaining the following benefits.</p><p><strong>Psychic Resistance.</strong> You have Resistance to Psychic damage.</p><p><strong>Resilient Mind.</strong> You have Advantage on
      saving throws to avoid or end the Charmed or Frightened conditions.</p>'
