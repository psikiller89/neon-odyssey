- _id: YfIXn15pT1Zv4oXQ
  name: Vehicle Rules
  type: text
  sort: 500000
  title:
    show: true
    level: 1
  text:
    format: 1
    content: '<h2>Vehicles</h2><p>Vehicles are woven into every layer of life in the Stardust Rhapsody—from the most commonplace personal commuter car, to rapid air transit across continents, to the wondrous
      and awe-inspiring starships that carry souls to the farthest reaches of the galaxy. Vehicles of all kinds in Neon Odyssey follow the rules presented in this chapter. Starships will have their own
      rules which can replace these.</p><h2>Stat Blocks</h2><p>A vehicle’s game statistics function like those for creatures with the following additional considerations.</p><h3>Structures</h3><p>Vehicles
      are treated as mobile structures. They aren’t subject to effects that target creatures, but some effects can apply conditions to vehicles. Vehicles and Starships are noted as such where a standard
      creature stat block lists its creature type.</p><h3>Starship Scale</h3><p>Starship sizes operate on a different scale than standard creatures and objects, and use a special notation of size categories
      relative to other starships. Using standard size categories, starships are Gargantuan. A starship’s stat block lists its starship size category.</p><h3>Vehicle Class</h3><p>Vehicles are divided into
      nine different classes as shown on the Vehicle Classes table. A vehicle’s class, which is also the proficiency used to operate it, is listed as a tag after its size category entry.</p><p>A creature
      that has proficiency with a vehicle it is operating can add its Proficiency Bonus to any D20 Tests it makes using the vehicle or its systems. If that creature also has proficiency in a skill the task
      requires, it makes the check with Advantage.</p><h3>Crew</h3><p>Vehicles generally require one or more creatures to operate them. The Crew entry lists the minimum and maximum number of creatures that
      can crew the vehicle.</p><h3>Armor Class</h3><p>Planetary vehicles are typically made of steel or similar material and have an AC of 19 plus its Dexterity modifier while moving, or 19 while stationary.
      Worn or damaged vehicles might have a lower AC. Starship AC is determined differently, and will be included in a later playtest. <strong>Vehicle Classes</strong> <strong>Vehicle Class</strong> <strong>Example</strong>
      Light Planetary Racing Bike, Cargo Hauler, Defense Airspeeder, Speeder Heavy Planetary Freight Hauler, Bulk Passenger Transport, Tank Light Mech Armored Enforcement Walker, Battle Frame Standard Mech
      Assault Mech, Construction Walker Heavy Mech Cavalon Questing Knight, Morzebian Hulk Light Starfighter Interceptor, Patrol Craft Standard Starfighter Superiority Fighter, Saurok Sentinel Heavy Starfighter
      Bomber, Cavalon Lance Light Transport Light Freighter, Passenger Liner Heavy Transport Heavy Freighter, Strike Carrier Capital Ship Cavalon Crownship, GrimCo Destroyer</p><h3>Hit Points</h3><p>The
      vehicle’s maximum Hit Points. Lost Hit Points can be restored by making repairs to the vehicle (see “Repairs”). When a vehicle drops to 0 Hit Points, it ceases to function and is damaged beyond simple
      repair. The wreck can be rebuilt or salvaged for scrap at the GM’s discretion.</p><h4>Shield Points</h4><p>Some vehicles and most starships have shield generators that provide Shield Points (SP in
      the stat block if it has shields) while the vehicle is powered up. Shield Points work like an outer layer of Hit Points, taking any damage dealt to the vehicle first. Once the Shield Points are reduced
      to 0, any further damage (including excess damage when the Shield Points drop to 0) applies to the vehicle’s Hit Points. After 1 minute without taking damage, the Shield Points are restored to their
      maximum.</p><h4>Damage Threshold</h4><p>Vehicles have bulk or armor that lets them shrug off minor damage. The vehicle has Immunity to all damage unless it takes an amount of damage equal to or greater
      than its Damage Threshold value, in which case it takes the damage as normal. Damage that fails to overcome the Damage Threshold is superficial and doesn’t reduce the vehicle’s Hit Points or Shield
      Points.</p><p>For example, a vehicle has a Damage Threshold of 15. A laser blast hits it and deals 20 Radiant damage. The total exceeds the Damage Threshold, so the vehicle takes the full damage.
      If instead the blast dealt 14 damage, the vehicle would take no damage.</p><h4>Mishap Threshold</h4><p>If a vehicle’s Hit Points take damage from a single source equal to or greater than its Mishap
      Threshold, it must roll on the appropriate mishaps table for its type (see “Mishaps”).</p><h3>Speed</h3><p>Planetary vehicles have Speed that works like that of other creatures. Starships are incredibly
      fast and have special rules for their Speed. If a vehicle’s Speed lists a Cruise Speed, this Speed governs travel outside of combat.</p><h4>Atmospheric Speed</h4><p>Certain flying vehicles are far
      faster than most ground-based vehicles or even flying creatures can match, so its Fly Speed is given in hexes (which for flying vehicles in atmosphere are 500 ft.). These vehicles are classed as Starfighters
      despite not being able to travel into space and use those rules (which will appear in a future playtest).</p><h3>Ability Scores</h3><p>A vehicle has ability scores and corresponding modifiers. A creature
      driving the vehicle typically makes ability checks and maneuvering-related saving throws for the vehicle using the vehicle’s ability scores. When game text calls for a vehicle D20 Test of any variety,
      a “vehicle Dexterity check” for example, it refers to making that test using the vehicle’s abilities. If a vehicle ability check notes a skill, it uses the creature&#x27;s proficiencies as normal.</p><p>The
      vehicle’s size and weight determine its Strength. Dexterity represents its handling and maneuverability. Constitution reflects its durability and quality of construction. Vehicles with computers,
      sensors, or communication systems have Intelligence, Wisdom, and Charisma scores representing those systems, respectively. Vehicles that lack those systems have a score of 0 in the corresponding ability.</p><p>If
      the vehicle has a 0 in a score, it automatically fails any vehicle D20 Test that uses that score, though it might also be immune to effects that target it. For example, a vehicle with an Intelligence
      score of 0 lacks a computer system and automatically fails vehicle D20 Tests that use Intelligence, but it also can’t be spiked as it has no computer to hack.</p><h3>Cargo Capacity</h3><p>Cargo Capacity
      specifies how much cargo the vehicle can carry or tow beyond personal gear carried by passengers.</p><h3>Passengers</h3><p>The Passengers entry lists how many creatures (usually Medium, but this can
      vary by the vehicle’s construction) can ride in the vehicle comfortably—along with any equipment such creatures can carry. More creatures can potentially fit by squeezing inside or hanging on to the
      outside of the vehicle.</p><h3>Sensors</h3><p>Most starships and some planetary vehicles, particularly military models, have sensor systems installed. See the “Sensors” crew station for rules on using
      sensors. The Sensors entry specifies the range of the vehicle’s sensors and its Passive Perception score using sensors.</p><h3>Crew And Stations</h3><p>A vehicle doesn’t take actions on its own and
      relies on crew to occupy stations and use their turns to operate the vehicle’s functions. Except for Controls, any option that appears in the Crew Stations section of a vehicle stat block requires
      an action to perform. Some vehicles have Bonus Actions or Reactions, which also require crew to perform as specified, such as the Racing Bike’s Agile Dodge.</p><h4>Cover</h4><p>Crew inside enclosed
      vehicles usually have at least ThreeQuarters Cover, such as in a Speeder or any typical vehicle with normal windows. Reinforced vehicles, such as military vehicles and starships provide Total Cover
      to their crew.</p><h2>General Vehicle Rules</h2><p>Rules for vehicles are summarized below.</p><h3>Fire Arcs</h3><p>Vehicle weapons have fire arcs which might restrict the directions from the vehicle
      in which they can attack. A weapon station’s fire arcs are noted in the station’s name. Typical arcs are Front, Left, Right, and Rear. In the case of weapons that can swivel such as a turret, it might
      have multiple fire arcs it can cover, or All if it can rotate 360 degrees.</p><h3>Opportunity Attacks</h3><p>Vehicles provoke Opportunity Attacks. When a vehicle provokes an Opportunity Attack, the
      attacker can target the vehicle or a creature riding on or in the vehicle that doesn’t have Total Cover and is within reach.</p><h3>Vehicle Systems And Crew Stations</h3><p>A creature can use an action
      of the station it’s occupying. Once a creature uses a station’s functions, that station can’t be used by any other creatures until the start of the first creature’s next turn. Only one creature can
      control a station at a time.</p><p>A creature not occupying a station is either in an interior space or clinging to the outside of the vehicle.</p><p>Small or larger starships typically have stations
      for all their systems.</p><h4>Controls</h4><p>A vehicle’s Controls station is typically a chair with a steering wheel or control stick, switches, pedals, and other controls. A vehicle with no driver
      or pilot automatically fails Dexterity saving throws.</p><p><strong>Control.</strong> A driver or pilot can take a Bonus Action to start or shut down the vehicle’s engine. Some massive vehicles take
      longer to power up, as noted in their Controls station with a Power Cycle entry. While the engine is on, the driver can use its movement during its turn to control the vehicle instead of moving normally.
      The driver of a ground vehicle can propel it up to its Speed or bring the vehicle to a dead stop. While the vehicle is moving, the driver can also steer it along any course. The vehicle can reverse
      by spending 2 feet of movement for every foot moved. Starships have their own rules for movement, presented in a future playtest.</p><p><strong>Actions.</strong> The driver or pilot can use its action
      as normal while controlling a vehicle, and it can use its action to make the vehicle take the Dash, Disengage, Dodge, or Hide action, or take the Attack action to fire weapons operated by the vehicle’s
      Controls. If the station controls multiple weapons, the creature can choose which weapon to fire with each attack it makes.</p><p><strong>Systems.</strong> The driver or pilot can operate the communication,
      engineering, sensor, and shield systems of the vehicle, if any.</p><p>If the driver or pilot has the Incapacitated condition, leaves the Controls, or does nothing to alter the vehicle’s course and
      speed, the vehicle moves in the same direction and at the same speed as it did during the driver’s last turn until it hits an obstacle big enough to stop it.</p><h4>Communication</h4><p>If a vehicle
      has a Communication system, a creature crewing it (called a comms operator) can take the Utilize action to use the following features. If the vehicle has an Intelligence score, the comm station functions
      as a Spiking Deck.</p><p><strong>Jam Comms.</strong> Make a vehicle Charisma (Computers) check and record the total. When an enemy vehicle within 1 mile (or within sensor range for starships) tries
      to use a Communication station or other transmission system, it must succeed on a vehicle Charisma saving throw with a DC equal to the recorded total or the communication attempt fails, and can’t
      be tried again until the start of its next turn. Personal Communicators are also affected and don’t function.</p><p><strong>Malware Strike (Requires Intelligence).</strong> Target a powered-up vehicle
      you can see within 500 feet or on the vehicle’s sensors (if any) and make a vehicle Intelligence (Computers) check. If the target has an Intelligence score, it must succeed on a vehicle Intelligence
      saving throw with a DC equal to your check total or have Disadvantage on vehicle ability checks, attack rolls, or saving throws (your choice) for 1 minute. The target repeats the save at the end of
      each of its turns, ending the effect on a success.</p><h4>Engineering</h4><p>If a vehicle has an Engineering system, a creature crewing it (called an engineer) can make Intelligence checks to repair
      Mishaps and Ion Exhaustion (see “Vehicle Exhaustion” below) without being at the location of the damaged system.</p><h4>Sensors</h4><p>If a vehicle has a Sensors system, a creature crewing it (called
      a sensor operator) can operate the sensors. Sensors operate in two modes: Passive (the default) and Sweep. An operator can change sensor modes once on its turn (no action required) if it doesn’t have
      the Incapacitated condition.</p><p>The ability check to operate sensors is a vehicle Wisdom (Computers) check.</p><p><strong>Passive Mode.</strong> Passive sensors produce no signals of their own
      and read information from the environment including surrounding terrain or conditions in space, positions of Huge or larger objects and vehicles and Gargantuan creatures, and any active transmissions.
      An operator can take the Search action using the sensors to detect hidden targets or the presence of targets with the Invisible condition. If this detection doesn’t cause the target to lose the Invisible
      condition, the target doesn’t fully appear on the sensors, but its position is revealed. A vehicle with its sensors in Passive mode imposes Disadvantage on use of sensors to detect it.</p><p><strong>Sweep
      Mode.</strong> Sweep mode focuses the sensors on one fire arc. The sensors return no information on the other three arcs but have Advantage on Search actions made with the sensors in the targeted
      arc, and other vehicles have Advantage on use of sensors to detect the sweeping vehicle. The operator can Scan a target (see below) or take the Help action targeting a vehicle on sensors, granting
      the operator’s vehicle Advantage on the next attack roll it makes against the target before the end of the vehicle&#x27;s next turn. <strong>Scan.</strong> Scan a single object, structure, or a 1-hex
      area (1,500 ft. in space, 500 ft. in atmosphere) in range. As a Search action, make a DC 10 vehicle Wisdom (Computers) check with Advantage. On a success, and for every 5 by which the total exceeds
      the DC, you learn one of the following pieces of information of your choice about the target:</p><p>•One ship’s identifying information</p><p>•Amount of cargo in a container or vehicle</p><p>•Type
      of cargo in a container or vehicle</p><p>•A vehicle’s weapon systems</p><p>•A ship’s FTL systems</p><p>•Presence and number of life forms</p><p>•A vehicle’s current and maximum Hit Points and Shield
      Points</p><p>•Any active Mishaps or Exhaustion levels</p><p>•Presence of power sources</p><p>•Presence and general shape of structures</p><p>•Environmental hazards (e.g. aether leak in a ship, toxicity
      in a planet’s atmosphere).</p><h4>Shields</h4><p>If a vehicle has a Shields system, as a Utilize action, the operator can Focus or Reset the vehicle’s shields.</p><p><strong>Focus Shields.</strong>
      Double the current and maximum Shield Points and apply them to the chosen arc, and the other three arcs aren’t protected by the shields—any incoming damage to those arcs applies directly to the vehicle’s
      Hit Points.</p><p><strong>Reset Shields.</strong> Halve the current focused Shield Points and apply that protection to all fire arcs, and the maximum Shield Points return to normal.</p><h4>Weapon
      Stations</h4><p>A creature crewing the station (called a gunner) can fire the station’s weapons using the vehicle’s relevant ability score (the ability modifier is included in the weapon’s attack
      bonus). If the gunner has proficiency with the weapon as indicated in the station’s name or has proficiency with the vehicle class noted in the vehicle’s stat block, the gunner can add its Proficiency
      Bonus to attack rolls with the weapon.</p><p><strong>Character-Scale Weapons.</strong> If the station’s weapon is one that appears in the equipment section’s weapon list, a gunner that can make multiple
      attacks as part of the Attack action, such as with the Extra Attack feature, can fire the weapon as many times as its features allow. If the station controls multiple weapon systems, the gunner chooses
      which to fire with each attack it can make.</p><h3>Mishaps</h3><p>Roll on the Planetary Vehicle Mishaps table when one of the following occurs to a vehicle (Starships have their own table):</p><p>•The
      vehicle’s Hit Points (not Shield Points, if any) takes damage from a single source equal to or greater than its Mishap Threshold.</p><p>•The vehicle becomes Bloodied.</p><h3>Vehicle Exhaustion</h3><p>Wear
      and tear, and some weapons, can cause a vehicle to stop functioning properly. This degradation can be represented by Exhaustion levels as described in the core rules with the following modifications:</p><p>•The
      Exhaustion penalty applies to any D20 Test made using the vehicle’s stations or ability scores.</p><p>•When the vehicle reaches Exhaustion level 6, its Hit Points drop to 0 and the vehicle breaks
      down.</p><p>•Exhaustion levels can only be removed from the vehicle by repairing it. <strong>Planetary Vehicle Mishaps</strong></p><h4>1d20</h4><p><strong>Mishap</strong> <strong>Repair DC</strong>
      <strong>1</strong> <strong>Fire.</strong> A fire breaks out in the vehicle’s engine. A creature that starts its turn in or on the vehicle takes 11 (2d10) Fire damage. 15 (Dex) <strong>2–4</strong>
      <strong>Frozen Steering.</strong> The vehicle can’t turn. It automatically fails vehicle ability checks and saving throws using Dexterity until repaired. 15 (Str) <strong>5–7</strong> <strong>Power
      Drain.</strong> The vehicle gains 1 Exhaustion level. See “Repairs” <strong>8–10</strong> <strong>Weapon Malfunction.</strong> One of the vehicle’s weapons (determined randomly) is disabled until
      repaired. If the vehicle has no functioning weapons, this mishap has no effect. 20 (Str) <strong>11–13</strong> <strong>Sharp Veer.</strong> The driver must take an action at the start of each of
      its turns to hold the vehicle’s course steady, or the vehicle swerves 45 degrees to one side and moves one-quarter of the Speed it moved during its last turn in that direction. 15 (Dex) <strong>14–16</strong>
      <strong>Buckled Frame.</strong> The vehicle’s Damage Threshold is reduced by 10 until repaired. 15 (Str) <strong>17–19</strong> <strong>Damaged Drive.</strong> The vehicle shudders uncontrollably
      until repaired. It has Disadvantage on vehicle Dexterity checks, and creatures riding the vehicle have Disadvantage on ability checks and attack rolls. 20 (Dex) <strong>20</strong> <strong>Roll Over.</strong>
      The vehicle rolls, has the Prone condition, and comes to a dead stop in an unoccupied space. Creatures holding on to the outside of the vehicle must succeed on a DC 20 Strength saving throw or be
      thrown off, landing with the Prone condition in a random unoccupied space within 30 feet of the overturned vehicle. Creatures inside the vehicle have the Prone condition and take 11 (2d10) Bludgeoning
      damage. —</p><h4>Ion Exhaustion</h4><p>Ion weapons, electrical hazards, and other effects can inflict Ion Exhaustion on vehicles. Ion Exhaustion levels are treated the same as standard vehicle Exhaustion
      but can be repaired more easily (see “Remove Exhaustion” below). If a vehicle reaches 6 Exhaustion levels with any number of Ion Exhaustion levels among them, it shuts down, but can be restarted once
      at least one level is removed.</p><h3>Repairs</h3><p>When a vehicle is damaged, suffers a mishap, or gains any Exhaustion levels, a creature can attempt to repair the vehicle. The creature making
      repairs must meet the following criteria:</p><p>•The creature can’t operate any of the vehicle’s stations while making repairs.</p><p>•The creature must be within reach of the damaged area.</p><p>•The
      creature must have the right tools for the job (usually Mechanic’s Tools or Engineer’s Tools).</p><p>When it begins making repairs, the creature must decide which repair option (presented below) it
      will use.</p><h4>End a Mishap</h4><p>A creature can take the Utilize action to make an ability check using appropriate tools, determined by the mishap (see the Mishaps table), with Disadvantage if
      the vehicle is moving. A mishap with no repair DC can’t be repaired.</p><h4>Remove Exhaustion</h4><p>The creature can spend 1 hour or more trying to reduce the vehicle’s Exhaustion level. The vehicle
      must be stationary, and the creature must have Repair Parts (see the Equipment section). After 1 hour of work, the creature makes a DC 15 Intelligence (Technology) check using Engineer’s Tools or
      Mechanic’s Tools. On a success, expend 1 Repair Parts and the vehicle’s Exhaustion level decreases by 1. On a failure, the repair fails, but the parts aren’t wasted.</p><p><strong>Removing Ion Exhaustion.</strong>
      A creature can remove Ion Exhaustion levels from the vehicle as a Utilize action using Engineer’s Tools or an Engineering station. The creature makes a DC 15 Intelligence (Technology) check, removing
      1 Ion Exhaustion level on a success. For every 5 by which the total exceeds the DC, remove one additional level.</p><h4>Restore Hit Points</h4><p>If the vehicle has at least 1 Hit Point, a creature
      can spend 1 hour or more trying to patch damaged panels and replaced damaged parts. The vehicle must be stationary, and the creature must have Repair Parts (see &quot;Equipment&quot;). After 1 hour
      of work, the creature makes a DC 10 Dexterity (Technology) check using Mechanic’s Tools. On a success, the vehicle regains Hit Points appropriate to the Repair Parts used. For every 5 points by which
      the total exceeds the DC, the Hit Points regained increases by 5. On a failure, the repair fails, but the parts aren’t expended.</p><p>Spells such as the Mending cantrip generally aren’t powerful
      enough to repair the kind of damage that significantly impairs vehicles unless that damage is especially pinpointed, such as torn cables, cut circuit boards, cracked engine blocks, snapped axles,
      etc.</p><h3>Planetary Vehicle Crashes</h3><p>When a vehicle crashes into something that could damage it, such as another vehicle, a concrete wall, or a creature one size smaller than the vehicle or
      larger, the vehicle comes to a sudden stop and takes 1d6 Bludgeoning damage for every 10 feet it moved since its last turn (maximum 20d6). Whatever the vehicle struck takes the same amount of damage.
      If two vehicles collide head on, add their crash damage together.</p><p>Creatures riding vehicles involved in a crash must make a DC 15 Strength saving throw, taking the same amount of damage the
      crash dealt on a failed save, or half as much damage on a successful one.</p><h4>Crashing into Creatures</h4><p>A vehicle can crash into a creature by entering its space. The target can take a Reaction
      to try to evade the vehicle and make a DC 10 Dexterity saving throw. On a failure, the vehicle hits the target, and the target takes damage as a crash and has the Prone condition. On a success, the
      target moves to the closest unoccupied space out of the vehicle’s path and takes no damage. A creature makes this save only once per turn.</p><p>If the vehicle is at least two size categories bigger
      than the target, the vehicle can continue moving through the target’s space if it has any movement left. Otherwise, the vehicle comes to a dead stop and crashes.</p><h3>Falling</h3><p>When a vehicle
      goes over a cliff or otherwise falls, the vehicle and all creatures on or in it take damage from the fall as normal and land with the Prone condition.</p>'
