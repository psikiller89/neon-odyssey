    content: '<h2>Equipment</h2><p>An outrunner’s survival can depend on having the right gear for the mission. This section provides rules and prices for weapons, armor, and other kinds of equipment that
      characters might purchase or find. The GM lets you know if a shop has an item for sale and whether it’s available at the listed price.</p><h4>SELLING EQUIPMENT</h4><p>Equipment fetches half its cost
      when sold. In contrast, trade goods and valuables—like precious stones, commodities, and art objects—retain their full value in the marketplace.</p><h2>Currency</h2><p>The core currency used throughout
      the galaxy is the Galactic Note, denoted by this symbol: $. Notes are a physical or digital manifestation of the concept of value as embodied and empowered in the Hypergrid. Nexus Financial, the galaxy’s
      largest and most powerful banking and financial institution, controls the minting and distribution of notes.</p><p>Galactic Notes come in several forms, including metal or plastic coins, paper or
      polymer bills, and digital “credit” chips or simply account balances.</p><p>Notes are notoriously difficult to counterfeit due to their magical origin and nature (though they aren’t magic items themselves),
      and successful counterfeiters are or work closely with data mavens versed in technomagic such as Gridrunners.</p><h4>CURRENCY CONVERSION</h4><p>If you need to compare values with items from outside
      the Neon Odyssey setting, 1 GP equals $50. Some prices of equivalent gear might not match this ratio, as several prices have been intentionally adjusted to account for a variety of factors.</p><p>As
      a consideration, the buying power of $1 is roughly equivalent to that of 1 US dollar circa 1997.</p><h2>Hypertech</h2><p>Magic items created with technological magic resemble technology despite functioning
      as magic items. Technomagic items are known throughout the Stardust Rhapsody as “hypertech.” Hypertech items follow all the same rules as standard magic items.</p><h2>Weapons</h2><p>Weapons in Neon
      Odyssey are drawn from space opera and fantasy, but all with an air of technological magic.</p><p>Melee weapons function just as one would expect a sword, axe, or spear to work, but the high-tech
      nature of these weapons means they’re enhanced and empowered if they have the Powered property. These weapons might have energized striking surfaces, hypersonic vibrations, or selfhoning, monomolecular
      cutting edges that keep them on par with space-age ranged weapons.</p><p>The Weapons tables in this section show the game’s main weapons. These tables lists the game statistics, cost, and weight of
      each weapon.</p><h3>New Weapon Properties</h3><p>New weapon properties are presented here in alphabetical order.</p><h4>Braced</h4><p>When making an attack with a Braced weapon, use your Strength
      modifier for the attack and damage rolls. If the weapon has the Heavy property, use your Strength score to determine if you can use it without Disadvantage.</p><h4>Burst</h4><p>As an action, or in
      place of one attack when you take the Attack action, you can expend 3 shots of a Burst weapon’s ammunition and make an attack with the weapon. On a hit or a miss, a second target within 5 feet of
      the first must make a DC 15 Dexterity saving throw or take the weapon’s damage, but you don’t add your ability modifier to that damage unless it is negative.</p><h4>Close Quarters</h4><p>Being within
      5 feet of an enemy doesn’t impose Disadvantage on your ranged attack rolls with a Close Quarters weapon.</p><h4>Powered</h4><p>You can activate a Powered weapon that has a charged Power Cell when
      you make an attack with it. On a hit while activated, the weapon’s damage die changes to the value noted with the property. If a damage type is also noted, the weapon deals damage of that type when
      activated. If the weapon also has the Versatile property, the Powered property has a second notation for the activated damage when wielded with two hands. A full Power Cell powers the weapon for 25
      attacks. You can exchange the cell as an action or a Bonus Action.</p><h4>Pummel</h4><p>Attacks with a Pummel weapon count as making Unarmed Strikes in addition to using a weapon. <strong>Martial
      Melee Weapons</strong> <strong>Name</strong> <strong>Damage</strong> <strong>Properties</strong> <strong>Mastery</strong> <strong>Weight</strong> <strong>Cost</strong> Breaker Axe 1d12 Slashing Heavy,
      Powered (2d8), Two-Handed Cleave 7 lb. $1,500 Breaker Sword 2d6 Slashing Heavy, Powered (2d8), Two-Handed Graze 6 lb. $2,500 Combat Axe 1d8 Slashing Powered (1d10; 1d12), Versatile (1d10) Topple 4
      lb. $750 Combat Sword 1d8 Slashing Powered (1d10; 1d12), Versatile (1d10) Sap 3 lb. $750 Combat Hammer 1d8 Bludgeoning Powered (1d10; 1d12), Versatile (1d10) Push 5 lb. $750 Concussion Maul 2d6 Bludgeoning
      Heavy, Powered (2d8 Thunder), Two-Handed Topple 10 lb. $2,500 Dueling Blade 1d8 Piercing Finesse, Powered (1d10) Vex 2 lb. $1,250 Filament Whip 1d4 Slashing Finesse, Powered (1d6 Fire), Reach Slow
      2 lb. $500 Mag Flail 1d8 Bludgeoning Powered (1d10) Sap 2 lb. $500 Nano-Edge Spear 1d8 Piercing Powered (1d10; 1d12), Thrown (Range 20/60), Versatile (1d10) Sap 4 lb. $250 Pole Axe 1d10 Slashing Heavy,
      Powered (1d12), Reach, Two-Handed Cleave 6 lb. $1,000 Power Fist 1d8 Bludgeoning Heavy, Powered (1d10), Pummel Topple 4 lb. $1,250 Power Glaive 1d10 Slashing Heavy, Powered (1d12), Reach, Two-Handed
      Graze 6 lb. $1,000 Quickblade 1d6 Piercing Finesse, Light, Powered (1d8) Vex 2 lb. $500 Saber 1d6 Slashing Finesse, Light, Powered (1d8) Nick 3 lb. $1,250 Vibro Pike 1d10 Piercing Heavy, Powered (1d12),
      Reach, Two-Handed Push 18 lb. $1,000 Shock Lance 1d10 Piercing Heavy, Powered (1d12 Lightning), Reach, Two-Handed (unless mounted) Topple 6 lb. $1,000 <strong>Martial Ranged Weapons</strong> <strong>Name</strong>
      <strong>Damage</strong> <strong>Properties</strong> <strong>Mastery</strong> <strong>Weight</strong> <strong>Cost</strong> Assault Rifle 1d8 Piercing Ammunition (Range 200/800; Bullets), Burst, Heavy,
      Reload (40 shots), Two-Handed Push 8 lb. $2,500 Breach Rifle 2d6 Piercing Ammunition (Range 80/320; Shells), Braced, Burst, Heavy, Reload (20 shots), Two Handed Cleave 10 lb. $4,000 Pulse Cannon 1d12
      Thunder Ammunition (Range 20/80; Power Cell), Braced, Heavy, Reload (5 shots) Push 4 lb. $2,500 Hand Cannon 1d12 Piercing Ammunition (Range 20/80; Shells), Braced, Heavy, Reload (5 shots) Topple 5
      lb. $2,500 Heavy Laser Rifle 2d6 Radiant Ammunition (Range 300/1,200; Power Cell), Heavy, Loading, Reload (5 Shots), Two-Handed Sap 25 lb. $7,500 Laser Rifle 1d8 Radiant Ammunition (Range 200/800;
      Power Cell), Burst, Heavy, Reload (25 Shots), Two-Handed Slow 7 lb. $2,500 Light Machine Gun 1d10 Piercing Ammunition (Range 200/800, Bullets), Burst, Finesse, Heavy, Reload (20 Shots), Two-Handed
      Cleave 15 lb. $3,750 Plasma Pistol 1d8 Lightning Ammunition (Range 80/320; Power Cell), Close Quarters, Reload (25 shots) Sap 4 lb. $2,000 Plasma Rifle 1d10 Lightning Ammunition (Range 200/800; Power
      Cell), Heavy, Reload (15 Shots), Two-Handed Vex 8 lb. $3,750 Repeating Laser 1d10 Radiant Ammunition (Range 200/800; Power Cell), Burst, Finesse, Heavy, Reload (20 Shots), Two-Handed Graze 12 lb.
      $3,750 Scatterblast 1d10 Fire Ammunition (Range 60/240; Power Cell), Close Quarters, Finesse, Reload (10 Shots), Scatter (15 ft.) Push 4 lb. $2,500 Shotgun 1d10 Piercing Ammunition (Range 60/240;
      Shells), Close Quarters, Finesse, Reload (10 Shots), Scatter (15 ft.) Vex 5 lb. $2,500 Sniper Rifle 2d6 Piercing Ammunition (Range 300/1,200; Bullets), Heavy, Loading, Two-Handed Graze 30 lb. $7,500
      <strong>Simple Weapons</strong> <strong>Name</strong> <strong>Damage</strong> <strong>Properties</strong> <strong>Mastery</strong> <strong>Weight</strong> <strong>Cost</strong> •<strong>Simple Melee
      Weapons</strong> Combat Baton 1d4 Bludgeoning Light, Powered (1d6) Slow 2 lb. $100 Combat Knife 1d4 Piercing Finesse, Light, Powered (1d6), Thrown (Range 20/60) Nick 1 lb. $100 Combat Staff 1d6 Bludgeoning
      Powered (1d8; 1d10), Versatile (1d8) Topple 4 lb. $250 Hatchet 1d6 Slashing Light, Powered (1d8), Thrown (Range 20/60) Vex 2 lb. $250 Hook Blade 1d4 Slashing Light, Powered (1d6) Nick 2 lb. $50 Power
      Cudgel 1d8 Bludgeoning Powered (1d10), Two-Handed Push 10 lb. $500 Shock Sap 1d6 Bludgeoning Powered (1d8 Lightning) Sap 3 lb. $250 Shock Knuckles 1d6 Bludgeoning Light, Powered (1d8 Lightning), Pummel
      Nick 1 lb. $100 Throwing Hammer 1d4 Bludgeoning Light, Powered (1d6), Thrown (Range 20/60) Nick 2 lb. $100 Throwing Spear 1d6 Piercing Powered (1d8), Thrown (Range 30/120) Slow 2 lb. $250 Vibro Claw
      1d4 Slashing Finesse, Light, Powered (1d6), Pummel Nick 1 lb. $250 Vibro Spear 1d6 Piercing Powered (1d8; 1d10), Thrown (Range 20/60), Versatile (1d8) Sap 3 lb. $50 •<strong>Simple Ranged Weapons</strong>
      Throwing Blade 1d4 Piercing Finesse, Thrown, Range (20/60) Vex 1/4 lb. $10 Laser Carbine 1d6 Radiant Ammunition (Range 150/600; Power Cell), Burst, Reload (25 Shots), Versatile (1d8) Slow 5 lb. $1,250
      Light Laser Pistol 1d6 Radiant Ammunition (Range 80/320; Power Cell), Close Quarters, Light, Reload (50 Shots) Nick 1 lb. $750 Light Pistol 1d6 Piercing Ammunition (Range 80/320; Bullets), Close Quarters,
      Light, Reload (15 Shots) Vex 1 lb. $750 Heavy Laser Pistol 1d8 Radiant Ammunition (Range 50/200; Power Cell), Close Quarters, Reload (25 Shots) Push 3 lb. $1,250 Heavy Pistol 1d8 Piercing Ammunition
      (Range 50/200; Bullets), Close Quarters, Reload (10 Shots) Sap 4 lb. $1,250 Submachine Gun 1d6 Piercing Ammunition (Range 150/600; Bullets), Burst, Reload (25 Shots), Versatile (1d8) Push 5 lb. $1,250</p><h4>Reload</h4><p>A
      Reload weapon’s ammunition is held in a magazine or a Power Cell. After the number of shots noted in the property, you must reload the weapon as an action or a Bonus Action.</p><h4>Scatter</h4><p>As
      an action, you can expend 2 shots from the weapon to fire it in a Cone with the specified area. Each creature in that area must succeed on a DC 15 Dexterity saving throw or take damage. Roll the weapon’s
      damage once and apply it to each creature that failed the save.</p><h3>Non-Lethal Ranged Attacks</h3><p>When you reduce a creature that isn’t a player character to 0 Hit Points using a ranged attack
      roll, you can choose not to kill the creature outright. The creature is dying and makes Death Saving Throws, even if it would normally die immediately upon reaching 0 Hit Points.</p><h3>Weapon Modules</h3><p>The
      arms industry has found many creative ways to improve weapons using cutting-edge technology.</p><p><strong>Mod Slots.</strong> This technology is widespread enough in the galaxy that Simple and Martial
      weapons are constructed with two mod slots, and more expensive and advanced weapons have as many as six. Additional mod slots increase the cost of the weapon as shown in the Weapon Mod Slot Costs
      table.</p><p><strong>Installing Modules in Mod Slots.</strong> You can set or remove a weapon module in a weapon mod slot with 1 minute of work.</p><p><strong>One of a Kind.</strong> The effects of
      multiple weapon modules of the same type don’t stack unless otherwise noted in the module. <strong>Weapon Mod Slot Costs</strong> <strong>Additional Mod Slots</strong> <strong>Cost</strong> 1 +$2,500
      2 +$20,000 3 +$180,000 4 +$1,500,000</p><h4>WEAPON AND ARMOR MODULES PREVIEW</h4><p>This document contains a sample of the weapon and armor mods that will be available in the full books. This limited
      selection is merely to whet your appetite.</p><h4>Deflection Circuitry ($2,000)</h4><p>This weapon module enhances melee weapons with forceprojection circuitry and can only be applied to weapons with
      the Powered property. When you are hit by a ranged attack roll that deals Force, Lightning, or Radiant damage, you can take a Reaction to expend a charge from its Power Cell and add 1d4 to your AC
      against that attack, possibly causing it to miss.</p><h4>Extended Magazine ($3,500)</h4><p>This weapon module doubles the ammo capacity of Ranged weapons with the Reload property that use Bullets
      or Shells.</p><h4>Extra Battery ($3,500)</h4><p>This weapon module allows Melee weapons with the Powered property and Ranged weapons with Power Cell ammunition to hold two Power Cells.</p><h4>Filament-Tether
      Grapnel ($2,500)</h4><p>This weapon module adds the function of an Ascension Gun to the weapon.</p><p>This module can only be applied to Ranged weapons.</p><h4>Grenade Chamber ($5,000)</h4><p>This
      weapon module increases the range of grenades. You can load a Grenade into this weapon module as a Bonus Action, and fire it in place of an attack when you take the Attack action. The grenade’s range
      increases to half the weapon’s normal range.</p><p>This module can only be applied to Ranged weapons with the Two-Handed property.</p><h2>Armor</h2><p>Armor in Neon Odyssey is created in a near-endless
      variety of materials, styles, and intentions. It would be impossible to do justice to a galaxy of variations in such limited space, so the rules present armor as basic shells which can then be upgraded
      and customized with armor modules. The Armor table presents the base varieties of Light, Medium, and Heavy armor, and Shields.</p><p>Consider your character’s origin world and culture when deciding
      what their armor looks like and what purpose it was designed for.</p><p>The Armor table lists the game statistics, cost, and weight of each type of armor.</p><h3>Armor Modules</h3><p>Armor can be
      improved in a wide variety of ways, including affixing modules to mod slots in the armor.</p><p><strong>Mod Slots.</strong> This technology is widespread enough in the galaxy that the ordinary suit
      of Light, Medium, or Heavy armor has two mod slots, and more expensive and advanced suits have as many as six.</p><p><strong>Installing Modules in Mod Slots.</strong> You can install or remove an
      armor module in an armor mod slot with 1 minute of work.</p><p><strong>One of a Kind.</strong> The effects of multiple armor modules of the same type don’t stack unless otherwise noted in the module.
      <strong>Armor Mod Slot Costs</strong> <strong>Additional Mod slots</strong> <strong>Cost</strong> 1 +$2,500 2 +$20,000 3 +$180,000 4 +$1,500,000</p><h4>Composite Weave ($1,750)</h4><p>You have a +1
      bonus to AC while wearing a suit of armor with this armor module. This armor module can&#x27;t be used in conjunction with Dynasteel Plating. While attached to Heavy Armor, the armor&#x27;s Strength
      requirement increases to 14.</p><h4>Concealed Compartment ($3,000)</h4><p>This armor module is typically placed on the forearm or thigh. It can hold one Tiny object, and you can take an object out
      of the compartment, or put an object in, as a Bonus Action. A creature can locate the compartment as a Search action with a successful DC 15 Wisdom (Perception) check.</p><h4>Dynasteel Plating ($6,250)</h4><p>You
      have a +2 bonus to AC while wearing a suit of Heavy Armor with this armor module, and the armor&#x27;s Strength requirement increases to 15. This armor module can&#x27;t be used on Light or Medium
      armor or in conjunction with Composite Weave.</p><h4>Environment Seals ($4,500)</h4><p>This armor module gives a suit of armor the air, pressure, radiation, and temperature protection needed to survive
      for up to 24 hours in space, underwater, or in other hostile environments. The armor module replenishes its protective capability with 1 hour of access to pressurized, breathable air.</p><h4>Integrated
      Tool ($2,500 Plus Tool Cost)</h4><p>This armor module integrates a tool and necessary controls for it into your armor. Bypass tools, Electronics Tools, Engineer’s Tools, Spiking Deck, and Mechanic’s
      Tools are by far the most common tools to integrate this way. The tool extends from the armor’s forearm, glove, or gauntlet.</p><p>You can install multiple Integrated Tool modules in a suit of armor,
      but you must choose different tools for each module.</p>'
