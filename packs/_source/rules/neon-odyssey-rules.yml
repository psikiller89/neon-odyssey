- _id: 2w0QM7L6LktTcBep
  name: Hypertech Spellcasting
  type: text
  sort: 400000
  title:
    show: true
    level: 1
  text:
    format: 1
    content: <h2>Spells</h2><p>This section presents new spells for Neon Odyssey. Some of these spells are replacements for standard spells that are otherwise not thematically appropriate for the space
      opera setting.</p><h2>Hypertech Spellcasting</h2><p>Many spellcasters in Neon Odyssey work their magic through hypertech rather than traditional magical or spellcraft trappings, using advanced but
      magical-at-its-core science and technology, tools, and gadgets. Any spellcaster can be a hypertech caster— make that decision for your character when you create it or when it gains a level in a class
      that grants it the ability to cast spells.</p><p>Hypertech spellcasters use Hypertech Component Packs (see the Equipment section) for their Material components, and all of their spells have an M component
      and lack a V component. They must have a Hypertech Component Pack or the specific Material component for a spell to cast it. Describe and rename your spells to showcase their scientific or technological
      origin. For example, Fireball might instead be Thermal Detonator for a hypertech spellcaster. The spell&#x27;s function is otherwise unchanged.</p><h4>ETHEREAL VERSUS OVERTONE</h4><p>When using standard
      D&amp;D game features, anything that references or interfaces with the Ethereal Plane or Border Ethereal instead interfaces with the Overtone in Neon Odyssey. Mechanically speaking, the two work identically.</p><p>For
      example, a Gridrunner casting Blink vanishes into the Overtone, where they can see 60 feet into the Material Plane, but can’t affect, be affected by, or be seen by anything on the Material Plane unless
      some game feature says otherwise, such as the See Invisibility spell or a Wall of Force.</p><h2>Spell Descriptions</h2><p>New spells are presented in alphabetical order.</p><h4>Accelerate Fall</h4><p>Level
      1 Transmutation (Esper, Gridrunner, Machinist) <strong>Casting Time:</strong> Reaction, which you take when you or a creature you can see within 60 feet of you falls <strong>Range:</strong> 60 feet
      <strong>Components:</strong> V, S <strong>Duration:</strong> 1 minute Choose up to five falling creatures within range. A target’s rate of descent doubles until the spell ends. If a target lands before
      the spell ends, it takes double damage from the fall, and the spell ends for it.</p><p><strong>Using a Higher-Level Spell Slot.</strong> If you cast this spell using a level 5+ spell slot, its range
      increases to 20 miles, it can target vehicles in addition to creatures, and the duration increases to 10 minutes.</p><h4>Anchoring Smite</h4><p>Level 3 Evocation (Enforcer) <strong>Casting Time:</strong>
      Bonus Action, which you take immediately after hitting a creature with a Melee weapon or an Unarmed Strike <strong>Range:</strong> Self <strong>Components:</strong> V <strong>Duration:</strong> Concentration,
      up to 1 minute Target hit by the strike takes 3d8 Force damage and is wrapped in magical tethers that bind its limbs and gag its mouth. For the duration, the target has the Restrained condition. While
      Restrained in this way, it can’t speak. At the end of each of its turns, the target can make a Strength saving throw, breaking free and ending the spell on a success.</p><p><strong>Using a Higher-Level
      Spell Slot.</strong> The extra damage increases by 1d8 for each spell slot level above 3.</p><h4>Armor of Secrets</h4><p>Level 1 Abjuration (Cryptist) <strong>Casting Time:</strong> Bonus Action <strong>Range:</strong>
      Self <strong>Components:</strong> V, S, M (a shard of black glass) <strong>Duration:</strong> 1 hour A shroud of shadowy whispers settles over you. You gain 5 Temporary Hit Points. If a creature hits
      you with a melee attack roll before the spell ends, the creature takes 5 Psychic damage. The spell ends early if you have no Temporary Hit Points.</p><p><strong>Using a Higher-Level Spell Slot.</strong>
      The Temporary Hit points and the Psychic damage both increase by 5 for each spell slot level above 1.</p><h4>Aura of Aether</h4><p>Level 4 Abjuration (Enforcer, Oracle) <strong>Casting Time:</strong>
      Action <strong>Range:</strong> Self <strong>Components:</strong> V <strong>Duration:</strong> Concentration, up to 10 minutes An aura radiates from you in a 30-foot Emanation for the duration. While
      in the aura, you and your allies have Resistance to Poison damage and Advantage on saving throws against the Blinded, Charmed, Deafened, Frightened, Paralyzed, Petrified, Poisoned, or Stunned conditions.</p><p>If
      a creature within the aura forces a creature affected by the aura to make a saving throw against any of the above conditions, you can take a Reaction to end the spell early. If you do, the triggering
      creature must make a Strength saving throw. On a failure, it takes 5d10 Radiant damage and is pushed straight away from you to the nearest space outside the Emanation. On a success, it takes half
      as much damage only.</p>
