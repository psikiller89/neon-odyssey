- _id: 72AhVwdNeTKhMVbI
  name: Aether Exposure & Grid Spiking
  type: text
  sort: 200000
  title:
    show: true
    level: 1
  text:
    format: 1
    content: '<h2>New Rule: Aether Exposure</h2><p>Outer Space in the Stardust Rhapsody is far from empty. It is filled with colorful clouds, nebulae, and currents of aether—a breathable gas that conducts
      heat much like a world’s atmosphere. While a creature can survive in it, aether is far from safe. Prolonged exposure saturates a creature with the strange energies aether carries, breaking down biological
      and living mechanical systems.</p><p>A creature breathing aether has the Poisoned condition. It must also make a DC 10 Constitution saving throw after each hour of exposure. On a failed save, the
      creature gains 1 Exhaustion level and can’t remove Exhaustion until it spends 1 hour in an aether-free environment.</p><p>A creature with an air supply (or that doesn’t breathe) but that is otherwise
      exposed to the aether, such as one using a Breath Mask but without an Enviro Suit, isn’t Poisoned by the aether and makes the save every 8 hours instead.</p><h2>New System: Grid Spiking</h2><p>Computers
      are a staple of life and technology in the Stardust Rhapsody, and so too are those who use, maintain, or abuse them. Computer hacking is colloquially known as “grid spiking” or simply “spiking” throughout
      the galaxy, and spikers are sought after both for security expertise, and for gaining unauthorized access to systems whether for criminal gain, or get advantage over an enemy.</p><h3>Access Secure
      System</h3><p>Users with proficiency in the Computers skill or with Spiking Decks can access secure systems—such as computers, security systems, or bots—without authorization. A user can’t perform
      any restricted operations on a secure system without first having an access code or spiking the security.</p><p>The Security Complexity table shows how long it takes to spike a security system based
      on its complexity. At the end of that time, the user breaks the security and can access the system with a successful Intelligence (Computers) check using a Spiking Deck. The DC is determined by the
      system’s quality, as shown on the Security Quality table.</p><p>Security systems of Daunting quality require multiple successful checks (minimum of 3) to spike. Failing any of these checks by 5 or
      more alerts system administrators to the intrusion attempt and could trigger a mishap (see “Spiking Mishaps”). <strong>Security Complexity</strong> <strong>Complexity</strong> <strong>Time</strong>
      Simple Utilize action Complex 1 minute Daunting 1 day, 3 successful checks needed <strong>Security Quality</strong> <strong>Quality</strong> <strong>DC</strong> Inferior 15 Good 20 Superior 25 Maximum
      30</p><h4>Operate Component</h4><p>With access to a computer system, a user can operate any devices or sub-systems governed by the main system. Unless the user has full authorization to use the system
      (such as by using stolen access codes), it must succeed on an Intelligence (Computers) check using a Spiking Deck to operate the system’s components. The time required for an operation and the DC
      are shown on the System Components table. Failing any of these checks by 5 or more alerts the system administrators to the intrusion. <strong>System Components</strong> <strong>Task</strong> <strong>Time</strong>
      <strong>DC</strong> Operate Passive Component Utilize action 15 Operate Active Component Utilize action 20 Reset Parameters Utilize action 25</p><p><strong>Operate Passive Component.</strong> The
      user can activate or deactivate one passive system such as door locks, cameras, or other sensors controlled by the system.</p><p><strong>Operate Active Component.</strong> The user can activate or
      deactivate one active system such as alarms, sentry guns, or security bots controlled by the system.</p><p><strong>Reset Parameters.</strong> The user can add, delete, or change one operational parameter
      of automated components such as targeting information on sentry guns, area authorization credentials, alarm delays, etc.</p><h4>Programming</h4><p>A user can alter an existing program or write a new
      one. After working for the required time, the user accomplishes the task with a successful Intelligence (Computers) check using a Spiking Deck against a DC determined by the task. Both the time required
      and the DC are shown on the Programming table. <strong>  Programming</strong> <strong>Task</strong> <strong>Time</strong> <strong>DC</strong> •<strong>Alter Program</strong> Change Access Codes 1
      minute 20 Hide Evidence 1 minute 15 Reprogram Bot 10 minutes 10 + bot’s Intelligence score Sabotage Program 1 minute 20 Wipe Bot Memory 10 minutes 20 •<strong>Write Program</strong> Simple Program
      1 day 15 Complex Program 7 days 25</p><p><strong>Change Access Codes.</strong> The user alters the access code of the program or system to one of its choice.</p><p><strong>Hide Evidence.</strong>
      The user hides the traces of its previous tampering with the system. On a successful check, record the total. That becomes the DC of Intelligence (Computers or Investigation) checks made to discover
      the tampering. If the system is altered again, the tampering is no longer hidden.</p><p><strong>Reprogram Bot.</strong> The user can add, change, or delete behavior directives or commands of a wiling
      robot or one with the Incapacitated condition. This reprogramming can compel the bot to take or refrain from taking actions as specified by the programmer. The user can reprogram a number of parameters
      equal to its Intelligence modifier (minimum of 1) with a single use of this task.</p><p><strong>Sabotage Program. </strong>The user tampers with the functioning of a program or repairs such tampering.
      Creatures have Disadvantage on any D20 Tests made to use a sabotaged program, or to use a system or equipment the program governs.</p><p><strong>Wipe Bot Memory.</strong> The user erases the memory
      storage of a willing robot or one with the Incapacitated condition, returning it to its baseline settings with no additional directives or knowledge.</p><p><strong>Write Simple Program.</strong> The
      user creates a simple program such as a database or account management application.</p><p><strong>Write Complex Program.</strong> The user creates a complex program such as a sophisticated analysis
      engine, a virus, or a security program.</p><h4>Spiking Mishaps</h4><p>When a spiker intrudes on a restricted system there’s always a risk of running afoul of intrusion countermeasures or alerting
      system admins to the unauthorized access. When a user attempting to access, manipulate, or operate a secure system without full authorization fails an Intelligence (Computers) check by 5 or more,
      roll on the Spiking Mishaps table.</p><p>If a mishap has a repair DC and the affected Spiking Deck is within reach, a user can take the Utilize action to end the mishap with a successful Intelligence
      (Technology) check using an Electronics Kit. <strong>Spiking Mishaps</strong></p><h4>1d20</h4><p><strong>Mishap</strong> <strong>DC</strong> <strong>1</strong> <strong>Destructive Feedback.</strong>
      The user takes 11 (2d10) Lightning damage from a Hypergrid surge. — <strong>2–4</strong> <strong>Memory Corruption.</strong> The Spiking Deck is corrupted with junk code and imposes a −2 penalty on
      ability checks using it until it’s repaired. If this mishap reoccurs, the penalty worsens by 2. If the penalty exceeds −10, the deck is destroyed. 15 <strong>5–7</strong> <strong>Firewall.</strong>
      The next ability check made against the system has Disadvantage. — <strong>8–10</strong> <strong>Transmitter Burnout.</strong> The Spiking Deck can’t form a stable connection to the Hypergrid until
      repaired. Unless the deck is connected to a system directly, the user must subtract 1d10 from ability checks using the deck. 20 <strong>11–13</strong> <strong>Hypercounter Protocol.</strong> The user
      must succeed on a DC 14 Wisdom saving throw or have the Stunned condition until the end of its next turn. <strong>14–16</strong> <strong>Lag Spike</strong>. The Spiking Deck suffers slowdown. Until
      it’s repaired, a user must take a Bonus Action to stabilize the deck’s software to take the Utilize action with it that turn. 20 <strong>17–19</strong> <strong>Location Fix.</strong> The system or
      its administrator learns the location of the spiker’s access point. — <strong>20</strong> <strong>Lockout.</strong> The spiker’s connection to the system is terminated and the spiker must find a different
      access point to spike that system again. —</p>'
