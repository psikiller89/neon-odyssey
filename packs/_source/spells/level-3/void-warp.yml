name: Void Warp
type: spell
img: modules/neon-odyssey/icons/neon/s-circle-nodes-violet.webp
system:
  description:
    value: <p>You teleport to an unoccupied space you can see within range.</p><p>You can also target one creature within 5 feet of you when you teleport. The target must make a Constitution saving throw.
      On a failure, the target is teleported to an unoccupied space of your choice that you can see within range, takes 1d10 Psychic damage, and has the Frightened condition until the end of its next turn.
      The chosen space must be on a surface that can support the target.</p>
