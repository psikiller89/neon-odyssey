name: Raking Shot
type: spell
img: modules/neon-odyssey/icons/neon/s-wand-magic-sparkles-yellow.webp
system:
  description:
    value: <p>You brandish the weapon used to cast the spell and conjure a withering crossfire in a 60-foot Cone. Each creature in that area makes a Dexterity saving throw. On a failed save, a target takes
      6d6 Force damage and has Disadvantage on attack rolls until the start of your next turn. On a successful save, a target takes half as much damage only.</p><p><strong>Using a Higher-Level Spell Slot.</strong>
      The damage increases by 1d6 for each spell slot level above 3.</p>
