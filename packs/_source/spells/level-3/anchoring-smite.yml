name: Anchoring Smite
type: spell
img: icons/magic/lightning/bolt-strike-blue.webp
system:
  description:
    value: <p>Target hit by the strike takes 3d8 Force damage and is wrapped in magical tethers that bind its limbs and gag its mouth. For the duration, the target has the Restrained condition. While Restrained
      in this way, it can’t speak. At the end of each of its turns, the target can make a Strength saving throw, breaking free and ending the spell on a success.</p><p><strong>Using a Higher-Level Spell
      Slot.</strong> The extra damage increases by 1d8 for each spell slot level above 3.</p>
