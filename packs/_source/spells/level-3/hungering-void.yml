_id: Gm5OXs0BUV02je4J
name: Hungering Void
type: spell
img: icons/magic/symbols/runes-star-pentagon-blue.webp
system:
  description:
    value: <p>You tear open a rift to the Abyssal Void, a place of hunger, darkness, and shattered minds. A 20-foot-radius Sphere of Darkness appears, centered on a point within range and lasting for the
      duration. The Sphere is Difficult Terrain, and is filled with muffled sounds of deep thrumming and strange cajoling, which are audible up to 30 feet away. No light, magical or otherwise, can illuminate
      the area, and creatures fully within it have the Blinded condition.</p><p>Any creature that starts its turn in the area takes 2d6 Cold damage. Any creature that ends its turn in there must succeed
      on a Intelligence saving throw or take 2d6 Psychic damage from otherworldly sibilance.</p><p><strong>Using a Highter-Level Spell Slot.</strong> The Cold or Psychic damage (your choice) increases by
      1d6 for each spell slot level above 3.</p>
