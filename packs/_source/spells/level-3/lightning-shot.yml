name: Lightning Shot
type: spell
img: icons/magic/movement/trail-streak-zigzag-yellow.webp
system:
  description:
    value: <p>After your attack hits or misses the target, the weapon or ammunition you’re using transforms into an arcing spark of lightning. On a hit, the target takes an extra 2d6 Lightning damage, and
      it can’t take Reactions until the start of its next turn. On a miss, the target takes half as much damage only.</p><p>Hit or miss, select up to two additional targets, each of which must be within
      10 feet of at least one other target. Each target makes a Dexterity saving throw. On a failed save, the target takes 2d6 Lightning damage and can’t take Reactions until the start of its next turn.
      On a successful save, the target takes half as much damage only.</p><p><strong>Using a Higher-Level Spell Slot.</strong> The damage for both effects of the spell increases by 1d6 for each spell slot
      level above 3.</p>
