_id: I55GXJPjj1aqzIIs
name: Elemental Wrath
type: spell
img: icons/magic/lightning/bolt-strike-blue.webp
system:
  description:
    value: <p>You conjure elemental fury into a 20-foot-radius Sphere, centered on a point within range. The Sphere is Difficult Terrain. When you cast the spell, choose one of the damage types below. Any
      creature that starts its turn in the Sphere or enters the Sphere for the first time during a turn must succeed on a Dexterity saving throw or take 2d8 damage of that type and be subject to the associated
      effect. On a successful save, the target takes half as much damage only. <strong>Acid.</strong> The target takes an extra 2d8 Acid damage and its Speed is halved until the start of its next turn.
      <strong>Cold.</strong> The target takes an extra 1d8 Cold damage and has Disadvantage on D20 Tests until the start of its next turn. <strong>Fire.</strong> The target starts burning. It takes 1d10
      Fire damage from burning in this way. <strong>Lightning.</strong> The target has the Incapacitated condition until the start of its next turn. <strong>Thunder.</strong> The target takes an extra 1d8
      Thunder damage and has the Prone condition.</p>
