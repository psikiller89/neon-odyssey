_id: KVHYJOUvSxmrSkYd
name: Somber Trance
type: spell
img: modules/neon-odyssey/icons/neon/s-skull-lime.webp
system:
  description:
    value: <p>You touch a willing creature, and it lapses into a trance-like state deep enough to seem like death. All forms of outward inspection, including spells, indicate that the target is dead. The
      target has the Blinded and Incapacitated conditions, Resistance to all damage except Psychic damage, Immunity to Poison damage and the Poisoned condition, and its Speed is 0.</p><p>The target remains
      conscious during the spell’s duration, and it can choose to end the spell’s duration at any time. If the spell lasts for its full duration, the target can choose to receive the benefit of a Short
      Rest and remove one Exhaustion level when the spell ends.</p>
