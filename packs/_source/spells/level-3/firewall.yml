name: Firewall
type: spell
img: modules/neon-odyssey/icons/neon/s-fire-flame-curved-red.webp
system:
  description:
    value: '<p>$15,000+, which the spell consumes) You touch a point and deploy a security field. The area can have a radius up to 20 feet, and the spell fails if the radius includes an area already under
      the effect of <em>Firewall</em>. The affected area has the following effects.</p><p><strong>Access Control.</strong> Choose one creature type. Creatures of the chosen type can’t willingly enter the
      area, and any creature that is possessed by or that has the Charmed or Poisoned condition from such creature isn’t possessed, Charmed, or Poisoned by them while in the area.</p><p><strong>Extra Effect.</strong>
      You bind an extra effect to the area from the list below: <strong>Adaptive Encryption. </strong>Creatures of the chosen type have Disadvantage on ability checks using Intelligence, Wisdom, or Charisma
      while in the area or against targets in the area. <strong>Antivirus.</strong> Creatures of the chosen type can’t gain the Poisoned condition while in the area. <strong>Device Lockout.</strong> Power
      Cells and powered devices carried or used by creatures of the chosen type don’t function. <strong>Port Closure.</strong> Creatures of any types you choose can’t enter or exit the area using teleportation
      or interplanar travel. <strong>Resistance.</strong> Creatures of the chosen type have Resistance to one of the following damage types: Fire, Lightning, Poison, Psychic. <strong>Signal Jammer.</strong>
      Nonmagical sensors and communication devices don’t function within, or into the area. <strong>System Hardening. </strong>The DC of any Intelligence (Computers) check made in the area or against a
      computer system in the area can’t be lower than your spell save DC.</p>'
