name: Somber Extraction
type: spell
img: modules/neon-odyssey/icons/neon/s-skull-lime.webp
system:
  description:
    value: <p>This spell steals a fragment of life force from its target’s soul. A creature you can see within range makes a Wisdom saving throw. On a failure, the target takes 4d8 Necrotic damage. On a
      success, it takes half as much damage. You gain a number of Temporary Hit Points equal to the Necrotic damage dealt. While you have Temporary Hit Points from this spell, you have Advantage on saving
      throws.</p><p><strong>Using a Higher-Level Spell Slot.</strong> The damage increases by 1d8 for each spell slot level above 3.</p>
