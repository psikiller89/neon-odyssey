name: Summon Discordant
type: spell
img: modules/neon-odyssey/icons/neon/s-ghost-teal.webp
system:
  description:
    value: '<p>You call forth a discordant fiendish spirit from Cacophony. It manifests in an unoccupied space that you can see within range and uses the <strong>Discordant Spirit</strong> stat block. When
      you cast the spell, choose the creature’s tone: Entropy, Instinct, Progress, or Thrill. The spirit resembles a Fiend of the chosen tone, which determines certain details of its stat block. The creature
      disappears when it drops to 0 Hit Points or when the spell ends.</p><p>The creature is an ally to you and your allies. In combat, the creature shares your Initiative count, but it takes its turn immediately
      after yours. It obeys your verbal commands (no action required by you). If you don’t issue any, it takes the Dodge action and uses its movement to avoid danger.</p><p><strong>Using a Higher-Level
      Spell Slot.</strong> Use the spell slot’s level for the spell’s level in the stat block.</p><ul><li><p><strong>Traits Actions Bonus Actions</strong></p></li><li><p><strong>Traits Actions</strong></p></li></ul>'
