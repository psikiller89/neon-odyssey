name: Chem Synthesis
type: spell
img: modules/neon-odyssey/icons/neon/s-wand-magic-sparkles-yellow.webp
system:
  description:
    value: <p>You create reagents in a chemical flask that you touch, which roil and smoke impressively. The liquid in the flask duplicates the properties of a Common or Uncommon potion of your choice (such
      as a <em>Healing Stim</em>*), which you can decant into appropriate containers as a Bonus Action. You can decant a number of these potions equal to your spellcasting ability modifier (minimum of 1).
      When the last of these potions is decanted, the spell ends.</p><p>Alternately, when you haven’t decanted any potions yet, you can create a beaker of potent acid. If hurled at a target as an action,
      each creature within 10 feet of the target must make a Dexterity saving throw, taking, 11d6 Acid damage on a failed save, or half as much damage on a successful one.</p><p>Potions decanted from the
      flask that aren’t consumed disappear when you cast this spell again.</p>
