name: Psychic Sunder
type: spell
img: modules/neon-odyssey/icons/neon/s-brain-pink.webp
system:
  description:
    value: <p>You tear at the mental defenses of a creature you can see within range. The target makes an Intelligence saving throw. On a failed save, it takes 5d8 Psychic damage and gains Vulnerability
      to Psychic damage for the spell’s duration. On a successful save, the target takes half damage only. At the end of each of its turns, the target repeats the save, ending the spell on itself on a success.</p><p><strong>Using
      a Higher-Level Spell Slot.</strong> The damage increases by 1d8 for each spell slot level above 5.</p>
