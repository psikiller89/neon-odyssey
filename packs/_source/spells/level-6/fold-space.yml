name: Fold Space
type: spell
img: icons/magic/symbols/runes-star-pentagon-blue.webp
system:
  description:
    value: <p>You fold space, connecting two points via portals. Choose two Large, unoccupied spaces, one you can see within range and other one within 10 feet of you. You can target a space you can see
      through a camera, picture, or magical scrying, that is immediately above a surface or liquid that can support creatures. A circular portal opens in each of those spaces and remains for the duration.
      The portals are vertical, twodimensional glowing rings filled with distortion or static that blocks sight. They hover in the space.</p><p>A portal is open on only one side (you choose which). Anything
      entering the open side of a portal exits from the open side of the other portal as if the two were adjacent to each other. As a Bonus Action, you can change the facing of the open sides.</p><p><strong>Using
      a Higher-Level Spell Slot.</strong> If you use a level 7 spell slot, its range increases to 500 miles. If you use a level 8 spell slot, the range includes anywhere on the planet. If you use a level
      9 spell slot, the size of the portal becomes Huge, and the range becomes anywhere on the plane of existence.</p>
