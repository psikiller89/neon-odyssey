name: Tech Overload
type: spell
img: icons/magic/lightning/bolt-strike-blue.webp
system:
  description:
    value: <p>You target one Power Cell you can see within range. If the Power Cell isn’t being worn or carried, it explodes. Each creature in 10-foot-radius Sphere centered on the Power Cell must make
      a Dexterity saving throw, taking 4d6 Fire damage and 4d6 Lightning damage on a failed save and half as much damage on a successful one.</p><p>If the Power Cell is being worn or carried, the creature
      must succeed on a Wisdom saving throw, or the Power Cell explodes as above.</p><p><strong>Using a Higher-Level Spell Slot.</strong> You can target an additional Power Cell for every two spell slot
      levels above 4.</p>
