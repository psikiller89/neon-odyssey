_id: 0v2e6WBYr6qvJdsA
name: Limning Starlight
type: spell
img: modules/neon-odyssey/icons/neon/s-sun-yellow.webp
system:
  description:
    value: <p>Your skin reflects the constellations above, even if they aren’t visible. Until the spell ends, you have Resistance to Radiant damage, you have Advantage on saving throws against Radiant damage
      or the Blinded condition, and your melee attacks deal an extra 2d6 Radiant damage.</p><p>Immediately after you take damage from a creature you can see within 60 feet of you, you can take a Reaction
      to force the creature to make a Constitution saving throw. If the damage dealt was Radiant, the creature has Disadvantage on the save. On a failed save, the creature has the Blinded condition until
      the end of your next turn.</p><p>You can’t lose Concentration on this spell from taking Radiant damage.</p>
