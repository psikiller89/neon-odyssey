name: Remote Tether
type: spell
img: modules/neon-odyssey/icons/neon/s-wand-magic-sparkles-yellow.webp
system:
  description:
    value: <p>You create a grasping tether anchored to a surface in an unoccupied space that you can see within range. The tether lasts for the duration.</p><p>When you cast this spell and as a Bonus Action
      on your later turns, you can target a willing creature within 30 feet of the tether’s anchor point and pull it up to 30 feet towards the point. If the creature is unwilling, make a melee spell attack
      against it. On a hit, the target takes 5d8 Bludgeoning damage, is pulled up to 30 feet towards the anchor point and becomes tethered. The anchor point can tether only one creature at a time, and you
      can cause the anchor point to release a tethered creature (no action required).</p><p>While tethered, the target’s Speed is halved, and it can’t willingly move to a space more than 30 feet from the
      anchor point. A creature can take an action to make a Strength (Athletics) check or Dexterity (Acrobatics) check (DC equal to your spell save DC) to free itself or another tethered creature within
      5 feet, breaking the tether connection on a success.</p><p><strong>Using a Higher-Level Spell Slot.</strong> You can create one additional tether for each spell slot level above 4. You can only direct
      one tether at a time.</p>
