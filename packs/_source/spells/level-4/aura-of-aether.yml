name: Aura of Aether
type: spell
img: icons/magic/defensive/shield-barrier-glowing-blue.webp
system:
  description:
    value: <p>An aura radiates from you in a 30-foot Emanation for the duration. While in the aura, you and your allies have Resistance to Poison damage and Advantage on saving throws against the Blinded,
      Charmed, Deafened, Frightened, Paralyzed, Petrified, Poisoned, or Stunned conditions.</p><p>If a creature within the aura forces a creature affected by the aura to make a saving throw against any
      of the above conditions, you can take a Reaction to end the spell early. If you do, the triggering creature must make a Strength saving throw. On a failure, it takes 5d10 Radiant damage and is pushed
      straight away from you to the nearest space outside the Emanation. On a success, it takes half as much damage only.</p>
