_id: fm6GlTfNGM1hsXDY
name: Vortex
type: spell
img: modules/neon-odyssey/icons/neon/s-explosion-red.webp
system:
  description:
    value: <p>You create a point of dark energy within range that generates a gravity vortex in a 30-foot Emanation originating from the point. The vortex is Difficult Terrain. A creature within the Emanation
      when it appears, or whenever a creature enters the Emanation for the first time during a turn or starts its turn there must make a Strength saving throw, taking 1d8 Force damage and is pulled up to
      20 feet closer to the center point on a failure, or takes half as much damage only on a success. When the spell ends, the vortex violently collapses. Each creature in the Emanation takes 4d8 Force
      damage, and if it’s Huge or smaller it has the Prone condition.</p><p><strong>Using a Higher-Level Spell Slot.</strong> The initial damage increases by 1d8 for each spell slot level above 4.</p>
