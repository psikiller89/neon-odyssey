name: Summon Primordial
type: spell
img: icons/magic/symbols/runes-star-pentagon-blue.webp
system:
  description:
    value: '<p>You call forth a primordial spirit. It manifests in an unoccupied space that you can see within range and uses the <strong>Primordial Spirit</strong> stat block. When you cast the spell,
      choose</p><ul><li><p><strong>Traits Actions</strong></p></li><li><p><strong>Actions</strong> a calamity: Blizzard, Earthquake, Tempest, or Volcano. The creature resembles the calamity compressed into
      bipedal form, which determines certain details in its stat block. The creature disappears when it drops to 0 Hit Points or when the spell ends.</p></li></ul><p>The creature is an ally to you and your
      allies. In combat, the creature shares your Initiative count, but it takes its turn immediately after yours. It obeys your verbal commands (no action required by you). If you don’t issue any, it takes
      the Dodge action and uses its movement to avoid danger.</p><p><strong>Using a Higher-Level Spell Slot.</strong> Use the spell slot’s level for the spell’s level in the stat block.</p>'
