system:
  description:
    value: <p>Gravity churns around a creature or an object that isn’t being worn or carried (or a 10-foot Cube portion of a larger object) within range, compressing it from multiple angles. The target
      makes a Constitution saving throw. On a failed save the target takes 5d10 Force damage and has the Restrained condition until the start of your next turn. On a successful save the target takes half
      as much damage only.</p><p>Objects take double damage automatically.</p>
