name: Shrapnel Burst
type: spell
img: icons/magic/symbols/runes-star-pentagon-blue.webp
system:
  description:
    value: <p>As you hit the target, an electric shock bursts out of your Ranged weapon or ammunition. The target of the attack and each creature within 5 feet of it make a Dexterity saving throw. On a
      failed save a target takes 2d4 Piercing damage, and if it moves from its space before the start of your next turn, it takes an extra 2d4 Piercing damage. On a successful save it takes half as much
      damage only.</p><p><strong>Using a Higher-Level Spell Slot.</strong> The initial and extra damage each increase by 2d4 for each spell slot level above 1.</p>
