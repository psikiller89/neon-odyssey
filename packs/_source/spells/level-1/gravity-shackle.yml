name: Gravity Shackle
type: spell
img: modules/neon-odyssey/icons/neon/s-meteor-orange.webp
system:
  description:
    value: <p>You bind a creature you can see within range in crushing bands of gravity. The target makes a Strength saving throw. On a failed save, the target takes 1d10 Force damage, and its speed is
      halved for the duration. On a successful save, the target takes half damage only, and the spell ends.</p><p>For the duration, the target makes a Strength saving throw at the end of each of its turns.
      On a failed save, it takes the Force damage again. On a successful save, the spell ends.</p><p><strong>Using a Higher-Level Spell Slot.</strong> The damage increases by 1d10 for each spell slot level
      above 1.</p>
