_id: rGmh4Rex63ayPexq
name: Memory Leak
type: spell
img: icons/magic/control/hypnosis-mesmerism-swirl.webp
system:
  description:
    value: <p>Junk information clouds the mind of a creature you can see within range. The target makes a Wisdom saving throw. On a failed save, it suffers a memory leak for the duration.</p><p>While suffering
      from a memory leak, the target can take one Action, one Bonus Action, one Reaction, or Move on a turn without taking damage. For each subsequent option used on that turn, the target takes 1d6 Psychic
      damage.</p><p>At the end of each of its turns, the target repeats the save, ending the spell on itself on a success.</p><p><strong>Using a Higher-Level Spell Slot.</strong> The damage increases by
      1d6 for each spell slot level above 1.</p>
