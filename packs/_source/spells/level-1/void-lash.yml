system:
  description:
    value: <p>Channeling the Abyssal Void, tentacles of flowing darkness lash out from you. Each creature in a 15-foot Cube originating from you makes a Strength saving throw. On a failed save, a target
      takes 3d4 Psychic damage and can’t take Reactions until the start of its next turn. On a successful save, a target takes half as much damage only.</p><p><strong>Using a Higher-Level Spell Slot.</strong>
      The damage increases by 1d4 for each spell slot level above 1.</p>
