name: Cage Match
type: spell
img: modules/neon-odyssey/icons/neon/s-wand-magic-sparkles-yellow.webp
system:
  description:
    value: <p>You create an ephemeral fighting cage that only constrains you and one other creature. One creature you can see within range makes a Wisdom saving throw. On a failed save, the target has Disadvantage
      on attack rolls against creatures other than you. If it attempts to move to a space more than 30 feet away from</p><ul><li><p><strong>Traits Actions Reactions</strong> you, it takes 4d10 Force damage
      that ignores Resistance, its Speed is 0 until the start of its next turn, and the spell ends. The cage doesn’t affect any other creature.</p></li></ul><p>The spell also ends if you make an attack
      roll against a creature other than the target, if you cast a spell on an enemy other than the target, if an ally of yours damages the target, or if you end your turn more than 30 feet away from the
      target.</p>
