name: Digitize Knowledge
type: spell
img: icons/magic/control/hypnosis-mesmerism-swirl.webp
system:
  description:
    value: <p>Choose one skill in which you have proficiency. You create a Data Chip in your hand containing a copy of your knowledge in that skill. A creature with an Intelligence score of 4 or higher
      that is holding the chip can take the Utilize action to absorb the skill knowledge, granting them proficiency in the skill for the duration. The storage device vanishes after being used or when you
      cast the spell again, whichever occurs first. <strong>Using a Higher-Level Spell Slot.</strong> The spell’s duration increases with a spell slot of level 2 (1 hour), 3-4 (8 hours), or 5+ (24 hours).</p>
