name: Withering Lightning
type: spell
img: modules/neon-odyssey/icons/neon/s-bolt-lightning-cyan.webp
system:
  description:
    value: <p>You unleash a torrent of lightning at a creature within range, which flows continuously from you to the target. The target’s Speed is halved, and it makes a Dexterity saving throw. On a failed
      save, the target takes 2d6 Lightning or Necrotic damage (your choice).</p><p>On each of your subsequent turns, you can take a Bonus Action to deal 1d6 damage of the chosen type to the target automatically,
      even if the target succeeded on the saving throw.</p><p>The spell ends if the target is ever outside the spell’s range or if it has Total Cover from you.</p><p><strong>Using a Higher-Level Spell Slot.</strong>
      The initial damage increases by 2d6 for each spell slot level above 1.</p>
