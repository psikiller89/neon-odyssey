name: Construct Companion
type: spell
img: modules/neon-odyssey/icons/neon/s-wand-magic-sparkles-yellow.webp
system:
  description:
    value: <p>You create a special Construct in an unoccupied space within range. This creature uses the <strong>Construct Companion</strong> stat block. If you already have a companion from this spell,
      the companion is replaced by the new one. You determine the companion’s appearance, such as a hovering drone, a miniature android, or a wheeled or tracked task bot.</p><p><strong>Combat.</strong>
      The companion is an ally to you and your allies. In combat, it shares your Initiative count, but takes its turn immediately after yours. It obeys your commands (no action required by you). If you
      don’t issue any, it takes the Dodge action and uses its movement to avoid danger.</p><p><strong>Using a Higher-Level Spell Slot.</strong> Use the spell slot’s level for the spell’s level in the stat
      block.</p><ul><li><p><strong>Traits Actions Reactions</strong></p></li></ul>
