name: Shield of Stars
type: spell
img: modules/neon-odyssey/icons/neon/s-shield-halved-cyan.webp
system:
  description:
    value: <p>You summon 2 starry motes that swirl around you for the duration. You gain a +1 bonus to your AC for each mote that is currently active.</p><p>When a creature within 5 feet of you hits you
      with an attack roll, you can take a Reaction to cause a mote to vanish in a burst of light, dealing 2d4 Radiant damage to the attacker. The spell ends early when all of the motes have disappeared.</p><p><strong>Using
      a Higher-Level Spell Slot.</strong> You can create one additional mote for every two spell slot levels above 2.</p>
