_id: voIIMmKb7SvS9rvP
name: Malignant Spray
type: spell
img: icons/magic/lightning/bolt-strike-blue.webp
system:
  description:
    value: '<p>When you cast the spell, choose the spell’s tone: Entropy, Instinct, Progress, or Thrill. You release a corruptive spray from your hand. Each creature in a 30-foot Cone makes a Dexterity
      saving throw. On a failed save, a target takes 2d8 Acid (Instinct), Cold (Entropy), Lightning (Progress), or Psychic (Thrill) damage plus one of the effects below determined by the spell’s tone. On
      a successful save, the target takes half as much damage and no other effect. <strong> Entropy.</strong> The target can’t regain Hit Points until the start of your next turn. <strong>Instinct.</strong>
      The target has the Frightened condition until the start of your next turn. <strong>Progress.</strong> The target’s Speed is reduced to 0 until the start of your next turn. <strong>Thrill.</strong>
      The target has Disadvantage on its next attack roll before the start of your next turn.</p><p><strong>Using a Higher-Level Spell Slot.</strong> The damage increases by 1d8 for each spell slot level
      above 2.</p>'
