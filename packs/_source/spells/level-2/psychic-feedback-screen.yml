system:
  description:
    value: <p>An aura radiates from you in a 15-foot Emanation for the duration, affecting you and your allies. When a creature causes one of the following effects it takes 3d8 Psychic damage:</p><ul><li><p>Deals
      Psychic damage to an affected creature</p></li><li><p>Reads an affected creature’s mind</p></li><li><p>Gives an affected creature the Charmed or Frightened condition</p></li></ul><p><strong>Using
      a Higher-Level Spell Slot.</strong> The radius of the Emanation increases by 10 feet for each spell slot level above 2.</p>
