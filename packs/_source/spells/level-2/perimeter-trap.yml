_id: MLrc30Q0naJ38qbZ
name: Perimeter Trap
type: spell
img: icons/magic/perception/eye-ringed-glow-angry-small-teal.webp
system:
  description:
    value: <p>You create a Tiny object that attaches to a surface that you touch and can’t be moved thereafter. When a creature enters a space within 30 feet of the object for the first time on a turn or
      ends its turn there, it rolls a Dexterity saving throw. On a failed save, it takes 2d6 Radiant damage and can’t benefit from the Invisible condition until the end of its next turn. On a successful
      save, the creature takes half as much damage only. The spell ends after the spell deals damage four times.</p><p>When you cast this spell, you can designate any creatures you choose, and the spell
      ignores them.</p><p><strong>Using a Higher-Level Spell Slot. </strong>The number of times this spell can deal damage increases by two for each spell slot level above 2.</p>
