_id: GEiLy0Fx6IWqJrLZ
name: Minion Binding
type: spell
img: icons/magic/control/hypnosis-mesmerism-swirl.webp
system:
  description:
    value: '<p>One creature that you can see within range must succeed on a Wisdom saving throw or have the Charmed condition for the duration.</p><p>Shadow obscures the Charmed target’s features. Immediately,
      and at the start of each of your turns for the duration, the target takes its Reaction to do one of the following (your choice each time): Move up to half its Speed toward a creature you mentally
      choose (it won’t knowingly move into a space directly harmful to it, such as off a cliff or into fire), or make one melee attack against a creature you mentally choose. The target repeats the save
      at the end of each of its turns, ending the spell on itself on a success.</p><p>On your later turns, you must take a Magic action to maintain control of the target, or the spell ends.</p>'
