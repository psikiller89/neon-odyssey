name: Harmonic Bond
type: spell
img: icons/magic/defensive/shield-barrier-glowing-blue.webp
system:
  description:
    value: <p>You touch another creature that is willing, creating a harmonic connection between you and the target. When the target is hit by an attack roll while within 60 feet of you, you can take a
      Reaction to end this spell. If you do, the target takes half damage from the attack, you teleport to an unoccupied space within 10 feet of the target, and you can make a melee attack against the attacker
      if it is within reach.</p><p>The spell ends early if you cast this spell again.</p>
