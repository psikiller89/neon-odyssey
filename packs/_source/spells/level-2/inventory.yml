name: Inventory
type: spell
img: modules/neon-odyssey/icons/neon/s-wand-magic-sparkles-yellow.webp
system:
  description:
    value: <p>You open a digital interface that only you can see, showing a personal inventory of items stored in an extradimensional space. For the duration of the spell, you can store and retrieve objects
      from this extradimensional space with a Bonus Action. When you retrieve an item, it appears in your hand or the closest unoccupied space to you.</p><p>The extra dimensional space can hold up to 10
      items whose total weight does not exceed 500 pounds, or a total volume of 64 cubic feet. The inventory is persistent between castings of this spell. If you die, the inventory collapses and any stored
      items appear in the closest unoccupied spaces to you.</p>
