name: Meta Vitality
type: spell
img: icons/magic/defensive/shield-barrier-glowing-blue.webp
system:
  description:
    value: '<p>You draw on your inner well of power to purge your body of detrimental effects. You can expend and roll up to two of your Hit Point Dice, and regain a number of Hit Points equal to the roll’s
      total plus your spellcasting ability modifier. For each die you expend, instead of regaining Hit Points, you can end one condition on yourself: Blinded, Deafened, or Poisoned.</p><p><strong>Using
      a Higher-Level Spell Slot.</strong> The number of Hit Point Dice you can expend increases by one for each spell slot level above 2. If you cast this spell using a slot of level 5+, you can add these
      options to the list of effects you can end: Charmed, Petrified, 1 Exhaustion level, one curse, any reduction to one of your Ability scores, or any reduction to your Hit Point maximum.</p>'
