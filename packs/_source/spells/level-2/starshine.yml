_id: rFOqMpX3JRXjiGhd
name: Starshine
type: spell
img: icons/magic/symbols/runes-star-pentagon-blue.webp
system:
  description:
    value: <p>You are wreathed in the glittering light of the stars for the duration, emitting Bright Light in a 10-foot radius and Dim Light for an additional 10 feet.</p><p>Until the spell ends, a creature
      that enters the area for the first time on its turn or starts its turn there must make a Charisma saving throw. On a failed save, the creature takes 2d6 Radiant damage and is limned in sparkling light
      until the start of its next turn. An affected creature sheds Dim Light in a 10-foot radius and can’t benefit from the Invisible condition.</p><p><strong>Using a Higher-Level Spell Slot.</strong> The
      damage increases by 1d6 for each spell slot level above 2.</p>
