name: Power Sag
type: spell
img: modules/neon-odyssey/icons/neon/s-explosion-red.webp
system:
  description:
    value: <p>For the duration, energy in powered devices or systems bleeds away in a 20-foot-radius Sphere centered on a point you can see within range. Any creature or object entirely inside the Sphere
      has Resistance to Lightning damage, and any creature in the Sphere when it appears, or that starts its turn there, must succeed on a Wisdom saving throw or Power Cells and powered devices on the creature’s
      person don’t function until the start of the creature’s next turn. Magic items that don’t rely on power are unaffected.</p><p>Powered objects and systems—or components of larger systems—that aren’t
      being worn or carried and are entirely inside the Sphere don’t function.</p>
