_id: pMUW91MVaFti0hpy
name: Relentless Ride
type: spell
img: modules/neon-odyssey/icons/neon/s-wand-magic-sparkles-yellow.webp
system:
  description:
    value: <p>You summon a cosmic ride that appears in an unoccupied space you can see within range. It takes the form of a <strong>Cruising Bike</strong>* or a <strong>Racing Bike</strong>* (choose when
      you cast the spell). If you already have a ride from this spell, it is replaced by the new one.</p><p><strong>Combat.</strong> The ride functions as a normal vehicle, but only you and creatures you
      choose can operate it. While you have the Incapacitated condition, if the ride is within 5 feet of you attack rolls that hit you hit the ride instead, and during your turn the ride moves to get as
      close to you as it can.</p><p><strong>Disappearance.</strong> The ride disappears if it drops to 0 Hit Points or if you die. When it disappears, it leaves behind anything it was carrying. If you cast
      this spell again, you decide whether you summon the ride that disappeared or a different one.</p><p><strong>Using a Higher-Level Spell Slot.</strong> The ride gains 10 Hit Points for each spell slot
      level above 2. With a level 4+ spell slot, the ride gains a Fly Speed equal to its Speed.</p>
