_id: jmoK10tOb35X80uj
name: Gene Splicing
type: spell
img: modules/neon-odyssey/icons/neon/s-dna-lime.webp
system:
  description:
    value: <p>You cause a physical adaptation in your body, gaining traits of alien creatures. Choose one of the following options. The chosen option lasts for the duration, unless you take a Magic action
      to choose a new option to replace it. When the new option takes effect, you take 1d10 Necrotic damage from the transformative strain.</p><p><strong>Amphibious.</strong> You grow gills or gas exchange
      membranes on your skin, and webs between your digits. You can breathe water, and you have a Swim Speed equal to your Speed.</p><p><strong>Cosmetic Replication.</strong> You change your appearance,
      including your height, weight, facial features, voice, hair length, skin and hair color, and other distinguishing features. You can take on the appearance of a different species, though your game
      statistics don’t change. You can’t change your size, and your body must keep the same arrangement of limbs. If you take the Magic action to change your chosen option, you can change your appearance
      without taking Necrotic damage.</p><p><strong>Natural Weapons.</strong> You grow claws, a fanged snout or insectile mandibles, blunt horns, or some other natural weapon. You can use these weapons
      to make Unarmed Strikes. The GM decides if the strike can use the Grapple option. On a hit, the strike deals damage equal to 1d6 plus your Strength modifier of a type appropriate to the weapon’s form
      (Bludgeoning, Piercing, or Slashing) instead of the normal damage of an Unarmed Strike. You can use your spellcasting ability modifier for the attack and damage rolls instead of Strength.</p><p><strong>Traversal
      Adaptation.</strong> You grow broad scooping paws or fine gripping cilia on your hands. You gain a Burrow Speed equal to half your Speed, or a Climb Speed equal to your Speed.</p><p><strong>Using
      a Higher-Level Spell Slot.</strong> The duration increases to 8 hours with a level 3+ spell slot.</p>
