name: Psychic Link
type: spell
img: modules/neon-odyssey/icons/neon/s-brain-pink.webp
system:
  description:
    value: <p>You establish a psychic connection between yourself and a willing creature with which you are familiar. The creature can be anywhere on the same plane of existence as you. The spell ends if
      you or the target are no longer on the same plane.</p><p>Until the spell ends, you and the target can instantly share words, images, sounds, and other sensory messages with each other through the
      connection, and the target recognizes you as the creature it is communicating with. The spell enables a creature to understand the meaning of your words and any sensory messages you send to it.</p><p>During
      the spell’s duration, you can cast a spell as if you were in the target’s space, after which this spell ends immediately.</p>
