name: Psychic Storm
type: spell
img: modules/neon-odyssey/icons/neon/s-bolt-lightning-cyan.webp
system:
  description:
    value: <p>A whirling cloud of luminous psychic energy rips out from a point within range. Each creature in a 20-foot-radius Sphere centered on that point makes an Intelligence saving throw, taking 8d6
      Psychic damage on a failed save, or half as much damage on a successful one.</p><p>On a failed save, a target’s mind is shredded for 1 minute. During that time, it has Disadvantage on attack rolls
      and ability checks, and if it is Concentrating, at the start of each of its turns it must make a Constitution saving throw or lose Concentration. At the end of each of its turns it repeats the Intelligence
      save, ending the effect on itself on a success.</p>
