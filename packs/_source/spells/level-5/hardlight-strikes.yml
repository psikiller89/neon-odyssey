system:
  description:
    value: <p>Chose up to five creatures you can see within range. A holographic copy of yourself appears within 5 feet of each of them, attacks, then vanishes. Make a melee spell attack against each target.
      On a hit, a target takes 5d12 Radiant damage.</p><p>You then teleport to an unoccupied space you can see within 5 feet of one of the targets. That target has Disadvantage on attack rolls until the
      start of your next turn.</p>
