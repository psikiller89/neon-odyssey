_id: aJcryXgw7oZKrRia
name: Spacetime Anchor
type: spell
img: modules/neon-odyssey/icons/neon/s-hourglass-half-yellow.webp
system:
  description:
    value: <p>One Large or smaller object that you touch can’t be altered in form or position for the duration of the spell, supporting up to 16,000 pounds of weight, even if it defies gravity. If the target
      object is in another creature’s possession, the creature can make an Intelligence saving throw. On a success, the spell has no effect.</p><p>If the target object can’t be released without moving the
      object, such as an article of clothing it wears, a creature wearing it has the Restrained condition for the spell’s duration, but as the clothing or armor also can’t be pierced by any force, the target’s
      AC increases by 5 while Restrained in this way. Smaller objects, such as a glove or bracelet, only reduce the target’s Speed to 0.</p><p><strong>Using a Higher-Level Spell Slot.</strong> Your Concentration
      can last longer with a spell slot of up to level 6 (up to 10 minutes), 7 (up to 1 hour), or 8+ (up to 8 hours).</p>
