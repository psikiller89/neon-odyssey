name: Rebirth
type: spell
img: icons/magic/death/skull-horned-goat-pentagram-red.webp
system:
  description:
    value: <p>You touch a dead creature that is a playable species, or a piece of one. The spell fails if cast on the corpse of a cygnian, dathu, motlien, terminox, or varg. If the creature has been dead
      for no longer than 10 days, the spell forms a new body for it and calls the soul to enter that body. Roll 1d100 and consult the table below to determine the body’s species, or the GM chooses another
      playable species. Aetheron Oculok* Amanite Oozoid Anitron Pakku* Benthos* Poggle* Bitling* Raizo Clawderan Rangor Flambego* Saurian Glowblin Skettik* Gorgonite Solari Greeble* Stardust Human Isotron*
      Tekal Jenovan* Volcar* Jozza Yaungu Laika Yoggoth* Marsoom* Zamani Murexian Zephursa* Navili* Zeticulan* Nematoan Zorbrak Nilari The reborn creature makes any choices that a species’ description offers,
      and the creature recalls its former life. It retains the capabilities it had in its original form, except it loses the traits of its previous species and gains the traits of its new one.</p>
