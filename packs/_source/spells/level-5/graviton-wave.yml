name: Graviton Wave
type: spell
img: modules/neon-odyssey/icons/neon/s-water-blue.webp
system:
  description:
    value: <p>You create a powerful gravity wave in a 60-foot Cone. Each creature in that area makes a Constitution saving throw. On a failed save, a target takes 10d6 Force damage and is pushed or pulled
      20 feet toward or away from you (your choice). On a successful save, the target takes half damage only and the spell ends on it. For 1 minute, at the start of a target’s turn it must repeat the saving
      throw. On a failure, it is pushed 10 feet toward or away from you, as you initially selected. On a success, the spell ends on that target.</p><p><strong>Using a Higher-Level Spell Slot.</strong> The
      damage increases by 1d6 for each spell slot level above 5.</p>
