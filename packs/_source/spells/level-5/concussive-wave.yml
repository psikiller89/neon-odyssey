name: Concussive Wave
type: spell
img: icons/magic/lightning/bolt-strike-blue.webp
system:
  description:
    value: <p>You emit a burst of bright and loud energy in a 30-foot Emanation. Each creature you choose in the Emanation makes a Constitution saving throw. On a failed save, a target takes 2d6 Thunder
      damage and 3d6 Radiant or Lightning damage (your choice) and has the Stunned condition. A target can choose not to be Stunned, in which case it takes an extra 21 Thunder damage that bypasses Resistance
      or Immunity. On a successful save, a target takes half as much damage only.</p>
