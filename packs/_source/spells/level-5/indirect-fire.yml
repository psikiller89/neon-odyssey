system:
  description:
    value: <p>A red targeting circle briefly appears on the ground beneath a point you choose within range. A cascade of digitized arrows, bullets, or artillery shells rains down, then disappears. Each
      creature in a 40-foot-radius, 40-foot-high Cylinder centered on that point makes a Dexterity saving throw. On a failed save, a target takes 10d6 Force damage and the next attack roll made against
      it before the end of your next turn has Advantage. On a successful save it takes half as much damage only.</p>
