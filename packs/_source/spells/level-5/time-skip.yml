name: Time Skip
type: spell
img: icons/magic/movement/trail-streak-zigzag-yellow.webp
system:
  description:
    value: <p>You create a sharp fold in time and lose yourself within its angles, vanishing from existence. While vanished, you can’t take actions or Reactions, and nothing can target or affect you or
      your equipment. You reappear in an unoccupied space of your choice within 10 feet of the space you last occupied at the start of your next turn.</p><p>The temporal distortion when you return causes
      each creature of your choice that you can see within 20 feet of you when you reappear to have Disadvantage on D20 Tests until the start of your next turn.</p>
