name: Grid Storm
type: spell
img: modules/neon-odyssey/icons/neon/s-bolt-lightning-cyan.webp
system:
  description:
    value: <p>You cause an electrical storm that disrupts access to the Hypergrid in a 20-foot Cube centered on a point you can see within range. While in this area, creatures have the Blinded and Deafened
      conditions and have Disadvantage on Constitution saving throws made to maintain Concentration. Additionally, Power Cells and powered equipment don’t function in this area.</p><p>When the storm appears,
      each creature in it makes a Dexterity saving throw, taking 2d8 Force damage and 2d8 Lightning damage on a failed save or half as much damage on a successful one. A creature also makes this save when
      it enters the spell’s area for the first time on a turn or ends its turn there. A creature makes this save only once per turn.</p><p><strong>Using a Higher-Level Spell Slot.</strong> The Force and
      Lightning damage increase by 1d8 for each spell slot level above 5.</p>
