name: Barbed Lure
type: spell
img: modules/neon-odyssey/icons/neon/s-wand-magic-sparkles-yellow.webp
system:
  description:
    value: <p>You create a cord of energy ending in a barbed hook that shoots toward a creature of your choice in range. Make a melee spell attack against the target. On a hit, the target takes 1d6 Piercing
      damage, and if it is Large or smaller, you can pull it up to 10 feet closer to you. If the target is willing, you hit automatically, and you can choose to deal no damage.</p><p><strong>Cantrip. </strong>The
      damage increases by 1d6 when you reach levels 5 (2d6), 11 (3d6), and 17 (4d6).</p>
