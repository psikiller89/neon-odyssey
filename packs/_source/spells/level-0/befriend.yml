name: Befriend
type: spell
img: modules/neon-odyssey/icons/neon/s-brain-pink.webp
system:
  description:
    value: <p>You create a feeling of trust toward you in one creature you can see within range. The target must succeed on a Wisdom saving throw or you have Advantage on Charisma checks made for the Influence
      action against the target for the duration. The target succeeds automatically if it has Immunity to the Charmed condition, if you’re fighting it, or if you have cast this spell on it within the past
      24 hours.</p>
