name: Telekinetic Combat
type: spell
img: icons/magic/movement/trail-streak-zigzag-yellow.webp
system:
  description:
    value: <p>Reaching out with telekinetic power, you manipulate a weapon that is in range and with which you have proficiency. The spell fails if the weapon is being carried by another creature. For the
      duration, the weapon floats in your space. You can make one attack with the weapon against a creature within range (the weapon darting to the target and back after the attack if necessary). The attack
      uses your spellcasting ability for the attack and damage rolls instead of using Strength or Dexterity.</p><p><strong>Cantrip Upgrade.</strong> The attack deals extra Force damage when you reach levels
      5 (1d6), 11 (2d6), and 17 (3d6).</p>
