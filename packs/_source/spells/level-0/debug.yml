name: Debug
type: spell
img: icons/magic/movement/trail-streak-zigzag-yellow.webp
system:
  description:
    value: <p>You touch a creature or an electronic device and create one of the following effects.</p><p><strong>Diagnostic.</strong> You learn what conditions and other nonmagical harmful effects are
      affecting the creature you are touching.</p><p><strong>Enhance.</strong> You cause the device to magnify and improve the quality of one image or video frame stored on or displayed by a device. Ability
      checks made for the Search or Study actions using the image before the start of your next turn have Advantage.</p><p><strong>Repair Software.</strong> You repair a minor error, corruption, or fault
      in the device’s software, such as a damaged file or broken link. The DC of ability checks to use the device or program is reduced by 1 for 1 minute. You can’t use this effect on the same target again
      until you finish a Long Rest.</p>
