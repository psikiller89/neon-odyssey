name: Kinetic Propulsion
type: spell
img: modules/neon-odyssey/icons/neon/s-meteor-orange.webp
system:
  description:
    value: <p>You lash out with kinetic force at a creature or object within range, using one of the following options.</p><p><strong>Kinetic Lash.</strong> Make a ranged spell attack against the target.
      On a hit, the target takes 1d8 Force damage.</p><p><strong>Propel.</strong> You propel one object within range weighing up to 5 pounds that isn’t being worn or carried, or you throw the object with
      great force. Make a ranged spell attack against a creature or object within 90 feet of the object. On a hit, the target takes 1d10 Bludgeoning, Piercing, or Slashing damage, as appropriate to the
      object thrown. If you’re just throwing the object to move it, you propel it up to 90 feet in a direction of your choice. Fragile objects are destroyed on landing.</p><p><strong>Cantrip Upgrade.</strong>
      The damage increases by 1d8 Force (Kinetic Lash), or 1d10 damage (Propel), when you reach levels 5 (2d8 or 2d10), 11 (3d8 or 3d10), and 17 (4d8 or 4d10).</p>
