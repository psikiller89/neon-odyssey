    alignment: Neutral
    biography:
      value: '<p>CODESHAPERS</p><p>Reality-Bending Datamancers</p><p>Habitat: Planar (Hypergrid), Urban; Treasure: Arcana,</p><p>Individual</p><p>Codeshapers manipulate the Hypergrid to alter reality, casting  powerful
        spells and performing other impressive feats of  technomancy. Many codeshapers are employed by numerous  businesses and corporations of the galaxy, but some turn  to criminal endeavors, using their
        mastery of code for profit  and power.</p><p>CODESHAPER JUNIOR</p><p>CODESHAPER JUNIOR</p><p>Codeshaper juniors are novices who only recently sat  behind their first real computer and began the
        process of  unlocking the complex mysteries of the Hypergrid. They  have learned to execute a handful of basic scripts, but their  enthusiasm makes up for their inexperience. Most juniors  learn
        from more senior codeshapers, starting their career as  unpaid interns.</p><p>CODESHAPER</p><p>CODESHAPER</p><p>Codeshapers are proficient programmers of the Hypergrid,  capable of executing a wider
        variety of reality-bending  functions and an agile approach to code. They manipulate  data that weaves throughout the galaxy to jolt their enemies,  execute powerful scripts, or delete the magic
        of their foes  from existence. They are typically employed by massive  organizations where they work with other codeshapers, or  they live a life of solo freelancing.</p><p>CODESHAPER TECHNOCRAT</p><p>CODESHAPER
        TECHNOCRAT</p><p>Only a rare few programmers ascend in expertise and power  to become codeshaper technocrats. Often driven by unbound  ambition and the desire for immortality, they seek to shape  an
        “unfit” reality to their own will to create a future of their  making. The scripts they have mastered are immensely  potent, allowing them to rewrite the code of a person’s mind,  step through the
        Hypergrid in an instant, or digitally replicate  themselves upon death.</p><p>Codeshaper Junior</p>'
