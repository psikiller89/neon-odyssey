    alignment: Neutral
    biography:
      value: '<p>WEIRD SCIENTISTS</p><p>Inventors of the Impossible</p><p>Habitat: Any; Treasure: Arcana, Implements</p><p>Weird scientists take the rigorous, highly controlled  experiments that a standard
        scientist might conduct and  push them beyond the realm of what most consider proper  or reasonable. They throw caution to the wind and ignore the  laws of physics, hoping to achieve the impossible.
        However,  it is a dangerous line of work, and many of these scientists  suffer explosive ends at the hands of their own experiments  or inventions.</p><p>WEIRD SCIENTIST LABTECH</p><p>WEIRD SCIENTIST
        LABTECH</p><p>Weird scientist labtechs are newcomers to strange research,  often serving as test subjects or experiment fodder  themselves. They typically work under an experienced weird  scientist
        dutifully and loyally, despite the treacherous working  conditions. If threatened, these labtechs have bizarre gadgets  at their disposal, but whether or not they can control the  tools’ effectiveness
        is another question altogether.</p><p>WEIRD SCIENTIST</p><p>WEIRD SCIENTIST</p><p>Weird scientists are masters of the strange and  unconventional in scientific pursuits, having survived  innumerable
        mishaps, explosions, leaks, and other  experimental disasters. No matter how far they rise, they  are never satisfied and are always looking toward the  next discovery or invention of the absurd.
        Their  wide array of gizmos allows them to unleash a  plethora of unpredictable effects.</p><p>Weird Scientist Labtech</p>'
