    alignment: Neutral
    biography:
      value: '<p>PSI MINDS</p><p>Unbound Psionic Savants</p><p>Habitat: Any; Treasure: Arcana</p><p>Psi minds are individuals who have pushed their minds  beyond normal limits, granting them incredible
        psionic  powers. They use their psi to cast spells and warp reality  with a thought alone. Some psi minds use these abilities in  the employ of powerful organizations, while others remain  solitary
        and simply want to understand their gifts.</p><p>PSI MIND KINETICIST</p><p>PSI MIND KINETICIST</p><p>Psi mind kineticists have let go and allowed their psionic  power to be completely unbound. They
        unleash volatile  telekinesis that lashes from their minds with destructive  force that can obliterate anything in their path. These wild psi  minds often wreak havoc wherever they go, whether on
        the  battlefield or the streets of the city they call home.</p><p>PSI MIND TELEPATH</p><p>PSI MIND TELEPATH</p><p>Psi mind telepaths have honed their psi and can wield it with  precision, using
        powerful telepathy to pierce into others’  minds. This psychic infiltration allows them to effortlessly  read or implant thoughts, shred the mind, or even completely  dominate a target until they
        are a mesmerized thrall. Many of  these psi minds end up as masterminds, pulling the strings  of vast networks to advance their mysterious aims.</p><p>Psi Mind Kineticist</p>'
