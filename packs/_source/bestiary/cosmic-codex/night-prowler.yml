      value: '<p>NIGHT PROWLER</p><p>Elusive Shadow Hunter</p><p>Habitat: Forest, Plains; Treasure: None</p><p>Night prowlers are among the most elusive and terrifying  predators. They stalk the night in
        the wilds across the  galaxy. These nocturnal hunters prowl through the shadows  with many-limbed, elongated bodies that grant them the  speed and flexibility to employ hit-and-run tactics until
