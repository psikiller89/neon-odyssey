    alignment: Unaligned
    biography:
      value: '<p>ICE STALKER</p><p>Terror of the Tundra</p><p>Habitat: Arctic; Treasure: None</p><p>The apex predators of frigid climates, ice stalkers claim vast  territories across the galaxy, and the
        tundras, mountains,  and frozen shorelines are their hunting grounds. Perfectly  camouflaged amid snow and ice, they shadow their prey  for days. When they strike, their hooked claws open deep  wounds,
        allowing them to follow the scent of blood when  snowstorms obscure their quarry.</p><p>Traits</p><p>Abduct. The stalker needn’t spend extra movement to  move a creature it is grappling.</p><p>Blood
        Tracker. The stalker has Advantage on Wisdom  checks made to find or track any creature that doesn’t have  all its Hit Points.</p><p>Ice Walk. The stalker can move across and climb icy surfaces  without
        needing to make an ability check, and Difficult Terrain  composed of ice or snow doesn’t cost it extra movement.</p><p>Actions</p><p>Multiattack. The stalker makes one Bite attack and two</p><p>Claw
        attacks.</p><p>Bite. Melee Attack Roll: +9, reach 5 ft. Hit: 17  (2d10 + 6) Piercing damage, and the target has the</p><p>Grappled condition (escape DC 16).</p><p>Claw. Melee Attack Roll: +9, reach
        10 ft. Hit: 13 (2d6 + 6)</p><p>Slashing damage. If the target is a creature and doesn’t  already have a ragged wound, it is subjected to the following  effect. Constitution Saving Throw: DC 17.
        Failure: The target  receives a ragged wound. While wounded, the target loses 7  (2d6) Hit Points at the start of each of its turns. The wound  closes after 1 minute, after the target regains any
        Hit Points,  or after the target or a creature within 5 feet of it takes an  action to stanch the wound, doing so by succeeding on a</p><p>DC 17 Wisdom (Medicine) check.</p><p>Ice Stalker</p>'
