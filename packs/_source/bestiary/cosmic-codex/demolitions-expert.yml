- _id: nBdH9UUUunKIqrzy
  name: Throw Grenade
  type: feat
  img: icons/svg/upgrade.svg
  effects: []
  sort: 0
  system:
    description:
      value: '<p>The expert throws one of the following grenades at a point within 40 feet of itself (pick one or roll 1d4): 1. Photon Grenade. Dexterity Saving Throw: DC 15, each creature in a 10-foot
        Sphere originating from the point. Failure: 22 (5d8) Radiant damage. Success: Half damage. 2. EMP Grenade. Constitution Saving Throw: DC 15, each creature in a 10-foot Sphere originating from the
        point. Failure: 10 (3d6) Lightning damage, and Power Cells or powered devices the target is wearing or carrying don’t function until the end of the expert’s next turn. If the target is a Construct,
        it has the Stunned condition for the duration. Success: Half damage only. 3. Flashbang Grenade. Constitution Saving Throw: DC 15, each creature in a 20-foot Sphere originating from the point. Failure:
        The target has the Blinded condition for 1 minute or until its takes an action to rub its eyes. 4. Thermite Grenade. Dexterity Saving Throw: DC 15, each creature in a 10-foot Sphere originating
        from the point. Failure: 14 (4d6) Fire damage, and the target starts burning, taking 5 (1d10) Fire damage at the start of each of its turns instead of the normal burning damage. Success: Half damage
        only.</p>'
