    biography:
      value: "<p>TIME DOLPHIN</p><p>Playful Swimmers Through the Timestreams</p><p>Habitat: Any; Treasure: None</p><p>Time dolphins resemble aquatic mammals, with long snouts,  fan-like fins, and such apt\
        \ control over their echolocation  that they can peer into the various timestreams that weave  throughout the galaxy and beyond. This grants them  glimpses into the immediate past, present, and\
        \ future at the  same time. \t In a rebuttal to the laws of nature, time dolphins deftly  navigate these streams and manipulate the tether of time to  their immediate surroundings, giving themselves\
        \ and their  allies an advantage over their equally disadvantaged foes. \t These colorful creatures prefer to soar through space but  are comfortable in any environment ranging from sea, to sky,\
        \  to sand. They typically live in large pods and communicate  with musical vocalizations that some say is the Song of</p><p>Time itself.</p><p>Time Dolphin</p>"
