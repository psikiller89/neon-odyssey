- _id: vZOlnoDatSimMdvD
  name: Construct the gridgeist can see within 5 feet
  type: feat
  img: icons/svg/upgrade.svg
  effects: []
  sort: 0
  system:
    description:
      value: '<p>Failure: The target is possessed by the gridgeist; the gridgeist disappears, and the target has the Incapacitated condition and loses control of its body. The gridgeist now controls the
        body, but the target retains awareness. The gridgeist can’t be targeted by any attack, spell, or other effect, except ones that specifically target Undead. The gridgeist’s game statistics are the
        same, except it uses the possessed target’s Speed as well as the target’s Strength, Dexterity, and Constitution modifiers. In addition, the gridgeist can use any of the target’s actions. The possession
        lasts until the Construct drops to 0 Hit</p>'
