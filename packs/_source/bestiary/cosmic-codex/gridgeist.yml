- _id: gWvPoEC5vbF5mHhq
  name: Possess Object
  type: feat
  img: icons/svg/upgrade.svg
  effects: []
  sort: 0
  system:
    description:
      value: <p>The gridgeist possesses one Huge or smaller nonmagical object it can see within 5 feet that isn’t being worn or carried; the gridgeist disappears, and the target effectively becomes the
        gridgeist’s body. While possessing an object, the gridgeist’s game statistics are the same, except it uses the object’s size, its Speed becomes 40 feet, and it has Resistance to all damage types
        except Lightning and Psychic. Any damage or effects dealt to the possessed object affect the gridgeist. The possession lasts until the gridgeist leaves as a Bonus Action, the gridgeist is dealt
        10 or more Lightning damage in a single turn, or the gridgeist dies. When the possession ends, the gridgeist appears in an unoccupied space within 5 feet of the target.</p>
