    alignment: Neutral
    biography:
      value: '<p>BATTLE BOTS</p><p>Mass-Produced Mechanical Infantry</p><p>Habitat: Any; Treasure: None</p><p>Battle bots are robotic soldiers mass-manufactured and sold  to militaries across the galaxy.
        They represent the core of the  war industry that increases in profits every year. They can be  found as support units in grander forces, but some armies  are nearly entirely comprised of battle
        bots.</p><p>BATTLE BOT</p><p>BATTLE BOT</p><p>The baseline model of battle bots are made at low cost and  minimal quality to serve as little more than the battlefield fodder  needed by many galactic
        militaries. They are programmed  to march and do as they’re ordered, typically utilized to hold  formations, lay down synchronized fire, and stand watch without  sleep or pay. These bots can communicate
        with a language  module that outputs a high-pitched mechanical voice.</p><p>BATTLE BOT HEAVY</p><p>BATTLE BOT HEAVY</p><p>Battle bot heavies are built from tougher alloys and enhanced  systems,
        providing an upgraded and pricier option for robotic  infantry. Outfitted with reinforced servos and built-in laser  blasters, heavies are best equipped for taking or defending  critical objectives.
        These bots come with a communication  chip that delivers a deeper and flatter voice that typically  speaks in short, precise sentences.</p><p>Battle Bot</p>'
