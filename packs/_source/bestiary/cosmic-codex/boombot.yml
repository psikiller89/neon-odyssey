      value: '<p>BOOMBOT</p><p>Explosive Robotic Sentry</p><p>Habitat: Urban; Treasure: None</p><p>Boombots are built for location defense, serving as both  security camera and mobile land mine. Appearing
        as spheres  with little feet and large eyes, they rigidly march through  the halls of the bases, headquarters, and lairs they are  programmed to defend, always keeping their sensors alert  for intruders,
