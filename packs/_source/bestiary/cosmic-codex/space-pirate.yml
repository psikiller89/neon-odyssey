    alignment: Neutral
    biography:
      value: '<p>SPACE PIRATES</p><p>Scourges of the Aether Currents</p><p>Habitat: Outer Space; Treasure: Individual</p><p>Space pirates are bloodthirsty cutthroats that terrorize the  aether currents
        and far reaches of space aboard ships built for  raiding and pillaging. They prey on unsuspecting vessels for  their cargo and whatever other valuables can be plundered.</p><p>Some pirates will
        capture their victims for a hefty ransom,  while others leave no survivors to tell the tale.</p><p>SPACE PIRATE</p><p>SPACE PIRATE</p><p>Space pirates make up most of the crew aboard a pirate ship,  serving
        just as much as deckhands as they do as raiders. They  are motivated by greed and have little loyalty for the crew they  serve with. They often make boarding attempts by the dozen  with jet boots
        and hooks, hoping to reach the enemy ship  before they tumble off, lost in space.</p><p>SPACE PIRATE REAVER</p><p>SPACE PIRATE REAVER</p><p>Space pirate reavers are the ferocious fighters of a crew,
        relishing  in the thrill of battle with their brethren beside them. With brutal  boarding axes, they cleave through hulls and defending parties  with reckless abandon until nothing stands in between
        them and  their loot. With their scattershot guns, they can clear corridors  and cabins of hapless spacers with ease.</p><p>Space Pirate</p>'
