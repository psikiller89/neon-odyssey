    alignment: Neutral
    biography:
      value: '<p>INFILTRATORS</p><p>Covert Operatives</p><p>Habitat: Any; Treasure: Implements</p><p>Infiltrators are specialists who make a living sneaking into  high security areas to gather intel, plant
        incriminating  evidence, or assassinate a target. They often work in small  cells or alongside strike teams to accomplish seemingly  impossible missions. Many interstellar factions make use  of
        infiltrators to gather critical intelligence that can turn  the tide of galactic politics. Roll on or choose a result from  the Infiltrator Motivations table to inspire the reason they  took the
        job.</p><p>INFILTRATOR</p><p>INFILTRATOR</p><p>Career infiltrators are experienced secret agents that strive to  perfectly execute every job but are savvy enough to improvise  when complications
        arise. They employ specialized weaponry,  gadgetry, and training that keep them undetected by anything  that would jeopardize the success of their mission. Most  infiltrators utilize a code name
        to protect their identity,  oftentimes being a simple word or string of numbers.</p><p>Infiltrator</p>'
