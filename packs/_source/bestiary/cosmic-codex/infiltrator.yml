  name: Serrated Blade
  type: feat
  img: icons/svg/upgrade.svg
  effects: []
  sort: 0
  system:
    description:
      value: '<p>Melee or Ranged Attack Roll: +7, reach 5 ft. or range 20/60 ft. Hit: 7 (1d6 + 4) Piercing damage plus 7 (2d6) Poison damage. If the target is a creature and doesn’t already have a deep
        wound, it is subjected to the following effect. Constitution Saving Throw: DC 15. Failure: The target receives a deep wound. While wounded, the target loses 6 (1d12) Hit Points at the start of each
        of its turns. The wound closes after 1 minute, after the target regains any Hit Points, or after the target or a creature within 5 feet of it takes an action to stanch the wound, doing so by succeeding
