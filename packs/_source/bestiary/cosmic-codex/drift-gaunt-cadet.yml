  details:
    cr: 3
    type:
      value: undead
      subtype: ''
      custom: ''
    alignment: Chaotic Evil
    biography:
      value: "<p>DRIFT GAUNTS</p><p>The Ones Who Never Came Home</p><p>Habitat: Space; Treasure: Armaments</p><p>Few things are as horrifying as a space explorer losing their  tether back to their ship.\
        \ They drift until they die from aether  radiation, dehydration, or despair. Sinister powers feast upon  their terror and grief, and when they are done, the bones  still hunger. \t Drift gaunts\
        \ lurk in ruined space stations, lunar bases, and the  wreckage of space battles. The bones still wear their space suits,  often with the armor punctured or the helm shattered, and inflict  the\
        \ irradiated doom that claimed them upon any they encounter.</p><p>DRIFT GAUNT CADET</p><p>DRIFT GAUNT CADET</p><p>Some lingering impulse still binds drift gaunts to their chain  of command. Drift\
        \ gaunt cadets were once enlisted or junior  officers, and they instinctively obey commands from higher- ranking drift gaunts—regardless of their society of origin. More  rarely, they attempt to\
        \ rejoin the service branch they belonged  to in life, only to attack their former comrades. Tall tales told in  every spaceport speak of drift gaunts spending an eternity in  drill formation, awaiting\
        \ their commander’s return.</p><p>DRIFT GAUNT LIEUTENANT</p><p>DRIFT GAUNT LIEUTENANT</p><p>Drift gaunt lieutenants were once intrepid explorers or special  forces operatives. Now they gather drift\
        \ gaunt cadets into their  command and lead them against isolated space stations or lunar  outposts. They tend to have visible insignia of their former lives.</p><p>DRIFT GAUNT COMMANDER</p><p>DRIFT\
        \ GAUNT COMMANDER</p><p>Formerly famous explorers or fearless warriors, drift gaunt  commanders are outfitted with cutting-edge weapons, space  suits, and other technology. Undeath means they can\
        \ never  enjoy their reputation and acclaim, and now they are doomed  to a bitter eternity of vengeance against the living.</p><p>Drift Gaunt Cadet</p>"
      public: ''
    source:
