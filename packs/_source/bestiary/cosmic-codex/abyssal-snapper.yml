      value: '<p>NEW MONSTERS</p><p>A selection of new monsters are presented here.</p><p>ABYSSAL SNAPPER</p><p>Schooling Frenzy of the Void</p><p>Habitat: Planar (Abyssal Void); Treasure: None</p><p>Abyssal
        snappers are among the smallest of the terrors  spawned by the Abyssal Void, but their hunger is no less  immense. Though individually weak, they hunt in devastating  frenzied schools that can strip
