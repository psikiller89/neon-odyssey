    alignment: Neutral Evil
    biography:
      value: '<p>VORT</p><p>Alien Invaders from Outside Space</p><p>Habitat: Planar (Abyssal Void); Treasure: None</p><p>Vort are the ultimate invasive species, even seen as aberrant  among the Deep of
        the Abyssal Void. These extra-dimensional  invaders are driven by the singular purpose to reproduce and  spread their brood like a cancer, rapidly adapting to whatever  environment they find themselves
        in. While they begin their  lifecycle hungering for mortal flesh, their diet evolves until  they devour spacetime itself.</p><p>VORT LARVA</p><p>VORT LARVA</p><p>Vort larvae are the earliest stage
        of the brood, developed  within a living host before violently emerging. They are driven  exclusively by survival, seeking out dark and hidden spaces  where they can molt, grow, and mature.</p><p>VORT
        DRONE</p><p>VORT DRONE</p><p>Vort drones are the most numerous members of the brood,  serving as hunters and harvesters. Their core instinct drives  them to seek out and incapacitate prey to implant
        their larvae  in, spreading the cancer of the brood with each successful  hunt. When they encounter potential hosts, they use their  superior speed and ambush tactics to terrify their victims  before
        going in for the kill.</p><p>VORT ELITE</p><p>VORT ELITE</p><p>Vort elites are created in rare instances when a drone  achieves an apex status that gains the notice of the queen,  transforming them
        to serve as her royal guards. In this new  stage of life, they develop a new hunger for the fabric of  space and time, which they can manipulate. They defend their  queen with brutal ferocity and
        a body perfectly evolved to kill,  turning even the most grizzled marine into terrified prey.</p><p>Vort Larva</p>'
      public: ''
