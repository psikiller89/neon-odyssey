- _id: zedInyYQxYPFn8az
  name: Personal Warp Generator
  type: feat
  img: icons/svg/upgrade.svg
  effects: []
  sort: 0
  system:
    description:
      value: '<p>The drift gaunt wears a damaged personal warp generator on its back. While wearing it, the drift gaunt has a Fly Speed of 40 ft., can hover, and can use the Warp Cells Bonus Action. The
        generator has AC 15; HP 40; and Immunity to Necrotic, Poison, and Psychic damage. If the generator is reduced to 0 Hit Points, it explodes. Strength Saving Throw: DC 16, each creature in a 20-foot
        Emanation originating from the generator. The drift gaunt automatically fails this save. Failure: 35 (10d6) Force damage, and the target is pulled 10 feet toward the generator. Success: Half damage
        only.</p>'
      chat: ''
