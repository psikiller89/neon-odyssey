      value: '<p>CLOAKWING</p><p>Color-Shifting Sky Hunters</p><p>Habitat: Forest, Mountain; Treasure: None</p><p>Cloakwings are the ultimate aerial ambushers, swooping  down from great canopies or mountaintops
        to snatch  unsuspecting prey before they’re even detected. Their skin is  adapted to constantly shift color and pattern to provide near  perfect camouflage, even while in motion. Their distinctive,  ear-splitting
