      value: '<p>CRAG CRAWLER</p><p>Territorial Cliff Dwellers</p><p>Habitat: Coastal, Desert, Forest, Mountain; Treasure: None</p><p>Crag crawlers are incredibly aggressive and territorial hunters  that
        typically make their home in dugouts along steep  cliffsides. They climb along the crags to gain an advantageous  position to strike at potential prey or even encroaching  predators with their hooked
        claws and serrated tail. These  crawlers are just as comfortable living a semi-aquatic life  along sea cliffs as they are hunting in desert canyons, and  every biome in between.</p><p>Crag Crawler</p>'
