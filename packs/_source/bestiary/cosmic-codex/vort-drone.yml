- _id: A3bzofE6031lmJWN
  name: Inject Egg
  type: feat
  img: icons/svg/upgrade.svg
  effects: []
  sort: 0
  system:
    description:
      value: '<p>A creature Grappled by the vort takes 3 (1d6) Necrotic damage and must make the following saving throw if it isn’t already implanted with a vort egg. Constitution Saving Throw: DC 13. Failure:
        The target is afflicted with a magical contagion unawares, and a minuscule vort egg is implanted in it. The contagion can be healed only by the Lesser Restoration spell or similar magic, which destroys
        the egg. Over 30 (2d4 × 6) days, the egg gestates. In the final 24 hours, the afflicted target feels unwell; its Speed is halved, and it has Disadvantage on D20 Tests. At the end of this time, the
        egg turns into a Vort Larva^, which chews out of the host and kills it. Vort Elite</p>'
