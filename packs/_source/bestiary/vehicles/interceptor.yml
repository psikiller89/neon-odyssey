  system:
    description:
      value: '<p>Shield Points (30) are tracked as Temporary Hit Points and absorb damage first. They have their own Damage Threshold. After 1 minute (10 rounds) of game time without taking damage they
        return to maximum automatically. Use Restore Shield Points to refill them by hand.</p><p><strong>Focus Shields</strong> (Utilize action): double the current and maximum Shield Points and put them
        on one fire arc; the other three arcs aren''t protected. <strong>Reset Shields</strong> (Utilize action): halve the focused Shield Points and cover all arcs again; the maximum returns to normal.</p>'
