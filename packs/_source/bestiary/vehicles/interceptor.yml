- _id: SZGdzoFUQ4p795SZ
  name: Starship Maneuvers
  type: feat
  img: icons/svg/wing.svg
  effects: []
  sort: 0
  system:
    description:
      value: '<p>Starships move on a hex grid (1 hex = 500 ft in atmosphere, 1,500 ft in space) and facing matters. Open the <strong>Helm</strong> from the token HUD (ship wheel icon) to move the ship.</p><p><strong>Simple
        Maneuvers.</strong> <em>Forward</em>: up to Speed; on later turns the ship keeps going the same number of hexes unless the pilot changes course. <em>Reverse</em>: 1 hex backward for all of its Speed.
        <em>Turn</em>: 1 hex of movement to turn 60°, after moving at least 1 hex forward; or all movement to pivot to any facing. <em>Side Slip</em>: diagonally forward 1 hex for 2 hexes of movement, needing
        1 hex forward before the next slip. <em>Loop</em>: 12 hexes, ending 1 hex behind its start, same facing. <em>Landing and Docking</em>: at a Speed of 1 hex or less.</p><p><strong>Stunts</strong>
        (one per move, vehicle Dexterity check): <em>Tight Turn</em> turns in place for free (DC 10 for 60°, 15 for 120°, 20 for 180°). <em>Hard Loop</em> (DC 25) ends 1 hex behind, same facing, for free.
        <em>Wingover</em> (DC 20) ends 1 hex behind facing the opposite way, for free. <em>Pursuit</em>: move into the enemy''s space from its left, right or rear arc; it makes a vehicle Dexterity save
        against your check or you shadow it, moving with it and firing one front weapon as a Reaction; two pursuers have Advantage on attacks against it. <em>Skimming Run</em> (DC 10 Gargantuan, 20 Huge,
        25 Large target): off sensors and untargetable by that target until the end of your next turn; fail by more than 5 and you crash. <em>Fast Landing</em> (DC 15): fail by more than 5 and you crash.</p><p><em>From
        the Neon Odyssey Pre-Launch playtest starship rules; the current playtest says new starship rules will follow.</em></p>'
      chat: ''
