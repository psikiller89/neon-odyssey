- _id: 354XLLmfHCDgxIYb
  name: Mag Cable
  type: feat
  img: icons/svg/upgrade.svg
  effects: []
  sort: 0
  system:
    description:
      value: '<p>Melee Attack Roll: +5 plus crew’s PB, reach 15 ft. Hit: The cable attaches to a metallic target such as a vehicle or a creature with metal body parts or wearing metal armor. While attached,
        the target can’t move beyond the cable length. An attached creature or the driver of an attached vehicle can take an action to make a DC 15 vehicle Strength saving throw, detaching the cable on
        a success. As a Bonus Action, the crew can retract the cable to a minimum of 1 foot long, extend the cable up to 15 feet long, or detach the cable. If the attached load exceeds the hauler’s towing
        cargo capacity, the hauler can’t move beyond the cable length and is pulled toward the load if the cable is retracted.</p>'
