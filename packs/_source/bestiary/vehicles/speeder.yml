  details:
    biography:
      value: '<p>Speeders are general, affordable civilian passenger conveyance vehicles. Most carry four people comfortably, but some models accommodate as few as two or as many as six. Armored Enforcement
        Walker Armored Enforcement Walker Huge Vehicle (Light Mech; 7,500 lb.) AC 21 (19 while stationary) Initiative +2 plus PB HP 100 (Damage Threshold 15, Mishap Threshold 25) Speed 60 ft. (Cruise 50
        mph) MOD SAVE MOD SAVE MOD SAVE STR 20 +5 +5 DEX 14 +2 +2 CON 18 +4 +4 INT 0 — — WIS 0 — — CHA 14 +2 +2 Add Pilot''s PB to saves if proficient with the vehicle Immunities Poison, Psychic Cargo Capacity
        200 lb. Passengers 0 Crew 1 Traits Servo-Assist Targeting. The walker uses its Strength modifier for attack rolls and damage rolls with Ranged weapons. Crew Stations Controls (Requires 1 Crew).
        Pilot and steer the walker and use the following actions: Crushing Strike (Simple Weapon, All). Melee Attack Roll: +5 plus crew’s PB, reach 5 ft. Hit: 9 (1d8 + 5) Bludgeoning damage. If the target
        is Large or smaller, it has the Prone condition. Repeating Lasers (Martial Weapon, All). Ranged Attack Roll: +5 plus crew’s PB, range 200/800 ft. Hit: 16 (2d10 + 5) Radiant damage. Grenade Launcher
        (Martial Weapon, All). The walker fires a grenade at a point within 150 feet using one of the following options: • Frag Grenade (4 Grenades). Dexterity Saving Throw: DC 15, each creature in a 20-foot-radius
        Sphere. Failure: 14 (4d6) Piercing damage. Success: Half damage. • Smoke Grenade (4 Grenades). A 20-foot-radius Sphere of smoke appears centered on the point. The Sphere is Heavily Obscured for
        1 minute or until strong wind disperses it. Reactions Assault Suppression (Requires Pilot). Trigger. The walker is hit by a melee attack roll. Response—Dexterity Saving Throw: DC 14, the triggering
        attacker. Failure: 9 (2d8) Lightning damage and the target can’t take Reactions until the end of the walker’s next turn. Success: Half damage only.</p><p><strong>Class</strong> Light Planetary.
        <strong>Cargo</strong> 500 lb.. <strong>Passengers</strong> 3. <strong>Crew</strong> 1. <strong>Initiative</strong> +2 plus PB.</p>'
