- _id: M4f2C0r4rZ1DLBkf
  name: Stunt
  type: feat
  img: icons/svg/upgrade.svg
  effects: []
  sort: 0
  system:
    description:
      value: <p>On its turn, the bike’s driver can expend 10 feet of movement to perform one free vehicle stunt, such as a wheelie, traversing an obstacle up to 5 feet high without expending additional
        movement, or balancing on a surface up to 6 inches wide. The bike must first move at least 10 feet in a straight line. If the driver then succeeds on a DC 10 vehicle Dexterity check, the stunt is
        successful. Otherwise, the driver is unable to perform the stunt and can’t attempt another stunt until the start of its next turn. If the check fails by 5 or more, the bike and all creatures riding
        it gain the Prone condition as the bike wipes out and comes to a dead stop.</p>
      chat: ''
    type:
      value: monster
      subtype: ''
    uses:
      max: ''
