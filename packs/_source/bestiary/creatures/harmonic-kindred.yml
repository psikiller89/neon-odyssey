- _id: XINOa61lrZAW1Ufy
  name: Mask
  type: feat
  img: icons/svg/upgrade.svg
  effects: []
  sort: 0
  system:
    description:
      value: <p>The kindred wears one of the following masks, gaining its benefit. Choose a mask or roll 1d6 to determine it. The mask dissolves into light when removed from the kindred or if the kindred
        dies. A removed mask reappears on the kindred when it finishes a Long Rest. 1–2 Enigmatic Mask. No magic can observe the kindred remotely or detect its thoughts without its permission. Wisdom (Insight)
        checks made to ascertain the intentions or sincerity of the kindred are made with Disadvantage. 3–4 Requiem Mask. When a creature within 5 feet of the kindred is reduced to 0 Hit Points, the creature
        immediately gains one failed Death Saving Throw. 5–6 Thriving Mask. While not Bloodied, the kindred has Advantage on attack rolls and saving throws.</p>
