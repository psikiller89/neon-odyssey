    alignment: Neutral
    biography:
      value: "<p>HARMONIC KINDRED</p><p>Masked Echo of Many</p><p>Habitat: Planar (Harmony); Treasure: None</p><p>Harmonic kindred are formed when dispersed essence within \nthe Harmony coalesces, giving\
        \ rise to masked beings that \ncontain the remnants of dozens of once-individual souls.</p><p>Their forms can vary drastically from bestial to humanoid and \nbeyond, each kindred personifying the\
        \ Harmony in its own \nway. They can exist in one of two states, embodying either</p><p>Vital or Somber energies, which they channel through masks \nthat grant them mystical powers.</p><p>Harmonic\
        \ Kindred</p><p>Harmonic Kindred</p><p>Medium or Small Celestial, Neutral</p><p>AC 12</p><p>Initiative +0 (10)</p><p>HP 22 (4d8 + 4)</p><p>Speed 30 ft.</p><p>MOD\t SAVE</p><p>MOD\t SAVE</p><p>MOD\t\
        \ SAVE</p><p>STR\t 10\t\n+0\t +0</p><p>DEX\t 10\t\n+0\t +0\t CON\t 12\t\n+1\t\n+1</p><p>INT\t\n10\t\n+0\t +0</p><p>WIS\t 16\t\n+3\t\n+3\t CHA\t\n7\t\n−2\t\n−2</p><p>Resistances Necrotic, Radiant</p><p>Immunities\
        \ Exhaustion</p><p>Senses Darkvision 60 ft.; Passive Perception 13</p><p>Languages Lyric; telepathy 30 ft.</p><p>CR 1/2 (XP 100; PB +2)</p><p>Traits</p><p>Mask. The kindred wears one of the following\
        \ masks, gaining \nits benefit. Choose a mask or roll 1d6 to determine it. The \nmask dissolves into light when removed from the kindred \nor if the kindred dies. A removed mask reappears on the\
        \ \nkindred when it finishes a Long Rest.\n1–2 Enigmatic Mask. No magic can observe the kindred \nremotely or detect its thoughts without its permission.</p><p>Wisdom (Insight) checks made to ascertain\
        \ the intentions \nor sincerity of the kindred are made with Disadvantage.\n3–4 Requiem Mask. When a creature within 5 feet of the \nkindred is reduced to 0 Hit Points, the creature immediately\
        \ \ngains one failed Death Saving Throw.\n5–6 Thriving Mask. While not Bloodied, the kindred has</p><p>Advantage on attack rolls and saving throws.</p><p>Actions</p><p>Multiattack. The kindred makes\
        \ one Resonate attack and \ncan use Harmonic Aura.</p><p>Resonate. Melee or Ranged Attack Roll: +5, reach 5 ft. or \nrange 30 ft. Hit: 7 (1d8 + 3) Necrotic or Radiant damage \n(kindred’s choice).</p><p>Harmonic\
        \ Aura. The kindred projects one of the following \nauras in a 5-foot Emanation until the start of its next turn.</p><p>Any creature that starts its turn there is subjected to the \naura’s effect:</p><p>Somber\
        \ Decay. The creature takes 3 (1d6) Necrotic damage.</p><p>Vital Rejuvenation. The creature regains 2 (1d4) Hit Points.</p><p>Bonus Actions</p><p>Many Faces and None (1/Day). The kindred chooses\
        \ a \ndifferent Mask.</p>"
