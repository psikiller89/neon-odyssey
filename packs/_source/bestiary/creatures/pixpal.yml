    alignment: Neutral
    biography:
      value: "<p>PIXPAL</p><p>Helpful Pixelated Buddy</p><p>Habitat: Planar (Arcadia); Treasure: None</p><p>Pixpals are playful sprites from Arcadia that have an \ninherently helpful nature, typically seeking\
        \ to bond with a \nhero on an epic quest whose collectibles they can share in.</p><p>They float behind their favorite protagonist, guiding them \ntoward the next objective and shielding them with\
        \ arcade \nmagic. Pixpals can take a wide variety of forms from animals \nto living objects, often with large, goofy eyes.</p><p>Pixpal</p><p>Pixpal</p><p>Tiny Fey, Neutral</p><p>AC 12</p><p>Initiative\
        \ +2 (12)</p><p>HP 25 (10d4)</p><p>Speed 10 ft., Fly 30 ft. (hover)</p><p>MOD\t SAVE</p><p>MOD\t SAVE</p><p>MOD\t SAVE</p><p>STR\t\n7\t\n−2\t\n−2</p><p>DEX\t 14\t\n+2\t\n+4\t CON\t 10\t\n+0\t +0</p><p>INT\t\
        \n12\t\n+1\t\n+1</p><p>WIS\t 12\t\n+1\t\n+1</p><p>CHA\t 12\t\n+1\t\n+1</p><p>Skills Acrobatics +4</p><p>Senses Darkvision 60 ft.; Passive Perception 11</p><p>Languages Pixlish, Common</p><p>CR 1\
        \ (XP 200; PB +2)</p><p>Traits</p><p>Flyby. The pixpal doesn’t provoke an Opportunity Attack \nwhen it flies out of an enemy’s reach.</p><p>Actions</p><p>Multiattack. The pixpal makes two Guiding\
        \ Zap attacks.</p><p>Guiding Zap. Melee or Ranged Attack Roll: +4, reach 5 ft. or \nrange 60 ft. Hit: 9 (2d6 + 2) Lightning damage, and the next \nattack roll another creature makes against the\
        \ target before \nthe start of the pixpal’s next turn has Advantage.</p><p>Bonus Actions</p><p>Bonded Ward (1/Day). The pixpal can form or dissolve a \nmagical bond with a willing creature within\
        \ 5 feet. While they \nare on the same plane of existence, if the bonded creature \ndrops to 0 Hit Points, the pixpal vanishes and the target is \nreduced to 1 Hit Point instead. The pixpal reappears\
        \ within 5 \nfeet of the bonded creature 24 hours later.</p><p>Reactions</p><p>Warding Burst. Trigger. A creature the pixpal can see within \n60 feet makes an attack roll against the target of its\
        \ Bonded</p><p>Ward. Response: The triggering attack roll has Disadvantage.</p>"
