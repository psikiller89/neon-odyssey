  details:
    cr: 1
    type:
      value: construct
      subtype: ''
      custom: ''
    alignment: Neutral
    biography:
      value: "<p>OMNIBOT</p><p>Buddy Built for Utility</p><p>Habitat: Urban; Treasure: None</p><p>Omnibots are small, clever robots built to serve as the ideal \ncompanion to the average galactic citizen\
        \ and help them for \nany need they may have. Manufactured for utility, they can \nhandle a wide variety of tasks in the operation of technology \nand computers, as well as serve as constant recording\
        \ \ndevices. These friendly bots can follow their owner wherever \nthey go with a full suite of mobility modes and even defend \nthem with a painful taser.</p><p>Omnibot</p><p>Omnibot</p><p>Small\
        \ Construct (Robot), Neutral</p><p>AC 13</p><p>Initiative +2 (12)</p><p>HP 33 (6d6 + 12)</p><p>Speed 30 ft.</p><p>MOD\t SAVE</p><p>MOD\t SAVE</p><p>MOD\t SAVE</p><p>STR\t 10\t\n+0\t\n+2</p><p>DEX\t\
        \ 14\t\n+2\t\n+4\t CON\t 14\t\n+2\t\n+4</p><p>INT\t\n16\t\n+3\t\n+5</p><p>WIS\t 12\t\n+1\t\n+3\t CHA\t 14\t\n+2\t\n+4</p><p>Skills Computers +7, Technology +5</p><p>Resistances Psychic</p><p>Immunities\
        \ Poison; Blinded, Deafened, Poisoned</p><p>Gear Data Chip</p><p>Senses Darkvision 60 ft.; Passive Perception 11</p><p>Languages SIGNAL; understands Common but can’t speak</p><p>CR 1 (XP 200; PB\
        \ +2)</p><p>Traits</p><p>Durable. If the omnibot is reduced to 0 Hit Points but not killed \noutright, it has the Unconscious condition but doesn’t die, and \nit can be repaired with 8 hours of\
        \ work and $500 of materials.</p><p>Holo-Recorder. The omnibot has a built-in Camera and</p><p>Holoprojector, including sound recording and playback. The \nrecording is stored on a Data Chip installed\
        \ in the bot.</p><p>Omni-tool. The omnibot has Bypass Tools and tools \nappropriate to any ability check using the Computers or</p><p>Technology skills. It can make an Intelligence (Technology)\
        \ \ncheck instead of the normal check to use Bypass Tools.</p><p>Actions</p><p>Taser. Melee Attack Roll: +5, reach 5 ft. Hit: 10 (2d6 + 3)</p><p>Lightning damage. The target gains the Incapacitated\
        \ \ncondition until the start of the omnibot’s next turn, and \nthe target can’t gain the Incapacitated condition from this \nomnibot again for 24 hours.</p><p>Bonus Actions</p><p>Reconfigure Locomotion\
        \ (Recharge after a Short Rest). The \nomnibot chooses one of the following movement types:</p><p>Burrow, Climb, Fly, or Swim. It gains the chosen Speed equal \nto its normal Speed for 1 minute.</p><p>Reactions</p><p>Defiant\
        \ Zap (Recharge after a Short Rest). Trigger: An ally \nwithin 5 feet is hit by an attack roll from a creature within 5 \nfeet of the omnibot. Response: The omnibot makes a Taser \nattack against\
        \ the attacker.</p>"
      public: ''
