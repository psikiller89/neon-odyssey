  details:
    cr: 0.125
    type:
      value: construct
      subtype: ''
      custom: ''
    alignment: Neutral
    biography:
      value: "<p>SPY DRONE</p><p>Stealthy Surveillance Bot</p><p>Habitat: Any; Treasure: None</p><p>Spy drones are utilized for surveillance, typically recording \nand streaming encrypted feeds to linked\
        \ databases. If \ndiscovered, a spy drone attempts to flee using sedative darts \nto stall pursuers. To ensure that their controllers are not \ncompromised, they self-destruct when critically damaged.</p><p>Spy\
        \ Drone</p><p>Spy Drone</p><p>Tiny Construct, Neutral</p><p>AC 15</p><p>Initiative +3 (13)</p><p>HP 12 (5d4)</p><p>Speed 5 ft., Fly 30 ft.</p><p>MOD\t SAVE</p><p>MOD\t SAVE</p><p>MOD\t SAVE</p><p>STR\t\
        \n1\t\n−5\t\n−5</p><p>DEX\t 13\t\n+1\t\n+1\t CON\t 10\t\n+0\t +0</p><p>INT\t\n8\t\n−1\t\n−1</p><p>WIS\t 14\t\n+2\t\n+2\t CHA\t 10\t\n+0\t +0</p><p>Skills Perception +4, Stealth +5, Survival +6</p><p>Immunities\
        \ Poison; Charmed, Exhaustion, Frightened, Petrified,</p><p>Poisoned</p><p>Gear Data Chip</p><p>Senses Darkvision 60 ft.; Passive Perception 14</p><p>Languages SIGNAL; understands Common and one\
        \ other \nlanguage but can’t speak them</p><p>CR 1/8 (XP 25; PB +2)</p><p>Traits</p><p>Self-Destruct. The drone explodes when it dies, destroying \nany installed Data Chip. Dexterity Saving Throw:\
        \ DC 10, each \ncreature in a 5-foot Emanation originating from the drone.</p><p>Failure: 2 (1d4) Fire damage. Success: Half damage.</p><p>Actions</p><p>Shock. Melee Attack Roll: +3, reach 5 ft.\
        \ Hit: 4 (1d6 + 1)</p><p>Lightning damage. If the target is a Medium or smaller \ncreature, it has the Prone condition.</p><p>Sleep Dart. Constitution Saving Throw: DC 11, one creature \nthe drone\
        \ can see within 20 feet. Failure: The target has \nthe Poisoned condition until the start of the drone’s next \nturn. The target also has the Incapacitated condition while</p><p>Poisoned in this\
        \ way. Failure by 5 or More: The Poisoned \ncondition lasts for 1 minute, and the Poisoned target has the</p><p>Unconscious condition until it takes damage or a creature \nwithin 5 feet of it takes\
        \ an action to shake it awake.</p><p>Transmit. The drone can transmit what it sees and hears \nin real time up to 1 mile to a communication receiver or \ncomputer. Alternatively, while the drone\
        \ is connected to a \ndatabase within 1 mile, it can upload recordings while it \nmaintains Concentration. It can upload the contents of a full</p><p>Data Chip over the course of 10 minutes.</p><p>Bonus\
        \ Actions</p><p>Record. The drone starts or stops recording sound and video.</p><p>Video is recorded from its main sensor’s perspective. The \nrecording is stored on a Data Chip installed in the\
        \ drone.\n\t As an action, a creature can remove or install a chip in the \ndrone—if it is willing or has the Incapacitated condition—\nwith a successful DC 20 Intelligence (Technology) or</p><p>Dexterity\
        \ (Sleight of Hand) check using Engineer’s Tools. If \nthe check fails by 5 or more, any data on the chip is erased.</p><p>PIXPAL</p><p>Helpful Pixelated Buddy</p><p>Habitat: Planar (Arcadia); Treasure:\
        \ None</p><p>Pixpals are playful sprites from Arcadia that have an \ninherently helpful nature, typically seeking to bond with a \nhero on an epic quest whose collectibles they can share in.</p><p>They\
        \ float behind their favorite protagonist, guiding them \ntoward the next objective and shielding them with arcade \nmagic. Pixpals can take a wide variety of forms from animals \nto living objects,\
        \ often with large, goofy eyes.</p><p>Pixpal</p><p>Pixpal</p><p>Tiny Fey, Neutral</p><p>AC 12</p><p>Initiative +2 (12)</p><p>HP 25 (10d4)</p><p>Speed 10 ft., Fly 30 ft. (hover)</p><p>MOD\t SAVE</p><p>MOD\t\
        \ SAVE</p><p>MOD\t SAVE</p><p>STR\t\n7\t\n−2\t\n−2</p><p>DEX\t 14\t\n+2\t\n+4\t CON\t 10\t\n+0\t +0</p><p>INT\t\n12\t\n+1\t\n+1</p><p>WIS\t 12\t\n+1\t\n+1</p><p>CHA\t 12\t\n+1\t\n+1</p><p>Skills\
        \ Acrobatics +4</p><p>Senses Darkvision 60 ft.; Passive Perception 11</p><p>Languages Pixlish, Common</p><p>CR 1 (XP 200; PB +2)</p><p>Traits</p><p>Flyby. The pixpal doesn’t provoke an Opportunity\
        \ Attack \nwhen it flies out of an enemy’s reach.</p><p>Actions</p><p>Multiattack. The pixpal makes two Guiding Zap attacks.</p><p>Guiding Zap. Melee or Ranged Attack Roll: +4, reach 5 ft. or \n\
        range 60 ft. Hit: 9 (2d6 + 2) Lightning damage, and the next \nattack roll another creature makes against the target before \nthe start of the pixpal’s next turn has Advantage.</p><p>Bonus Actions</p><p>Bonded\
        \ Ward (1/Day). The pixpal can form or dissolve a \nmagical bond with a willing creature within 5 feet. While they \nare on the same plane of existence, if the bonded creature \ndrops to 0 Hit Points,\
        \ the pixpal vanishes and the target is \nreduced to 1 Hit Point instead. The pixpal reappears within 5 \nfeet of the bonded creature 24 hours later.</p><p>Reactions</p><p>Warding Burst. Trigger.\
        \ A creature the pixpal can see within \n60 feet makes an attack roll against the target of its Bonded</p><p>Ward. Response: The triggering attack roll has Disadvantage.</p>"
      public: ''
    source:
      custom: ''
      book: 'Neon Odyssey: Outrunner’s Handbook'
      page: ''
      license: ''
