      value: "<p>JELLIKIN</p><p>Squishy Slime Critters</p><p>Habitat: Urban; Treasure: None</p><p>Jellikin are small animals comprised entirely of a pliable jelly-\nlike substance. They can arise in a variety\
        \ of ways, whether \nsimply being part of an ooze-filled ecosystem or pulling the \nmemories from the remains of a deceased critter. No matter \ntheir origin, jellikin are highly social creatures\
