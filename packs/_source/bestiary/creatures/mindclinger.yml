    alignment: Neutral
    biography:
      value: "<p>MINDCLINGER</p><p>Scuttling Symbiote</p><p>Habitat: Planar (Abyssal Void); Treasure: None</p><p>Mindclingers are tiny symbiotes from the Abyssal Void, \noften drawn forth into the galaxy\
        \ by curiosity and hunger \nfor mortal minds in equal parts. They seek out a host to \nbond with, granting them protection through its surprisingly \npotent psychic power. The appearance of these\
        \ parasites is \nas inconsistent as it is alien, often incorporating elements \nof octopus, crab, and other aquatic creatures with an \notherworldly strangeness.</p><p>Mindclinger</p><p>Mindclinger</p><p>Tiny\
        \ Aberration, Neutral</p><p>AC 12</p><p>Initiative +2 (12)</p><p>HP 25 (10d4)</p><p>Speed 20 ft., Climb 20 ft., Swim 20 ft.</p><p>MOD\t SAVE</p><p>MOD\t SAVE</p><p>MOD\t SAVE</p><p>STR\t\n9\t\n\
        −1\t\n−1</p><p>DEX\t 14\t\n+2\t\n+2\t CON\t 10\t\n+0\t +0</p><p>INT\t\n14\t\n+2\t\n+4</p><p>WIS\t 11\t\n+0\t +0\t CHA\t\n6\t\n−2\t\n−2</p><p>Skills Stealth +4</p><p>Resistances Necrotic</p><p>Immunities\
        \ Psychic</p><p>Senses Darkvision 60 ft.; Passive Perception 10</p><p>Languages Hadalic; telepathy 30 ft.</p><p>CR 1 (XP 200; PB +2)</p><p>Traits</p><p>Amphibious. The mindclinger can breathe air\
        \ and water.</p><p>Mind Quiet. The mindclinger has Advantage on</p><p>Intelligence saving throws.</p><p>Spider Climb. The mindclinger can climb difficult surfaces, \nincluding along ceilings, without\
        \ needing to make an \nability check.</p><p>Actions</p><p>Latch. Melee Attack Roll: +4, reach 5 ft. Hit: 4 (1d4 + 2)</p><p>Piercing damage plus 7 (2d6) Psychic damage, and the \nmindclinger attaches\
        \ to the target. While attached, the \nmindclinger can’t make Latch attacks, and the target \ntakes 14 (4d6) Psychic damage at the start of each of the \nmindclinger’s turns.\n\t The mindclinger\
        \ can detach itself by spending 5 feet of \nmovement. The target or a creature within 5 feet of it can \ndetach the mindclinger as an action.</p><p>Mind Shield. The mindclinger extends the benefits\
        \ of its</p><p>Mind Quiet trait to each creature of its choice within a \n5-foot Emanation originating from it until the start of the \nmindclinger’s next turn.</p><p>Psychic Burst (1/Day). Intelligence\
        \ Saving Throw:</p><p>DC 12, each target in a 5-foot Emanation centered on the \nmindclinger. Failure: 9 (2d6 + 2) Psychic damage, and the \ncreature has the Stunned condition until the end of the\
        \ \nmindclinger’s next turn. Success: Half damage only.</p><p>Bonus Actions</p><p>Symbiosis. The mindclinger forms a magical bond with \na willing creature it touches. The bonded creature has</p><p>Advantage\
        \ on Intelligence saving throws and Resistance \nto Psychic damage. The bond ends when the creature dies, \nthe mindclinger dies, the mindclinger ends the bond (no \naction required), or when the\
        \ mindclinger uses this Bonus</p><p>Action again.</p>"
