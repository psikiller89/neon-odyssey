    alignment: Neutral Evil
    biography:
      value: "<p>CHATTERLING</p><p>Annoying Little Helper</p><p>Habitat: Cacophony; Treasure: None</p><p>Chatterlings are what take form when the smallest \ndollop of Discord coalesces into a creature,\
        \ muting \nits inherent malevolence into more of a nuisance \nthat is almost helpful. Their shape is determined by \ntheir Discordant tone, but they are often ugly-cute \nand always loud and foul-mouthed.\
        \ They typically \nattempt to bond with targets marked for corruption \nbut oftentimes end up becoming a “friend” despite the \nmaddening shrieks and chittering they use against all \nwithin earshot.</p><p>Chatterling</p><p>Chatterling</p><p>Tiny\
        \ Fiend, Neutral Evil</p><p>AC 13</p><p>Initiative +3 (13)</p><p>HP 21 (6d4 + 6)</p><p>Speed 30 ft., Burrow 30 ft. (Instinct only)</p><p>MOD\t SAVE</p><p>MOD\t SAVE</p><p>MOD\t SAVE</p><p>STR\t\n\
        8\t\n−1\t\n−1</p><p>DEX\t 16\t\n+3\t\n+5\t CON\t 13\t\n+1\t\n+3</p><p>INT\t\n8\t\n−1\t\n−1</p><p>WIS\t\n8\t\n−1\t\n−1</p><p>CHA\t 14\t\n+2\t\n+2</p><p>Skills Stealth +5, Perception +1</p><p>Immunities\
        \ Acid (Instinct only), Cold (Entropy only), Lightning \n(Progress only), Psychic (Thrill only)</p><p>Senses Darkvision 120 ft.; Passive Perception 11</p><p>Languages Common, Dissonant</p><p>CR\
        \ 1 (XP 200; PB +2)</p><p>Traits</p><p>Discordant Tone. The chatterling is of one of the tones of</p><p>Cacophony: Entropy, Instinct, Progress, or Thrill. Its tone \ndetermines its Speed, its Immunities,\
        \ and the damage type \nof its Discordant Shriek.</p><p>Endless Annoyance. If the chatterling dies outside</p><p>Cacophony, unless its remains are doused in Cosmic</p><p>Suspension*, it comes back\
        \ to life in 1d4 hours with all its</p><p>Hit Points, regrowing any missing body parts.</p><p>Magic Resistance. The chatterling has Advantage on saving \nthrows against spells and other magical\
        \ effects.</p><p>Actions</p><p>Gnaw. Melee Attack Roll: +5, reach 5 ft. Hit: 6 (1d6 + 3)</p><p>Piercing damage and 3 (1d6) damage of the same type as its \ndamage Immunity.</p><p>Discordant Shriek\
        \ (Recharge 5–6). Constitution Saving Throw:</p><p>DC 12, each creature in a 30-foot Emanation originating from \nthe chatterling. A target makes the save with Advantage if it \nwas affected by\
        \ this chatterling’s shriek in the last 24 hours.</p><p>Failure: 5 (2d4) Thunder damage, and until the start of the \nchatterling’s next turn, the creature has Disadvantage on \nattack rolls, and\
        \ attack rolls against it have Advantage.</p><p>Reactions</p><p>Distracting Chatter (Recharge after a Short or Long Rest).</p><p>Trigger: A creature targets the chatterling or one of its allies\
        \ \nit can see within 30 feet with an attack roll. Response: The \nattack roll has Disadvantage, and if the attack misses, the \nattacker takes 5 (1d6 + 2) Psychic damage.</p>"
