name: Guiding Starlight
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: '<p>When you gain this feature, you focus your connection to the power of Agathos upon one of the triads of your choice: Beacon, Chronicle, Fountain, or Tower.</p><p>Additionally, you can draw
      guidance from the stars to adjust the flow of fate. Whenever a creature you can see within 30 feet of you succeeds or fails on a D20 Test, you can take a Reaction to roll 1d4 and add or subtract (your
      choice) the number rolled from the total, potentially changing the result.</p><p>You can use this Reaction a number of times equal to your Wisdom modifier (minimum of once), and you regain all expended
      uses when you finish a Long Rest.</p>'
