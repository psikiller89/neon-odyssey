name: Abyssal Maw
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You become a herald of the Void and feed its hunger. You gain the following benefits.</p><p><strong>Devouring Collapse.</strong> You can take a Magic action to end your Abyssal Breach. When
      you do, each affected creature in the Sphere takes 5d8 Force damage and must succeed on a Charisma saving throw or be affected by the <em>Banishment</em> spell. You must maintain Concentration as
      normal. Once you use this action, you can’t use it again until you finish a Long Rest.</p><p><strong>Oblivion’s Touch.</strong> Any Necrotic or Psychic damage dealt by you or creatures you summon
      ignores Resistance. When you or creatures you summon deal either of those damage types to a target with Immunity to them, the target instead takes Force damage equal to half the Necrotic or Psychic
      damage dealt.</p>
