_id: nEpsJtpc0pvkWMSi
name: Call of the Void
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>The Abyssal Void calls back. You gain the following benefits.</p><p><strong>Deep Resilience.</strong> You gain Resistance to Necrotic and Psychic damage.</p><p><strong>Drowned Revelation.</strong>
      As a Magic action, you can force one creature in your Abyssal Breach to make a Wisdom saving throw. On a failed save, the target has the Incapacitated condition until the start of your next turn.
      Once you use this action, you can’t use it again until you create a new Abyssal Breach.</p><p><strong>Warped Reality.</strong> While you are within 100 feet of your Abyssal Breach, you can cast spells
      with a range of Touch on creatures within the breach’s area.</p><p><strong>Yawning Breach.</strong> The area of your Abyssal Breach increases to a 20-foot Sphere.</p>
