_id: k1MKCZMiDDDEbsLm
name: Abyssal Breach
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You open rifts to the Abyssal Void, calling forth what waits on the other side. As a Bonus Action, you can expend one use of your Cosmic Conduit to summon nether energies from the Abyssal
      Void at a point you can see within 60 feet of yourself. Choose Crushing Deep or Hunger Beyond. The energies create the chosen effect in a 10-foot Sphere originating from the point. Each creature that
      enters the area for the first time on a turn or starts its turn there is affected by the breach. When you create the breach, you can designate creatures to be unaffected by it.</p><p>As a Bonus Action
      on your subsequent turns, you can move the breach up to 30 feet, but no farther than 60 feet away from yourself.</p><p>The breach remains for 1 minute. It ends early if you dismiss it (no action required),
      if you have the Incapacitated condition, or if you die.</p><p><strong>Crushing Deep.</strong> The Sphere is distorted and warped by the abyssal intrusion. An affected creature’s Speed is halved, and
      it must succeed on a Wisdom saving throw or have Disadvantage on attack rolls and ability checks until the start of its next turn.</p><p><strong>Hunger Beyond.</strong> The Sphere is filled with shadowy
      manifestations of skittering, slithering, or flying void creatures. An affected creature must succeed on a Dexterity saving throw or take 1d8 Necrotic or Psychic damage (your choice). This damage
      increases by 1d8 when you reach Oracle levels 5 (2d8) and 13 (3d8).</p>
