name: Flow of Energy
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You can reach out through the Harmony to divert the flow of harmful energies. When a creature you can see within 30 feet of you takes Acid, Cold, Fire, Lighting, Necrotic, Radiant, or Thunder
      damage, you can take a Reaction to give the target Resistance to one of those triggering damage types. A different creature of your choice that you can see within 30 feet of you takes Necrotic or
      Radiant damage (your choice) equal to your half your Oracle level.</p><p>You can use this Reaction a number of times equal to your Wisdom modifier (minimum of once), and you regain all expended uses
      when you finish a Short or Long Rest.</p>
