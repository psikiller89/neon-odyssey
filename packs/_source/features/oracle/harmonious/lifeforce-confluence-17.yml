_id: LnxUJ8qFEFLl6kNE
name: Lifeforce Confluence
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You have the power to forestall death, delaying someone from rejoining the Harmony. When another creature you can see within 30 feet of you drops to 0 Hit Points, you can take a Reaction to
      anchor its escaping lifeforce for 1 minute.</p><p>For the duration, the target doesn’t gain the Unconscious condition from having 0 Hit Points and can continue to act as normal. In addition, whenever
      the target takes damage, you take the damage instead. This damage ignores Resistance and Immunity. The target must make Death Saving Throws at the start of its turn as normal. The effect ends early
      if the target becomes stable or regains Hit Points, if you have the Incapacitated condition, or if you die.</p><p>Once you use this feature, you can’t do so again until you finish a Long Rest.</p>
