name: Waking Dream
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You now always walk among the Arcadian dream. You gain the following benefits.</p><p><strong>Lucid Dreamer.</strong> When you finish a Long Rest, you can conjure forth one object of your choice.
      The object can be mundane or magical, as long as it is of Common, Uncommon, or Rare rarity, and it must fit within a 5-foot Cube. The item vanishes when you finish your next Long Rest.</p><p><strong>Spark
      of Creativity.</strong> When you create a Dream Figment, you can choose a number of creatures up to your Wisdom modifier (minimum of 2) to gain a figment. You can take a Bonus Action to move any number
      of figments to an equal number of creatures within 30 feet of yourself. At the start of an affected creature’s turn, it gains Heroic Inspiration if it doesn’t already have it. Once you use this benefit
      to create additional figments, you can’t do so again until you finish a Long Rest.</p>
