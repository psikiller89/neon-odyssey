name: Unbroken Reverie
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>Your whimsy is infectious and those around you have more vivid imaginations. When you or a creature you can see within 30 feet of yourself fails a Constitution saving throw to maintain Concentration,
      you can take a Reaction to reinforce their mind’s image of the spell or effect. The target gains a bonus to the saving throw equal to your Wisdom modifier (minimum of +1), possibly turning the failure
      into a success.</p><p>You can use this feature a number of times equal to your Wisdom modifier (minimum of once), and you regain all expended uses when you finish a Long Rest. If you use this feature
      on a creature with your Dream Figment, the use isn’t expended.</p>
