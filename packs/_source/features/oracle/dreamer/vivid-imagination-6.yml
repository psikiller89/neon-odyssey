name: Vivid Imagination
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>Reality becomes more like a dreamscape to you. Your Dream Figment grows more powerful, improving in the following ways.</p><p><strong>Cozy Bubble.</strong> An affected creature has Immunity
      to the Frightened condition. The Temporary Hit Points gained are now equal to twice your Wisdom modifier (minimum of 2).</p><p><strong>Glitter Burst.</strong> An affected creature’s reach is 5 feet
      greater with melee attacks, and other creatures gain no benefit from Half Cover against attack rolls and Dexterity saving throws from an affected creature. The extra damage increases to 1d8.</p><p><strong>Rainbow
      Boost.</strong> Once on each of an affected creature’s turns, it can teleport up to 15 feet to an unoccupied space it can see (no action required). It can’t teleport while its Speed is 0.</p>
