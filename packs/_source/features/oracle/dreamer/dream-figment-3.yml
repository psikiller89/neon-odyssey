_id: P1ATJCPLvJj4FW9L
name: Dream Figment
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You can manifest a figment of your imagination to bolster you and your allies with hope. As a Bonus Action, you present your Cosmic Symbol and expend a use of your Cosmic Conduit to choose
      a creature you can see within 30 feet of yourself. An intangible dream figment appears in the target’s space and moves with it for 1 minute. You choose one of the benefits below, which affects both
      you and the target, and you decide the figment’s appearance. For the duration, you can take a Bonus Action to either choose a different benefit or move the figment to a different creature you can
      see within 30 feet of yourself.</p><p><strong>Cozy Bubble.</strong> At the start of an affected creature’s turn, it gains Temporary Hit Points equal to your Wisdom modifier (minimum of 1).</p><p><strong>Glitter
      Burst.</strong> Once per turn when an affected creature hits with an attack roll, it can deal an extra 1d4 Psychic or Radiant damage (affected creature’s choice).</p><p><strong>Rainbow Boost.</strong>
      The affected creature’s Speed increases by 10 feet, and Opportunity Attacks have Disadvantage against it.</p>
