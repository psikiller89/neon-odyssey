_id: S8mIumrSi2avdkst
name: Cosmic Conduit
type: feat
img: icons/magic/symbols/star-rising-purple.webp
system:
  description:
    value: '<p>You can channel cosmic energy directly from the forces that govern existence to fuel magical effects. You start with two such effects: Cosmic Pulse and Rebuke Anathema, each of which is described
      below. Each time you use this class’s Cosmic Conduit, choose which Cosmic Conduit effect from this class to create. You gain additional effect options at higher Oracle levels.</p><p>You can use this
      class’s Cosmic Conduit twice. You regain one of its expended uses when you finish a Short Rest, and you regain all expended uses when you finish a Long Rest. You gain additional uses when you reach
      certain Oracle levels, as shown in the Cosmic Conduit column of the Oracle Features table.</p><p>If a Cosmic Conduit effect requires a saving throw, the DC equals the spell save DC from this class’s
      Spellcasting feature.</p><p><strong> Cosmic Pulse.</strong> As a Magic action, you point your Cosmic Symbol at another creature you can see within 30 feet of yourself and focus cosmic energy at it.
      Roll 1d8 and add your Wisdom modifier. You either restore Hit Points to the creature equal to that total or force the creature to make a Constitution saving throw. On a failed save, the creature takes
      Necrotic or Radiant damage (your choice) equal to that total. On a successful save, the creature takes half as much damage.</p><p>You roll an additional d8 when you reach Oracle levels 7 (2d8), 13
      (3d8), and 18 (4d8).</p><p><strong>Rebuke Anathema.</strong> Your destiny sets you against interlopers from other planes of existence. When you gain this feature choose one of the following creature
      types as your anathema: Aberrations, Celestials, Fey, Fiends, or Undead. As a Magic action, you present your Cosmic Symbol and censure creatures of the chosen type. Each anathema creature of your
      choice within 30 feet of you must make a Wisdom saving throw. If the creature fails its save, it has the Frightened and Incapacitated conditions for 1 minute. For that duration, it tries to move as
      far from you as it can on its turns. This effect ends early on the creature if it takes any damage, if you have the Incapacitated condition, or if you die. +2 Spellcasting, Destined Path 3 4 2 +2
