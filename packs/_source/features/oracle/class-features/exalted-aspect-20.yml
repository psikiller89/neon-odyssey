  description:
    value: <p>You have become an ascended herald and a speaker of cosmic power. You gain the following benefits.</p><p><strong>Cosmic Will.</strong> You can now exert the will of your cosmic power source
      to alter the course of destiny. When you use your Call the Cosmos feature, you can choose <em>Wish</em> when you select a spell. If you do so, you can’t use Cosmic Intervention again until you finish
      2d4 Long Rests.</p><p><strong>Infinite Messenger.</strong> You always have the <em>Sending</em> spell prepared, and you can cast it without expending a spell slot.</p>
