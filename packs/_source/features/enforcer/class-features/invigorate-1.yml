name: Invigorate
type: feat
img: icons/magic/light/orbs-firefly-hand-yellow.webp
system:
  description:
    value: <p>Your cosmic resolve empowers your touch to rally and restore your allies. You have a pool of healing power that replenishes when you finish a Long Rest. With that pool, you can restore a total
      number of Hit Points equal to five times your Enforcer level.</p><p>As a Bonus Action, you can touch a creature (which could be yourself) and draw power from the pool of healing to restore a number
      of Hit Points to that creature, up to the maximum amount remaining in the pool.</p><p>You can also expend 5 Hit Points from the pool of healing power to remove the Poisoned condition from the creature;
      those points don’t also restore Hit Points to the creature.</p>
