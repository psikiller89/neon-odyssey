name: Zone of Safety
type: feat
img: icons/magic/defensive/barrier-shield-dome-deflect-teal.webp
system:
  description:
    value: <p>The cosmos protects you and your allies. You radiate a protective, unseeable aura in a 10-foot Emanation that originates from you. The aura is inactive while you have the Incapacitated condition.</p><p>You
      and your allies in the aura gain a bonus to saving throws equal to your Charisma modifier (minimum bonus of +1).</p><p>If another Enforcer is present, a creature can benefit from only one Zone of
      Safety at a time; the creature chooses which aura while in them.</p>
