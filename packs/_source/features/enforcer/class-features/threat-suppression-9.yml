name: Threat Suppression
type: feat
img: icons/magic/holy/projectiles-blades-salvo-yellow.webp
system:
  description:
    value: '<p>As a vanguard of your code, you have the means to subdue threats to your code. As a Magic action, you can expend one use of this class’s Cosmic Conduit to overwhelm your foes. As you present
      your Cosmic Symbol or weapon, you can target a number of creatures equal to your Charisma modifier (minimum of one creature) that you can see within 60 feet of yourself. Each target must succeed on
      a Wisdom saving throw or have the Frightened condition for 1 minute or until it takes any damage. While Frightened in this way, a target can do only one of the following on its turns: move, take an
      action, or take a Bonus Action.</p>'
