_id: GHyeTZ1OdBS3PiaN
name: Cosmic Conduit
type: feat
img: icons/magic/fire/projectile-wave-arrow.webp
system:
  description:
    value: '<p>Your conviction to your code has drawn the notice of the cosmos, allowing you to channel it to enact magical effects. You start with one such effect: Vigilance, which is described below.
      Other Enforcer features give additional Cosmic Conduit effect options. Each time you use this class’s Cosmic Conduit, you choose which effect from this class to create.</p><p>You can use this class’s
      Cosmic Conduit twice. You regain one of its expended uses when you finish a Short Rest, and you regain all expended uses when you finish a Long Rest. You gain an additional use when you reach Enforcer
      level 11.</p><p>If a Cosmic Conduit effect requires a saving throw, the DC equals the spell save DC from this class’s Spellcasting feature.</p><p><strong>Vigilance.</strong> Your connection to the
      cosmos makes you sensitive to intrusions from beyond the material galaxy. As a Bonus Action, you can open your awareness to detect Aberrations, Celestials, Constructs, Fey, Fiends, and Undead. For
      the next 10 minutes or until you have the Incapacitated condition, you know the location of any creature of those types within 60 feet of yourself, and you know its creature type. Within the same
      radius, you also detect the presence of any place or object that has been consecrated or desecrated, as with the <em>Hallow</em> spell.</p>'
