_id: stjEgnF22pHAwiho
name: More Machine than Mortal
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>Your cybernetic implants go into overdrive, temporarily overwriting your organics with machinery and unlocking an array of powerful protocols. As a Bonus Action, you gain the benefits below
      for 10 minutes. Once you use this feature, you can’t use it again until you finish a Long Rest. You can also restore your use of it by expending a level 5 spell slot (no action required).</p><p><strong>Body
      Reforged.</strong> Your creature type is Construct.</p><p><strong>Disruptor Pulse.</strong> When you cast <em>Cosmic Smite</em>, the target has the Blinded and Deafened conditions until the start
      of your next turn.</p><p><strong>Multi-Target Array.</strong> When you hit a target with a Ranged weapon, you can take a Reaction to make one attack with a Ranged weapon against another target within
      range.</p><p><strong>Threat Simulator.</strong> This advanced piece of hardware constantly runs simulations and threat assessments. Enemies can’t gain Advantage on attack rolls against you, and you
      ignore Disadvantage on attack rolls and saving throws you make.</p>
