_id: oyuoSZsp0J0NfH9f
name: Peacekeeper
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You have an integrated firearm targeting system equipped with augments to subdue your foes. When you take the Attack action, you can expend one use of your Cosmic Conduit to imbue one Ranged
      weapon that you are holding with the conviction of your code. For 10 minutes or until you use this feature again, you ignore Half Cover, and you can cast <em>Cosmic </em> <em>Smite</em> as a Bonus
      Action immediately after you hit a target with a Ranged weapon. When you do so, the target must succeed on a Constitution saving throw or have the Restrained condition for 1 minute. At the end of
      each of its turns, it repeats the save, ending the condition on itself on a success.</p>
