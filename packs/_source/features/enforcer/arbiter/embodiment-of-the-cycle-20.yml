_id: plv4kj6E7uL8OGkN
name: Embodiment of the Cycle
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: '<p>The will of the Harmony surges within you, and you become a Somber reaper or Vital shepherd. As a Bonus Action, you become a vessel of your current Aspect of Balance, gaining the benefits
      below associated with that aspect for 10 minutes. Once you use this feature, you can’t use it again until you finish a Long Rest. You can also restore your use of it by expending a level 5 spell slot
      (no action required).</p><p><strong>Somber.</strong> While embodying the Somber Harmony, you gain the following: <strong>Choking Grasp.</strong> A creature that fails its saving throw against your
      Harmony’s Grasp takes 3d10 Necrotic damage and has the Restrained condition until the start of your next turn. A creature that succeeds takes half as much damage only. <strong>Death Sentence.</strong>
      When you hit a creature with an attack roll, the target takes an extra 2d10 Necrotic damage if it is missing any of its Hit Points.</p><p><strong>Vital.</strong> While embodying the Vital Harmony,
      you gain the following: <strong>Harmony’s Reach.</strong> When you use Harmony’s Grasp, you can choose a number of targets up to your Charisma modifier. <strong>Life Spring.</strong> When you activate
      this feature and at the start of each of your turns for the duration, a creature of your choice within your Zone of Safety (you can choose yourself) gains 10 Temporary Hit Points.</p>'
