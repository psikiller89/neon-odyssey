_id: MPKOqWIGL6UKY08W
name: Aspect of Balance
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: '<p>You are the firm hand of the Harmony. When you finish a Long Rest, choose which aspect of the Harmony your balance shifts toward: Somber or Vital. When you take the Attack action, you can
      expend one use of your Cosmic Conduit to imbue one or two Melee weapons you are holding with Harmonic energy. For 10 minutes or until you use this feature again, imbued weapons gain one of the following
      benefits. If your current balance doesn’t match the benefit, your balance shifts to match it.</p><p>You can end this effect early (no action required). This effect also ends if you aren’t carrying
      all imbued weapons.</p><p><strong>Somber.</strong> When you hit with the weapon, you can cause it to deal Necrotic damage instead of its normal damage type. Once on each of your turns when you do
      so, you can deal extra damage equal to twice your Charisma modifier (minimum of 2 extra damage).</p><p><strong>Vital.</strong> When you hit with the weapon, you can cause it to deal Radiant damage
      instead of its normal damage type. Once on each of your turns when you do so, you regain a number of Hit Points equal to your Charisma modifier (minimum of 1), gaining any excess beyond your maximum
      as Temporary Hit Points.</p>'
