name: Harmony’s Grasp
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You can reach through the Harmony’s ever-present flow. As an Attack action, or in place of an attack when you take that action on your turn, you can telekinetically move an object or another
      creature that you can see within 30 feet of you. An object must be Medium or smaller. A creature must succeed on a Strength saving throw against your spell save DC or be affected. You move an affected
      target up to 30 feet to an unoccupied space you can see.</p><p>You can use this feature a number of times equal to your Charisma modifier (minimum of once). You regain one expended use when you finish
      a Short Rest, and you regain all expended uses when you finish a Long Rest.</p>
