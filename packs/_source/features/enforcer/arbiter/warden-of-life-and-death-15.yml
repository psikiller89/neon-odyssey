name: Warden of Life and Death
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You are especially attuned to the Harmony within your allies. You gain the following benefit determined by your Aspect of Balance.</p><p><strong>Somber Retribution.</strong> When a creature
      hits you or an ally in your Zone of Safety, you can take a Reaction to make one melee attack against that creature if it’s within your reach or to use Harmony’s Grasp on it without requiring or expending
      a use of that feature.</p><p><strong>Vital Deflection.</strong> When you or an ally in your Zone of Safety takes damage, you can take a Reaction to reduce the damage taken by 2d8 plus your Charisma
      modifier (minimum of +1).</p>
