name: Spinning Shell
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>A shielding power-up encircles you and your allies. You gain three tokens that take the form of baubles, markings, or Tiny sprites. When you or an ally in your Zone of Safety is hit by an
      attack roll, that creature can take a Reaction to add a bonus up to the number of remaining tokens to its AC against that attack, possibly causing it to miss. A number of tokens equal to the bonus
      added interpose themselves to stop the attack and then vanish. At the start each of your turns, vanished tokens reappear.</p>
