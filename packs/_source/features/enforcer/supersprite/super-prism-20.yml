name: Super Prism
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You have become truly super and can call upon the ultimate power-up. As a Bonus Action, you gain the benefits below for 1 minute. Once you use this feature, you can’t use it again until you
      finish a Long Rest. You can also restore your use of it by expending a level 5 spell slot (no action required).</p><p><strong>Invincibility Frames.</strong> You have Resistance to all damage.</p><p><strong>Rainbow
      Rush.</strong> You ignore Difficult Terrain, and you can end the Grappled, Paralyzed, Restrained, and Stunned conditions by spending 10 feet of movement.</p><p><strong>Super Smash.</strong> When you
      move to within 5 feet of a creature, you can deal 2d12 Radiant damage to it. A creature takes this damage only once per turn.</p>
