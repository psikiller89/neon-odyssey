name: Rare Power-Up
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You unlock rare and potent power-ups. When you activate your Hero’s Power-Up feature, you can now choose one of the following rare power-ups that lasts for the duration.</p><p><strong>Colossus
      Roar.</strong> Your size increases to Large if there is room for you to grow. Your attacks with weapons and Unarmed Strikes deal an extra 1d12 Force damage.</p><p><strong>Fairy Dust.</strong> You
      gain a Fly Speed of 60 feet and can hover.</p><p><strong>Steel Block.</strong> Your body and equipment take on a metallic sheen. While you don’t have the Incapacitated condition, you can’t be moved
      or teleported from your space against your will. Additionally, when you take damage, reduce the amount taken by your Charisma modifier (minimum of 1).</p>
