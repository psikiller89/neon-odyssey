name: Urban Legend
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You become a vigilante feared by the corrupt across the galaxy. When you activate your Rage of the Streets, you can also embody the unbridled force of the legend surrounding your exploits.
      You gain the benefits below for the duration of Rage of the Streets. Once you use this feature, you can’t use it again until you finish a Long Rest. You can also restore your use of it by expending
      a level 5 spell slot (no action required).</p><p><strong>Combo Breaker.</strong> You can now make two attacks with an Unarmed Strike or an improvised weapon as a Bonus Action.</p><p><strong>Shrug
      It Off.</strong> You gain Resistance to two damage types of your choice.</p><p><strong>Street Runner.</strong> Your Speed is doubled.</p>
