name: Adaptive Mutation
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>Your mutation progresses, permanently changing your physiology with strange adaptations. You gain one of the following options. When you activate your Surge, you can change your selection.</p><p><strong>Amorphous.</strong>
      Your body breaks down into formless sludge. You can move through any space as narrow as 1 inch, and you can spend 5 feet of movement to end either the Grappled or Prone condition.</p><p><strong>Amphibious.</strong>
      You gain a Swim Speed equal to your Speed, and you can breathe both air and water.</p><p><strong>Subterranean.</strong> You gain a Burrow Speed equal to your Speed.</p><p><strong>Clinging.</strong>
      You gain a Climb Speed equal to your Speed.</p>
