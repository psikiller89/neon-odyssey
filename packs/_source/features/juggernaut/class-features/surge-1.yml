_id: uKbFSOh6dq9GNvRb
name: Surge
type: feat
img: icons/creatures/abilities/mouth-teeth-human.webp
system:
  description:
    value: '<p>Your core contains an inner power called Surge. Unleashing it pushes you to exceed your normal limits, augmenting your body with kinetic force to grant you unbound strength and endurance.
      You can activate it as a Bonus Action if you aren’t wearing Heavy armor.</p><p>You can activate your Surge the number of times shown for your Juggernaut level in the Surges column of the Juggernaut
      Features table. You regain one expended use when you finish a Short Rest, and you regain all expended uses when you finish a Long Rest.</p><p>While active, your Surge follows the rules below.</p><p><strong>Damage
      Resistance.</strong> You have Resistance to three damage types of your choice from the following list (choose when you activate Surge): Bludgeoning, Fire, Lightning, Piercing, Radiant, Slashing.</p><p><strong>Surge
      Damage.</strong> When you make an attack using Strength—with either a weapon or an Unarmed Strike—and deal damage to the target, you gain a bonus to the damage that increases as you gain levels as
      a Juggernaut, as shown in the Surge Damage column of the Juggernaut Features table.</p><p><strong>Strength Advantage.</strong> You have Advantage on Strength checks and Strength saving throws.</p><p><strong>No
      Concentration or Spells.</strong> You can’t maintain Concentration, and you can’t cast spells.</p><p><strong>Duration.</strong> The Surge lasts until the end of your next turn, and it ends early if
      you don Heavy armor or have the Incapacitated condition. If your Surge is still active on your next turn, you can extend the Surge for another round by doing one of the following:</p><ul><li><p>Make
      an attack roll against an enemy.</p></li><li><p>Force an enemy to make a saving throw.</p></li><li><p>Take a Bonus Action to extend your Surge. Each time the Surge is extended, it lasts until the
      end of your next turn. You can maintain a Surge for up to 10 minutes.</p></li></ul>'
