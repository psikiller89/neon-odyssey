name: Surging Core
type: feat
img: icons/skills/social/intimidation-impressing.webp
system:
  description:
    value: <p>The reservoir of Surge at your core is nearly limitless. When you roll Initiative, you can regain all expended uses of Surge. After you regain uses of Surge in this way, you can’t do so again
      until you finish a Long Rest.</p><p>In addition, your Surge is so potent that it now lasts for 10 minutes without you needing to do anything to extend it from round to round. Your Surge ends early
      if you have the Unconscious condition (not just the Incapacitated condition) or don Heavy armor.</p>
