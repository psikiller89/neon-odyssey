name: Kinetic Impact
type: feat
img: icons/skills/melee/strike-axe-blood-red.webp
system:
  description:
    value: <p>Your Surge courses through your strikes to hit foes with devastating effect. If you use Unstable Assault, you can forgo any Advantage on one Strength-based attack roll of your choice on your
      turn. The chosen attack roll mustn’t have Disadvantage. If the chosen attack roll hits, the target takes an extra 1d10 damage of the same type dealt by the weapon or Unarmed Strike, and you can cause
      one Kinetic Impact effect of your choice. You have the following options.</p><p><strong>Disrupt Momentum.</strong> The target’s Speed is reduced by 15 feet until the start of your next turn. A target
      can be affected by only one Disrupt Momentum at a time—the most recent one.</p><p><strong>Repelling Force.</strong> The target is pushed 15 feet straight away from you. You can then move up to half
      your Speed straight toward the target without provoking Opportunity Attacks.</p>
