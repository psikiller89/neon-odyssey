system:
  description:
    value: <p>Your unbound body refuses to die. If you drop to 0 Hit Points while your Surge is active and don’t die outright, you can make a DC 10 Constitution saving throw. If you succeed, your Hit Points
      instead change to a number equal to twice your Juggernaut level.</p><p>Each time you use this feature after the first, the DC increases by 5. When you finish a Short or Long Rest, the DC resets to
      10.</p>
