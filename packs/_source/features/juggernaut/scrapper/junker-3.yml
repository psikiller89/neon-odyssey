name: Junker
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: '<p>You have a scrappy mind and know how to create makeshift equipment out of otherwise useless junk. You gain the following benefits.</p><p><strong>Scrappy Tinker.</strong> You gain a set of
      Mechanic’s Tools, and you are proficient with them.</p><p><strong>Gritty Survivor.</strong> When a Scrapper feature requires a saving throw, the DC is 8 plus your Strength modifier and Proficiency
      Bonus.</p><p><strong>Junk-Rigger.</strong> With 1 minute of work using Mechanic’s Tools, you can cobble together simple, working tech out of scrap or spare parts. You can fashion: a single piece of
      nonmagical outrunning gear worth no more than $500, 40 Bullets or 20 Shells in a Magazine, a Simple weapon, a suit of Light or Medium armor, or a Shield. The item created is obviously constructed
      from junk and has no monetary value. Additionally, the item’s construction is temporary, and it falls apart when you finish a Short or Long Rest or when you create another item with this feature.</p>'
