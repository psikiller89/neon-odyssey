_id: sO9zKxRjXtLQ6Ury
name: Fury of the Road
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>Your Surge now infuses nearby junk to bear you into battle. When you activate your Surge, or as a Bonus Action while your Surge is active, you can magically create a <strong>Cruising  Bike</strong>*
      in an unoccupied space within 10 feet of you. The bike remains until it is reduced to 0 Hit points, you create another bike with this feature, your Surge ends, or you die. You gain proficiency with
      the bike for the duration of your Surge if you don’t already have it.</p><p>When you move within 5 feet of a creature while riding the bike, you can deal 3d6 Slashing damage to it. A creature takes
      this damage only once per turn.</p><p>As a Magic action while the bike exists, you can cause it to detonate. When you do, it explodes in a 30-foot Sphere. Each creature in that area makes a Dexterity
      saving throw, taking 5d6 Fire damage and 5d6 Piercing damage on a failed save or half as much damage on a successful one.</p><p>Once you create a bike with this feature, you can’t do so again until
      you finish a Long Rest unless you expend a use of your Surge (no action required) to restore your use of it.</p>
