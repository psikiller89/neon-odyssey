_id: 3ls0hK2NcKY3Q7lA
name: Junkyard Ingenuity
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You can scrap together improvised tools to survive the deadly chaos around you. You gain one of the following options of your choice. When you finish a Long Rest, you can choose a different
      option. You can activate the chosen option as part of the Bonus Action you take to activate or maintain your Surge.</p><p><strong>Dragline. </strong>While holding a weapon, you can fire a hook and
      chain at a creature, object, or surface you can see within a range equal to your Speed. If the target is a creature up to one size larger than you, it must succeed on a Strength saving throw or have
      the Grappled condition and be pulled to the nearest unoccupied space to you (you can maintain the grapple without a free hand while holding the weapon). If the target is an object up to one size larger
      than you, it is automatically pulled in the same way.</p><p>If the target is larger than you or is a point on a surface, you can instead pull yourself to the nearest unoccupied space to the target.</p><p><strong>Boombounce.</strong>
      You slam a weapon you’re holding into the ground and immediately jump as if you had a running start, and your jump distance is doubled. You can choose a number of allies up to your Strength modifier
      (minimum of one creature) within 10 feet of you to jump the same distance you do.</p>
