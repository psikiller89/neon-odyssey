_id: 8vS4zld7mFXw3vwz
name: Monstrous Charge
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>Your rampaging energies smash obstacles out of your path. While your Surge is active, you gain the following benefits.</p><p><strong>Crash Through.</strong> Once per turn, you can move through
      an object no larger than a 10-foot Cube. An unfixed object is pushed aside, and a fixed one is broken or bent out of your way. You can break through a wall or portion of a larger object with a successful
      DC 20 Strength (Athletics) check. Objects and barriers without Hit Points, such as a <em>Wall of Force</em>, can’t be broken this way.</p><p><strong>Shattered Chains.</strong> You automatically succeed
      on D20 Tests to avoid or end the Restrained condition.</p><p><strong>Toss Aside.</strong> You can move through a Hostile creature’s space as though it were Difficult Terrain. When you enter an enemy’s
      space, it must succeed on a Strength saving throw (DC 8 plus your Strength modifier and Proficiency Bonus) or be pushed 5 feet away from you and have the Prone condition. A creature makes this save
      only once per turn.</p>
