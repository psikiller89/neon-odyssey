name: Earthshaking Leap
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You call upon the ferocity of alien behemoths to move about destructively. When you activate your Surge, or as a Bonus Action while your Surge is active, you can leap up to your Speed to an
      unoccupied space you can see. When you land, each creature in a 10-foot Emanation originating from you must make a Constitution saving throw (DC 8 plus your Strength modifier and Proficiency Bonus).
      Roll a number of d10s equal to your Surge Damage bonus. On a failed save, a target takes Force damage equal to the number rolled. On a successful save, it takes half as much damage.</p>
