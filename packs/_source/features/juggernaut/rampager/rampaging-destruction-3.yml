name: Rampaging Destruction
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You are a monster of devastation. You gain the following benefits.</p><p><strong>Smash Apart.</strong> While your Surge is active, you deal double damage to objects or structures. Additionally,
      when you use Unstable Assault, the first time you hit with an attack roll using Strength during that turn you can deal extra Force damage to the target. The extra damage is a number of d4s equal to
      your Surge Damage bonus.</p><p><strong>Titanic Surge.</strong> When you activate your Surge, you can change your size to Large if you’re in a big enough space. This transformation lasts for the duration
      of the Surge.</p><p>While your Surge is active, you can use an object you’re holding or creature you’re grappling as a Martial melee weapon with the Heavy and Two-Handed properties, provided it is
      Medium, Large, or Huge. On a hit, the weapon deals 2d6 Bludgeoning damage, and if the weapon is a creature, it takes Bludgeoning damage equal to your Strength modifier plus your Surge Damage bonus.</p>
