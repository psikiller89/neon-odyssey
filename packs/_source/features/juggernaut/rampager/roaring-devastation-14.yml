_id: QvRxlVHKz2B3ck2n
name: Roaring Devastation
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You can let out a savage roar to unleash your monstrous Surge in devastating waves. When you activate your Surge, or when you take a Bonus Action to maintain it for another round, you can
      unleash a blast wave in a 20-foot Emanation originating from you. Each creature in that area must make a Constitution saving throw (DC 8 plus your Strength modifier and Proficiency Bonus). On a failed
      save, a target takes 4d6 Force damage and has the Prone condition. On a successful save, it takes half as much damage only.</p><p>Once the Surge ends, you can’t use this feature again until you finish
      a Long Rest unless you expend a use of your Surge (no action required) to restore your use of it.</p>
