system:
  description:
    value: '<p>Your Surge heightens your senses and grants you mythic protection. When you use your Surge and have your Vessel of Power in your possession, you gain the following benefits for the duration
      of the Surge.</p><p><strong>Heroic Resolve.</strong> Choose one ability from the following: Intelligence, Wisdom, or Charisma. When you make a saving throw using that ability, add your Strength bonus
      to the total. You can change your choice when you activate your Surge again.</p><p><strong>Sight Beyond Sight.</strong> You have Blindsight with a range of 10 If you have Blindsight from another source,
      increase its range by 10 feet.</p>'
