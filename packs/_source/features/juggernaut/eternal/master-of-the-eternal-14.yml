name: Master of the Eternal
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You have fully embodied the virtues of your inner hero. While your Surge is active, you gain the following benefits.</p><p><strong>Bonded Relic.</strong> As a Bonus Action, or when you activate
      your Surge, you can teleport your Vessel of Power into your possession or reconstitute it from nothing if it has been destroyed.</p><p><strong>Eternal Hero.</strong> You gain Resistance to all the
      damage type options of your Surge, rather than having to pick three.</p><p><strong>Glorious Presence.</strong> Your Mythic Presence is now a 30-foot Emanation, and an ally that starts its turn in
      the Emanation can add your Surge Damage bonus to damage rolls it makes until the start of its next turn.</p>
