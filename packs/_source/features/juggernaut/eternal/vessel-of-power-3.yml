system:
  description:
    value: <p>You have discovered a mythic relic of immense heroic power. You have a Tiny or Small item that fuels your Eternal subclass features. You can decide what the item is, or you can determine it
      randomly by rolling on the Eternal Vessel table. If your Vessel of Power is lost, you can summon it back to yourself when you finish a Long Rest. Your Vessel is virtually indestructible.</p><p>If
      your Vessel is a Melee weapon, you can transfer the essence that makes it your Vessel of Power to any other Melee weapon as part of a Short or Long Rest. Amulet Bracer Circlet or headband Jewel Melee
      weapon Wristwatch</p>
