_id: pswAzUrhI0mwXJO7
name: Call the Power
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You call upon the power of your inner hero to transform. While your Surge is active and your Vessel of Power is in your possession, you gain the following benefits.</p><p><strong>Heroic Alter-Ego</strong>.
      When you activate your Surge, you transform into a heroic ideal for the duration. You can choose your appearance, but you must retain the same body configuration. While in this form, you have Advantage
      on Charisma checks, and creatures can recognize your true identity only with a successful DC 20 Intelligence (Investigation) check.</p><p><strong>Energy Beam.</strong> On your turn, you can replace
      one of your attacks with an Energy Beam. Each creature of your choice in a 30-foot-long, 5-foot-wide Line must succeed on a Dexterity saving throw (DC 8 plus your Strength modifier and Proficiency
      Bonus) or take Force damage equal to 1d6 plus your Strength modifier and your Surge Damage bonus.</p><p><strong>Mythic Presence.</strong> You radiate eternal power in a 10-foot Emanation originating
      from you. Your allies in the Emanation add 1d4 to saving throws.</p>
