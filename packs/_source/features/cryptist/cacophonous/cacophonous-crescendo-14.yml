_id: C5U0uvMHhzBEbNWs
name: Cacophonous Crescendo
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You can now tear a rift in the fabric of the galaxy and usher in Cacophony. You can use one of the options below. Once you use this feature, you can’t do so again until you finish a Long Rest.</p><p><strong>Cacophony
      Breach.</strong> You can cast <em>Summon Discordant</em>* (your chosen tone only) once without a spell slot or Material components, and you regain the ability to do so when you finish a Long Rest.
      When you cast the spell in this way, you can modify it so that it doesn’t require Concentration. If you do so, the spell’s duration becomes 1 minute for that casting, and when summoned, the Fiend
      has a number of Temporary Hit Points equal to your Cryptist level plus your Occult Magic spellcasting ability modifier.</p><p><strong>Discordant Ascension.</strong> As a Bonus Action, you consume
      a torrent of discordant energy and transform for 1 minute, gaining the following benefits:</p><ul><li><p>Your creature type becomes Fiend.</p></li><li><p>You have a +2 bonus to AC.</p></li><li><p>You
      have Immunity to Necrotic damage and the damage type associated with your discordant tone.</p></li><li><p>When you deal damage, you can change the damage type to Necrotic or the damage type associated
      with your discordant tone, and you ignore targets’ Resistance to that damage.</p></li><li><p>Whenever an enemy starts its turn within 30 feet of you, it must succeed on a Wisdom saving throw against
      your spell save DC or have the Frightened condition until the start of its next turn.</p></li></ul>
