name: Mark of Discord
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You gain the power to mark someone’s soul for Discordant corruption. As a Magic action, you can curse a creature you can see within 60 feet of yourself with a mark of your discordant tone.
      The target must succeed on a Wisdom saving throw against your spell save DC or be cursed for 1 minute. For the duration, the target must subtract 1d4 from D20 Tests, and it takes 2d8 damage at the
      start of each of its turns. The damage type is determined by your discordant tone.</p><p>Once a creature fails its saving throw against this curse, you can’t use this feature again until you finish
      a Short or Long Rest.</p>
