_id: aHhdl9bcNBVoKr9L
name: Invoke Cacophony
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You call forth Discordant powers to corrupt your foes. When you damage an enemy, you can take a Reaction to tear a hole in the cosmos and invite in Cacophony, gaining a benefit based on your
      Discordant tone. You can also take this Reaction if another creature reduces an enemy within 10 feet of you or a creature summoned by you to 0 Hit Points. If a benefit requires a saving throw, the
      DC equals your spell save DC.</p><p>You can take this Reaction a number of times equal to your Occult Magic spellcasting ability modifier (minimum of once), and you regain all expended uses when you
      finish a Long Rest.</p><p><strong>Entropy.</strong> Each creature of your choice within 10 feet of the triggering creature takes 1d6 Cold damage, and its Speed is reduced by 10 feet until the end
      of its next turn.</p><p><strong>Instinct.</strong> Each creature of your choice within 10 feet of the triggering creature must make a Constitution saving throw. On a failed save, a target takes Acid
      damage equal to your Occult Magic spellcasting ability modifier (minimum of 1) and has the Poisoned condition until the start of your next turn.</p><p><strong>Progress.</strong> Each creature of your
      choice within 10 feet of the triggering creature takes 1d8 Lightning damage and can’t take Reactions until the start of your next turn. <em>Bane</em>,<em> Malignant </em> <em>Spray</em>* <em>Dissonant
      Whispers</em>, <em>Silence</em> <em>Acid Arrow</em>,<em> Ray of </em> <em>Sickness</em> <em>Command</em>, <em>Power Sag</em>* <em>Hideous Laughter</em>, <em>Mirror Image</em> <em>Summon Lesser </em>
      <em>Discordant</em>* <em>Slow</em> <em>Haste</em> <em>Raking Shot</em>* <em>Hypnotic Pattern</em> <em>Dimension Door</em> <em>Phantasmal Killer</em> <em>Vitriolic Sphere</em> <em>Resilient Sphere</em>
      <em>Confusion</em> <em>Forceful Majesty</em>* <em>Antilife Shell</em> <em>Insect Plague</em> <em>Wall of Force </em> <em>Mislead</em></p><p><strong>Thrill.</strong> Each creature of your choice within
      10 feet of the triggering creature must make a Wisdom saving throw. On a failed save, a target takes 1d6 Psychic damage and must take a Reaction to move up to half its Speed in a direction of your
      choice. Your allies who fail this save take no damage.</p>
