name: Sign of Annihilation
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You unravel the song of creation within your foes. You can cast <em>Hex</em> without a spell slot once, and you regain the ability to do so when you finish a Long Rest.</p><p>A creature cursed
      by your <em>Hex</em> must make a Constitution saving throw against your spell save DC at the start of each of its turns. On a failed save, its Armor Class is reduced by 1 until the <em>Hex</em> ends.
      Successive failures worsen the penalty by 1 to a maximum of 5. On a success, this effect ends and its Armor Class returns to normal (but the spell remains).</p>
