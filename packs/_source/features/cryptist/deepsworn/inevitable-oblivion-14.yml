_id: RBNoLBQqlagN8ceW
name: Inevitable Oblivion
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You become a vessel for the annihilating hunger of the Deep. As a Magic action, you unleash lashing arcs of void energy. You can direct the lashes at up to four targets within 60 feet of you.
      A target can be a creature, a nonmagical object, or a creation of magical force, such as a wall created by <em>Wall of Force</em>.</p><p>A creature targeted by one or more lashes makes a Dexterity
      saving throw against your spell save DC. On a failed save, the target takes 2d8 + 10 Force damage for each lash that struck it (this is considered one source of damage). If this damage reduces the
      target to 0 Hit Points, it and everything nonmagical it is wearing and carrying are disintegrated into dust. The creature can be revived only by a <em>True Resurrection</em> or <em>Wish</em> spell.</p><p>Each
      lash automatically disintegrates a Medium or smaller nonmagical object or creation of magical force. If such a target is Large or larger, a lash disintegrates two 5-foot Cube portions of it.</p><p>Once
      you use this feature, you can’t use it again until you finish a Long Rest. Alternatively, you can expend a level 6+ Eldritch Revelation to use it again; the damage of one lash increases by 2d8 for
      each level above 6.</p>
