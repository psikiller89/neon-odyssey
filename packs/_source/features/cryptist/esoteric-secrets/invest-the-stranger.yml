name: Invest the Stranger
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: '<p><em>Prerequisite: Level 5+ Cryptist, Mystery of the Stranger Secret</em></p><p>When you cast <em>Autonomous Assistant</em>*, you infuse the summoned assistant with a measure of your eldritch
      power, granting the creature the following benefits.</p><p><strong>Aerial or Aquatic.</strong> The assistant gains either a Fly Speed or a Swim Speed (your choice) of 40 feet.</p><p><strong>Quick
      Attack.</strong> As a Bonus Action, you can command the assistant to take the Attack action.</p><p><strong>Necrotic or Radiant Damage.</strong> Whenever the assistant deals Bludgeoning, Piercing,
      or Slashing damage, you can make it deal Necrotic or Radiant damage instead.</p><p><strong>Your Save DC.</strong> If the assistant forces a creature to make a saving throw, it uses your spell save
      DC.</p><p><strong>Resistance.</strong> When the assistant takes damage, you can take a Reaction to grant it Resistance against that damage.</p>'
