name: Mystery of the Stranger
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: '<p>You learn the <em>Autonomous Assistant</em>* spell and can cast it as a Magic action without expending a spell slot.</p><p>When you cast the spell, you can choose Aberration as the creature
      type for your assistant, and you choose the normal form for it or one of the following special forms: <strong>Chatterling*</strong>, <strong>Jellikin*</strong>, <strong>Pixpal*</strong>, <strong>Starry
      Guide*</strong>, <strong>Harmonic  Kindred</strong>*, or <strong>Mindclinger*</strong>.</p><p>If you chose one of the special forms above, when you take the Attack action, you can forgo one of your
      own attacks to allow your assistant to make one attack of its own with its Reaction.</p>'
