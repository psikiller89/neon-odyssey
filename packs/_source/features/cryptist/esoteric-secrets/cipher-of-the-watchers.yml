name: Cipher of the Watchers
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: '<p><em>Prerequisite: Level 9+ Cryptist, Mystery of the Cipher Secret</em></p><p>With your permission, a creature can take an action to input its name in your Codex of Ciphers, which can contain
      a number of names equal to your Occult Magic spellcasting ability modifier (minimum of one name).</p><p>When any creature whose name is in the codex is reduced to 0 Hit Points but not killed outright,
      the creature magically drops to 1 Hit Point instead. Once this magic is triggered, no creature can benefit from it until you finish a Long Rest.</p><p>As a Magic action, you can erase a name from
      the codex by touching it.</p>'
