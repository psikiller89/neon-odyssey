_id: U6uSvn8KDxcOdBxk
name: Silent Proxy
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>The living and dead are mere puppets to you, no matter where you are. You can cast <em>Animate Dead</em> once without a spell slot, and you can’t do so again until you finish a Long Rest.
      When you cast the spell in this way, its level is equal to your Occult Magic slot level.</p><p>Additionally, you can reach your magic through the yawning space where your servants’ Harmony should
      be. While you and an Undead creature you created or summoned are on the same plane of existence, as a Bonus Action, you can see through its eyes and hear what it hears until the start of your next
      turn, gaining the benefits of any special senses it has.</p><p>If you are within 100 feet of the creature and you cast a spell with a casting time of an action while using the creature’s senses in
      this way, you can cause the spell to originate from that creature’s space as if you were occupying it. You and the creature both count as the caster of the spell, though you make all decisions and
      rolls for the spell. Once you cast a level 1+ spell in this way, you can’t do so again until you finish a Short or Long Rest. You can still cast cantrips in this way during that time.</p>
