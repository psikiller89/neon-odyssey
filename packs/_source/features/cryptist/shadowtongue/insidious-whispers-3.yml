system:
  description:
    value: <p>Your whispers twist the Harmony to wrap your enchanting magic around the mind of normally resilient beings. When you cast a spell that imposes the Charmed condition, you can modify it to affect
      creatures of any type.</p><p>When you do so, one target of the spell normally unaffected because of its creature type is affected. The target has Advantage on any saving throws against the spell,
      and the spell ends after 1 minute, unless its normal duration is shorter.</p>
