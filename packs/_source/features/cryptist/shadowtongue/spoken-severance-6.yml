name: Spoken Severance
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You can temporarily sever a creature from the Harmony in the moment of its transition from living existence. When a creature that isn’t Undead that you can see within 30 feet of you dies,
      you can take a Reaction to cast <em>Summon Silent</em>* without a spell slot or Material components, requiring no Concentration. When you cast the spell in this way, its duration becomes 1 minute.
      Once you use this Reaction, you can’t use it again until you finish a Long Rest.</p>
