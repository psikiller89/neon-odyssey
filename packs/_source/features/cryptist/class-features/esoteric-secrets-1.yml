system:
  description:
    value: <p>Delving into the mysteries of the galaxy have led you to discovering Esoteric Secrets that grant you magical abilities of the occult. You gain one secret of your choice, such as Mystery of
      the Cipher. Secrets are described in the “Esoteric Secrets Options” section later in the class’s description.</p><p><strong>Prerequisites.</strong> If a secret has a prerequisite, you must meet it
      to learn that secret. For example, if a secret requires you to be a level 5+ Cryptist, you can select the secret once you reach Cryptist level 5.</p><p><strong>Replacing and Gaining Secrets.</strong>
      Whenever you gain a Cryptist level, you can replace one of your secrets with another one for which you qualify. You can’t replace a secret if it’s a prerequisite for another secret that you have.</p><p>When
      you gain certain Cryptist levels, you gain more secrets of your choice, as shown in the Esoteric Secrets column of the Cryptist Features table.</p><p>You can’t pick the same secret more than once
      unless its description says otherwise.</p>
