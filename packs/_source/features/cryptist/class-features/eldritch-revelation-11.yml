name: Eldritch Revelation
type: feat
img: icons/magic/unholy/hand-marked-pink.webp
system:
  description:
    value: <p>In your delving into hidden secrets, you have unearthed a cosmic truth called a revelation. Choose one level 6 Cryptist spell as this revelation.</p><p>You can cast your revelation spell once
      without expending a spell slot, and you must finish a Long Rest before you can cast it in this way again.</p><p>As shown in the Cryptist Features table, you gain another Cryptist spell of your choice
      that can be cast in this way when you reach Cryptist levels 13 (level 7 spell), 15 (level 8 spell), and 17 (level 9 spell). You regain all uses of your Eldritch Revelation when you finish a Long Rest.</p><p>Whenever
      you gain a Cryptist level, you can replace one of your revelation spells with another Cryptist spell of the same level.</p>
