name: Calamity-Touched
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: '<p>You are infused with elemental calamity, granting you the following benefits.</p><p><strong>Archaic Element.</strong> Choose one of the following damage types to master: Acid, Cold, Fire,
      Lightning, or Thunder. You gain Resistance to the damage type you mastered. Additionally, when you deal damage with a spell or a weapon, you can change the damage type to the type you mastered, and
      you ignore Resistance to that type.</p><p><strong>Consuming Calamity.</strong> When a creature you can see within 30 feet takes damage of the same type as your chosen Archaic Element, you can take
      a Reaction to grant the creature Resistance to that instance of damage, and you gain a number of Temporary Hit Points equal to the amount of damage the creature takes. You can use this feature a number
      of times equal to your Occult Magic spellcasting ability modifier (minimum of once), and you regain all expended uses when you finish a Long Rest.</p>'
