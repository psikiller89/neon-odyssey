  description:
    value: <p>Your power over the destructive forces of nature grows, granting you the following benefits.</p><p><strong>Archaic Duality.</strong> Choose a second damage type from your Archaic Element feature
      to master.</p><p><strong>Primeval Wrath.</strong> When you cast <em>Elemental Wrath</em>* and choose one of your mastered damage types, targets have Disadvantage on saving throws against the spell.</p><p>Additionally,
      you can cast the spell once without expending a spell slot, and you regain the ability to do so when you finish a Long Rest. When you cast it in this way, you can modify it so that it doesn’t require
      Concentration. If you do so, the spell’s duration becomes 1 minute for that casting.</p>
