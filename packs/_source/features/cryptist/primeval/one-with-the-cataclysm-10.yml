name: One with the Cataclysm
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You become one with an elemental force, granting you the following benefits.</p><p><strong>Archaic Wrath.</strong> Choose a third damage type from your Archaic Element to master.</p><p>Additionally,
      choose one of your Archaic Element damage types. You gain Immunity to that damage type, and you can change the selection when you finish a Long Rest.</p><p><strong>Primordial Barrier.</strong> When
      you or an ally you can see within 10 feet of you is targeted by an attack roll, you can take a Reaction to create a swirling barrier of one of your mastered elements until the end of your next turn.
      The barrier fills a 10-foot Emanation originating from you. You and your allies in the barrier have Half Cover. When the barrier ends, you can deal 2d8 damage of the chosen type to creatures of your
      choice within the Emanation.</p><p>You can take this Reaction a number of times equal to your Occult Magic spellcasting ability modifier, (minimum of once), and you regain all expended uses when you
      finish a Long Rest.</p>
