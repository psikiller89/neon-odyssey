name: Iconic Inspiration
type: feat
img: icons/magic/light/orbs-firefly-hand-yellow.webp
system:
  description:
    value: <p>You resonate with cosmic song to uplift and inspire those around you through your preferred means of expression. This inspiration is represented by your Iconic Inspiration die, which is a
      d6.</p><p><strong>Using Iconic Inspiration.</strong> As a Bonus Action, you can inspire another creature within 60 feet of yourself who can see or hear you. That creature gains one of your Iconic
      Inspiration dice. A creature can have only one Iconic Inspiration die at a time.</p><p>Once within the next hour when the creature fails a D20 Test, the creature can roll the Iconic Inspiration die
      and add the number rolled to the d20, potentially turning the failure into a success. An Iconic Inspiration die is expended when it’s rolled.</p><p><strong>Number of Uses.</strong> You can confer
      an Iconic Inspiration die a number of times equal to your Charisma modifier (minimum of once), and you regain all expended uses when you finish a Long Rest.</p><p><strong>At Higher Levels.</strong>
      Your Iconic Inspiration die changes when you reach certain Icon levels, as shown in the Iconic Die column of the Icon Features table. The die becomes a d8 at level 5, a d10 at level 10, and a d12
      at level 15.</p>
