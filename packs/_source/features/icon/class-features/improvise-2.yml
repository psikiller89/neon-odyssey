system:
  description:
    value: <p>You’ve picked up a range of experience with skills during your travels across the Rhapsody, even in ones you haven’t formally practiced. You can add half your Proficiency Bonus (round down)
      to any ability check you make that uses a skill proficiency you lack and that doesn’t otherwise use your Proficiency Bonus.</p><p>For example, if you make a Strength (Athletics) check and lack Athletics
      proficiency, you can add half your Proficiency Bonus to the check.</p>
