name: Spellcasting
type: feat
img: icons/skills/trades/music-notes-sound-blue.webp
system:
  description:
    value: <p>Your ability to perceive and weave the Stardust Rhapsody allows you to cast spells. See the <em>D&amp;D Beyond Basic Rules</em> for the rules on spellcasting. The information below details
      how you use those rules with Icon spells, which appear in the Icon spell list later in the class’s description.</p><p><strong>Cantrips.</strong> You know two Icon cantrips of your choice. <em>Dancing
      Lights</em> and <em>Vicious Mockery</em> are recommended.</p><p>Whenever you gain an Icon level, you can replace one of your cantrips with another cantrip of your choice from the Icon spell list.</p><p>When
      you reach Icon levels 4 and 10, you learn another Icon cantrip of your choice from the Icon spell list, as shown in the Cantrips column of the Icon features table.</p><p><strong>Spell Slots.</strong>
      The Icon Features table shows how many spell slots you have to cast your level 1+ spells. You regain all expended slots when you finish a Long Rest.</p><p><strong>Prepared Spells of Level 1+.</strong>
      You prepare the list of level 1+ spells that are available for you to cast with this feature. To start, choose four level 1 spells from the Icon spell list. <em>Charm </em> <em>Person</em>, <em>Color
      Spray</em>, <em>Dissonant Whispers</em>, and <em>Healing Word</em> are recommended.</p><p>The number of spells on your list increases as you gain Icon levels, as shown in the Prepared Spells column
      of the Icon Features table. Whenever that number increases, choose additional spells from the Icon spell list until the number of spells on your list matches the number on the table. The chosen spells
      must be of a level for which you have spell slots. For example, if you’re a level 3 Icon, your list of prepared spells can include six spells of levels 1 and 2 in any combination.</p><p>If another
      Icon feature gives you spells that you always have prepared, those spells don’t count against the number of spells you can prepare with this feature, but those spells otherwise count as Icon spells
      for you.</p><p><strong>Changing Your Prepared Spells.</strong> Whenever you gain an Icon level, you can replace one spell on your list with another Icon spell for which you have spell slots.</p><p><strong>Spellcasting
      Ability.</strong> Charisma is your spellcasting ability for your Icon spells.</p><p><strong>Spellcasting Focus.</strong> You can use an Amplifier, Artist’s Supplies, a Hypertech Component Pack, or
      a Musician’s Instrument as a Spellcasting Focus for your Icon spells.</p>
