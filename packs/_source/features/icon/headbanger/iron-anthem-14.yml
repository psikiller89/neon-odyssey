name: Iron Anthem
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You crank up your screaming anthem to eleven, rallying your allies to throw themselves into the mosh.</p><p>When you activate your Metal Mayhem feature, you can invoke a thunderous anthem
      that lasts for 1 minute and affects you and a number of creatures of your choice within 30 feet of you, up to your Charisma modifier (minimum of one other creature). Once you invoke this anthem, you
      can’t do so again until you finish a Long Rest unless you expend a level 7+ spell slot (no action required) to restore your use of it.</p><p>Each affected creature gains the following benefits.</p><p><strong>Power
      Chord.</strong> The creature gains Resistance to Thunder damage, and when another creature hits it with an attack roll, it can take a Reaction to deal Thunder damage equal to your Charisma modifier
      to the attacker.</p><p><strong>Screaming Defiance.</strong> If the creature would drop to 0 Hit Points, it is reduced to 1 Hit Point instead, and the creature can’t use this benefit again until it
      finishes a Long Rest.</p><p><strong>Thrasher.</strong> The creature has Advantage on Strength and Dexterity saving throws.</p>
