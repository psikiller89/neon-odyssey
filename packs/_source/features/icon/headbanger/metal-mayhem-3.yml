name: Metal Mayhem
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You unleash the defiant aggression of your screaming song. When you expend a use of Iconic Inspiration, you can enter a rocking fury (no action required) that lasts for 1 minute or until you
      have the Incapacitated condition, during which you gain the following benefits.</p><p><strong>Hot-Blooded.</strong> You gain Temporary Hit Points equal to the highest number on your Iconic Inspiration
      die.</p><p><strong>Stand and Shout.</strong> You have Advantage on saving throws to avoid or end the Charmed or Frightened condition.</p><p><strong>Steel Slam.</strong> Once on each of your turns,
      when you hit a creature with an attack roll, you can force the target to make a Strength saving throw against your spell save DC. On a failed save, the target has the Prone condition.</p>
