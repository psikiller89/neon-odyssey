_id: GPA6AhDyYbDY4aCe
name: Glitz and Glamour
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You can command the stage and captivate your audience with your glam. You know the <em>Minor Illusion</em> cantrip. If you already know it, you learn a different Icon cantrip of your choice.
      The cantrip doesn’t count against your number of cantrips known. Additionally, you always have the <em>Enthrall</em> and <em>Silent Image</em> spells prepared, and you gain the following benefits.</p><p><strong>Lightshow.</strong>
      When you cast <em>Silent Image</em>, you can modify the spell so it doesn’t require Concentration. If you do so, the spell’s duration becomes 10 minutes for that casting. Once you use this benefit,
      you can’t use it again until you finish a Long Rest. You can also restore your use of it by expending one use of your Iconic Inspiration (no action required).</p><p><strong>Starstruck.</strong> When
      you cast <em>Enthrall</em>, creatures you or your companions are fighting don’t automatically succeed on the saving throw against the spell.</p>
