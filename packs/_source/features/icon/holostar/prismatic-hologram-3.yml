_id: loGtFlc232dZvvxi
name: Prismatic Hologram
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You can create colorful holograms that become extensions of your cosmic song. As a Bonus Action, or as part of the same Bonus Action you use to grant an Iconic Inspiration die, you can conjure
      a Medium or smaller hologram within 30 feet of you. You decide the hologram’s form, but it is obviously a holographic image.</p><p>The hologram persists for 1 minute. For the duration, you can use
      the benefits below. Once you use this feature to create a hologram, you can’t do so again until you finish a Short or Long Rest.</p><p><strong>Backup.</strong> You can cast spells as though you were
      in the hologram’s space, but you must use your own senses.</p><p><strong>Harmonize.</strong> When a creature you can see within 30 feet of the hologram succeeds or fails on a D20 Test, you can take
      a Reaction to roll 1d4 and add it to or subtract it from the total (your choice), potentially changing the result.</p><p><strong>Moonwalk.</strong> As a Bonus Action, you can move the hologram up
      to 30 feet to a space you can see within 120 feet of yourself.</p><p><strong>Spotlight.</strong> When you create the hologram, you can cause it to shed Bright Light or Dim Light up to 20 feet, or
      no light, and you can change this selection once on each of your turns if you don’t have the Incapacitated condition.</p>
