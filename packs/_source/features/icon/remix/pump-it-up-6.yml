system:
  description:
    value: <p>Your beats get more energetic. While your Upbeat Aura is active, you gain the following benefits.</p><p><strong>Louder.</strong> The size of the Emanation of your Upbeat Aura increases to
      60 feet.</p><p><strong>Double Time.</strong> You and your allies within the aura can take the Dash action as a Bonus Action.</p><p><strong>Record Scratch.</strong> When a creature tagged by your Upbeat
      Aura makes an attack roll, you can take a Reaction to reduce the total by one roll of your Iconic Inspiration die.</p>
