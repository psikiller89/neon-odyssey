_id: DiqpCbK8XRA4LsQJ
name: Upbeat Aura
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You keep your allies pumped up with your energetic rhythms. As a Magic action, or as part of the Magic action you use to cast a spell, you can expend a use of Iconic Inspiration to emit a
      thumping aura in a 30-foot Emanation originating from you. The aura can be heard up to 300 feet away and lasts for 1 minute, until you have the Incapacitated condition, or until you dismiss it (no
      action required). While the aura is active, you have the following benefits.</p><p><strong>Flow State.</strong> Your movement doesn’t provoke Opportunity Attacks.</p><p><strong>Glide Roll.</strong>
      You and your allies in the aura have Advantage on Dexterity saving throws.</p><p><strong>Tempo Tag.</strong> Once per turn, when you move to a space within 5 feet of an enemy, you can tag it until
      the end of your next turn. While tagged, the target’s Speed is reduced by 20 feet. If the target takes damage, the tag ends early, and the target takes Psychic damage equal to one roll of your Iconic
      Inspiration die.</p>
