_id: 58T6fAJ9KEA9YYoO
name: Remix Reality
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You can now effortlessly remaster the rhythms of the cosmic song. You gain the following benefits.</p><p><strong>Groove and Grind.</strong> You and your allies in your Upbeat Aura ignore Difficult
      Terrain.</p><p><strong>Wallride.</strong> You can move along vertical surfaces and across liquids on your turn without falling during the movement.</p><p><strong>Drop the Beat.</strong> You can take
      a Magic action to target up to two enemies in your aura. A target must make a Constitution saving throw against your spell save DC. On a failed save, the target has the Stunned condition until the
      end of your next turn. On a successful save, its Speed is halved until the end of your next turn, and it has Disadvantage on the next attack roll it makes during that time. Once you use this benefit,
      you can’t use it again until you finish a Long Rest unless you expend a level 5+ spell slot (no action required) to restore your use of it.</p>
