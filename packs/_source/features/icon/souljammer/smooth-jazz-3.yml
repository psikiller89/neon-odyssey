name: Smooth Jazz
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>Your soulful songs can soothe the hearts, minds, and spirits of your allies. You always have the <em>Calm Emotions</em> and <em>Protection from Evil and Good</em> spells prepared.</p><p>Additionally,
      immediately after you cast an Abjuration or Enchantment spell of level 1+, you can expend a use of Iconic Inspiration to choose a number of other creatures within 60 feet of yourself, up to your Charisma
      modifier (minimum of one creature). The Charmed and Frightened conditions end on each target, and each target gains a number of Temporary Hit Points equal to two rolls of your Iconic Inspiration die.</p><p>Once
      you use this benefit, you can’t use it again until you finish a Long Rest. You can also expend one use of your Iconic Inspiration (no action required) to restore your use of it.</p>
