_id: yqIbD3BrHn2zVXOb
name: Rhapsody in Blues
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>The grand cosmic melody flows from your soul to those around you. You gain the following benefits.</p><p><strong>Soothed Soul.</strong> You have Immunity to the Charmed and Frightened conditions,
      and while you don’t have the Incapacitated condition, you can use your Soul Jamming feature without taking a Reaction. Once you use Soul Jamming in this way, you can’t do so again until the start
      of your next turn.</p><p><strong>Transcendent Bebop.</strong> As a Bonus Action, you can expend one use of your Iconic Inspiration and choose a number of creatures, including yourself, that you can
      see within 60 feet of yourself, up to your Charisma modifier (minimum of one creature). Each target gains Heroic Inspiration if it doesn’t already have it, and for 1 minute, a creature that damages
      a a chosen target takes Psychic damage equal to one roll of your Iconic Inspiration die. A creature can take this damage only once per turn.</p>
