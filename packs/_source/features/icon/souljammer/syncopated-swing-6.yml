name: Syncopated Swing
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: '<p>Your song becomes even more flexible, helping and harming in equal measure. You always have the <em>Bane</em> and <em>Bless</em> spells prepared.</p><p>You can cast one of these spells without
      expending a spell slot. When you cast the spell in this way, you can choose to either modify the spell so that it doesn’t require Concentration (the spell’s duration becomes 1 minute for that casting)
      or empower it in one of the following ways based on the spell you cast: <strong>Bane.</strong> Creatures have Disadvantage on the saving throw against the spell. <strong>Bless.</strong> Affected creatures
      add 1d6 to their attack rolls and saving throws instead of 1d4. Once you cast a spell using this feature, you can’t do so again until you finish a Long Rest. You can also restore your use of it by
      expending a level 3+ spell slot (no action required).</p>'
