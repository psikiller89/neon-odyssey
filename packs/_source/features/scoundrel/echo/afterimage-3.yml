  description:
    value: <p>You can see and step through the flows of time, gaining the following benefits.</p><p><strong>Dilated Steps.</strong> Your Speed increases by 5 feet.</p><p><strong>Prescient Glimpse.</strong>
      You add your Proficiency Bonus to Initiative rolls.</p><p><strong>Try Again.</strong> When you fail a D20 Test, you can reroll the d20 and use the higher roll. When you do so, until the end of your
      next turn, your Cheap Shot is reduced by 1d6. You can use this benefit a number of times equal to your Dexterity modifier (minimum of once), and you regain all expended uses when you finish a Long
      Rest.</p>
