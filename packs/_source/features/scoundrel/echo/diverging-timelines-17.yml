name: Diverging Timelines
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>Your mastery of time has empowered you to split your own timeline. When you roll Initiative, or as a Magic action at any other time, you can cause an identical version of yourself from another
      timeline—an echo—to appear in the nearest unoccupied space to you and persists for 1 minute. Once you split your timeline, you can’t do so again until you finish a Long Rest.</p><p>For the duration,
      when you move during your turn, you simultaneously move your echo. Your echo is intangible, can’t take damage or be targeted by any effects, and can’t affect the world. You can switch between timelines
      in the following ways, causing your echo to become your real self, and your real self to become your echo.</p><p><strong>Action.</strong> When you take an action or a Bonus Action, you can switch
      timelines to swap with your echo before resolving the action.</p><p><strong>Harm.</strong> When you are hit by an attack roll, take damage, or are forced to make a saving throw, you can take a Reaction
      to switch timelines, swapping with your echo. If you are out of reach or range of the triggering effect, it fails and is wasted.</p>
