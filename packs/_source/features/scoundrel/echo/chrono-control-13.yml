name: Chrono Control
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You have unlocked the ability to stop a foe in time. When you deal Cheap Shot damage, you can force the target to make a Constitution saving throw (DC 8 plus your Dexterity modifier and Proficiency
      Bonus). On a failed save, the target has the Paralyzed condition until the end of your next turn or until it takes any damage. Once a creature becomes Paralyzed in this way, you can’t use this feature
      again until you finish a Long Rest.</p>
