_id: 65DypJkONcSWgAPt
name: Dirty Trick
type: feat
img: icons/skills/melee/blade-tip-acid-poison-green.webp
system:
  description:
    value: '<p>You’re not above employing dirty tricks when you catch foes unaware. When you deal Cheap Shot damage, you can add one of the following Dirty Trick effects. Each effect has a die cost, which
      is the number of Sneak Attack damage dice you must forgo to add the effect. You remove the die before rolling, and the effect occurs immediately after the attack’s damage is dealt. For example, if
      you add the Toxic Payload effect, remove 1d6 from the Cheap Shot’s damage before rolling.</p><p>If a Dirty Trick effect requires a saving throw, the DC equals 8 plus your Dexterity modifier and Proficiency
      Bonus.</p><p><strong>Quick Getaway (Cost: 1d6).</strong> Immediately after the attack, you move up to half your Speed without provoking Opportunity Attacks.</p><p><strong>Tendon Strike (Cost: 1d6).</strong>
      If the target is Large or smaller, it must succeed on a Dexterity saving throw or have the Prone condition. +2 Cheap Shot, Expertise, Smuggler&#x27;s Slang, Weapon Mastery 1d6 +2 Slick Maneuver 1d6
      +2 Scoundrel Subclass, Zero In 2d6 +2 Ability Score Improvement 2d6 +3 Dirty Trick, Lucky Break 3d6 +3 Expertise 3d6 +3 Agile Escape, Upper Hand 4d6 +3 Ability Score Improvement 4d6 +4 Subclass feature
      5d6 +4 Ability Score Improvement 5d6 +4 Double Down 6d6 +4 Ability Score Improvement 6d6 +5 Subclass feature 7d6 +5 Dirty Deeds 7d6 +5 Sharp Wits 8d6 +5 Ability Score Improvement 8d6 +6 Subclass feature
      9d6 +6 One Step Ahead 9d6 +6 Epic Boon 10d6 +6 Fortune Favored 10d6</p><p><strong>Toxic Payload (Cost: 1d6).</strong> You add a toxin to your strike, forcing the target to make a Constitution saving
      throw. On a failed save, the target has the Poisoned condition for 1 minute. At the end of each of its turns, the Poisoned target repeats the save, ending the effect on itself on a success.</p><p>To
      use this effect, you must have a Toxin Kit on your person.</p>'
