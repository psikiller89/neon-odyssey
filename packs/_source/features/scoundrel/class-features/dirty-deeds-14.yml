system:
  description:
    value: '<p>You have even more devious tricks up your sleeve when you Cheap Shot a foe. The following effects are now among your Dirty Trick options.</p><p><strong>Blackout (Cost: 6d6).</strong> The
      target must succeed on a Constitution saving throw, or it has the Unconscious condition for 1 minute or until it takes any damage. The Unconscious target repeats the save at the end of each of its
      turns, ending the effect on itself on a success.</p><p><strong>Blind Spot (Cost: 3d6).</strong> The target must succeed on a Dexterity saving throw, or it has the Blinded condition until the end of
      its next turn.</p><p><strong>Brain Rattle (Cost: 2d6).</strong> The target must succeed on a Constitution saving throw, or on its next turn, it can do only one of the following: move or take an action
      or a Bonus Action.</p>'
