_id: dNLdo1ja6dwyPNSb
name: Cheap Shot
type: feat
img: icons/skills/melee/strike-dagger-white-orange.webp
system:
  description:
    value: <p>You don’t play fair, and you know how to strike an opponent when and where they least expect it. Once per turn, you can deal an extra 1d6 damage to one creature you hit with an attack roll
      if you have Advantage on the roll and the attack uses a Finesse or Ranged weapon. The extra damage type is the same as the weapon’s type.</p><p>You don’t need Advantage on the attack roll if at least
      one of your allies is within 5 feet of the target, the ally doesn’t have the Incapacitated condition, and you don’t have Disadvantage on the attack roll.</p><p>The extra damage increases as you gain
      Scoundrel levels, as shown in the Cheap Shot column of the Scoundrel Features table.</p>
