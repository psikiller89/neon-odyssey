name: Specialized Supply
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>Your skill with chemicals yields potent formulas that adapt to any victim’s defenses or provide critical intervention for your allies. You gain the following benefits, provided you have a
      Toxin Kit on your person.</p><p><strong>Emergency Stim.</strong> When a creature you can see within 30 feet of yourself is reduced to 0 Hit Points but not killed outright, you can take a Reaction
      to expend an unstable compound and cause the target to be reduced to 1 Hit Point instead.</p><p><strong>Tailored Cocktail.</strong> Your Poison damage now ignores a target’s Resistance, and when you
      cause the Poisoned condition, it ignores a target’s Immunity to that condition.</p><p><strong>Unstable Adaptation.</strong> When you deal Poison damage, you can change the damage type to Acid, Necrotic,
      or Psychic.</p>
