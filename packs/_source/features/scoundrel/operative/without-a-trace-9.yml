  description:
    value: <p>You strike without warning, using the art of uncertainty as the perfect distraction to slip away.</p><p>If you deal Cheap Shot damage on your turn, at the end of the turn, you can make a Dexterity
      (Stealth) check as if you took the Hide action, even if an enemy can see you (you must meet all other requirements to hide). You can use this feature a number of times equal to your Dexterity modifier
      (minimum of once), and you regain all expended uses when you finish a Long Rest.</p>
