_id: 7dySPfrTjkqbqLM7
name: Contingency Plan
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: '<p>You never go into a high-risk situation without a contingency plan and always have the right gadget to finish the job. During your turn, you can enact one of the contingencies described below.
      Although the options duplicate spells, the effects aren’t magical but are a product of your equipment or training. <strong>Anticipated Tactics.</strong> At the start of your turn, you can enact drills
      and plans that perfectly fit the current situation (no action required). You gain the effect of the <em>Foresight</em> spell until the end of your next turn. <strong>Exit Strategy.</strong> You never
      know when you need to be elsewhere in a hurry. As a Bonus Action, you gain the effect of the <em>Mislead</em> spell for 1 hour, requiring no spell components or Concentration (you can end the spell
      at any time, no action required). You must have a Holoprojector on your person to use this contingency. <strong>The Best Defense.</strong> You enact an emergency offensive. As a Bonus Action, you
      set off a device that creates one of the following spell effects of your choice: <em>Chain Lightning</em>, <em>Cloudkill </em>(1 minute with no Concentration; the cloud is stationary), <em>Cone of
      Cold</em>, <em>Fireball</em>, or <em>Psychic Storm</em>* (save DC equals 8 plus your Dexterity modifier and Proficiency Bonus). You must have a Ranged weapon or a Grenade on your person to use this
      contingency. Once you use this feature, you can’t do so again until you finish a Long Rest.</p>'
