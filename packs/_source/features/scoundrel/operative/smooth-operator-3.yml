name: Smooth Operator
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>Your skills can see you through any covert assignment, granting you the following benefits.</p><p><strong>Grace Under Pressure.</strong> When a creature you can see succeeds on a Wisdom (Perception)
      check to find you, or when you fail a Charisma (Deception or Persuasion) check, you can roll a d20 and force the ability check to use the new number instead of the original d20 roll. Once you use
      this benefit, you can’t use it again until you finish a Short or Long Rest.</p><p><strong>One Shot, One Kill.</strong> You can apply a specialized technique when you hit or miss a creature with an
      attack roll using a weapon or an Unarmed Strike. On a hit, you can activate the Sap mastery property in addition to a different mastery property you’re using with that weapon. On a miss, you can activate
      the Graze mastery property. You can use this benefit a number of times equal to your Dexterity modifier (minimum of once). You regain one expended use when you finish a Short Rest, and you regain
      all expended uses when you finish a Long Rest.</p><p><strong>Overwatch.</strong> You add your Proficiency Bonus to Initiative rolls.</p>
