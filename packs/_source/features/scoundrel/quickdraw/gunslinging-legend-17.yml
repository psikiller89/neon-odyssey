  description:
    value: <p>Tall tales of your shooting skills are told in saloons across the galaxy. You gain the following benefits.</p><p><strong>Deadshot.</strong> Once on each of your turns when you reduce a creature
      to 0 Hit Points with an attack made with a Ranged weapon, you can immediately make another attack with the same weapon against a different creature. If this attack hits, you also deal half your Cheap
      Shot damage to the target.</p><p><strong>Run for Cover.</strong> When you use your Lucky Break feature, you can move up to half your Speed without provoking Opportunity Attacks as part of the same
      Reaction.</p>
