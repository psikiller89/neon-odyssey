name: Heads Down
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You are prepared for gunfights and shootouts to keep your enemies pinned down. When you hit a creature with an attack roll, you can force the target to make a Wisdom saving throw against your
      Dirty Trick save DC. On a failed save, the target has Disadvantage on attack rolls and ability checks until the start of your next turn.</p><p>You can use this feature a number of times equal to your
      Dexterity modifier (minimum of once), and you regain all expended uses when you finish a Long Rest.</p>
