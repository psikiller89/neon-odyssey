name: Deadeye
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>Your gunslinging skills allow you to outdraw your opponent and hit your mark. You gain the following benefits.</p><p><strong>Bullseye.</strong> When you make an attack roll and roll an 18
      or 19 on the d20, you can cause the attack to score a Critical Hit. You can use this benefit a number of times equal to your Dexterity modifier (minimum of once), and you regain all expended uses
      when you finish a Long Rest.</p><p><strong>One Eye Open.</strong> You have Advantage on Initiative rolls.</p><p><strong>Shoot First.</strong> When you roll Initiative, if you can see an enemy, you
      can take a Reaction to make one attack with a Ranged weapon that lacks the Heavy and Two-Handed properties. If your Initiative is higher than your target’s, you have Advantage on the attack roll.
      Once you use this feature, you can’t use it again until you finish a Short or Long Rest.</p>
