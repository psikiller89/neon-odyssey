name: Trick Shot
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: '<p>You’ve learned how to wield a firearm with startling finesse. The following are now Dirty Trick options for you:</p><p><strong>Drop It (Cost: 2d6).</strong> When you deal Cheap Shot damage
      with a Ranged weapon, the target must succeed on a Constitution saving throw or drop one item of your choice it is holding. The object lands at the creature’s feet in its space.</p><p><strong>Fan
      the Hammer (Cost: 1d6).</strong> When you deal Cheap Shot damage with a Ranged weapon, you can target a second creature you can see within 30 feet of the first creature. Roll half the number of Cheap
      Shot damage dice for your level (round up), and the second creature takes damage of the weapon’s type equal to the roll’s total.</p>'
