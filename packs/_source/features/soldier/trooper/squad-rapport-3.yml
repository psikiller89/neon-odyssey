  description:
    value: '<p>You and your allies fight as an organized unit. You gain the following benefits.</p><p><strong>Facilitator.</strong> You can take the Help action as a Bonus Action. When you use the Assist
      an Ability Check option, you can apply your Tactical Discipline feature to the roll. When you use the Assist an Attack Roll option, the enemy you distract can be within 30 feet of you.</p><p><strong>Negotiator.</strong>
      You gain proficiency in one of the following skills of your choice: Deception, Insight, Intimidation, or Persuasion.</p>'
