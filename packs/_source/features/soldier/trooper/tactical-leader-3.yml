_id: Oo6dQPnPOQIGoxzy
name: Tactical Leader
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You can lead your team through battle and other high-pressure situations. You teach them tactics that are fueled by special dice called Tactical Dice. You can choose yourself as a target of
      tactics.</p><p>You have four Tactical Dice, which are d6s. You regain all expended Tactical Dice when you finish a Short or Long Rest.</p><p>You gain an additional Tactical Die when you reach Soldier
      levels 7 (five dice total) and 15 (six dice total).</p><p><strong>Advance.</strong> As a Bonus Action, you can expend one Tactical Die to choose one ally within 30 feet of yourself that can see or
      hear you. The chosen creature can take a Reaction to move up to its Speed, gaining your Tactical Die as a bonus to its AC against Opportunity Attacks until the end of the turn. If a creature makes
      an Opportunity Attack against your target and misses, attack rolls against that creature have Advantage until the end of your next turn.</p><p><strong>Focus Fire.</strong> As a Bonus Action, you can
      expend one Tactical Die to choose two allies within 30 feet of yourself that can see or hear you. One target can add your Tactical Die to one attack roll it makes before the end of its next turn.
      The other target can add your Tactical Die to one damage roll it makes before the end of its next turn.</p><p><strong>Hold Position.</strong> As a Bonus Action, you can expend one Tactical Die to
      choose two allies within 30 feet of yourself that are within 5 feet of each other. Each chosen creature that can see or hear you gains Temporary Hit Points equal to two rolls of your Tactical Die.</p><p><strong>Push
      Through.</strong> When you or one of your allies within 30 feet of yourself that can see or hear you makes an ability check that uses a skill proficiency, you can take a Reaction to expend one Tactical
      Die, which the target adds to its roll.</p>
