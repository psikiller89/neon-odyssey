_id: 8nDjzLgpYu5AaFtk
name: Tactical Commander
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>Your tactical mind becomes sharper. Your Tactical Die increases to a d8, and you gain the following tactics.</p><p><strong>Bombard.</strong> As a Bonus Action, you can expend one Tactical
      Die to choose two allies within 60 feet of yourself that can see or hear you. One target can add a roll of your Tactical Die to one attack roll it makes before the start of your next turn. When another
      target forces creatures to make a Dexterity saving throw before the start of your next turn, one of the creatures subtracts a roll of your Tactical Die from the total.</p><p><strong>Secure the Area.</strong>
      As a Bonus Action or when you roll Initiative, you can expend one Tactical Die to choose two allies within 30 feet of yourself and enhance their tactics for 1 minute. For the duration, one target
      adds a roll of your Tactical Die to ability checks it makes for the Search action and gains Blindsight with a range of 10 feet, and another target can choose to add a roll of your Tactical Die to
      Initiative rolls and Dexterity saving throws.</p>
