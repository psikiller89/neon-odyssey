_id: vC9DrV56YKmuq6ia
name: Specialized Chassis
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>Your exosuit is a weapon of war built to excel at battle up close or at a distance. Select one of the three chassis options below to determine what kind of exosuit you have. You can change
      your selection when you finish a Long Rest.</p><p><strong>Bastion.</strong> Your exosuit is a stalwart defender built to hold the line. You have the following benefits while piloting it. <strong>Evasion
      Circuits.</strong> You can take the Dodge action as a Bonus Action. You can use this benefit a number of times equal to your Strength or Dexterity modifier (choose the ability when you select this
      chassis), and you regain all expended uses when you finish a Long Rest. <strong>Threat Attractor.</strong> When you hit a creature with an attack roll, you can mark it until the start of your next
      turn, or until you mark another creature. The marked target has Disadvantage on attack rolls against a target other than you.</p><p><strong>Comet.</strong> Your exosuit is optimized for speed and
      defeating the enemy in close combat. You have the following benefits while piloting it. <strong>Meteor Matrix.</strong> Your attack rolls with installed Melee weapons score a Critical Hit on a roll
      of 19 or 20 on the d20. <strong>Momentum Amplifier.</strong> Once on each of your turns when you hit with an installed melee weapon or an Unarmed Strike, you can deal an extra 1d8 Force damage. The
      extra damage increases to 2d8 when you reach Soldier level 10. <strong>Rocket Booster.</strong> Your Speed increases by 10 feet.</p><p><strong>Mortar.</strong> Your exosuit is outfitted with a robust
      arsenal to launch artillery fire from range. You have the following benefits while piloting it. <strong>Plasma Battery.</strong> Once on each of your turns when you hit with an installed ranged weapon,
      you can deal 1d8 Lightning damage to another target within 15 feet of the first and that isn’t behind Total Cover. When you reach Soldier level 10, the extra damage increases to 2d8. <strong>Targeting
      Array.</strong> Attacking at long range doesn’t impose Disadvantage on your attack rolls with installed Ranged weapons.</p>
