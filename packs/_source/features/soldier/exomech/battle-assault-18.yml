name: Battle Assault
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You push your exosuit beyond its limits, overheating it as you unleash an all-out assault. As a Bonus Action while piloting your exosuit, you can overcharge your weapons and unleash everything
      you’ve got. Until the end of the turn, when you hit with an attack roll, you deal maximum damage with that attack. At the end of your turn, you gain 4 Exhaustion levels. Exhaustion gained in this
      way vanishes at the end of your next turn, or if you expend a use of Frontline Rally (no action required). Once you use this feature, you can’t use it again until you finish a Long Rest.</p>
