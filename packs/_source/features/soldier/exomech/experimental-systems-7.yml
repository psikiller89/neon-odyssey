name: Experimental Systems
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You discover new system enhancements to make your exosuit deadlier. You can use one of the options below based on your exosuit’s chassis. You can use this feature a number of times equal to
      your Strength or Dexterity modifier (your choice), and you regain all expended uses when you finish a Long Rest.</p><p><strong>Bastion.</strong> When you use Evasion Circuits, you can project a defensive
      screen in a 10-foot Emanation originating from you until the start of your next turn. You and your allies in that area have Half Cover.</p><p><strong>Comet.</strong> As a Bonus Action, you can move
      up to your Speed without provoking Opportunity Attacks. If you then hit a creature with a melee weapon attack or an Unarmed Strike before the end of your turn, you can activate the Push or Topple
      mastery property, in addition to another mastery property you’re using.</p><p><strong>Mortar.</strong> When you take the Attack action on your turn, you can replace one attack with a spread of micro
      rockets. Each creature in a 30-foot Cone makes a Dexterity saving throw (DC 8 plus your Strength or Dexterity modifier [your choice] and Proficiency Bonus), taking 4d6 Fire damage on a failed save
      or half as much damage on a successful one.</p>
