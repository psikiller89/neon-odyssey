name: Perfected Exosuit
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You have perfected the design of your exosuit, granting you one of the following benefits based on your exosuit’s chassis.</p><p><strong>Bastion.</strong> You have Resistance to damage dealt
      by a target marked by your Threat Attractor.</p><p><strong>Comet.</strong> When you take the Dash action you also take the Disengage action, and until the end of the turn, you can move through an
      enemy’s space as if it were Difficult Terrain.</p><p><strong>Mortar.</strong> When you hit with an attack roll, you can cause it to be a Critical Hit. Once you use this benefit, you can’t use it again
      until you finish a Short or Long Rest.</p>
