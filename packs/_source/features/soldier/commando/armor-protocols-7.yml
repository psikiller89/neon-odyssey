system:
  description:
    value: <p>You suit up with even more advanced armor. While wearing a set of Light, Medium, or Heavy armor registered to your Loadout, you gain the following benefits.</p><p><strong>Energy Shield.</strong>
      Whenever you don this armor or finish a Short or Long Rest, you gain Temporary Hit Points equal to 1d8 + half your Soldier level (round up).</p><p><strong>Power-Assist Servos.</strong> Your carrying
      capacity and jump distance are doubled.</p><p><strong>Sonic Dampeners.</strong> The armor doesn’t impose Disadvantage on Dexterity (Stealth) checks.</p>
