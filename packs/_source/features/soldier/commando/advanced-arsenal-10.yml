system:
  description:
    value: <p>You have the biggest and the best weapons. The options of your Weapon Protocols feature improve, as detailed below. <strong>Plasma Charge.</strong> The movement from this option no longer
      provokes Opportunity Attacks, and the damage increases to 2d8.</p><p><strong>Resolve Breaker.</strong> On a hit, the target takes an extra 1d8 Force damage, and the die it must subtract from a roll
      increases to 1d8.</p><p><strong>Rocket Launch.</strong> The rocket now creates a 15-foot-radius Sphere, and the damage increases to 3d6.</p><p><strong>Suppressive Fire.</strong> The size of the Cube
      increases to 20 feet, and the damage increases to 1d10.</p>
