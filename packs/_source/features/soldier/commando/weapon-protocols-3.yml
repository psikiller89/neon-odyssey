_id: ImBJJGUDySn0OwsB
name: Weapon Protocols
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>Your Hypergrid armory can modify your weapons in an instant for the situation at hand. While you’re holding a weapon registered to your Loadout, as a Bonus Action or in place of an attack
      when you take the Attack action on your turn, you can use one of the options below. The Commando Weapon Protocols table shows the number of uses you have when you reach certain Soldier levels. 2 3
      4 5 6 You regain all expended uses when you finish a Short or Long Rest.</p><p><strong>Plasma Charge.</strong> Move up to half your Speed. Once during this movement, if you move within 5 feet of a
      creature you can deal Lightning damage equal to 1d8 plus your Strength or Dexterity modifier (your choice) to the target.</p><p><strong>Resolve Breaker.</strong> Make an attack with the weapon. On
      a hit, the target takes the weapon’s normal damage and must subtract 1d6 from the next attack roll or saving throw it makes before the end of your next turn.</p><p><strong>Rocket Launch.</strong>
      You launch an explosive at a point you can see within 120 feet of yourself. Each creature in a 5-footradius Sphere centered on that point makes a Dexterity saving throw (DC 8 plus your Strength or
      Dexterity modifier [your choice] and Proficiency Bonus), taking 2d6 Fire damage on a failed save or half as much damage on a successful one.</p><p><strong>Suppressive Fire.</strong> You unleash a
      rapid burst of plasma in a 10-foot Cube centered on a point you can see within 120 feet of yourself. The Cube lasts until the start of your next turn. Each creature in that area has Disadvantage on
      attack rolls. When a creature enters the area, or moves within it, the creature takes 1d8 Lightning damage for every 5 feet it moves.</p>
