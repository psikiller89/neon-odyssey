name: Loadout
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You store your arsenal in a digital armory. You can register your gear to a Hypergrid armory and quickly store or retrieve that gear.</p><p>When you finish a Short or Long Rest, you can register
      a loadout consisting of up to three items you touch, each of which can be a set of armor, a weapon, or a Shield. This registration fails if another creature is wearing or carrying the item, another
      Soldier has already registered it, or if an item is a magic item to which someone else is attuned. If you register an item beyond your maximum, you must unregister one of the others, which appears
      at your feet in your space. You also can unregister an item as a Bonus Action.</p><p>As a Bonus Action, you can digitize a registered item and send it into Hypergrid storage, or you can summon one
      from storage. If you summon armor, you can don it instantly if you aren’t wearing armor, and if you summon a weapon, it appears in a free hand. Otherwise, a summoned object appears at your feet in
      your space.</p><p>Additionally, if you unequip a weapon on your turn, you can equip a different weapon as part of the same action or attack if you equip a registered weapon.</p><p>The maximum number
      of items you can have registered at once increases when you reach Soldier levels 7 (four items), 10 (five items), 15 (six items), and 18 (seven items).</p>
