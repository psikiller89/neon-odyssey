  description:
    value: <p>As a terror on the battlefield, you bring the fight to the enemy. You gain the following benefits.</p><p><strong>Glorious Fervor.</strong> When an enemy within 10 feet of you is reduced to
      0 Hit Points, you can take a Reaction to regain one expended use of Weapon Protocols.</p><p><strong>Ignore Pain.</strong> When you activate your Frontline Rally with a Bonus Action, you gain Resistance
      to one damage type of your choice until the start of your next turn.</p><p><strong>Unbreakable.</strong> You have Immunity to the Frightened condition.</p>
