system:
  description:
    value: <p>Battlefield experience has honed your mind to analyze and adapt to any situation both in and out of combat. When you fail an ability check, you can expend a use of your Frontline Rally to
      push yourself toward success. Rather than regaining Hit Points, you roll 1d10 and add the number rolled to the ability check, potentially turning it into a success. If the check still fails, this
      use of Frontline Rally isn’t expended.</p>
