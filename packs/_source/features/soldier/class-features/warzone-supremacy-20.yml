system:
  description:
    value: <p>Your mastery of the battlefield is unmatched, granting you the following benefits.</p><p><strong>Dreadnought.</strong> When you’re hit by an attack roll and take damage, you can take a Reaction
      and expend a use of your Frontline Rally to reduce the damage by 1d10 + your Soldier level. If you reduce the damage to 0, the attack misses you instead.</p><p><strong>Three Extra Attacks.</strong>
      You can attack four times instead of once whenever you take the Attack action on your turn.</p>
