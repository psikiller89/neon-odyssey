name: Battlefield Resuscitation
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>Your nanites can deliver a targeted cocktail of trauma intervention stims and rapidly repair critical damage to resuscitate the recently deceased. You can cast <em>Revivify</em> requiring
      no spell components, using Wisdom as the spellcasting ability. When you cast the spell in this way, you can expend a use of your Adrenaline Rush to modify the spell; its range becomes 60 feet. Once
      you cast the spell using this feature, you can’t do so again until you finish a Long Rest.</p><p>To use this feature, you must have a Pharma Kit on your person.</p>
