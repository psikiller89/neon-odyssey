_id: QPkwuE3FS2uLEaBY
name: Nanite Medicine
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You have a cluster of nanites you can direct to stimulate healing in minor wounds. Your nanites are stored in a container of your choice, which you can replenish using a Pharma Kit when you
      finish a Long Rest. You can use the nanites to restore a total number of Hit Points equal to five times your Soldier level.</p><p>As an action, or in place of an attack when you take the Attack action
      on your turn, you can direct some of your nanites at a creature you can see within 30 feet of yourself and restore a number of Hit Points to that creature, up to the maximum amount remaining in the
      cluster.</p><p>You can also expend 5 Hit Points from the cluster to remove the Poisoned condition from the creature; those points don’t also restore Hit Points to the creature.</p><p>To use this feature,
      you must have a Pharma Kit on your person.</p>
