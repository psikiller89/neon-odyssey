name: Surgical Swarm
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: '<p>Your nanites now have enough power to overcome more ailments, and they can remain with a subject and continue treating their wounds for a short time. You gain the following benefits.</p><p><strong>Cure-All.</strong>
      When you use your Nanite Medicine feature, you can expend 5 Hit Points from the cluster to remove one of the following conditions on the target: Blinded, Deafened, Frightened; those points don’t also
      restore Hit Points to the creature.</p><p><strong>Lingering Nanites.</strong> When you use your Nanite Medicine feature, at the start of the target’s next turn, it can expend and roll one of its Hit
      Point Dice. It regains a number of Hit Points equal to the number rolled.</p><p><strong>Nano-Stim.</strong> When you use your Nanite Medicine feature, you can give the target Temporary Hit Points
      instead of restoring lost Hit Points.</p>'
