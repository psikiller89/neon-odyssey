name: Psi Shaping
type: feat
img: icons/magic/unholy/orb-collecting-energy-green.webp
system:
  description:
    value: <p>You can shape your spells with a single thought; you gain two Psi Shaping options of your choice from “Psi Shaping Options” later in this class’s description. You use the chosen options to
      temporarily modify spells you cast. To use an option, you must spend the number of Psi Points that it costs.</p><p>You can use only one Psi Shaping option on a spell when you cast it unless otherwise
      noted in one of those options.</p><p>Whenever you gain an Esper level, you can replace one of your Psi Shaping options with one you don’t know. You gain two more options at Esper level 10 and two
      more at Esper level 17.</p>
