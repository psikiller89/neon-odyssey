name: Spellcasting
type: feat
img: icons/magic/control/debuff-energy-hold-teal-blue.webp
system:
  description:
    value: '<p>Focusing your psionic power, you can mentally alter reality to cast spells. See the <em>D&amp;D Beyond Basic Rules</em> for the rules on spellcasting. The information below details how you
      use those rules with Esper spells, which appear in the Esper spell list later in the class’s description.</p><p><strong>Spellcasting Ability.</strong> Intelligence or Charisma is your spellcasting
      ability for your Esper spells, chosen as your Primary Ability (see the Core Esper Traits table) when you first select this class. Intelligence represents shaping your magic with mental acuity, while
      Charisma represents your mind creating magic through sheer psychic presence.</p><p><strong>Cantrips.</strong> You know four Esper cantrips of your choice. <em>Befriend</em>*, <em>Prestidigitation</em>,
      <em>Psychic Needle</em>*, and <em>Sorcerous </em> <em>Burst </em>are recommended. Whenever you gain an Esper level, you can replace one of your cantrips from this feature with another Esper cantrip
      of your choice.</p><p>When you reach Esper levels 4 and 10, you learn another Esper cantrip of your choice, as shown in the Cantrips column of the Esper Features table.</p><p><strong>Spell Slots.</strong>
      The Esper Features table shows how many spell slots you have to cast your level 1+ spells. You regain all expended slots when you finish a Long Rest.</p><p><strong>Prepared Spells of Level 1+.</strong>
      You prepare the list of level 1+ spells that are available for you to cast with this feature. To start, choose two level 1 Esper spells. <em>Detect Magic</em> and <em>Magic </em> <em>Missile</em>
      are recommended.</p><p>The number of spells on your list increases as you gain Esper levels, as shown in the Prepared Spells column of the Esper Features table. Whenever that number increases, choose
      additional Esper spells until the number of spells on your list matches the number in the Esper Features table. The chosen spells must be of a level for which you have spell slots. For example, if
      you’re a level 3 Esper, your list of prepared spells can include six Esper spells of level 1 or 2 in any combination.</p><p>If another Esper feature gives you spells that you always have prepared,
      those spells don’t count against the number of spells you can prepare with this feature, but those spells otherwise count as Esper spells for you.</p><p><strong>Changing Your Prepared Spells.</strong>
      Whenever you gain an Esper level, you can replace one spell on your list with another Esper spell for which you have spell slots.</p><p><strong>Psychic Manifestation.</strong> You can use an Occult
      Focus as a Spellcasting Focus for your Esper spells. Alternatively, when you cast an Esper spell, you can forego the spell’s Verbal, Somatic, or Material components, except Material components that
      are consumed by the spell or have a cost specified in the spell. If you do, you must replace each ignored component with a manifestation shown below. If you can&#x27;t create a manifestation (such
      as trying to create a sound in a <em>Silence</em> spell,) the spell fails. Choose from the provided examples or create your own. Creatures that observe these manifestations can discern that you are
      casting a spell. The manifestations last only a few seconds, then fade. If the manifestation creates a physical phenomenon, such as a crack in glass, the effect remains but causes no Hit Point damage
      to objects. <strong>Verbal.</strong> A sound as loud as a clearly spoken phrase: ringing, crackling, buzzing, disembodied voices, phantom music. <strong>Somatic.</strong> Visual phenomena or distortion:
      vibrant color flares around your head or fingers, your eyes turn a uniform color, ripples shimmer around you. <strong>Material.</strong> Nearby objects affected, or physical sensations in observers:
      glass cracks, reflective surfaces tarnish, sudden frost, Tiny objects move or levitate, headaches or minor nosebleeds, prickling across skin, vertigo.</p>'
