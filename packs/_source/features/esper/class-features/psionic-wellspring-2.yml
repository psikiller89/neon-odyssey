name: Psionic Wellspring
type: feat
img: icons/magic/light/hand-sparks-glow-yellow.webp
system:
  description:
    value: <p>Your magic draws from the font of psychic power that flows from your mind. This mental reservoir is represented by Psi Points, which allow you to create a variety of magical effects.</p><p>You
      have 2 Psi Points, and you gain more as you reach higher levels, as shown in the Psi Points column of the Esper Features table. You can’t have more Psi Points than the number shown in the table for
      your level. You regain all expended Psi Points when you finish a Long Rest.</p><p>You can use your Psi Points to fuel the options below, along with other features, such as Psi Shaping, that use those
      points.</p><p><strong>Converting Spell Slots to Psi Points.</strong> You can expend a spell slot to gain a number of Psi Points equal to the slot’s level (no action required).</p><p><strong>Creating
      Spell Slots.</strong> As a Bonus Action, you can transform unexpended Psi Points into one spell slot. The Creating Spell Slots table shows the cost of creating a spell slot of a given level, and it
      lists the minimum Esper level you must be to create a slot. You can create a spell slot no higher than level 5.</p><p>Any spell slot you create with this feature vanishes when you finish a Long Rest.
      2 2 3 3 5 5 6 7 7 9</p>
