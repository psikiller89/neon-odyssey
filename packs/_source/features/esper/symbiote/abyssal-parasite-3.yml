name: Abyssal Parasite
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>Your mind has bonded with a parasitic entity of the Abyssal Void. You can describe how the parasite changes your appearance. This change might become more prominent when you cast spells or
      while you maintain Concentration on a spell. You gain the following benefits.</p><p><strong>Bonded Mind.</strong> When you fail a saving throw to maintain Concentration, you can take a Reaction to
      add 5 to the roll, potentially turning failure into success. You can use this Reaction once and regain the use of it when you cast a spell using a spell slot of level 1+ or when you finish a Long
      Rest.</p><p><strong>Living Carapace.</strong> Your Hit Point maximum increases by 3, and it increases by 1 whenever you gain another Esper level. While you are the target of <em>Mage Armor,</em> you
      gain an additional +2 bonus to AC.</p><p><strong>Symbiotic Shred.</strong> Your parasite grants you natural weapons of psychic energy that you can use to make Unarmed Strikes with a reach of 10 feet.
      You choose the weapons’ appearance. If you hit with this Unarmed Strike and deal damage, you can deal 1d8 Psychic damage plus your Strength modifier instead of the normal damage for an Unarmed Strike.
      You can use your spellcasting ability in place of Strength for attack and damage rolls with your Unarmed Strikes. When you cast a spell that deals damage, your Unarmed Strike can deal damage of the
      same type until the end of your next turn.</p>
