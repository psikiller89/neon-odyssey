_id: NvVOQ1RnC3m70khm
name: Unwound Future
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You can trap your foes somewhere in time and space. When you hit a creature with an attack roll or deal damage to it, you can open a consuming rift in either space or time (your choice). The
      target must succeed on a Charisma saving throw against your spell save DC or suffer the associated effect.</p><p>You can use this feature only once per turn. Once you use it, you can’t do so again
      until you finish a Long Rest unless you spend 9 Psi Points (no action required) to restore your use of it.</p><p><strong>Space.</strong> The target takes 4d10 Force damage and teleports to an unoccupied
      space you can see within 100 feet of it. Its Speed is reduced to 0 until the start of your next turn.</p><p><strong>Time.</strong> The target takes 10d10 Force damage and vanishes into a temporal
      anomaly. At the start of your next turn, it reappears in the space it left or, if that space is occupied, in the nearest unoccupied space. No time passes for the target until it reappears.</p>
