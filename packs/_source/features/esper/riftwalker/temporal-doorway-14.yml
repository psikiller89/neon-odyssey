name: Temporal Doorway
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>Your rifts in spacetime linger. When you teleport using your Rift Walk feature, you can choose to leave persistent rifts in your starting and destination spaces. The rifts remain for 1 minute,
      or until you create more. When a creature enters the space of a rift, it is affected depending on whether it is your ally or your enemy. A creature is affected by the rifts only once per turn.</p><p><strong>Ally.</strong>
      The creature teleports to the other rift, and its Speed increases by 10 feet until the start of its next turn.</p><p><strong>Enemy.</strong> The creature makes a Charisma saving throw against your
      spell save DC. On a failed save, the creature takes 2d10 Force damage, and you can cause it to teleport to the other rift. On a successful save, it takes half as much damage only.</p>
