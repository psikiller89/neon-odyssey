name: Borrowed Time
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You can steal fragments of time and use them to forestall your fate. You can cast <em>Haste</em> or <em>Slow</em> without expending a spell slot, and you must finish a Long Rest before you
      can use this feature again unless you spend 5 Psi Points to restore your use of it. When you use this feature, you gain an additional benefit depending on the spell you cast.</p><p><strong>Haste.</strong>
      While you maintain Concentration on <em>Haste</em>, you gain a +1 bonus to AC. When the spell ends, the target doesn’t suffer lethargy.</p><p><strong>Slow.</strong> You gain 5 Temporary Hit Points
      for each target that fails its initial saving throw against the spell.</p>
