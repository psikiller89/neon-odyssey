name: Shatter Mindscape
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You discover the thought, memory, or emotion needed to fragment a mind. When a creature fails a saving throw against a Divination, Enchantment, or Illusion spell you cast with a spell slot,
      you can give it the Stunned condition. At the end of each of its turns, the target makes a Wisdom saving throw against your spell save DC, ending the condition on itself on a success. After 1 minute,
      it succeeds automatically.</p><p>Once you use this feature, you can’t use it again until you finish a Long Rest unless you spend 5 Psi Points (no action required) to restore your use of it.</p>
