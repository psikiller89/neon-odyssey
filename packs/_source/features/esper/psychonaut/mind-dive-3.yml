name: Mind Dive
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You delve so deep into others’ minds that you can cause them to crack. You gain the following benefits.</p><p><strong>Crack Psyche.</strong> When you deal Psychic damage with a spell, you
      can add your spellcasting ability modifier to the damage dealt to one target.</p><p><strong>Thought Reader.</strong> When you probe a target’s mind with <em>Detect Thoughts</em>, the target doesn’t
      know you tried to read its mind. You can use this benefit a number of times equal to your spellcasting ability modifier (minimum of once), and you regain all expended uses when you finish a Long Rest.</p>
