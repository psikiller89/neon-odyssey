name: Collapse Identity
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You chart your own pathways between mindscapes. You gain the following benefits.</p><p><strong>Ego Death.</strong> As a Magic action, you can force a creature you can see within 60 feet of
      yourself to make a Wisdom saving throw against your spell save DC. On a failed save, the target has the Charmed or Frightened condition (your choice). The target repeats the save at the end of each
      of its turns, ending the effect on itself on a success. After 1 minute, it succeeds automatically.</p><p>You can use this benefit once, and you regain the ability to do so when you finish a Long Rest.</p><p><strong>Persona
      Shift.</strong> If a creature you are in telepathic contact with has the Charmed or Frightened condition, you can take a Magic action to end one of those conditions and immediately use Ego Death,
      restoring an expended use of it to do so if necessary.</p>
