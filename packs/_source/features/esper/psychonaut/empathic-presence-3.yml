name: Empathic Presence
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You voyage through the thoughts, emotions, and memories of others. You gain the following benefits.</p><p><strong>Boundless Broadcast.</strong> The range of your telepathy is now 20 feet times
      your level in this class.</p><p><strong>Fractal Telepathy.</strong> You can initiate telepathic contact with a number of creatures up to your spellcasting ability modifier (minimum of two creatures)
      at one time. You must maintain Concentration to maintain these simultaneous links. While you concentrate, the range at which you can maintain the contact with them increases to 1 mile, and you and
      those creatures have Advantage on Intelligence (Investigation) and Wisdom (Perception) checks.</p>
