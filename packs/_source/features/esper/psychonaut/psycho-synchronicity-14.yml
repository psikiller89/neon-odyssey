_id: 72tGqaM8r4P0Hvaj
name: Psycho-Synchronicity
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>The power of your telepathy allows you to borrow the senses of other minds you contact and channel your magic through that connection. As a Bonus Action, choose one creature you are in telepathic
      contact with; you can see and hear using their senses until the start of your next turn. During this time, when you cast a Divination, Enchantment, or Illusion spell, you can transfer the spell through
      the telepathic link. The creature you are in telepathic contact with makes an Intelligence saving throw. On a failed save, you cast the spell from that creature’s space as if you were in it, and then
      your telepathic contact with that creature ends. On a successful save, the spell fails (if it was cast with a spell slot, the slot isn’t expended).</p>
