_id: Pw3rv9vhdc1ppezf
name: Go Nuclear
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You become a living bomb of psionic annihilation. As a Magic action, you create a 30-foot Emanation originating from yourself that lasts for 1 minute. Each creature that enters the Emanation
      for the first time on a turn (including when the Emanation appears) or that starts its turn there makes a Constitution saving throw against your spell save DC. On a failed save, the target takes 1d10
      Force damage and is pushed up to 10 feet in a horizontal direction of your choice. On a successful save, the target takes half as much damage only. The Emanation ends early if you dismiss it (no action
      required) or have the Incapacitated condition.</p><p>Once you use this feature, you can’t use it again until you finish a Long Rest unless you spend 5 Psi Points (no action required) to restore your
      use of it.</p>
