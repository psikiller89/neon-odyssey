name: Volatile Mind
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>Your psionics are explosive and unmaking. You gain the following benefits.</p><p><strong>Blast Radius.</strong> While your Unbound Psyche feature is active, your <em>Disruption</em> cantrip
      has a range of 120 feet.</p><p><strong>Destructive Psi.</strong> When you deal Force damage with a spell, you deal extra Force damage equal to your spellcasting ability modifier to one of the spell’s
      targets. Additionally, you can spend 1 Psi Point to choose another creature within 20 feet of a target that took Force damage. The chosen creature takes 1d10 Force damage.</p><p><strong>Violent Telekinesis.</strong>
      You can cast and control <em>Mage Hand</em> as a Bonus Action, and the maximum weight it can carry is 10 pounds times your Proficiency Bonus.</p>
