name: Secure and Contain
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>Your occultech weapon is perfected to initiate containment protocols against the unexplained. When you use your occultech weapon as a Spellcasting Focus to cast a level 1+ spell with a casting
      time of an action, you can use your Bonus Action to make one attack with the weapon.</p><p>If the attack hits a creature and the target is Bloodied after taking damage, you can force it to make a
      Constitution saving throw against your spell save DC. On a failure, it has the Incapacitated condition until the start of your next turn.</p>
