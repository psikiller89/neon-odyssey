name: Esoteric Revelation
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You unlock deeper secrets of your occultech, granting you the following benefits.</p><p><strong>Aberrant Countermeasures.</strong> When you cast a spell that allows you to choose one or more
      creature types to affect with the spell, you add Aberrations to the options you can choose.</p><p><strong>Occult Scouring.</strong> Once per turn when you hit with an attack roll using your occultech
      weapon, you can deal an extra 1d8 Psychic damage.</p><p><strong>Unsealed Secrets.</strong> Choose a level 2 spell from the Cryptist spell list such as <em>Misty Step</em>; you always have that spell
      prepared. While you are holding your occultech weapon, you can cast that spell once without a spell slot, and you regain the ability to do so when you finish a Long Rest.</p>
