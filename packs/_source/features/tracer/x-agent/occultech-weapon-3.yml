name: Occultech Weapon
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You have access to esoteric, alien, or occult technology. When you finish a Long Rest, you can integrate this strange technology into a weapon to create an occultech weapon. If you make an
      occultech weapon while you already have one, the first weapon is no longer an occultech weapon. Your occultech weapon gains the following benefits.</p><p><strong>Occult Round.</strong> Choose a level
      1 spell from the Cryptist spell list such as <em>Withering Lightning</em>*; you always have that spell prepared. While you are holding the weapon, you can cast that spell once without a spell slot,
      and you regain the ability to do so when you finish a Long Rest.</p><p><strong>Uncanny Intrusion.</strong> When you hit with an attack roll using the occultech weapon, you can cause it to deal Psychic
      damage instead of the normal damage type.</p>
