name: Gritty Interrogation
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You know the right words to tip an interaction in your favor. As an Influence action, you can make a Charisma (Intimidation or Persuasion) check against a creature within 60 feet of you that
      can hear you. The creature makes a Wisdom saving throw against a DC equal to your check’s total. On a failed save, the target has the Charmed or Frightened condition (your choice) for 1 minute. The
      target repeats the save at the end of each of its turns, ending the effect on itself on a success. The Charmed condition ends early if you damage the target.</p><p>Once you use this feature on a creature,
      you can’t use it on that creature again until you finish a Long Rest.</p>
