name: Split-Second Read
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>Your keen senses push you to your limits when your life is on the line. When you miss with an attack roll or fail a Dexterity saving throw, you can take a Reaction to add a bonus to the roll
      equal to your Wisdom modifier (minimum of +1), potentially turning the miss into a hit or the failure into a success.</p><p>You can use this feature a number of times equal to your Wisdom modifier
      (minimum of once). You regain one expended use when you finish a Short Rest, and you regain all expended uses when you finish a Long Rest.</p>
