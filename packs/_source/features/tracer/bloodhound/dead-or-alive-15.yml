_id: 2yrJOzjekZTWltnd
name: Dead or Alive
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>When your quarry is in your sights, you strike to end the hunt. You gain the following benefits.</p><p><strong>Bring ‘Em In.</strong> When you hit a creature with an attack roll, you can force
      it to make a Wisdom saving throw against your spell save DC. On a failed save, the target has the Incapacitated condition until the start of your next turn. Once you use this benefit, you can’t use
      it again until you finish a Short or Long Rest unless you expend a level 4+ spell slot (no action required) to restore your use of it.</p><p><strong>Dogged Pursuit.</strong> Once on your turn, when
      you move your <em>Hunter’s Mark</em> to a new creature, you can do so without using a Bonus Action.</p>
