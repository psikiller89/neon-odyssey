name: Streetwise Wits
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>Your eyes, mind, and tongue are quick, even in the heat of battle. As a Bonus Action, you can take the Influence, Search, or Study actions.</p><p>You can take the Search action to scrutinize
      a creature you can see within 60 feet of yourself. Make a DC 15 Wisdom (Insight) check. On a success, in addition to anything you learn about the creature, for 1 minute, the first attack roll you
      make against the target on your turn has Advantage. This sense ends early if you scrutinize another creature.</p>
