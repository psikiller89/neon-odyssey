name: Mark II Armor
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: '<p>You make substantive upgrades to your Power Armor designs, gaining the following benefits.</p><p><strong>Expanded Systems.</strong> You create and install one of the following pieces of outrunning
      gear into your armor (ignoring its weight): Flamethrower (refuels when you finish a Long Rest), Grenade Launcher (with one Frag Grenade, which replenishes when you finish a Long Rest), High Power
      Communicator (provides its own power), or Night Vision Goggles (provides its own power).</p><p>The gear can’t be removed from the armor, but you can change the selection when you finish a Short or
      Long Rest. The gear vanishes if the armor stops being your Power Armor.</p><p><strong>Flight Jets.</strong> You build flight systems into your armor. As a Bonus Action while wearing your Power Armor,
      you gain a Fly Speed equal to your Speed for 1 minute or until you remove the armor.</p><p>You can use this Bonus Action a number of times equal to your Wisdom modifier (minimum of once), and you
      regain all expended uses when you finish a Long Rest.</p>'
