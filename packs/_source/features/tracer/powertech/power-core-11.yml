system:
  description:
    value: <p>You add power reserves to your Power Armor that activate when needed, granting you the following benefits while wearing the armor.</p><p><strong>Ammo Reserves.</strong> Your integrated weapon
      now creates its own ammunition. Created ammunition vanishes immediately after it hits or misses.</p><p><strong>Capacitor Spike.</strong> When you roll Initiative, if you have fewer than two uses remaining
      for the Charge Burst benefit of your Hunter’s Arsenal feature, you regain expended uses until you have two.</p><p><strong>Stim Jolt.</strong> When you fail a saving throw, you can take a Reaction
      to succeed on the save instead. Once you use this benefit, you can’t do so again until you finish a Short or Long Rest.</p>
