name: Power Armor
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: '<p>You have fused primordial and technological power into armor that becomes a second skin. As a Magic action while you have Mechanic’s Tools in hand, you can turn a suit of armor you are wearing
      into Power Armor. The armor continues to be Power Armor until you don another suit of armor or if you die.</p><p>You gain the following benefits while wearing your Power Armor.</p><p><strong>Hypertech
      Upgrades.</strong> You can use your Power Armor as a Spellcasting Focus for your Tracer spells. When you do so, a spell lacks a <em>V</em> component and gains an <em>M</em> component.</p><p><strong>Second
      Skin.</strong> If the armor normally has a Strength requirement, the Power Armor lacks this requirement for you. Additionally, it doesn’t count as Heavy armor for your OmniTraversal feature.</p><p><strong>Swift
      Suit-Up.</strong> You can don or doff the armor as a Utilize action. The armor can’t be removed against your will.</p><p><strong>Utility Attachments.</strong> You create and install one of the following
      pieces of outrunning gear into your armor (ignoring its weight), and you can take the Utilize action with it as a Bonus Action: Ascension Gun, Bypass Tools (you have proficiency with it), Climbing
      Gear, Macro Scope (affects your Hunter’s Arsenal, see below, regardless of the scope’s properties), or Med Pack (replenishes 1d6 uses when you finish a Long Rest).</p><p>The gear can’t be removed
      from the armor, but you can change the selection when you finish a Short or Long Rest. The gear vanishes if the armor stops being your Power Armor.</p>'
