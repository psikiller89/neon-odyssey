name: Mark III Armor
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You have developed the ultimate upgrades to your Power Armor and gain the following benefits.</p><p><strong>Overcharged Pulse.</strong> On a hit, your Charge Burst Bonus Action attack now
      deals 2d8 Force damage on a hit, and you add Topple to the mastery property options you can activate on a hit.</p><p><strong>Reinforced Plating.</strong> While wearing your Power Armor, it provides
      the <em>M</em> component when you cast <em>Stoneskin</em>. You can also cast it once without a spell slot, and you regain the ability to cast it in this way when you finish a Long Rest.</p><p>Whenever
      you start casting the spell while wearing your Power Armor, you can modify it so that it doesn’t require Concentration. If you do so, the spell’s duration becomes 1 minute for that casting, and you
      gain Resistance to Radiant damage for the duration.</p>
