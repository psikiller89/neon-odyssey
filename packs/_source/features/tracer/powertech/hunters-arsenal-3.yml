name: Hunter’s Arsenal
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>Your Power Armor is outfitted with built-in weapon systems, granting the following benefits.</p><p><strong>Arsenal System.</strong> While wearing your Power Armor, you can activate or deactivate
      your armor’s arsenal system whenever you can draw or stow a weapon. While active, you can use your armor’s arsenal system as a Martial Melee or Ranged weapon with the Finesse property, a reach of
      5 feet, and a range of 100/300 feet. On a hit, the weapon deals 1d8 Force damage plus your ability modifier.</p><p><strong>Charge Burst. </strong>As a Bonus Action while your arsenal system is activated,
      you can make one attack with it, and on a hit, you can activate the Push or Sap mastery property. You can use this Bonus Action a number of times equal to your Wisdom modifier (minimum of twice),
      and you regain all expended uses when you finish a Short or Long Rest.</p><p><strong>Integrated Weapon.</strong> Using Mechanic’s Tools, when you finish a Short or Long Rest, you can integrate (or
      remove) a Melee or Ranged weapon into your Power Armor, causing the weapon to vanish. The weapon reappears in the armor’s space when the weapon is removed or when the armor is no longer your Power
      Armor. You can have one weapon integrated into the armor at a time, and you can’t drop the integrated weapon.</p><p>While your arsenal system is active, the gauntlet and forearm of one of the armor’s
      arms transform into your integrated weapon, and you can attack with your integrated weapon normally. Your hand inside the weapon can’t hold or manipulate other objects.</p>
