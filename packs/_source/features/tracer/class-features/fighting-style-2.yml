system:
  description:
    value: '<p>You gain a Fighting Style feat of your choice (see the <em>D&amp;D </em> <em>Beyond Basic Rules</em> for these feats). Instead of choosing one of those feats, you can choose one of the options
      below.</p><p><strong>Primal Hunter.</strong> You learn two Primalist cantrips of your choice (see the Primalist class’s section for a list of Primalist spells). <em>Guidance</em> and <em>Starry Wisp</em>
      are recommended. The chosen cantrips count as Tracer spells for you, and Wisdom is your spellcasting ability for them. Whenever you gain a Tracer level, you can replace one of these cantrips with
      another Primalist cantrip.</p><p><strong>Urban Hunter.</strong> You gain proficiency in two skills of your choice from the following: Acrobatics, Deception, Intimidation, or Persuasion.</p>'
