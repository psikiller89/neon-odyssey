name: Inescapable Hunt
type: feat
img: icons/skills/targeting/crosshair-triple-strike-orange.webp
system:
  description:
    value: <p>Your primal connection pushes your hunter’s instinct to its apex, granting the following benefits.</p><p><strong>Amplified Instincts.</strong> When you hit a creature with an attack roll,
      you can cast <em>Hunter’s Mark</em> on it as part of the attack and can ignore the spell’s normal range. Once you use this benefit, you can’t use it again until you finish a Long Rest.</p><p><strong>Apex
      Predator.</strong> When you use your Hunter’s Ferocity feature to modify your <em>Hunter’s Mark</em> spell, you can make the spell’s duration permanent instead. The spell ends immediately if you or
      the target die or if you make another <em>Hunter’s Mark</em> permanent.</p>
