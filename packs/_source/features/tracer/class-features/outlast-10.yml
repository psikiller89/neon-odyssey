system:
  description:
    value: <p>You can draw upon your primordial connection to the hunt to shake off injury and fatigue to keep going. You gain the following benefits.</p><p><strong>Hunt Hardened.</strong> As a Magic action,
      you can give yourself a number of Temporary Hit Point equal to 1d8 plus your Wisdom modifier (minimum of 1). You can use this action a number of times equal to your Wisdom modifier (minimum of once),
      and you regain all expended uses when you finish a Long Rest.</p><p><strong>Tireless Pursuit.</strong> Whenever you finish a Short Rest, your Exhaustion level, if any, decreases by 1.</p>
