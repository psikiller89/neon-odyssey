name: Spellcasting
type: feat
img: icons/magic/symbols/arrowhead-green.webp
system:
  description:
    value: <p>Through your instinctive connection to the primordial aspect of the hunter or through hypertech, you have learned to cast spells. See the <em>D&amp;D Beyond Basic Rules</em> for the rules
      on spellcasting. The information below details how you use those rules with Tracer spells, which appear in the Tracer spell list later in the class’s description.</p><p><strong>Spell Slots.</strong>
      The Tracer Features table shows how many spell slots you have to cast your level 1+ spells. You regain all expended slots when you finish a Long Rest.</p><p><strong>Prepared Spells of Level 1+.</strong>
      You prepare the list of level 1+ spells that are available for you to cast with this feature. To start, choose two level 1 Tracer spells. <em>Cure Wounds</em> and <em>Ensnaring Strike</em> are recommended.</p><p>The
      number of spells on your list increases as you gain Tracer levels, as shown in the Prepared Spells column of the Tracer Features table. Whenever that number increases, choose additional Tracer spells
      until the number of spells on your list matches the number in the Tracer Features table. The chosen spells must be of a level for which you have spell slots. For example, if you’re a level 5 Tracer,
      your list of prepared spells can include six Tracer spells of level 1 or 2 in any combination.</p><p>If another Tracer feature gives you spells that you always have prepared, those spells don’t count
      against the number of spells you can prepare with this feature, but those spells otherwise count as Tracer spells for you.</p><p><strong>Changing Your Prepared Spells.</strong> Whenever you finish
      a Long Rest, you can replace one spell on your list with another Tracer spell for which you have spell slots.</p><p><strong>Spellcasting Ability.</strong> Wisdom is your spellcasting ability for your
      Tracer spells.</p><p><strong>Spellcasting Focus.</strong> You can use a Primal Focus, a Hypertech Component Pack, or a Simple or Martial weapon as a Spellcasting Focus for your Tracer spells.</p>
