_id: OMnorU8C9VhLWGiR
name: Protosaur Packmate
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: '<p>You have a mystical bond with a primeval protosaur to aid you in your hunts. Choose its stat block from the following protosaur options: Bonestomper, Bloodripper, or Skyterror. Choose its
      size from those noted in its stat block. You also determine the kind of dinosaur or prehistoric reptile it is, choosing a kind appropriate for the stat block. Whatever dinosaur you choose, it bears
      luminous markings indicating its supernatural origin.</p><p>The protosaur is Friendly to you and your allies and obeys your commands. It vanishes if you die.</p><p><strong>The Protosaur in Combat.</strong>
      In combat, the protosaur acts during your turn. It can move and use its Reaction on its own, but the only action it takes is the Dodge action unless you take a Bonus Action to command it to take an
      action in its stat block or some other action. You can also sacrifice one of your attacks when you take the Attack action to command the protosaur to take the Proto Strike action. If you have the
      Incapacitated condition, the protosaur acts on its own and isn’t limited to the Dodge action.</p><p><strong>Restoring or Replacing the Protosaur.</strong> If the protosaur has died within the last
      hour, you can take a Magic action to touch it and expend a spell slot. The protosaur returns to life after 1 minute with all its Hit Points restored.</p><p>Whenever you finish a Long Rest, you can
      summon a different protosaur, which appears in an unoccupied space within 5 feet of you. You choose its stat block and appearance. If you already have a protosaur from this feature, the old one vanishes
      when the new one appears.</p><ul><li><p><strong>Traits Actions</strong></p></li><li><p><strong>Traits Actions</strong></p></li><li><p><strong>Traits Actions</strong></p></li></ul>'
