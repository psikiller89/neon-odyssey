name: Hunt as One
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You hunt with your packmate in perfect sync. When you hit a creature with an attack roll while your protosaur is within 5 feet of the target and the protosaur doesn’t have the Incapacitated
      condition, the attack deals an extra 1d8 damage of the attack’s normal type.</p><p>In addition, the first time each turn your protosaur hits a creature under the effect of your <em>Hunter’s Mark</em>
      spell, it deals extra Force damage equal to the bonus damage of that spell.</p>
