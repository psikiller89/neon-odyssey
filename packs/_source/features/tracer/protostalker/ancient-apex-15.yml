name: Ancient Apex
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You and your protosaur have become apex predators feared by prey across the galaxy. As a Bonus Action, you can command your protosaur to give a fearsome roar using its Bonus Action. For 1
      minute, you gain the benefits below. Once you use this Bonus Action, you can’t use it again until you finish a Long Rest unless you expend a level 4+ spell slot to restore your use of it (no action
      required).</p><p><strong>Apex Onslaught.</strong> When the protosaur takes the Attack action, it can make two Proto Strike attacks.</p><p><strong>Preternatural Packmates.</strong> You have Advantage
      on an attack roll against a target while your protosaur is within 5 feet of it and the protosaur doesn’t have the Incapacitated condition.</p><p><strong>Survival Sense.</strong> You and the protosaur
      add a bonus to saving throws equal to your Wisdom modifier (minimum of +1).</p>
