name: Primal Rage
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You and your protosaur embrace ferocity. You gain the following benefits.</p><p><strong>Killer Instinct.</strong> When you take a Bonus Action to command your protosaur to take an action,
      you can also command it to take the Dash, Disengage, Dodge, Help, or Hide action using its Bonus Action.</p><p><strong>Savage Wound.</strong> When the protosaur hits a creature with its Proto Strike
      attack, the target suffers a bleeding wound if it doesn’t already have one. While wounded, the target loses 1d8 Hit Points at the start of each of its turns. At the end of the bleeding creature’s
      turn, it makes a Constitution saving throw against your spell save DC, closing the wound on a success. The wound closes early if a spell restores Hit Points to the target.</p>
