_id: UiEvX3OIe7qUfoOv
name: Gravitic Flux
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>Your weapon can destabilize space and gravity with a single shot. As a Magic action while holding your Grav Gun, you can create an intense fluctuation of gravity at a point you can see within
      150 feet of yourself. Each creature in a 20-foot-radius Sphere centered on that point makes a Strength saving throw, taking 6d8 Force damage on a failed save or half as much damage on a successful
      one. The area within the Sphere then retains a high or low gravity field (your choice) for 1 minute or until you dismiss it (no action required).</p><p>While in a high gravity field, a creature’s
      Speed is halved, it has Disadvantage on Dexterity saving throws, and it has Advantage on Strength saving throws.</p><p>While in a low gravity field, a creature’s jump distance is doubled, it has Disadvantage
      on Strength saving throws, and it has Advantage on Dexterity saving throws.</p><p>Once you use this action, you can’t use it again until you finish a Long Rest unless you expend a level 3+ spell slot
      (no action required) to restore your use of it.</p>
