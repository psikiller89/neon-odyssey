_id: BmgOKQqbJ1lPiDqs
name: Grav Gun
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You craft a Grav Gun, a heavy weapon powered by a condensed point of pure gravity. You have proficiency with the Grav Gun, and only you can operate it. When you finish a Long Rest, or if you
      take a Magic action and expend a spell slot, you can create a new Grav Gun using Engineer’s Tools or Mechanic’s Tools. If you create a new Grav Gun, the old one collapses into its singularity and
      vanishes.</p><p>Your Grav Gun is a Martial Ranged weapon that deals 1d12 Force damage on a hit. It has a normal Range of 100 feet and a long range of 400 feet, it has the Burst*, Heavy, and TwoHanded
      properties, and it has the Sap mastery property. It has 2 mod slots (see “Weapon Modules” in the Equipment section). You can use your Grav Gun as a Spellcasting Focus for your Machinist spells.</p><p>You
      can use your Intelligence instead of Dexterity for attack and damage rolls with it and for the Heavy property.</p>
