_id: Aw5ox6yUOOauNQY6
name: Singularity Cannon
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>Your Grav Gun is powered by a singularity that can be harnessed to devastating effect, which you can activate as a Bonus Action. If this feature forces a creature to make a saving throw, the
      DC equals your spell save DC.</p><p>You can use this Bonus Action a number of times equal to your Intelligence modifier (minimum of once). You regain one expended use when you finish a Short Rest,
      and you regain all expended uses when you finish a Long Rest. You can also use it again by expending a spell slot.</p><p><strong>Disruptor Beam.</strong> A focused emitter fires a beam of disintegrating
      energy in a 30-foot Line that is 5 feet wide. Each creature within the Line must make a Dexterity saving throw, taking 2d8 Force damage on a failed save or half as much damage on a successful one.
      A nonmagical object that isn’t being worn or carried takes the damage if it’s in the Line. If the beam destroys an object that blocks it, the Line then continues past it to its full length.</p><p><strong>Suppression
      Barrage.</strong> Rotary barrels fire a burst of gravity bolts in a 30-foot Cone. Each creature in that area makes a Dexterity saving throw. On a failed save, a target takes 1d8 Force damage and has
      the Prone condition. On a successful save, it takes half as much damage only.</p><p><strong>Vector Manipulator.</strong> Gathering rings that surround the singularity chamber unleash a wave of gravity
      in a 30foot Cone. Each Large or smaller creature in that area must succeed on a Strength saving throw or be pushed up to 30 feet straight toward or away from you (choose one).</p>
