name: Control Gravity
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You have mastered your control over gravity. You can cast <em>Reverse Gravity</em> once without a spell slot, and you regain the ability to do so when you finish a Long Rest.</p><p>When you
      cast the spell in this way, the spell creates a 100foot Cube instead of a Cylinder. You have a Fly Speed equal to your Speed while you’re in the Cube, and for the duration, you can take a Bonus Action
      to change the direction of gravity’s pull to any face of the Cube. When gravity changes in this way, creatures don’t take damage from falling.</p>
