_id: rS2Nq4fJPp1OTFvy
name: Deploy Turret
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You have invented easily deployable turrets to blast your foes. Using Engineer’s Tools or Mechanic’s Tools, you can take a Bonus Action to create a Small turret in an unoccupied space within
      5 feet of you. If the turret would fall when it appears in the space, the action fails without expending its use. The turret’s game statistics appear below. You determine its appearance.</p><p>You
      can create a number of turrets equal to your Intelligence modifier (minimum 1), and you regain all expended uses when you finish a Long Rest or expend a spell slot (no action required) to regain the
      use of this feature.</p><p>You can have up to two turrets at a time. If you create a new turret while you already have two, the first one that you created collapses into worthless scrap metal. A turret
      also collapses into worthless scrap metal if it is reduced to 0 Hit Points, after 1 hour, or if you dismiss it as a Magic action.</p><p>When you cast a Machinist spell, you can cast it as if you were
      in the space of one of your turrets.</p>
