_id: 8otkdZGUAsU2MvMb
name: Sentinel Mode
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You have modified your turrets to operate remotely. You gain the following benefits.</p><p><strong>Remote Fire.</strong> You can now activate your turrets within 500 feet of yourself. When
      you activate a turret, or as a Bonus Action, you can see and hear through the turret as if you were standing in its space until the start of your next turn. During that time, you have the Blinded
      and Deafened conditions with regard to your body.</p><p><strong>Sentry Gun.</strong> When a creature that doesn’t have the Invisible condition moves to a space within 30 feet of the turret, or appears
      within 30 of the turret, you can take a Reaction to see through the turret until the end of the turn as if you were in its space, and you can use the turret’s Flash Charge, Rivet Burst, or Plasma
      Arc action targeting the triggering creature.</p>
