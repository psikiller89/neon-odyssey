name: Enhanced Emplacements
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You have upgraded your sensor and weapons systems. Turrets you create gain the following improvements.</p><p><strong>Flash Charge.</strong> The charge now creates a 10-foot Sphere centered
      on the target. Each creature in the Sphere must make the Constitution saving throw instead of just the target.</p><p><strong>Rivet Burst.</strong> The attack’s damage increases to 3d6, and on a hit,
      the next attack roll against the target before the start of your next turn has Advantage.</p><p><strong>Plasma Arc.</strong> The Line becomes 60 feet long, and its damage increases to 3d8. A creature
      that fails its saving throw against this effect can’t take Reactions until the end of your next turn.</p><p><strong>Upgraded Sensors.</strong> While using the senses of your turrets through the Remote
      Fire benefit of your Sentinel Mode feature, you gain Blindsight with a range of 60 feet from the turret.</p>
