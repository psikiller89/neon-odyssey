name: Upgraded Parts
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You enhance the model of your buddy bot. You gain the following benefits.</p><p><strong>Assault Model Upgrade.</strong> When you command your buddy bot to take the Bot Bash or Ray Blaster
      action, it can make two attacks instead of one.</p><p><strong>Defender Model Upgrade.</strong> When you command your buddy bot as a Bonus Action, you can also activate enhanced defenses on the bot.
      For 1 minute, it gains Resistance to Bludgeoning, Piercing, Radiant, and Slashing damage, and creatures within 5 feet of it have Disadvantage on attacks rolls against targets other than the bot. Once
      you use this benefit, you can’t do so again until you finish a Long Rest.</p><p><strong>Medic Model Upgrade.</strong> Hit Points restored by the buddy bot’s First Aid action in excess of the target’s
      maximum Hit Points are gained as Temporary Hit Points. Additionally, the buddy bot regains one expended use of First Aid when you finish a Short Rest.</p><p><strong>Schematic Enhancements.</strong>
      You can apply Hypertech Schematics you know directly to your buddy bot. Its components count as weapons, armor, and clothing for the purposes of determining gear your schematics can upgrade.</p>
