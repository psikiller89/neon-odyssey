name: Engineered Evolution
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You have invented upgrades to your buddy bot. Your bot gains one of the options below (your choice). You can change the selection with 10 minutes of work using Electronics Tools.</p><p><strong>Calibrated
      Sensors.</strong> The bot can see Invisible creatures and objects within 60 feet of itself, and it adds twice your Proficiency Bonus to Intelligence (Investigation) and Wisdom (Perception) checks.</p><p><strong>Grabber
      Claw.</strong> A Large or smaller creature hit by the Bot Bash attack has the Grappled condition from one of two arms (escape DC equals your spell save DC). Until the grapple ends, the target has
      the Restrained condition.</p><p><strong>Powered Drive.</strong> The bot’s Speed increases by 20 feet.</p><ul><li><p><strong>Traits Actions Reactions</strong></p></li></ul>
