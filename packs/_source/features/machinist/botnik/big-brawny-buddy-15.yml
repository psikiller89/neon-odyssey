name: Big Brawny Buddy
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You have souped up your buddy bot to unlock its ultimate form. As a Magic action, you can engage overdrive protocols in your buddy bot. For 1 minute, it gains the benefits below. Once you
      use this action, you can’t use it again until you finish a Long Rest.</p><p><strong>Hover Jets.</strong> The bot gains a Fly Speed equal to its Speed and can hover.</p><p><strong>Maximization Circuit.</strong>
      The buddy bot’s size becomes Large if it’s in a big enough space. While Large, it has a compartment you can use to mount the bot, and it can carry you if you are Medium or smaller.</p><p><strong>Powered
      Attacks.</strong> Once on each of its turns when the bot hits with an attack roll, it can deal an extra 2d8 Lightning damage.</p>
