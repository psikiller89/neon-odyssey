  description:
    value: '<p><em>Prerequisite: Level 5+ Machinist</em></p><p><strong>Gear:</strong> Light, Medium, or Heavy armor The armor gains a +1 bonus to the AC it grants. The bonus doesn’t stack with another magical
      bonus provided by the armor, and it increases by 1 when you reach Machinist level 14 (+2 bonus).</p><p><strong>Repeatable.</strong> You can gain this schematic more than once. Each time you do, the
      number of suits of armor you can affect at one time with it increases by 1.</p>'
