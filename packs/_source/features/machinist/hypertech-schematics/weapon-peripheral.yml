system:
  description:
    value: '<p><em>Prerequisite: Level 5+ Machinist</em></p><p><strong>Gear:</strong> Simple or Martial weapon Choose one of the following pieces of outrunning gear to build into the weapon: Ascension Gun,
      Flamethrower, Grenade Launcher, Mesh Net, or Scanner. A creature holding the weapon can activate the gear as a Bonus Action or in place of an attack when it takes the Attack action on its turn. When
      created, the Flamethrower is fully loaded with Fuel Oil, the Grenade Launcher has one Grenade (Frag or Smoke Grenade only), and a Mesh Net has one net, none of which can be removed. They can be reloaded
      as normal (or as a Utilize action for a Mesh Net). The peripheral magically refills daily at dawn.</p>'
