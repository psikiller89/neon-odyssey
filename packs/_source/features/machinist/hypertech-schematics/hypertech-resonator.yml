    value: <p><strong>Gear:</strong> Datapad; Spellcasting Focus; tools; device A spellcaster who can use the item as a Spellcasting Focus must attune to the item to use this schematic’s benefits. While
      attuned to the item and holding or wearing it, the creature has a +1 bonus to spell attack rolls and its spell save DC. The bonus doesn’t stack with another magical bonus provided by the item, and
      it increases by 1 when you reach Machinist level 10 (+2 bonus).</p><p><strong>Repeatable.</strong> You can gain this schematic more than once. Each time you do, the number of items you can affect
      at one time with it increases by 1.</p>
