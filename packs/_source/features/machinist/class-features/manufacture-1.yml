name: Manufacture
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You can quickly manufacture simple devices. When crafting an item, the time required to do so is halved, and you know the <em>Mending</em> cantrip.</p><p>Additionally, as a Magic action while
      holding Mechanic’s Tools, you can create one item in your hand or in an unoccupied space within 5 feet of you. You can create a piece of nonmagical outrunning gear worth $500 or less or choose a suggested
      item from the list below. When you reach Machinist level 10, the maximum value increases to $2,000. +2 Spellcasting, Invention Specialist, Manufacture 2 2 2 +2 Hypertech Schematics, Rapid Repair 3
      2 3 2 +2 Machinist Subclass, Spark of Innovation 3 2 4 3 +2 Ability Score Improvement 4 2 5 3 +3 Spark of Innovation (level 3 spell), Subclass feature 4 2 6 4 2 +3 Hypertech Experimentation 5 2 6
      4 2 +3 Divert Energy, Spark of Innovation (level 4 spell) 5 2 7 4 3 +3 Ability Score Improvement 6 2 7 4 3 +4 Spark of Innovation (level 5 spell), Subclass feature 6 2 9 4 3 2 +4 Specialist Expansion
      7 3 9 4 3 2 +4 Spark of Innovation (level 6 spell) 7 3 10 4 3 3 +4 Ability Score Improvement 8 3 10 4 3 3 +5 Spark of Innovation (level 7 spell) 8 3 11 4 3 3 1 +5 Repair Recharge 9 4 11 4 3 3 1 +5
      Spark of Innovation (level 8 spell), Subclass feature 9 4 12 4 3 3 2 +5 Ability Score Improvement 10 4 12 4 3 3 2 +6 10 4 14 4 3 3 3 1 +6 Specialist Culmination 11 4 14 4 3 3 3 1 +6 Epic Boon 11 4
      15 4 3 3 3 2 +6 Machine Perfection 12 4 15 4 3 3 3 2 Belt Pack Grav Spikes Rucksack Camera Handcuffs Sleeping Bag Canteen Hauling Pulley Steel Bearings Collapsible Pole Lighter Steel Chain Cord Mesh
      Net Synth Line Flashlight Motion Sensor Thermal Blanket Fuel Oil Power Cell Utility Jug Grapnel Pry Bar Vial, Glass See the rules for the item in the Equipment section. The item lasts until you finish
      a Long Rest, at which point it vanishes. If the item uses a Power Cell, it appears with a fully charged cell that vanishes when removed.</p><p>You can use this feature a number of times equal to your
      Intelligence modifier (minimum of once), and you regain all expended uses when you finish a Long Rest.</p>
