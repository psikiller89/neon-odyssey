name: Rapid Repair
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You have a knack for swiftly repairing damage to constructed objects and creatures through targeted technomancy. You have a pool of repair dice (d6s) equal to twice your Intelligence modifier
      (minimum of 2).</p><p>As a Bonus Action while holding tools you can use as a Spellcasting Focus, you can repair one Construct, object, structure, or vehicle you can see within 30 feet of yourself.
      Expend and roll any number of repair dice from the pool and restore a number of Hit Points equal to the total. Your pool regains all expended dice when you finish a Long Rest.</p>
