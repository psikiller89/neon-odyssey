img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You have discovered the final technique that upgrades your chosen invention specialty. Once you use this feature, you can’t use it again until you finish a Long Rest.</p><p><strong>Armory.</strong>
      When you hit or miss with an attack roll using a weapon, you can cause the attack roll to become a Critical Hit instead.</p><p><strong>Hypertech.</strong> When you cast a spell using a spell slot
      and damage a creature, you can ignore the creature’s Resistances and Immunities.</p><p><strong>Robotics.</strong> When you are reduced to 0 Hit Points while you have an assistant, you can permanently
      dismiss your assistant to instead change your Hit Points to a number equal to twice your Machinist level.</p>
