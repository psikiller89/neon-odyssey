name: Divert Energy
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You’ve learned to repurpose your repairing energies into bolstering yourself or your allies. When you or a creature you can see within 30 feet of you fails a saving throw or is hit by an attack
      roll, you can take a Reaction and expend one of your Rapid Repair dice. Roll and add it to the target’s saving throw or AC as appropriate to the trigger, potentially turning a failure into a success
      or causing the attack to miss.</p>
