system:
  description:
    value: <p>Your flare for technical experimentation allows you to invent Hypertech wonders. You can cast a Machinist spell of up to level 2 without expending a spell slot and without having the spell
      prepared. Once you use this feature, you can’t use it again until you finish a Long Rest.</p><p>When you reach a Machinist level specified in the Spark of Innovation Spells table, you can choose from
      the listed spells of that level instead. <em>Protection from Energy</em>, <em>Stinking Cloud</em> <em>Arcane Eye</em>, <em>Fabricate</em> <em>Animate Objects</em>, <em>Creation</em> <em>Contingency</em>,
      <em>Disintegrate</em> <em>Forcecage</em>, <em>Symbol</em> <em>Incendiary Cloud</em>, <em>Power Word Stun</em></p>
