_id: WEhIgtIHtORQDJUl
name: Invention Specialist
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: '<p>You focused your technological invention to the specialty of your choice. Later features provide upgrades to your chosen specialty.</p><p><strong>Armory.</strong> You gain proficiency with
      Martial weapons and training with Heavy armor. You can use Intelligence in place of Strength or Dexterity for attack rolls, damage rolls, and the Heavy property for weapons, and you can use Intelligence
      to meet the Strength requirement of Heavy armor.</p><p><strong>Hypertech.</strong> You know two extra cantrips from the Machinist spell list. In addition, choose one of the following skills in which
      you have proficiency: Arcana Computers, Investigation, or Technology. You have Expertise in the chosen skill.</p><p><strong>Robotics.</strong> You always have the <em>Autonomous Assistant</em>* spell
      prepared and can cast it as a Magic action without expending a spell slot.</p><p>When you cast the spell in this way, you choose one of the normal forms for your assistant or one of the following
      special forms: <strong>Omnibot</strong>* or <strong>Spy Drone</strong>*. The assistant appears robotic.</p><p>Additionally, when you take the Attack action, you can forgo one of your own attacks to
      allow a special form assistant to make one attack of its own with its Reaction.</p>'
