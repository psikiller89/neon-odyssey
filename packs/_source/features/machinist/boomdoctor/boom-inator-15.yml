name: Boom-inator
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>Your grand invention is the mother of all booms. As a Magic action, you can choose one of the detonations below. Alternatively, if you would drop to 0 Hit Points, you can trigger this feature
      as a Reaction. The detonation is a 30-foot Emanation originating from you. Once you use this feature, you can’t use it again until you finish a Long Rest.</p><p><strong>Big Boom.</strong> Each creature
      in the Emanation must make a Dexterity saving throw against your spell save DC. On a failed save, a target takes 5d8 damage of two different damage types of your choice (10d8 total) from your Impromptu
      Bombs. On a successful save, a target takes half as much damage.</p><p><strong>Chaos Boom.</strong> Select one spell from the Ray Gun Effects table. Each creature in the Emanation is targeted by that
      spell (DC equals your spell save DC). The spell doesn’t require Concentration and instead has a duration of 1 minute.</p><p><strong>Cure-All Boom.</strong> Each creature in the Emanation regains 5d8
      Hit Points.</p>
