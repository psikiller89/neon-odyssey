name: Ray Gun
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You have created an experimental ray that causes unpredictable effects. As a Magic action, you can expend one Composition to prime and fire the ray. Make a ranged spell attack against one
      creature within 90 feet of you. On a hit, roll 1d6 and consult the table below to determine which spell the gun replicates. Alternatively, you can expend one additional Composition to select the effect
      rather than rolling.</p><p>The target is affected as if it had failed a saving throw against the replicated spell. The spell doesn’t require Concentration and instead has a duration of 1 minute. At
      the start of each of your turns, roll 1d6. On a 1, the spell ends early. <em>Sleep</em> <em>Hold Person</em> <em>Ray of Enfeeblement</em> <em>Slow</em> <em>Bestow Curse</em> <em>Fear</em></p>
