system:
  description:
    value: '<p>Your incessant and often unhinged tinkering has unlocked weird and experimental devices. You gain the following benefits.</p><p><strong>Boomsday Device.</strong> You invent a device with
      wildly varied functions. As a Magic action while holding Chemist’s Supplies, you can cast one of the following spells without a spell slot: <em>Confusion</em>, <em>Dimension Door</em>, <em>Greater
      Invisibility</em>, or <em>Polymorph</em>. Once you cast one of the spells using this benefit, you can’t cast any of them with this benefit again until you finish a Long Rest.</p><p><strong>More Boom.</strong>
      Your Impromptu Bombs now create a 20-foot-radius Sphere, and their damage dice become d8s instead of d6s.</p>'
