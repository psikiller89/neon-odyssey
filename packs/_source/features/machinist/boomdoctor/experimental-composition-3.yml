_id: d2eGVePVkkJArdpN
name: Experimental Composition
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: '<p>You have discovered the formula to volatile chemical Compositions that make a big boom. You create a number of Compositions equal to twice your Intelligence modifier (minimum of 2). These
      Compositions fuel your other features. If you have Chemist’s Supplies on your person, you regain one expended Composition when you finish a Short Rest, and you regain all expended Compositions when
      you finish a Long Rest.</p><p><strong>Impromptu Bomb.</strong> As a Magic action, you can expend a Composition to create and throw a Tiny bomb. Choose two damage types from the following: Acid, Cold,
      Fire, Lightning, Piercing, Poison, or Thunder.</p><p>You throw the bomb at a point you can see up to 60 feet away from yourself. Each creature in a 10-foot-Sphere originating from that point makes
      a Dexterity saving throw against your spell save DC, taking 2d6 damage of each chosen type (total of 4d6) on a failed save or half as much damage on a successful one. If the total of each damage type
      is equal, this bomb doesn’t expend a Composition. For example, if the bomb deals Fire and Acid damage, and both types roll a total of 8 damage each, the bomb’s Composition isn’t expended.</p><p>Compare
      the damage rolls to the table below to see if the bomb has any additional effects (multiple effects can trigger at one time). If any of the damage type’s dice rolled the same number, that type’s additional
      effect triggers. Acid A creature that failed the save takes 1d4 Acid damage at the start of its next turn. Cold A creature that failed the save has its Speed halved until the start of your next turn.
      Fire A creature that failed the save starts burning. Lightning A creature that failed the save can’t take Reactions until the start of your next turn. Piercing A creature that failed the save is pushed
      10 feet away from the bomb. Poison A creature that failed the save has the Poisoned condition until the start of your next turn. Thunder A creature that failed the save has the Prone condition.</p>'
