system:
  description:
    value: <p>You can temporarily spike the code of a device to improve its function. Provided you have a Spiking Deck on your person, as a Bonus Action, you can target a weapon, a tool, or a vehicle station
      you can see within 30 feet of yourself. For 1 minute or until you use this feature again, D20 Tests made using the target add 1d4 to the total.</p><p>Once you use this Bonus Action, you can’t use
      it again until you finish a Short or Long Rest, unless you expend a spell slot to use it again.</p>
