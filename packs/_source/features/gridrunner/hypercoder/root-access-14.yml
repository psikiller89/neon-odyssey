name: Root Access
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>Your clever programming allows you to spike into the code within objects, constructs, and living things. You always have the <em>Animate Objects</em> and <em>Dominate Person</em> spells prepared.
      You can cast one of these spells once without expending a spell slot, and when you do so, you can modify it in a way based on the spell you cast.</p><p>Once you cast either spell without a spell slot,
      you must finish a Long Rest before you use this feature again.</p><p><strong>Animate Objects.</strong> The spell doesn’t require Concentration, and its duration becomes 1 minute for that casting.
      The spell ends early if you cast it again.</p><p><strong>Dominate Person.</strong> You can target Constructs with the spell. When you cast the spell without a spell slot using this feature, it ignores
      a Construct’s Immunity to the Charmed condition, if any.</p>
