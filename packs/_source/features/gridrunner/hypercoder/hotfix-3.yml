name: Hotfix
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You can quickly alter the parameters of friendly scripts. Provided you are holding your hyperpad, when you or a willing ally within 30 feet of you casts a spell, you can take a Reaction to
      make one of the alterations below to that casting of the spell.</p><p>You can use this Reaction a number of times equal to your Intelligence modifier (minimum of once), and you regain all expended
      uses when you finish a Long Rest.</p><p><strong>Decrypt.</strong> The spell’s damage ignores damage Resistance.</p><p><strong>Refactor.</strong> If the spell has a range of Touch, its range becomes
      30 feet. If the spell creates an area of effect and has a duration of instantaneous, you can change the area to a different area from this list (the caster still makes all other decisions for the
      spell). Choose A) originating from you, the spell creates a 30-foot Cone, a 10-foot Emanation, or a 30-foot Line that is 5 feet wide; or B) originating from a point you can see within 60 feet of yourself,
      the spell creates a 10-foot Sphere or a 10-foot-radius Cylinder that is 30 feet high.</p>
