    value: <p>Your digital renders are directly from the Hypergrid. You gain the following benefits.</p><p><strong>Hardened Hardlight. </strong>When you cast a Conjuration spell that summons a creature,
      you can change the creature’s type to Construct. When you do so, you can empower it to gain Temporary Hit Points equal to your Gridrunner level, have Resistance to Lightning damage, and deal Lightning
      damage instead of its normal damage type.</p><p><strong>Photoreal.</strong> When you cast an Illusion spell that creates an image of a creature or an object, creatures have Disadvantage on ability
      checks or saving throws to discern it as an illusion.</p>
