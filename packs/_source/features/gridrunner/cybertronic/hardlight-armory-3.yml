name: Hardlight Armory
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You can render digital armaments out of Hypergrid hardlight. Your creations with this feature shed Dim Light in a 10-foot radius, in a color of your choice. As a Bonus Action, you create one
      of the options below of your choice that lasts for 10 minutes or until you use this feature again.</p><p>You can use this feature twice, and you regain all expended uses when you finish a Short or
      Long Rest. You can regain one expended use by expending a spell slot (no action required).</p><p><strong>Digi-Disc.</strong> A Tiny disc of neon hardlight appears, floating around you. When you activate
      this option and as a Bonus Action on your subsequent turns while it lasts, you can make a ranged spell attack, firing a bolt of data-infused light with a range of 60 feet. On a hit, the target takes
      Force damage equal to 1d8 plus your Intelligence modifier.</p><p><strong>Gridblade.</strong> A blade or similar armament appears around your hand. When you activate this option and as a Bonus Action
      on your subsequent turns while it lasts, you can make a melee spell attack using the gridblade. On a hit, the target takes Force damage equal to 1d8 plus your Intelligence modifier, and it can’t make
      Opportunity Attacks until the start of your next turn.</p>
