_id: t03K0p2VWaqOB4Hg
name: Ride the Light
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>The vehicles that navigate the Hypergrid are yours to create. You can create a personal vehicle using hardlight projection. As a Magic action, you can create a <strong>Racing Bike*</strong>
      that lasts for 8 hours. You can choose to create it so that you are already in the Controls station. The bike vanishes if you gain the Incapacitated condition or when the bike is reduced to 0 Hit
      Points. If you are dismounted from the bike, you can reform it around yourself as a Bonus Action, ending the Prone condition on yourself and the vehicle.</p><p>Once you create a vehicle with this
      feature, you can’t do so again until you finish a Long Rest or use your Cache Refresh feature.</p>
