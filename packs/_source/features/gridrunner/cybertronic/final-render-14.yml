name: Final Render
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You now can perfectly render a Hypergrid program into reality. When you cast an Illusion spell to create the image of a creature, or a Conjuration spell to summon a creature, you can modify
      the spell so it can’t be dispelled, damage can’t break your Concentration on it, and if it deals damage, you can change the damage type to Force and add your Intelligence modifier to the total.</p><p>Once
      you modify a spell with this feature, you can’t do so again until you finish a Long Rest or use your Cache Refresh feature.</p>
