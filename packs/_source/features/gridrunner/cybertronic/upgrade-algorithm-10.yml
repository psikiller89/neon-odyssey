system:
  description:
    value: <p>You have developed new and improved rendering techniques, granting the following benefits.</p><p><strong>Charge Sequence.</strong> You always have the <em>Magic Weapon</em> spell prepared.
      You can cast it once without a spell slot, and you can’t cast it in this way again until you finish a Long Rest. You can cast <em>Magic Weapon</em> as part of the same Bonus Action you use to activate
      Hardlight Armory, and you can target your armory as if it were a weapon.</p><p><strong>Digital Deflection.</strong> While your Hardlight Armory is active, you gain a +2 bonus to AC.</p><p><strong>Honed
      Light.</strong> The damage of your Hardlight Armory options increases by 1d8 (2d8 total).</p>
