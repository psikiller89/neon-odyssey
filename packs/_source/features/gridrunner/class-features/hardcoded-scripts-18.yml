name: Hardcoded Scripts
type: feat
img: icons/magic/unholy/beam-impact-purple.webp
system:
  description:
    value: <p>You have coded certain scripts so many times that they become effortless to execute. Choose a level 1 and a level 2 spell in your hyperpad that have a casting time of an action. You always
      have those spells prepared, and you can cast them at their lowest level without expending a spell slot. To cast either spell at a higher level, you must expend a spell slot.</p><p>Whenever you finish
      a Long Rest, you can update your hyperpad and replace one of those spells with an eligible spell of the same level from the pad.</p>
