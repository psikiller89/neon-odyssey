system:
  description:
    value: '<p>You have learned to program the code of the Hypergrid, using its connection to the fabric of reality to cast spells. See the <em>D&amp;D Beyond Basic Rules</em> for the rules on spellcasting.
      The information below details how you use those rules with Gridrunner spells, which appear in the Gridrunner spell list later in the class’s description.</p><p><strong>Hyperpad.</strong> Your Gridrunner
      study culminated in the creation of a unique Datapad: your hyperpad. It is a Tiny object that weighs 1 pound, can store 100 spells, and can be read only by you or someone casting <em>Identify</em>.
      You determine the pad’s appearance and user interface, such as a metal-cased device with a text screen or a hardlight pad with holographic projection.</p><p>You cast your Gridrunner spells using your
      hyperpad as a Spellcasting Focus. Your Gridrunner spells don’t have a <em>V</em> component, and you must have your hyperpad in hand when you cast a Gridrunner spell (meaning the spell has an <em>M</em>
      component when you cast it).</p><p>The pad contains the level 1+ spells you know. It starts with six level 1 Gridrunner spells of your choice. <em>Detect </em> <em>Magic</em>, <em>Feather Fall</em>,
      <em>Mage Armor</em>, <em>Magic Missile</em>, <em>Sleep</em>, and <em>Thunderwave</em> are recommended.</p><p>Whenever you gain a Gridrunner level after 1, add two Gridrunner spells of your choice
      to your hyperpad. Each of these spells must be of a level for which you have spell slots, as shown in the Gridrunner Features table. The spells are the culmination of arcane research you do regularly.
      <strong>Cantrips.</strong> You know three Gridrunner cantrips of your choice. <em>Circuit Shock</em>*,<em> Light</em>, and <em>Mage Hand</em> are recommended. Whenever you finish a Long Rest, you
      can replace one of your cantrips from this feature with another Gridrunner cantrip of your choice.</p><p>When you reach Gridrunner levels 4 and 10, you learn another Gridrunner cantrip of your choice,
      as shown in the Cantrips column of the Gridrunner Features table.</p><p><strong>Copying a Spell into the Pad.</strong> When you find a level 1+</p><p><strong>Copying the Pad. </strong>You can copy
      a spell from your</p><p><strong>Spell Slots.</strong> The Gridrunner Features table shows how many spell slots you have to cast your level 1+ spells. You regain all expended slots when you finish
      a Long Rest.</p><p><strong>Prepared Spells of Level 1+.</strong> You prepare the list of level 1+ spells that are available for you to cast with this feature. To do so, choose four spells from your
      hyperpad. The chosen spells must be of a level for which you have spell slots.</p><p>The number of spells on your list increases as you gain Gridrunner levels, as shown in the Prepared Spells column
      of the Gridrunner Features table. Whenever that number increases, choose additional Gridrunner spells until the number of spells on your list matches the number in the table. The chosen spells must
      be of a level for which you have spell slots. For example, if you’re a level 3 Gridrunner, your list of prepared spells can include six spells of levels 1 and 2 in any combination, chosen from your
      hyperpad.</p><p>If another Gridrunner feature gives you spells that you always have prepared, those spells don’t count against the number of spells you can prepare with this feature, but those spells
      otherwise count as Gridrunner spells for you.</p><p><strong>Changing Your Prepared Spells.</strong> Whenever you finish a Long Rest, you can change your list of prepared spells, replacing any of the
      spells there with spells from your hyperpad.</p><p><strong>Spellcasting Ability.</strong> Intelligence is your spellcasting ability for your Gridrunner spells. +2 Spellcasting, Cache Refresh, Open-Source
      Spells 3 4 2 +2 Data Query, Grid Spiker 3 5 3 +2 Gridrunner Subclass 3 6 4 2 +2 Ability Score Improvement 4 7 4 3 +3 Hot Swap 4 9 4 3 2 +3 Subclass feature 4 10 4 3 3 +3 4 11 4 3 3 1 +3 Ability Score
