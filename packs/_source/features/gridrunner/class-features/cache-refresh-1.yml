name: Cache Refresh
type: feat
img: icons/magic/earth/explosion-lava-stone-green.webp
system:
  description:
    value: <p>You reboot your systems to replenish your scripts. When you finish a Short Rest, you can choose expended spell slots to recover. The spell slots can have a combined level equal to no more
      than half your Gridrunner level (round up), and none of the slots can be level 6 or higher. For example, if you’re a level 4 Gridrunner, you can recover up to two levels’ worth of spell slots, regaining
      either one level 2 spell slot or two level 1 spell slots.</p><p>Once you use this feature, you can’t do so again until you finish a Long Rest.</p>
