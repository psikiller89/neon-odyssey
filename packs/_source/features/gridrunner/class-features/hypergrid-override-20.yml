_id: 9mnqnVfPKhn6yw4m
name: Hypergrid Override
type: feat
img: icons/magic/fire/projectile-wave-arrow.webp
system:
  description:
    value: <p>Interfacing with the Hypergrid has become second nature, to the point of being able to easily navigate it. You gain the following benefits.</p><p><strong>Grid Surf.</strong> You always have
      the <em>Plane Shift</em> and <em>Teleport</em> spells prepared. You can cast one of these spells once without expending a spell slot, requiring no Material components. Once you cast either spell in
      that way, you can’t use this benefit to cast the spells again until you finish a Long Rest.</p><p><strong>Personal Hotkeys.</strong> Choose two level 3 spells in your hyperpad as your signature spells.
      You always have these spells prepared, and you can cast each of them once at level 3 without expending a spell slot. When you do so, you can’t cast them in this way again until you finish a Short
      or Long Rest. To cast either spell at a higher level, you must expend a spell slot.</p>
