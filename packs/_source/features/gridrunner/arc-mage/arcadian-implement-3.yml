  description:
    value: <p>You harness your magic through arcade relics. Your hyperpad takes on the form of an Arcadian mage’s implement such as a staff, wand, orb, or spellbook. When you finish a Long Rest, you can
      change the implement’s form (including reverting it to a standard Datapad).</p><p>You can use your Arcadian Implement as a Spellcasting Focus for your Gridrunner spells. You can also cast your Gridrunner
      spells using Verbal components, and if you do so, you needn’t be holding your implement and can instead use any listed Material components for the spell.</p>
