name: Advanced Menu
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You unlock secret abilities from Arcadia, granting you the following benefits while you are holding your Arcadian Implement.</p><p><strong>Protect.</strong> If you damage an ally with a spell,
      you can expend 5 MP to cause them to take no damage and instead gain Temporary Hit Points equal to 5 plus your Intelligence modifier.</p><p><strong>Reflect.</strong> When you or a creature you can
      see within 30 feet of you makes a saving throw against a spell, you can take a Reaction and expend 1 MP to grant the target Advantage on the saving throw. If the save succeeds and the spell targeted
      only that creature, you can cause the spell to reflect at the caster if it is level 1 or lower. You can expend more MP up to the level of the spell, to a maximum of 5, to reflect a higher-level spell.
      The caster must make a saving throw against its own spell save DC, and the spell affects it without Concentration for its maximum duration.</p><p><strong>Revive.</strong> You can expend 7 MP and a
      level 3+ spell slot to cast <em>Revivify</em>, requiring no Material components.</p>
