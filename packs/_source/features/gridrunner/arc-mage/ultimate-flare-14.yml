name: Ultimate Flare
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You have discovered the ultimate expression of Arcadian arcana. As a Magic action while holding your Arcadian Implement, you can create one of the following effects that fills a 30-foot Cube
      centered on a point you can see within 150 feet of yourself. You can use your Magic Command, Bonus Upgrade, and Advanced Menu features on this effect as if it were a spell, and they affect each creature
      affected by the flare. Choose one of the options below when you use this action.</p><p>Once you use this action, you can’t use it again until you finish a Long Rest unless you expend 10 MP (no action
      required) to restore your use of it.</p><p><strong>Cataclysm.</strong> Each creature of your choice in the Cube makes a Dexterity saving throw against your spell save DC, taking 8d8 Force damage on
      a failed save or half as much damage on a successful one. You can use MP options on this effect as if it were Cold, Fire, or Lighting damage (choose one).</p><p><strong>Miracle.</strong> The flare
      restores up to 60 Hit Points divided as you choose among any number of creatures in the Cube.</p>
