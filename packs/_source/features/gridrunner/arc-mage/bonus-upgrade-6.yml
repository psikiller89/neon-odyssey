_id: aAFIIoZqZLw6zSm1
name: Bonus Upgrade
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: '<p>Your command of Arcadian magic levels up. When you use an option from your Magic Command feature, you can expend 1 additional MP to improve one chosen option in the following ways.</p><p><strong>Curative
      Remedy.</strong> When you roll to restore Hit Points with a spell, add a bonus to the total restored equal to your Intelligence modifier (minimum of 1 Hit Point).</p><p><strong>Element Shift.</strong>
      When you roll damage dice for the spell, you can reroll any dice that roll a 1 or 2. You must use the new rolls.</p><p><strong>Magic Boost.</strong> When you use a Magic Boost option, you ignore Resistance
      to that damage type, and one target must succeed on a Constitution saving throw against your spell save DC or the effect for the creature is modified depending on the option: <strong>Freeze.</strong>
      The target has the Restrained condition. It repeats the save at the end of each if its turns, ending the condition on itself on a success. <strong>Ignite.</strong> The burning damage increases to
      2d6. <strong>Shock.</strong> The target takes an extra 2d6 Lightning damage and has the Prone condition.</p>'
