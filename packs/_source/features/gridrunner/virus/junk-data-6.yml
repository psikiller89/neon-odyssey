name: Junk Data
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You overwhelm a target with a flood of meaningless data. When you use your Malware feature, you can also force the target to make an Intelligence saving throw against your spell save DC. On
      a failed save, the target has the Incapacitated condition until the start of your next turn. The target can choose to take 3d6 Force damage instead of gaining the Incapacitated condition.</p><p>You
      can use this feature a number of times equal to your Intelligence modifier (minimum of once), and you regain all expended uses when you finish a Long Rest.</p>
