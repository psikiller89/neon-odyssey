name: Contagious Code
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>Your malware spreads even easier. When you are concentrating on a spell that affects a creature and that creature dies or gains the Unconscious condition, you can take a Reaction to choose
      another target for your spell. The new target must be within the spell’s original range from the previous target, and the new target makes a saving throw, or you make a spell attack roll, as appropriate
      for the spell.</p><p>Once you use this feature, you can’t use it again until you finish a Long Rest. You can also restore your use of it by expending a level 3+ spell slot (no action required).</p>
