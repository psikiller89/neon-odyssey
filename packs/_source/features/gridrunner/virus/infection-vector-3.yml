name: Infection Vector
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You can incubate your malware within a host to infect those it comes into contact with. You can touch a creature (you can target yourself) to infuse it with dormant, malicious code that protects
      it for 1 hour or until you use this feature again. When a creature hits the protected target with an attack roll, the target can take a Reaction to force the attacker to make an Intelligence saving
      throw against your spell save DC. On a failed save, the triggering attack misses instead, and the attacker has Disadvantage on ability checks and attack rolls until the start of its next turn.</p><p>Once
      you use this feature, you can’t use it again until you finish a Long Rest. You can also restore your use of it by expending a level 2+ spell slot (no action required).</p>
