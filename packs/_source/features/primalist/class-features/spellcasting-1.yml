name: Spellcasting
type: feat
img: icons/magic/nature/beam-hand-leaves-green.webp
system:
  description:
    value: <p>Through your connection to the raw primordial forces of the galaxy, you have learned to cast spells. See the <em>D&amp;D Beyond </em> <em>Basic Rules</em> for the rules on spellcasting. The
      information below details how you use those rules with Primalist spells, which appear in the Primalist spell list later in the class’s description.</p><p><strong>Cantrips.</strong> You know two Primalist
      cantrips of your choice from the Primalist spell list. <em>Primalcraft</em> (<em>Druidcraft</em>) and <em>Produce Flame</em> are recommended.</p><p>Whenever you gain a Primalist level, you can replace
      one of your cantrips with another cantrip of your choice from the Primalist spell list.</p><p>When you reach Primalist levels 4 and 10, you learn another Primalist cantrip of your choice from the
      Primalist spell list, as shown in the Cantrips column of the Primalist features table.</p><p><strong>Spell Slots.</strong> The Primalist Features table shows how many spell slots you have to cast
      your level 1+ spells. You regain all expended slots when you finish a Long Rest.</p><p><strong>Prepared Spells of Level 1+.</strong> You prepare the list of level 1+ spells that are available for
      you to cast with this feature. To start, choose four level 1 spells from the Primalist spell list. <em>Cure Wounds</em>, <em>Detect Magic</em>, <em>Faerie Fire</em>, and <em>Thunderwave</em> are recommended.</p><p>The
      number of spells on your list increases as you gain Primalist levels, as shown in the Prepared Spells column of the Primalist Features table. Whenever that number increases, choose additional spells
      from the Primalist spell list until the number of spells on your list matches the number in on the table. The chosen spells must be of a level for which you have spell slots. For example, if you’re
      a level 3 Primalist, your list of prepared spells can include six spells of level 1 or 2 in any combination.</p><p>If another Primalist feature gives you spells that you always have prepared, those
      spells don’t count against the number of spells you can prepare with this feature, but those spells otherwise count as Primalist spells for you.</p><p><strong>Changing Your Prepared Spells.</strong>
      Whenever you finish a Long Rest, you can change your list of prepared spells, replacing any of the spells with other Primalist spells for which you have spell slots.</p><p><strong>Spellcasting Ability.</strong>
      Wisdom is your spellcasting ability for your Primalist spells.</p><p><strong>Spellcasting Focus.</strong> You can use a Primal Focus as a Spellcasting Focus for your Primalist spells.</p>
