name: Primordial Incarnation
type: feat
img: icons/magic/nature/root-vines-face-glow-green.webp
system:
  description:
    value: <p>Your being is fully suffused with powerful primordial magic, granting you the following benefits.</p><p><strong>Primeval Essence.</strong> You draw vitality from your connection to primordial
      nature and as a result you age more slowly. For every ten years that pass, your body ages only one year.</p><p><strong>Untamed Wellspring.</strong> Whenever you roll Initiative and have no uses of
      Primal Channel left, you regain one expended use of it.</p><p><strong>Wild Cycle.</strong> You can convert uses of Primal Channel into a spell slot (no action required). Choose a number of your unexpended
      uses of Primal Channel and convert them into a single spell slot, with each use contributing 2 spell levels. For example, if you convert two uses of Primal Channel, you produce a level 4 spell slot.
      Once you use this benefit, you can’t do so again until you finish a Long Rest. <strong>Traits Actions Bonus Actions Traits Actions Reactions Traits Actions Bonus Actions</strong></p>
