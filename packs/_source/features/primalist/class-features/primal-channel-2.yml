_id: 4bUR4pv4yvroX0BD
name: Primal Channel
type: feat
img: icons/creatures/mammals/bull-horns-eyes-glowin-orange.webp
system:
  description:
    value: '<p>You can harness the primal power flowing through you to create magical effects. You start with two such effects, Call Wildling and Primal Form, each of which is described below. Each time
      you use Primal Channel, choose which effect to create.</p><p>You can use Primal Channel twice. You regain one of its expended uses when you finish a Short Rest, and you regain all expended uses when
      you finish a Long Rest. You gain additional uses when you reach certain Primalist levels, as shown in the Primal Channel column of the Primalist Features table.</p><p>If a Primal Channel effect requires
      a saving throw, the DC equals the spell save DC from this class’s Spellcasting feature.</p><p><strong>Call Wildling.</strong> You can summon a spirit of the wild that assumes a form to aid you. As
      a Magic action, you can cast the <em>Autonomous Assistant</em>* spell without Material components.</p><p>When you cast the spell in this way, the summoned creature is an Elemental or a Monstrosity
      (your choice) and disappears when you finish a Long Rest. It appears as an alien or an elementally infused creature.</p><p><strong>Primal Form.</strong> Your connection to primordial forces allows
      you to adopt its form in various ways. As a Bonus Action, you shape-shift into one of the forms you know for this feature, which are detailed in the “Primal Forms” section later in this class’s description.
      You stay in that form for a number of hours equal to half your Primalist level or until you use Primal Form again, have the Unconscious condition, or die. You can also leave the form early as a Bonus
      Action.</p><p>While in one of these forms, you retain your personality, memories, and ability to speak, and the following rules apply: <strong>Temporary Hit Points.</strong> When you assume a Primal
      Form, you gain a number of Temporary Hit Points equal to your Primalist level. <strong>Game Statistics.</strong> Your game statistics are replaced by the form’s stat block. <strong>No Spellcasting.</strong>
      You can’t cast spells, but shape-shifting doesn’t break your Concentration or otherwise interfere with a spell you’ve already cast. <strong>Objects.</strong> Your ability to handle objects is determined
      by your form’s limbs. In addition, you choose whether your equipment falls in your space, merges into your new form, or is worn by it. Worn equipment functions as normal, but the GM decides whether
      the new form can wear a piece of equipment based on the creature’s size and shape. Your equipment doesn’t change size or shape to match the new form, and any equipment that the new form can’t wear
      must either fall to the ground or merge with the form. Equipment that merges with the form has no effect while you’re in that form.</p>'
