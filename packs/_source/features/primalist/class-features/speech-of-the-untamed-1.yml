system:
  description:
    value: <p>You can always commune with the forces of the wild places. You know Clysmic, the language of Elementals, world souls, and creatures in tune with the forces of the wild. You always have the
      <em>Speak with Animals</em> spell prepared, and you can communicate with Monstrosities using it in addition to Beasts.</p><p>You can use Clysmic to leave hidden messages in writing or markers made
      from stones, sticks, and other natural materials. You and others who know Clysmic automatically spot such a message. Others spot the message’s presence with a successful DC 15 Intelligence (Investigation)
      check but can’t decipher it without magic. +2 Spellcasting, Archaic Pathways, Speech of the Untamed 2 4 2 +2 Primal Channel 2 2 5 3 +2 Primalist Subclass 2 2 6 4 2 +2 Ability Score Improvement 2 3
