system:
  description:
    value: '<p>Your xenomon develop new adaptations. You gain the following benefits.</p><p><strong>Cosmic Infusion.</strong> When you summon a xenomon, you can blend cosmic energy with its primordial essence.
      Choose one of the following damage types: Lightning, Necrotic, Psychic, Radiant, or Thunder. Until the xenomon vanishes, it gains Immunity to the chosen type, and when it deals damage, it can deal
      the chosen type instead.</p><p><strong>New Move.</strong> Your xenomon gains a new action listed in its stat block. Once the xenomon uses this action, it can’t use it again until you expend a use
      of Primal Channel to summon a new xenomon.</p>'
