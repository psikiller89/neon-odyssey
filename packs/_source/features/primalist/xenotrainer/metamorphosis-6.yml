system:
  description:
    value: <p>Your bond with your xenomon deepens, and they metamorphosize into their next stage, granting the following benefits.</p><p><strong>Second Stage.</strong> The size of each of your xenomon increases
      to Medium and it Hit Dice becomes d8s.</p><p><strong>Switch Out.</strong> As a Bonus Action while you have a xenomon summoned, you can replace it with a different xenomon. Each creature (other than
      you) in a 10-foot Emanation originating from the new xenomon must succeed on a Dexterity saving throw against your spell save DC or take 2d6 damage of the same type the xenomon’s Elemental attack
      deals. You can command the xenomon as part of the same Bonus Action.</p>
