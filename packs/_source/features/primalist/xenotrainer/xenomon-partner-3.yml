_id: oftzTyUH2KsRy74j
name: Xenomon Partner
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: '<p>You have formed bonds with alien beings infused with primordial energies. As a Magic action, you can expend one use of your Primal Channel to summon a xenomon from one of three environments.
      The xenomon appears in an unoccupied space of your choice that you can see within 30 feet of yourself. Choose the xenomon’s stat block: Arctic, Tropical, or Volcanic. You determine the creature’s
      appearance, selecting a form whose nature matches the chosen stat block. Whatever its appearance, the xenomon is marked by the element of the chosen stat block.</p><p>The xenomon is Friendly to you
      and your allies and obeys your commands. It vanishes if it drops to 0 Hit Points, if you die, if you dismiss it (no action required), or if you expend another Primal Channel to summon a different
      xenomon.</p><p><strong>The Xenomon in Combat.</strong> In combat, the xenomon acts during your turn. It can move and use its Reaction on its own, but the only action it takes is the Dodge action unless
      you take a Bonus Action to command it to take an action in its stat block or some other action. You can also sacrifice one of your attacks when you take the Attack action to command the xenomon to
      take an Elemental attack action. If you have the Incapacitated condition, the xenomon acts on its own and isn’t limited to the Dodge action.</p>'
