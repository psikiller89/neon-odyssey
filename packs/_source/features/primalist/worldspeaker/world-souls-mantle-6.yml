system:
  description:
    value: <p>The energy of your world erupts around you, no matter where you are. You gain the following benefits.</p><p><strong>Planetary Travel.</strong> While your Planetary Embodiment is active, you
      ignore Difficult Terrain, and you can take the Dash action as a Bonus Action (which can be done as part of the Bonus Action to activate or use the feature).</p><p><strong>Worldly Resistance.</strong>
      When you select your World Bond, choose one of the damage types associated with it. You gain Resistance to that damage type until you select a World Bond again. Abundant Acidic, Idyllic, Verdant Acid,
      Piercing, Poison Defiled Deathly, Eldritch, Entropy, Instinct, Progress, Radioactive, Space, Technological, Thrill, Toxic Necrotic, Psychic, Slashing Turbulent Airy, Aquatic, Frigid, Storming Cold,
      Lightning, Thunder Unforgiving Luminous, Rocky, Scorching Bludgeoning, Fire, Radiant</p>
