_id: HyocMkLrlaDDCIho
name: The World Speaks
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You have become the herald of your world. You can cast <em>Commune with Nature</em> without a spell slot once, and you regain the ability to do so when you finish a Long Rest.</p><p>In addition,
      when you activate your Planetary Embodiment feature, you can empower it. When you do, the Emanation of your Biome Sanctuary feature increases to 30 feet for 1 minute. During that minute, the Emanation
      is Difficult Terrain for your enemies and an enemy that enters the Emanation for the first time on a turn or starts its turn there must make a saving throw against your spell save DC. The type of
      saving throw and the effect on a failed save are determined by the embodiment chosen. Once you empower your Emanation this way, you can’t do so again until you finish a Long Rest.</p><p><strong>Abundant
      (Strength Saving Throw).</strong> On a failed save, the target has the Restrained condition until the start of its next turn.</p><p><strong>Defiled (Wisdom Saving Throw).</strong> On a failed save,
      immediately after the target takes an action or a Bonus Action before the start of its next turn, it takes 3d8 damage of a type determined by your World Bond (your choice).</p><p><strong>Turbulent
      (Strength Saving Throw).</strong> On a failed save, the target has the Prone condition, and its Speed is 0 until the start of its next turn.</p><p><strong>Unforgiving (Constitution Saving Throw).</strong>
      On a failed save, the target gains 1 Exhaustion level. This can’t raise a creature’s Exhaustion level above 3.</p>
