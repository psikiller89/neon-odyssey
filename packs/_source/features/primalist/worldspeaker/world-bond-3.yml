name: World Bond
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: '<p>You have a strong bond with the world soul of a planet important to you. You know the <em>Elementalism</em> cantrip or another Primalist cantrip of your choice. When you finish a Long Rest,
      choose a bond: Abundant, Defiled, Turbulent, or Unforgiving. You form a bond with a matching world soul (you needn’t be on such a world at the time) until you finish your next Long Rest. When you
      deal damage with a spell, you can change the spell’s damage type to one associated with your bond.</p>'
