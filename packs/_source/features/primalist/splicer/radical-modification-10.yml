_id: 5U5M6HFzxA4fyiMk
name: Radical Modification
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: '<p>You discover stranger and more alien adaptations in your experiments. You gain the following benefits.</p><p><strong>Extra Aspect.</strong> When you assume a Primal Form, you can choose one
      additional Primal Aspect (total of two additional aspects).</p><p><strong>Outer Assimilation.</strong> You add the following Primal Aspects to your list of options:</p><ul><li><p><strong>Alien Adaptation</strong>
      <em>Prerequisite: Level 10+ Splicer</em> You have Resistance to one of the following damage types of your choice: Force, Necrotic, Psychic, or Radiant.</p></li><li><p><strong>Hulking</strong> <em>Prerequisite:
      Level 10+ Splicer, Battle Form</em> Your size becomes Huge if there is room to grow, and your reach increases by 5 feet.</p></li><li><p><strong>Neurotoxin</strong> <em>Prerequisite: Level 10+ Splicer</em>
      When you hit a creature with an attack that deals Piercing or Slashing damage, the target makes a Constitution saving throw against your spell save DC. On a failed save, it takes 2d8 Poison damage
      and has the Paralyzed condition until the start of your next turn. On a successful save, it takes half as much damage only.</p></li><li><p><strong>Regeneration</strong> <em>Prerequisite: Level 10+
      Splicer</em> While you are Bloodied and have at least 1 Hit Point, you regain 5 Hit Points at the start of your turn.</p></li><li><p><strong>Shriek</strong> <em>Prerequisite: Level 10+ Splicer</em>
      You gain the following Bonus Action.</p></li></ul>'
