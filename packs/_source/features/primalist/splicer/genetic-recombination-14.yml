name: Genetic Recombination
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You can gene-splice others into a stable, beneficial form in addition to yourself. You gain the following benefits.</p><p><strong>Gift of Splicing.</strong> After 1 hour of magical or medical
      operation on a willing creature within reach (this work can be done during a Short or Long Rest), the creature gains the effect of one Primal Aspect of your choice that doesn’t have a level or subclass
      prerequisite for 24 hours or until you use this benefit again. You can gene-splice a number of creatures equal to your Wisdom modifier (minimum one) at one time.</p><p><strong>Lingering Modifications.</strong>
      When you use the Stable Alterations benefit of your Warping Biology feature, you can now choose two aspects to manifest even while not in a Primal Form.</p>
