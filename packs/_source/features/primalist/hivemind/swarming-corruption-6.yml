type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>Your infinite swarm becomes even more endless and corruptive.</p><p><strong>Devouring Swarm.</strong> A creature that fails its saving throw against your Cacophonous Swarm has its AC reduced
      by 1 until the start of your next turn.</p><p><strong>Discordant Resistance.</strong> You gain Resistance to the damage type determined by your Discordant Tone.</p><p><strong>Tide of Discord.</strong>
      The size of the Emanation created by your Cacophonous Swarm increases to 15 feet. In addition, the base damage dealt by your swarm increases to 2d6.</p>
