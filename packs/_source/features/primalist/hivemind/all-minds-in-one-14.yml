name: All Minds in One
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You have achieved the perfect mental link with your swarm. You gain the following benefits.</p><p><strong>Voracious Corruption.</strong> The base damage dealt by your Cacophonous Swarm increases
      to 4d6, and a creature that fails its save has its AC reduced by 2 until the start of your next turn instead of by 1. Additionally, if a creature succeeds on its saving throw against your Cacophonous
      Swarm, it takes half as much damage only.</p><p><strong>Perfect Hivemind.</strong> When you activate your Cacophonous Swarm, you can instead choose to manifest it as two to four 5-foot-radius Spheres.
      When manifest as multiple Spheres the swarm’s damage is reduced to 2d6.</p><p>Each Sphere appears in a space you can see within 120 feet of yourself. As a Bonus Action, you can move each Sphere up
      to 30 feet, but no farther than 120 feet away from yourself.</p><p>You must choose which Sphere to use when using your Swarm Perception or Cast Spells benefits. While using your swarm’s senses, you
      can speak through it, with your voice emitting from the swarm.</p><p>Instead of targeting one creature with your Cacophonous Swarm effect, you can choose one creature you can see in each of the Spheres.</p>
