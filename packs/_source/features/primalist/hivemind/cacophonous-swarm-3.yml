_id: xDDIgCFP2c5oQit3
name: Cacophonous Swarm
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>The corruptive swarms of Cacophony respond to your every thought. As a Bonus Action, you can expend a use of your Primal Channel to manifest a 10-foot Emanation that takes <em>Bane</em>, <em>Ray
      of </em> <em>Enfeeblement</em> <em>Faerie Fire</em>, <em>Web</em> <em>Hold Person</em>, <em>Shield</em> <em>Hideous Laughter</em>, <em>Mirror Image</em> <em>Vampiric Touch</em> <em>Fly</em> <em>Lightning
      Bolt</em> <em>Hypnotic Pattern</em> <em>Blight</em> <em>Vitriolic Sphere</em> <em>Tech Overload</em>* <em>Confusion</em> <em>Cone of Cold</em> <em>Insect Plague</em> <em>Animate Objects</em> <em>Mislead</em>
      the form of a swarm that aligns with your Discordant Tone. For example, a Hivemind of Instinct might have a swarm of shimmering beetles or biting flies; Entropy might manifest a host of tiny bat-like
      creatures or a virulent fog; a Thrill swarm might appear as a cloud of aggressive confetti or animated demonic balloon animals; and a Hivemind of Progress might emit a swarm of tiny robotic entities
      or even an aura of ionized discharges crackling in the air.</p><p>The swarm surrounds you for 10 minutes. It ends early if you dismiss it (no action required), manifest it again, have the Unconscious
      condition, or die.</p><p>When you manifest the swarm and as a Bonus Action on your subsequent turns, you can choose another creature you can see in the Emanation. The target must succeed on a Constitution
      saving throw against your spell save DC or take 1d6 Necrotic damage and suffer an additional effect based on your tone.</p><p><strong>Entropy.</strong> The target takes an extra 1d6 Necrotic damage
      and gains 1 Exhaustion level (this can’t increase the target’s Exhaustion level higher than 1).</p><p><strong>Instinct.</strong> The target has the Restrained condition until the start of your next
      turn.</p><p><strong>Progress.</strong> The target has the Blinded condition until the start of your next turn.</p><p><strong>Thrill.</strong> The target takes an extra 1d6 Necrotic damage and has
      the Frightened condition until the start of your next turn.</p>
