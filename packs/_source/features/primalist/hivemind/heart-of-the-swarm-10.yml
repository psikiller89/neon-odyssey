_id: nxw46nqCu7O0sEY2
name: Heart of the Swarm
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>Your swarm grows and reaches beyond for new targets to devour, no longer bound to remain in your space. As part of the Bonus Action when you activate your Cacophonous Swarm or as a Bonus Action
      on subsequent turns, you can cause your swarm to form a 10-foot-radius Sphere centered on a point within 120 feet of you that you can see. The swarm can occupy a creature’s space and vice-versa, and
      it can move through an opening as small as 1-inch. While the Sphere persists, you have the following benefits.</p><p><strong>Cast Spells.</strong> You can cast spells as if you were in your swarm’s
      space.</p><p><strong>Move. </strong>As a Bonus Action, you can move your swarm up to 30 feet, but no farther than 120 feet away from yourself. When you do so, you can choose a creature in the Sphere
      as if it were an Emanation per your Cacophonous Swarm feature.</p><p><strong>Swarm Perception.</strong> As a Bonus Action, you can see through the swarm’s eyes and hear what it hears until the start
      of your next turn. The swarm has Darkvision and hearing to a range of 60 feet.</p>
