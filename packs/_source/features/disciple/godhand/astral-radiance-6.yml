type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>The godly radiance of the stars grows brighter, granting you the following benefits.</p><p><strong>Astral Wave.</strong> As a Magic action, you can expend 2 Essence Points to unleash a wave
      of crackling stellar brilliance in a 60foot Line that is 10 feet wide. Each creature in the Line must make a Dexterity saving throw. On a failed save, a creature takes Radiant damage equal to three
      rolls of your Combat Tradition die. On a successful save, a creature takes half as much damage.</p><p><strong>Emissary of the Gods.</strong> You have Resistance to Radiant damage.</p><p><strong>Godhand’s
      Reach.</strong> The range of your radiant blasts from your Star Gauntlet feature increases to 120 feet.</p>
