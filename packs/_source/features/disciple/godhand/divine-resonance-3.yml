name: Divine Resonance
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>Your soul resonates with one of the godly triads of Agathos. You gain proficiency in the Religion skill (or another skill of your choice if you already have it), and you know the <em>Thaumaturgy</em>
      cantrip. If you already know it, you learn a different cantrip of your choice from the Oracle spell list. Wisdom is your spellcasting ability for it.</p><p>Additionally, when you gain this feature,
      choose one of the triads on the Triad Affinity table. Once per turn, when you hit a creature with an Unarmed Strike or with the radiant blast of your Star Gauntlet feature, you can apply the resonance
      effect associated with your chosen triad. Beacon The next attack roll that misses the target before the end of your next turn adds 1d4 to the total, potentially causing it to hit. Chronicle You can
      push the target up to 10 feet away from you. Fountain The next time the target deals damage before the start of your next turn, reduce the damage by one roll of your Combat Tradition die. Tower The
      target has Disadvantage on the next attack roll it makes before the end of your next turn.</p>
