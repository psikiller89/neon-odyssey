_id: HGFq5M1sDcuM5NIy
name: Hand of God
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You are the hand of the gods and can unleash the brilliant might of Agathos. As a Magic action, you can expend 3 Essence Points to flare with stellar radiance for 1 minute, until you have
      the Incapacitated condition, or until you end your turn in an area of Darkness created by level 5+ spell. While flaring, you gain the following benefits.</p><p><strong>Blazing Hand.</strong> Once
      on each of your turns when you hit a target with an attack roll using an Unarmed Strike, the radiant blast of your Star Gauntlet feature, or a Disciple weapon, the target takes extra Radiant damage
      equal to one roll of your Combat Tradition die.</p><p><strong>Corona.</strong> You shed Bright Light in a 30-foot radius and Dim Light for an additional 30 feet. For the duration, at the start of
      each of your turns, you can apply your Divine Resonance to one creature of your choice within the Bright Light.</p><p><strong>Soul of Stars.</strong> You can use your Ensouled Strikes without expending
      any Essence Points.</p>
