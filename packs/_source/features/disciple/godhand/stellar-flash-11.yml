name: Stellar Flash
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You can briefly transform into a being of divine starlight. When you take the Dash action, until the end of the turn, you can spend 10 feet of movement to teleport to an unoccupied space you
      can see within 10 feet of yourself.</p><p>In addition, if you expend 1 Essence Point to use your Flowing Step to take the Dash action, the range up to which you can teleport increases to your Speed,
      and you spend an amount of movement equal to the distance you teleport. If you do, you unleash a flash of Dim Light in a 30-foot Emanation originating from your destination space. You can apply your
      Divine Resonance to each creature of your choice in the Emanation.</p>
