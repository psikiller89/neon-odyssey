system:
  description:
    value: <p>Your augments empower you to strike from the shadows. You gain the following benefits.</p><p><strong>Blade Master.</strong> Combat Swords are Disciple weapons for you.</p><p><strong>Infiltration
      Mode.</strong> You can take the Hide action as a Bonus Action. When you expend an Essence Point to use Flowing Step, you can replace the Dash or Disengage action with the Hide action, and you can
      hide even while in an enemy’s line of sight.</p><p><strong>Livewire Strike.</strong> Once per turn, when you hit with an Unarmed Strike or a Powered weapon and deal damage, you can expend 1 Essence
      Point to deal extra Lightning damage equal to two rolls of your Combat Tradition die.</p>
