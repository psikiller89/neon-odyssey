_id: UrJNwA4DKpIto7ph
name: Synthetic Supremacy
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You embrace the machine and unlock the soul in the steel. You gain the following benefits.</p><p><strong>Cyber Assassin.</strong> At the start of your turn, you can expend 1 Essence Point
      to enter a charged state for 10 minutes or until you have the Incapacitated condition. For the duration, your weapons that use Power Cells don’t drain charges from their cells or can operate without
      a cell, and you score a Critical Hit with them on a roll of 19 or 20 on the d20.</p><p><strong>Power Drain.</strong> As a Bonus Action, you can drain and destroy a fully charged Power Cell you’re
      carrying to regain 1d8 expended Essence Points. You can’t use this benefit again until you finish a Short or Long Rest.</p><p><strong>Shielded Core.</strong> You gain Resistance to Lightning damage.</p>
