  description:
    value: <p>Your body is upgraded with soul-powered cybernetics. You gain the following benefits.</p><p><strong>Sensory Upgrade.</strong> You gain Darkvision with a range of 60 feet. If you already have
      Darkvision, its range increases by 60 feet.</p><p><strong>Synthetic Speech.</strong> You know SIGNAL, the language of programs and bots.</p><p><strong>Tech Interface.</strong> You gain proficiency
      in your choice of the Computers or Technology skill if you don’t already have it, and you gain a bonus to Intelligence checks using either of those skills. The bonus equals your Wisdom modifier (minimum
      bonus of +1).</p>
