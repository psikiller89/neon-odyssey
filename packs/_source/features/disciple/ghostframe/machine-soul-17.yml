name: Machine Soul
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You eliminate the line between flesh, machine, and soul. While your Cyber Assassin feature is active. You gain the following benefits:</p><p><strong>Active Camouflage.</strong> As a Bonus
      Action, you can give yourself the Invisible condition until the start of your next turn. The condition ends early if you damage a creature or force anyone to make a saving throw.</p><p><strong>Core
      Conduit.</strong> Once on each of your turns, when you hit with an Unarmed Strike or a Disciple weapon and deal damage, you can deal extra Lightning damage equal to one roll of your Combat Tradition
      die.</p><p><strong>Cutting Edge Sensors.</strong> You gain Truesight with a range of 60 feet.</p>
