name: Essence Amplification
type: feat
img: icons/skills/movement/arrows-up-trio-red.webp
system:
  description:
    value: <p>Your control over the flow of Essence increases. Your Ensouled Strikes, Flowing Step, and Measured Guard gain the following benefits.</p><p><strong>Ensouled Strikes.</strong> You can expend
      1 Essence Point to use Ensouled Strikes and make three Unarmed Strikes with it instead of two.</p><p><strong>Flowing Step.</strong> When you expend an Essence Point to use Flowing Step, you can choose
      a willing creature within 5 feet of yourself that is Large or smaller. You move the creature with you until the end of your turn. The creature’s movement doesn’t provoke Opportunity Attacks.</p><p><strong>Measured
      Guard.</strong> When you expend an Essence Point to use Measured Guard, you gain a number of Temporary Hit Points equal to two rolls of your die.</p>
