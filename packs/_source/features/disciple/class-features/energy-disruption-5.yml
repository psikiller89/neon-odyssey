name: Energy Disruption
type: feat
img: icons/skills/melee/unarmed-punch-fist-blue.webp
system:
  description:
    value: <p>Your strikes can block and disrupt the flow of energy within your foes. Once per turn when you hit a creature with a Disciple weapon or an Unarmed Strike, you can expend 1 Essence Point to
      disrupt the target’s essential energies. The target must make a Constitution saving throw. On a failed save, the target has the Stunned condition until the start of your next turn. On a successful
      save, the target’s Speed is halved until the start of your next turn, and the next attack roll made against the target before then has Advantage.</p>
