name: Channeled Essence
type: feat
img: icons/creatures/eyes/human-single-brown.webp
system:
  description:
    value: '<p>Your cultivation of the connection between your body and soul allows you to channel spiritual energy within you. This energy is represented by Essence Points. Your Disciple level determines
      the number of points you have, as shown in the Essence Points column of the Disciple Features table.</p><p>You can expend these points to enhance or fuel certain Disciple features. You start knowing
      three such features: Ensouled Strikes, Flowing Step, and Measured Guard, each of which is detailed below.</p><p>When you expend an Essence Point, it is unavailable until you finish a Short or Long
      Rest, at the end of which you regain all your expended points.</p><p>Some features that use Essence Points require your target to make a saving throw. The save DC equals 8 plus your Wisdom modifier
      and Proficiency Bonus.</p><p><strong>Ensouled Strikes.</strong> You can expend 1 Essence Point to make two Unarmed Strikes as a Bonus Action.</p><p><strong>Flowing Step.</strong> You can take the
      Dash action as a Bonus Action. Alternatively, you can expend 1 Essence Point to take both the Disengage and Dash actions as a Bonus Action, and your jump distance is doubled for the turn.</p><p><strong>Measured
      Guard.</strong> You can take the Disengage action as a Bonus Action. Alternatively, you can expend 1 Essence Point to take both the Disengage and the Dodge actions as a Bonus Action.</p>'
