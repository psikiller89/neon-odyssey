_id: MjmVT6i7IzuTEbtq
name: Combat Tradition
type: feat
img: icons/skills/melee/maneuver-sword-katana-yellow.webp
system:
  description:
    value: <p>Your dedication to martial tradition makes you a skilled combatant with your Unarmed Strike and Disciple weapons, which are the following:</p><ul><li><p>Simple Melee weapons</p></li><li><p>Martial
      Melee weapons that have the Light property You gain the following benefits while you are unarmed or wielding only Disciple weapons and you aren’t wearing armor or wielding a Shield.</p></li></ul><p><strong>Bonus
      Unarmed Strike.</strong> You can make an Unarmed Strike as a Bonus Action.</p><p><strong>Combat Tradition Die.</strong> You can roll 1d6 in place of the normal damage of your Unarmed Strike or Disciple
      weapons. This die changes as you gain Disciple levels, as shown in the Combat Tradition column of the Disciple Features table.</p><p><strong>Dexterous Attacks.</strong> You can use your Dexterity
      modifier instead of your Strength modifier for the attack and damage rolls of your Unarmed Strikes and Disciple weapons. In addition, when you use the Grapple or Shove option of your Unarmed Strike,
      you can use your Dexterity modifier instead of your Strength modifier to determine the save DC.</p>
