  description:
    value: <p>As part of a Short or Long Rest, you can create a Combat Staff or two Sabers (your choice) that lack the Powered property. The striking ends or blades of the weapons are made of crystal and
      channel your balanced energies. You can activate their mastery properties. The weapons vanish if you create more or if you die.</p><p>Whenever you can make an Unarmed Strike as part of a Bonus Action,
      you can make an attack with one of the weapons instead. Whenever you hit with one of the weapons, you can cause it to deal Necrotic or Radiant damage instead of the normal damage type.</p>
