_id: OjgLlzoGemOzrWfY
name: Harmony’s Balance
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>Your connection to the Harmony shifts between its natural aspects—the flourishing and lifegiving Vital Harmony, and the fading and deathly Somber Harmony. When you finish a Long Rest, your
      balance shifts toward one of these aspects of your choice.</p><p>Once per turn, when you restore Hit Points to a creature, you can shift your balance to Vital, and when you deal Necrotic damage to
      a creature, you can shift your balance to Somber.</p><p><strong>Vital.</strong> While your balance is Vital, you have Resistance to Necrotic damage and Advantage on Constitution saving throws. Additionally,
      you can expend 2 Essence Points to cast <em>Lesser Restoration</em> without a spell slot.</p><p><strong>Somber.</strong> While your balance is Somber, you have Resistance to Radiant damage and Advantage
      on Initiative rolls. Additionally, you can expend 2 Essence Points to cast <em>Hold Person</em> without a spell slot.</p>
