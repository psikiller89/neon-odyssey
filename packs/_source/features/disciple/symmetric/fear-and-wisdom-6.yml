type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: '<p>You can reach out through the Harmony to close the distance to your foes or influence the minds of others.</p><p><strong>Whirling Force.</strong> Your Harmonic Weapons gain the Thrown property
      with a normal range of 60 feet and a long range of 120 feet. An enemy within 5 feet of you doesn’t impose Disadvantage on the attack roll when you throw the weapon, and the weapon returns to your
      hand immediately after the attack hits or misses.</p><p><strong>Harmonious Revelation.</strong> As a Magic action, you can expend 3 Essence Points to create one of the following effects of your choice,
      then shift your balance to the corresponding aspect if it isn’t already. <strong>Vital: Mind Touch.</strong> You cast <em>Suggestion</em> without a spell slot. If the target isn’t currently fighting
      you or your allies, it has Disadvantage on the saving throw. <strong>Somber: Inevitable End.</strong> You cast <em>Fear</em> without a spell slot. A Bloodied creature has Disadvantage on saving throws
      against the spell.</p>'
