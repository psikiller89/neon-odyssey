name: Lifeforce Control
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: '<p>Once per turn when you activate one of your Channeled Essence options using an Essence Point, you can activate one of the following effects of your choice: <strong>Redirect Vitality.</strong>
      One creature you can see within 30 feet of yourself (you can target yourself) regains a number of Hit Points equal to one roll of your Combat Tradition die. <strong>Somber Cull.</strong> The next
      creature you hit with an attack roll before the end of your next turn takes extra Necrotic damage equal to one roll of your Combat Tradition die.</p>'
