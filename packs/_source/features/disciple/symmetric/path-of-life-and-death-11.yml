_id: m0EIk7Vb3xbS49ix
name: Path of Life and Death
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You can feel the Harmony’s flow moving throughout the galaxy, and you follow where it leads. When you use your Flowing Step, you gain a Fly Speed equal to your Speed until the start of your
      next turn. If you use Flowing Step at the start of that turn, you don’t fall.</p><p>If you activate Flowing Step using an Essence Point, until the end of the turn, you also increase your Speed by
      20 feet, and when you move within 5 feet of a creature, you can impart Harmony energies into it. Choose one of the effects below and shift your balance to the corresponding aspect if it isn’t already.
      A creature can be affected only once per turn. <strong>Vital.</strong> The creature regains Hit Points equal to one roll of your Combat Tradition die. <strong>Somber.</strong> The creature takes Necrotic
      damage equal to one roll of your Combat Tradition die.</p>
