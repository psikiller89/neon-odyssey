name: One with the Harmony
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>You have achieved unification with the Harmony, granting you the following benefits.</p><p><strong>Prescient Balance.</strong> When you roll Initiative, before the roll, you can choose your
      balance aspect.</p><p><strong>Harmonic Realignment.</strong> When you take Necrotic damage, Radiant damage, or make a Constitution saving throw, you can take a Reaction to choose your balance aspect.</p><p><strong>Leveled
      Scales.</strong> On your turn, you can expend 1 Essence Point to enter a state of pure balance for 1 minute (no action required). For the duration, when you use Lifeforce Control or Path of Balance,
      you activate both Vital and Somber options of those features instead of choosing one, and your Lifeforce Control options make two rolls of your Combat Tradition die instead of one.</p>
