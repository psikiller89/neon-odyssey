name: Reality Override
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>Your digital soul untethers you from the rules of reality. You gain the following benefits.</p><p><strong>See the Simulation. </strong>You can expend 1 Essence Point to cast <em>See Invisibility</em>
      without spell components. Once during the spell’s duration, on your turn, you can choose to see through solid objects up to 1 foot thick that are within 60 feet of you. This special vision lasts until
      the end of your turn.</p><p><strong>Grid Breach.</strong> You can expend 1 Essence Point as a Bonus Action to teleport up to 60 feet to an unoccupied space you can see.</p>
