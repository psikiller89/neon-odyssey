name: Glitch in the Hypergrid
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>Your connection to the Hypergrid grants your body and soul additional combat features. You gain the following benefits.</p><p><strong>Hyper Arsenal.</strong> Simple Ranged weapons are Disciple
      weapons for you, and Submachine Guns have the Light property for you.</p><p><strong>Ballistic Protocol.</strong> When you use Ensouled Strikes, you can use a Simple Ranged weapon with the Light property
      to make the extra attacks that feature grants instead of Unarmed Strikes.</p><p><strong>Gridwarped Strikes.</strong> Once per turn, when you hit a creature with an attack roll using a Disciple weapon
      or an Unarmed Strike, you can push the target up to 10 feet away from yourself.</p>
