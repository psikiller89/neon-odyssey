_id: FUE6tI9pHEUfxHyC
name: Impossible No More
type: feat
img: icons/svg/upgrade.svg
system:
  description:
    value: <p>The code of your soul shatters the rules of reality. As a Magic action, you can expend 3 Essence Points to transcend your limits. This form lasts for 1 minute or until you have the Incapacitated
      condition. You gain the following benefits while this feature is active.</p><p><strong>Bullet Time.</strong> Ranged attacks made against you and your allies in a 10-foot Emanation originating from
      you have Disadvantage, and you and your allies in the Emanation have Resistance to damage from attacks made with Ranged weapons.</p><p><strong>Form Without Boundary.</strong> You have a Fly Speed
      equal to your Speed, and you can hover.</p><p><strong>Overclock.</strong> You can expend 1 Essence Point to use Ensouled Strikes and make four Unarmed Strikes with it instead of three.</p>
