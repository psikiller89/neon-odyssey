  description:
    value: <p><em>Connect with Living Worlds to Harness Planetary Power</em> Worldspeakers are conduits of the living world souls at the core of planets across the Stardust Rhapsody, feeling their intense
      emotions and sharing in their power. By forming spiritual tethers with these elemental entities, they can usher forth the untamed environments and biomes of their bonded worlds wherever they find
      themselves. Most Worldspeakers become influenced by the planet they’re most connected to, even taking on personality traits or physical characteristics that resemble its unique elemental attributes.</p>
