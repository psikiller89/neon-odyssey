  description:
    value: <p><em>Engineer Your Flesh with Genetic Experimentation</em> Splicers are Primalists who believe that science is simply an expression of interacting with the natural world, looking to discover
      ways to fuse the scientific and primordial to enhance themselves. By splicing their DNA with the biology of primordial and alien creatures, they can alter their flesh in bizarre new ways and become
      an evolved amalgamation never before seen. Many Splicers view their body as a research laboratory, experimenting on themselves and concocting new chimeric fusions until they discover the apex lifeform.</p>
