img: modules/neon-odyssey/icons/classes/primalist.png
system:
  description:
    value: '<h3>Core Primalist Traits</h3><table class="core-class-traits"><tbody><tr><th scope="row"><p>Primary Ability</p></th><td><p>Wisdom</p></td></tr><tr><th scope="row"><p>Hit Point Die</p></th><td><p>D8
      per Primalist level</p></td></tr><tr><th scope="row"><p>Saving Throw Proficiencies</p></th><td><p>Intelligence and Wisdom</p></td></tr><tr><th scope="row"><p>Skill Proficiencies</p></th><td><p>Choose
      2: Arcana, Animal Handling, Insight, Medicine, Nature, Perception, Religion, or Survival</p></td></tr><tr><th scope="row"><p>Weapon Proficiencies</p></th><td><p>Simple weapons</p></td></tr><tr><th
      scope="row"><p>Tool Proficiencies</p></th><td><p>Pharma Kit</p></td></tr><tr><th scope="row"><p>Armor Training</p></th><td><p>Light armor and Shields</p></td></tr><tr><th scope="row"><p>Starting Equipment</p></th><td><p>Choose
      A or B: (A) Light Armor, Shield, Hatchet, Laser Carbine, 2 Power Cells, Pharma Kit, Primal Focus (bone token), Outrunner’s Pack, and $70; or (B) $4,000</p></td></tr></tbody></table><p><strong>Primary
      Ability</strong> Wisdom <strong>Hit Point Die</strong> D8 per Primalist level <strong>Saving Throw  Proficiencies</strong> Intelligence and Wisdom <strong>Skill Proficiencies</strong> <em>Choose 2:</em>
      Arcana, Animal Handling, Insight, Medicine, Nature, Perception, Religion, or Survival <strong>Weapon  Proficiencies</strong> Simple weapons <strong>Tool Proficiencies</strong> Pharma Kit <strong>Armor
      Training</strong> Light armor and Shields <strong>Starting  Equipment</strong> <em>Choose A or B:</em> (A) Light Armor, Shield, Hatchet, Laser Carbine, 2 Power Cells, Pharma Kit, Primal Focus (bone
      token), Outrunner’s Pack, and $70; or (B) $4,000 Primalists feel the living pulse of the untamed primordial energy that first exploded into being when the song of creation was first sung. No matter
      how much technology and civilization spreads throughout the galaxy, this wild power still surges at the heart of every planet and throughout the unbound elemental chaos that thrives in the wild places
      of existence. Primalists tap into this archaic essence to unleash primal magic of the raw elements, alien beasts, planetary world souls, and everything ancient and untamed.</p><p>How Primalists approach
      their calling is as varied as the wild forces that suffuse them. They may channel the raw elements to unleash destruction or rejuvenation, focus on changing their shape to become what some would deem
      alien, or seek a mystical bond with primal creatures and world souls. Regardless of the approach, the manifestation of their magic is as untamed as the volatile forces they revere.</p><p>Although
      they harness the wild or even prehistoric energies that are often at odds with modernity, most Primalists accept that the galaxy is a technological one and do not eschew its advancements. They can
      be found piloting starships, living in neon-soaked cities, or utilizing powered gear and weapons, but a rare few seek a solitary or communal life stripped of the trappings of the mechanical world.
      No matter how they live, they always bring their unique, primal perspective to everything they do.</p>'
