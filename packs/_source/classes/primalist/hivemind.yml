  description:
    value: <p><em>Command the Infinite as One Through Discordant Swarms</em> Hiveminds are Primalists fascinated by the corrupting influence of Cacophony on the natural world and its ability to twist all
      life into malevolent mockeries of what they once were. They claim this union of Discordant and primordial for themselves, utilizing it to summon and dominate endless swarms of creatures corrupted
      by Cacophony. Most Hiveminds use this as a weapon to fight back against the Discordant powers and all else who would defile the wild, but some fall to corruption themselves and become agents of Entropy,
      Instinct, Progress, or Thrill.</p>
