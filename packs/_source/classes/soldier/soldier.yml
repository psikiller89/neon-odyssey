_id: ylyjb9FTJEZvuJHZ
name: Soldier
type: class
img: modules/neon-odyssey/icons/classes/soldier.png
system:
  description:
    value: '<h3>Core Soldier Traits</h3><table class="core-class-traits"><tbody><tr><th scope="row"><p>Primary Ability</p></th><td><p>Strength or Dexterity</p></td></tr><tr><th scope="row"><p>Hit Point
      Die</p></th><td><p>D10 per Soldier level</p></td></tr><tr><th scope="row"><p>Saving Throw Proficiencies</p></th><td><p>Strength and Constitution</p></td></tr><tr><th scope="row"><p>Skill Proficiencies</p></th><td><p>Choose
      2: Acrobatics, Athletics, History, Insight, Intimidation, Medicine, Persuasion, Perception, Stealth, or Survival</p></td></tr><tr><th scope="row"><p>Weapon Proficiencies</p></th><td><p>Simple and
      Martial weapons</p></td></tr><tr><th scope="row"><p>Armor Training</p></th><td><p>Light, Medium, and Heavy armor and Shields</p></td></tr><tr><th scope="row"><p>Starting Equipment</p></th><td><p>Choose
      A, B, or C: (A) Heavy Armor, Mag Flail, Breach Rifle, Heavy Laser Pistol, 2 Power Cells, 40 Shells, 2 Magazines, Outrunner’s Pack, and $150; (B) Light Armor (Composite Weave), Quickblade, Saber, Plasma
      Pistol, Repeating Laser, 4 Power Cells, Outrunner’s Pack, and $120; or (C) $11,000</p></td></tr></tbody></table><p><strong>Primary Ability</strong> Strength or Dexterity <strong>Hit Point Die</strong>
      D10 per Soldier level <strong>Saving Throw  Proficiencies</strong> Strength and Constitution <strong>Skill Proficiencies</strong> <em>Choose 2:</em> Acrobatics, Athletics, History, Insight, Intimidation,
      Medicine, Persuasion, Perception, Stealth, or Survival <strong>Weapon  Proficiencies</strong> Simple and Martial weapons <strong>Armor Training</strong> Light, Medium, and Heavy armor and Shields
      <strong>Starting  Equipment</strong> <em>Choose A, B, or C:</em> (A) Heavy Armor, Mag Flail, Breach Rifle, Heavy Laser Pistol, 2 Power Cells, 40 Shells, 2 Magazines, Outrunner’s Pack, and $150; (B)
      Light Armor (Composite Weave), Quickblade, Saber, Plasma Pistol, Repeating Laser, 4 Power Cells, Outrunner’s Pack, and $120; or (C) $11,000 Soldiers are combat experts with the skill and discipline
      to fight and survive in a galaxy at war. Their training and experience have earned them mastery of the weapons, armor, and equipment needed to claim victory on battlefields of any scale. They have
      a deep understanding of the strategy and tactics that define every stage of a conflict, from planning to execution and aftermath.</p><p>For most Soldiers, there is strength in numbers, and they share
      the belief that the best way to endure the innumerable dangers of the Stardust Rhapsody is to stand together. Even if they have long since left a formal military, they often seek out a new group of
      comrades that they can call their unit. Solitary Soldiers will wander the stars and lend their combat prowess and leadership to various minor conflicts before moving on once more.</p><p>Soldiers can
      be found on every battlefield across the galaxy. Whether career military, conscripted fighters, veteran mercenaries, bodyguards, or even bounty hunters, the art of battle is their shared language,
      and they drill relentlessly to master it. Whatever their origin, Soldiers know the cost of victory and will make the hard choices to achieve it, protecting those they call comrades.</p>'
    chat: ''
  source:
