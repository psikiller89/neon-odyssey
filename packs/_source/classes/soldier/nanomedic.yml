  description:
    value: <p><em>Treat the Wounded with Nanite Field Medicine</em> Nanomedics are Soldiers who use highly advanced nanomachines to save the dying on battlefields across the galaxy. Equal parts warrior
      and healer, these field medics perform critical triage and direct their countless microscopic bots to close wounds, neutralize infections, and even snatch mortally wounded comrades from the brink
      of death. Their nanite clusters can take a variety of forms when deployed, appearing as billowing clouds, crawling swarms, or beams of gel-like material.</p>
