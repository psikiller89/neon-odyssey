system:
  description:
    value: <p><em>Control the Living and the Dead with a Whisper</em> Shadowtongues have uncovered the truths of mortal life essence and the ways in which the Harmony flows through living things, and they
      have learned how to manipulate and dominate it with their voice alone. They whisper secret frequencies to twist emotion and desire toward their aims, eventually discovering how to sever one’s connection
      to the Harmony to bind mind, body, and soul to their will. Many Shadowtongues find themselves in positions of power, guiding the galaxy from the shadows, while others forgo the concerns of the living
      and fully embrace the curse of undeath.</p>
