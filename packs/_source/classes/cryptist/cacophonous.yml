  description:
    value: <p><em>Corrupt Body and Soul with Discordant Powers</em> The Cacophonous are especially cunning Cryptists who seek to outmaneuver the wicked malevolence of the Discordant to claim their fiendish
      power for themselves. They rip open tears to Cacophony to corrupt the body, mind, and soul of their enemies, marking them to succumb to the influences of Entropy, Instinct, Progress, or Thrill. Although
      they harness evil itself, many Cacophonous preserve their own souls through rigid discipline and calculated maneuvering, although some fully embrace the corruption and ascend to a new Discordant state
      of being.</p>
