name: Cryptist
type: class
img: modules/neon-odyssey/icons/classes/cryptist.png
system:
  description:
    value: '<h3>Core Cryptist Traits</h3><table class="core-class-traits"><tbody><tr><th scope="row"><p>Primary Ability</p></th><td><p>Choose 1: Intelligence or Charisma</p></td></tr><tr><th scope="row"><p>Hit
      Point Die</p></th><td><p>D8 per Cryptist level</p></td></tr><tr><th scope="row"><p>Saving Throw Proficiencies</p></th><td><p>Wisdom and your Primary Ability</p></td></tr><tr><th scope="row"><p>Skill
      Proficiencies</p></th><td><p>Choose 2: Arcana, Deception, History, Intimidation, Investigation, Nature, Perception, or Religion</p></td></tr><tr><th scope="row"><p>Weapon Proficiencies</p></th><td><p>Simple
      weapons</p></td></tr><tr><th scope="row"><p>Armor Training</p></th><td><p>Light armor</p></td></tr><tr><th scope="row"><p>Starting Equipment</p></th><td><p>Choose A or B: (A) Light Armor, Combat Knife,
      Light Pistol, 20 Bullets, Power Cell, Datapad (occult lore), Magazine, Occult Focus (crystal), Academic’s Pack, and $600; or (B) $4,000</p></td></tr></tbody></table><p><strong>Primary Ability</strong>
      <em>Choose 1:</em> Intelligence or Charisma <strong>Hit Point Die</strong> D8 per Cryptist level <strong>Saving Throw  Proficiencies</strong> Wisdom and your Primary Ability <strong>Skill Proficiencies</strong>
      <em>Choose 2:</em> Arcana, Deception, History, Intimidation, Investigation, Nature, Perception, or Religion <strong>Weapon  Proficiencies</strong> Simple weapons <strong>Armor Training</strong> Light
      armor <strong>Starting  Equipment</strong> <em>Choose A or B:</em> (A) Light Armor, Combat Knife, Light Pistol, 20 Bullets, Power Cell, Datapad (occult lore), Magazine, Occult Focus (crystal), Academic’s
      Pack, and $600; or (B) $4,000 Cryptists understand that certain truths hidden throughout the Stardust Rhapsody and the realms beyond are keys to unimaginable power. They devote themselves to the search,
      study, and discovery of these secrets, for uncovering and manipulating them can unleash the fundamental forces of the galaxy. They relentlessly delve into the mysteries of creation to unlock increasing
      power and the ability to weave their own potent magic.</p><p>The secrets in which the Cryptists deal are typically well guarded and require great commitment and sacrifice to unearth. Their occult
      practices are considered forbidden by the general galactic sensibility, and most common people would rather these hidden truths stay buried. These concerns do not stop Cryptists, for they know that
      the unenlightened will always fear what they don’t understand.</p><p>Many Cryptists are the ultimate researchers, spending their time in grand archives, buried in codices and data slates. Others seek
      the truth in the field, exploring longforgotten ruins, buried temples, and profane sites tethered to otherworldly realms. No matter the method, Cryptists and their strange spells are immensely valuable
      to the galaxy’s factions, governments, and organizations, and many find a fast track to positions of power across the Stardust Rhapsody.</p>'
