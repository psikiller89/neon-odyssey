system:
  description:
    value: <p><em>Unmake Existence with the Annihilation of the Void</em> The Deepsworn are Cryptists who scour the secrets of the infinite depths of the Abyssal Void and the prophecies that the Stardust
      Rhapsody will end how it began—in darkness. They dredge up the annihilating power of the Deep, unfathomable beings inimical to galactic existence, to unmake whatever or whomever does not fall into
      their cosmic designs. Many Deepsworn are drawn to the lost ruins of the Eldest in hopes to discover truths of what existed before the galaxy, while some look only forward to advance the unraveling
      of the song of creation.</p>
