system:
  description:
    value: '<h3>Core Tracer Traits</h3><table class="core-class-traits"><tbody><tr><th scope="row"><p>Primary Ability</p></th><td><p>Dexterity and Wisdom</p></td></tr><tr><th scope="row"><p>Hit Point Die</p></th><td><p>D10
      per Tracer level</p></td></tr><tr><th scope="row"><p>Saving Throw Proficiencies</p></th><td><p>Strength and Dexterity</p></td></tr><tr><th scope="row"><p>Skill Proficiencies</p></th><td><p>Choose
      3: Animal Handling, Athletics, History, Insight, Investigation, Nature, Perception, Stealth, or Survival</p></td></tr><tr><th scope="row"><p>Weapon Proficiencies</p></th><td><p>Simple and Martial
      weapons</p></td></tr><tr><th scope="row"><p>Armor Training</p></th><td><p>Light and Medium armor and Shields</p></td></tr><tr><th scope="row"><p>Starting Equipment</p></th><td><p>Choose A or B: (A)
      Light Armor (Composite Weave Module), Quickblade, Laser Rifle, Plasma Pistol, 3 Power Cells, Primal Focus (bone token) or Hypertech Component Pack, Outrunner’s Pack, and $470; or (B) $9,000</p></td></tr></tbody></table><p><strong>Primary
      Ability</strong> Dexterity and Wisdom <strong>Hit Point Die</strong> D10 per Tracer level <strong>Saving Throw  Proficiencies</strong> Strength and Dexterity <strong>Skill Proficiencies</strong> <em>Choose
      3:</em> Animal Handling, Athletics, History, Insight, Investigation, Nature, Perception, Stealth, or Survival <strong>Weapon  Proficiencies</strong> Simple and Martial weapons <strong>Armor Training</strong>
      Light and Medium armor and Shields <strong>Starting  Equipment</strong> <em>Choose A or B:</em> (A) Light Armor (Composite Weave Module), Quickblade, Laser Rifle, Plasma Pistol, 3 Power Cells, Primal
      Focus (bone token) or Hypertech Component Pack, Outrunner’s Pack, and $470; or (B) $9,000 Tracers harness the galaxy’s fierce and ancient primordial power to supernaturally enhance their hunter’s
      instinct. This energy exploded into existence when the Stardust Rhapsody first came into being, the inherent spark that would serve as the foundation of the natural, primal world. This connection
      sharpens a Tracer’s sense for stalking prey, reveals changes in their environment that betray hidden clues or lurking danger, and hones the skills necessary for survival in hostile locations.</p><p>Despite
      their magic’s origin as the energies of the natural world and the hunt, Tracers aren’t necessarily beings of the wilderness. Even in sprawling megacities or orbiting space stations, they keenly feel
      the pulse of the hunt. Tracers learn the ways of combat tempered with the need to move swiftly and quietly, and they cultivate magical abilities that tap into the primordial dance of predator and
      prey.</p><p>Tracers find themselves drawn to callings where this inherent understanding of natural cycles can be best put to use. Some serve as hinterland survival guides or space-faring wayfarers.
      Others keep to the neon and steel jungles of megacities and excel as bodyguards, detectives, or bounty hunters.</p>'
    chat: ''
