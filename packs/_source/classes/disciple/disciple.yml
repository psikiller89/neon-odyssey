name: Disciple
type: class
img: modules/neon-odyssey/icons/classes/disciple.png
system:
  description:
    value: '<h3>Core Disciple Traits</h3><table class="core-class-traits"><tbody><tr><th scope="row"><p>Primary Ability</p></th><td><p>Dexterity and Wisdom</p></td></tr><tr><th scope="row"><p>Hit Point
      Die</p></th><td><p>D8 per Disciple level</p></td></tr><tr><th scope="row"><p>Saving Throw Proficiencies</p></th><td><p>Strength and Dexterity</p></td></tr><tr><th scope="row"><p>Skill Proficiencies</p></th><td><p>Choose
      2: Acrobatics, Arcana, Athletics, History, Insight, Investigation, Religion, or Stealth</p></td></tr><tr><th scope="row"><p>Weapon Proficiencies</p></th><td><p>Simple weapons and Martial weapons that
      have the Light property</p></td></tr><tr><th scope="row"><p>Tool Proficiencies</p></th><td><p>Choose one type of Crafter’s Tools or Musician’s Instrument</p></td></tr><tr><th scope="row"><p>Armor
      Training</p></th><td><p>None</p></td></tr><tr><th scope="row"><p>Starting Equipment</p></th><td><p>Choose A or B: (A) Combat Knife, Combat Staf,f 2 Power Cells, Crafter’s Tools or Musician’s Instrument
      chosen for the tool proficiency above, Datapad (philosophy), Outrunner’s Pack, and $720; or (B) $3,000</p></td></tr></tbody></table><p><strong>Primary Ability</strong> Dexterity and Wisdom <strong>Hit
      Point Die</strong> D8 per Disciple level <strong>Saving Throw  Proficiencies</strong> Strength and Dexterity <strong>Skill Proficiencies</strong> <em>Choose 2:</em> Acrobatics, Arcana, Athletics,
      History, Insight, Investigation, Religion, or Stealth <strong>Weapon  Proficiencies</strong> Simple weapons and Martial weapons that have the Light property <strong>Tool Proficiencies</strong> <em>Choose
      one type of Crafter’s Tools or </em> <em>Musician’s Instrument</em> <strong>Armor Training</strong> None <strong>Starting  Equipment</strong> <em>Choose A or B:</em> (A) Combat Knife, Combat Staff,
      2 Power Cells, Crafter’s Tools or Musician’s Instrument chosen for the tool proficiency above, Datapad (philosophy), Outrunner’s Pack, and $720; or (B) $3,000 Disciples follow the traditions developed
      by legendary philosopher heroes who taught throughout the galaxy, practicing their techniques to cultivate the connection between body and soul. They amplify and channel the energy of this balance,
      called Essence, directing its flow through their bodies to accomplish incredible feats beyond what’s naturally possible.</p><p>Essence flows through everything a Disciple does. They move with uncanny
      grace and speed, attack with strikes empowered by their very soul, supernaturally detect and avoid harm before it happens, shake off injury and sickness, and expand their minds and spirit.</p><p>Some
      Disciples gather into orders devoted to a particular philosopher hero, where they study the teachings and practice the techniques of these mythic figures with intense focus and dedication. Others
      intuitively find the path that expands their Essence and sharpens their soul connection. Some of these traditions have ties to greater powers and realms beyond the Stardust Rhapsody, drawing Disciples
      who follow them on quests to the galaxy’s edge and beyond.</p>'
    chat: ''
  source:
