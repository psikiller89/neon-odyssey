  description:
    value: <p><em>Dominate a Ravenous Parasite to Devour All</em> Symbiotes are Espers who have turned the tables by mentally dominating a mind-bending parasite from the Abyssal Void, forming a symbiotic
      union in which the Esper maintains control. They unleash this ravenous aberration to shred and devour their enemies, feeding it their own psionic power and life essence to satisfy its hunger and keep
      it obedient. Some Symbiotes maintain an adversarial relationship of jailer and prisoner with their abyssal passenger, while others embrace the Void until the line between host and parasite is eliminated
      entirely.</p>
