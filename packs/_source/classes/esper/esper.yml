system:
  description:
    value: '<h3>Core Esper Traits</h3><table class="core-class-traits"><tbody><tr><th scope="row"><p>Primary Ability</p></th><td><p>Choose 1: Intelligence or Charisma</p></td></tr><tr><th scope="row"><p>Hit
      Point Die</p></th><td><p>D6 per Esper level</p></td></tr><tr><th scope="row"><p>Saving Throw Proficiencies</p></th><td><p>Constitution and your Primary Ability</p></td></tr><tr><th scope="row"><p>Skill
      Proficiencies</p></th><td><p>Choose 2: Arcana, Deception, History, Insight, Intimidation, Investigation, or Persuasion</p></td></tr><tr><th scope="row"><p>Weapon Proficiencies</p></th><td><p>Simple
      weapons</p></td></tr><tr><th scope="row"><p>Armor Training</p></th><td><p>None</p></td></tr><tr><th scope="row"><p>Starting Equipment</p></th><td><p>Choose A or B: (A) Combat Knife, Light Laser Pistol,
      2 Power Cells, Occult Focus (crystal), Outrunner’s Pack, and $720; or (B) $3,000</p></td></tr></tbody></table><p><strong>Primary Ability</strong> <em>Choose 1:</em> Intelligence or Charisma <strong>Hit
      Point Die</strong> D6 per Esper level <strong>Saving Throw  Proficiencies</strong> Constitution and your Primary Ability <strong>Skill Proficiencies</strong> <em>Choose 2:</em> Arcana, Deception,
      History, Insight, Intimidation, Investigation, or Persuasion <strong>Weapon  Proficiencies</strong> Simple weapons <strong>Armor Training</strong> None <strong>Starting  Equipment</strong> <em>Choose
      A or B:</em> (A) Combat Knife, Light Laser Pistol, 2 Power Cells, Occult Focus (crystal), Outrunner’s Pack, and $720; or (B) $3,000 Espers possess awakened minds that push beyond the limits of the
      possible to harness the waves of psychic force that flow through the Stardust Rhapsody. This innate potential allows them to perform psionic magic that they mentally shape to their will. Once their
      power unlocks, Espers can manipulate the material world with a mere thought, infiltrate the minds of those around them, and achieve the seemingly impossible with their Psi.</p><p>They are typically
      born with a gift for psionics, which may manifest slowly over time or erupt in a single mind-altering moment. Whether their Psi is honed through rigorous training or they have an innate knack with
      psychic powers, their minds are destined to blossom into something more powerful than the limitations imposed by reality itself.</p><p>An Esper can arise anywhere in the galaxy, with little rhyme
      or reason to their homeworld, social standing, or species. The mysterious nature of their awakening, combined with the immense power of psionics, leads some Espers to isolate themselves for fear of
      losing control and accidentally harming others. Most, however, embrace their psychic potential in service to the communities they call home.</p>'
