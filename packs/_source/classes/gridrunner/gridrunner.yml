system:
  description:
    value: '<h3>Core Gridrunner Traits</h3><table class="core-class-traits"><tbody><tr><th scope="row"><p>Primary Ability</p></th><td><p>Intelligence</p></td></tr><tr><th scope="row"><p>Hit Point Die</p></th><td><p>D6
      per Gridrunner level</p></td></tr><tr><th scope="row"><p>Saving Throw Proficiencies</p></th><td><p>Intelligence and Wisdom</p></td></tr><tr><th scope="row"><p>Skill Proficiencies</p></th><td><p>Choose
      2: Arcana, Computers, History, Insight, Investigation, Medicine, Nature, Religion, or Technology</p></td></tr><tr><th scope="row"><p>Weapon Proficiencies</p></th><td><p>Simple weapons</p></td></tr><tr><th
      scope="row"><p>Tool Proficiencies</p></th><td><p>Spiking Deck</p></td></tr><tr><th scope="row"><p>Armor Training</p></th><td><p>None</p></td></tr><tr><th scope="row"><p>Starting Equipment</p></th><td><p>Choose
      A or B: (A) Combat Knife, Light Laser Pistol, 2 Power Cells, Spiking Deck, Hyperpad, Technician’s Pack, and $320; or (B) $3,500</p></td></tr></tbody></table><p><strong>Primary Ability</strong> Intelligence
      <strong>Hit Point Die</strong> D6 per Gridrunner level <strong>Saving Throw  Proficiencies</strong> Intelligence and Wisdom <strong>Skill Proficiencies</strong> <em>Choose 2:</em> Arcana, Computers,
      History, Insight, Investigation, Medicine, Nature, Religion, or Technology <strong>Weapon  Proficiencies</strong> Simple weapons <strong>Tool Proficiencies</strong> Spiking Deck <strong>Armor Training</strong>
      None <strong>Starting  Equipment</strong> <em>Choose A or B:</em> (A) Combat Knife, Light Laser Pistol, 2 Power Cells, Spiking Deck, Hyperpad, Technician’s Pack, and $320; or (B) $3,500 Gridrunners
      are magical programmers with the advanced knowledge to interface with the Hypergrid, the digital realm that overlays the entire galaxy. Through the use of computers and other technology, they can
      edit the code of reality to execute spells, which many refer to as “scripts.” This technomancy can take a wide variety of forms and perform a nearly countless number of functions, limited only by
      the Gridrunner’s skill and creativity.</p><p>Learning to code the Hypergrid is a monumental undertaking that requires years of study, countless hours of practice, and the patience to compile, debug,
      optimize, and patch increasingly complex scripts. Gridrunners can accomplish these seemingly impossible tasks through the use of their hyperpad, an extremely advanced portable computer that is continuously
      linked to the Hypergrid. Even still, Gridrunners are eternal learners, spending their lives refining their scripts and developing new solutions to any problem.</p><p>Every Gridrunner leaves their
      unique fingerprint on the Hypergrid and how they code it. Some are meticulous engineers who pride themselves on the most elegant and efficient scripts, while others are reckless hackers who improvise
      messy but ingenious workarounds. No matter their approach, Gridrunners are united by the endless pursuit to understand and master the code behind reality.</p>'
