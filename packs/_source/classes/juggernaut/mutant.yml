system:
  description:
    value: <p><em>Warp Your Flesh with Mutagenic Horror</em> The bodies of Mutants course with volatile mutagens that change them and grant them the ability to twist their flesh into grotesque new forms.
      From fleshy tendrils to extra shrieking mouths, these mutations rip apart enemies in both body and mind. Some mutants are transformed in an instant after being doused by radioactive ooze, while others
      are slowly changed from the eldritch corruption of otherworldly influence.</p><p>You can choose the origin of your mutation or determine it by rolling on the Mutation Origin table. You drank something
      ancient, and it was a bit slimy. You were exposed to the Void for an unknown amount of time. You were subjected to an experimental treatment that had some unexpected side effects. You fell into a
      vat of mysterious slime.</p>
