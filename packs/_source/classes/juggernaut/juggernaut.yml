name: Juggernaut
type: class
img: modules/neon-odyssey/icons/classes/juggernaut.png
system:
  description:
    value: '<h3>Core Juggernaut Traits</h3><table class="core-class-traits"><tbody><tr><th scope="row"><p>Primary Ability</p></th><td><p>Strength</p></td></tr><tr><th scope="row"><p>Hit Point Die</p></th><td><p>D12
      per Juggernaut level</p></td></tr><tr><th scope="row"><p>Saving Throw Proficiencies</p></th><td><p>Strength and Constitution</p></td></tr><tr><th scope="row"><p>Skill Proficiencies</p></th><td><p>Choose
      2: Athletics, History, Intimidation, Medicine, Perception, or Survival</p></td></tr><tr><th scope="row"><p>Weapon Proficiencies</p></th><td><p>Simple and Martial weapons</p></td></tr><tr><th scope="row"><p>Armor
      Training</p></th><td><p>Light and Medium armor and Shields</p></td></tr><tr><th scope="row"><p>Starting Equipment</p></th><td><p>Choose A or B: (A) Concussion Maul, Hand Cannon, 20 Shells, Power Cell,
      Magazine, Outrunner’s Pack, and $460; or (B) $6,500</p></td></tr></tbody></table><p><strong>Primary Ability</strong> Strength <strong>Hit Point Die</strong> D12 per Juggernaut level <strong>Saving
      Throw  Proficiencies</strong> Strength and Constitution <strong>Skill Proficiencies</strong> <em>Choose 2:</em> Athletics, History, Intimidation, Medicine, Perception, or Survival <strong>Weapon  Proficiencies</strong>
      Simple and Martial weapons <strong>Armor Training</strong> Light and Medium armor and Shields <strong>Starting  Equipment</strong> <em>Choose A or B:</em> (A) Concussion Maul, Hand Cannon, 20 Shells,
      Power Cell, Magazine, Outrunner’s Pack, and $460; or (B) $6,500 Juggernauts are shockingly resilient bruisers who charge headfirst into battle, ripping through walls and smashing their enemies. Their
      supernatural strength and endurance are fueled by a reservoir of concentrated kinetic energy called Surge that continually builds up within their core. By utilizing this force throughout their bodies,
      Juggernauts can push their physical forms beyond the limits of what should be possible.</p><p>A Juggernaut’s power manifests when the kinetic force that radiates throughout the galaxy inexplicably
      coalesces into a single body. This usually occurs at birth, although their abilities typically remain dormant until childhood or adolescence. Some activate later in life, when a near-death experience
      ignites their kinetic reservoir and forces their body to surge beyond its limits to survive.</p><p>Many Juggernauts are drawn to gritty and dangerous lines of work, proving extremely valuable in security
      forces or criminal organizations. Occasionally, they can be found using their supernatural resilience and raw strength to help others in crisis response or search-and-rescue. A rare few become single-minded
      in discovering just how far beyond their limits they can push their bodies.</p>'
