  description:
    value: <p><em>Become the Judgment of Life and Death</em> Arbiters are Enforcers who stand at the precipice of life and death, serving as the firm hand of the Harmony to preserve its natural cycle and
      destroy threats to the balance. They wield the Vital aspect to protect lives whose purpose remains unfilled and unleash the Somber aspect to cull those who have lingered beyond their allotted time.
      Many Arbiters strive for balance by holding themselves to the same cycle, but some pledge themselves to a singular aspect, becoming Vital shepherds or Somber reapers.</p>
