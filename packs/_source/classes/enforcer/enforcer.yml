img: modules/neon-odyssey/icons/classes/enforcer.png
system:
  description:
    value: '<h3>Core Enforcer Traits</h3><table class="core-class-traits"><tbody><tr><th scope="row"><p>Primary Ability</p></th><td><p>Strength and Charisma</p></td></tr><tr><th scope="row"><p>Hit Point
      Die</p></th><td><p>D10 per Enforcer level</p></td></tr><tr><th scope="row"><p>Saving Throw Proficiencies</p></th><td><p>Wisdom and Charisma</p></td></tr><tr><th scope="row"><p>Skill Proficiencies</p></th><td><p>Choose
      2: Athletics, Insight, Intimidation, Medicine, Persuasion, Religion, or Technology</p></td></tr><tr><th scope="row"><p>Weapon Proficiencies</p></th><td><p>Simple and Martial weapons</p></td></tr><tr><th
      scope="row"><p>Armor Training</p></th><td><p>Light, Medium, and Heavy armor and Shields</p></td></tr><tr><th scope="row"><p>Starting Equipment</p></th><td><p>Choose A or B: (A) Heavy Armor, Shield,
      Combat Sword, Shotgun, Power Cell, 20 Shells, Magazine, Cosmic Symbol or Hypertech Component Pack, Outrunner’s Pack and $210; or (B) $9,000</p></td></tr></tbody></table><p><strong>Primary Ability</strong>
      Strength and Charisma <strong>Hit Point Die</strong> D10 per Enforcer level <strong>Saving Throw  Proficiencies</strong> Wisdom and Charisma <strong>Skill Proficiencies</strong> <em>Choose 2:</em>
      Athletics, Insight, Intimidation, Medicine, Persuasion, Religion, or Technology <strong>Weapon  Proficiencies</strong> Simple and Martial weapons <strong>Armor Training</strong> Light, Medium, and
      Heavy armor and Shields <strong>Starting  Equipment</strong> <em>Choose A or B:</em> (A) Heavy Armor, Shield, Combat Sword, Shotgun, Power Cell, 20 Shells, Magazine, Cosmic Symbol or Hypertech Component
      Pack, Outrunner’s Pack and $210; or (B) $9,000 Enforcers are warriors defined by personal codes that they uphold with such unyielding conviction that they become imbued with cosmic power. They wield
      this transcendent might to rally their allies and subdue their enemies, serving as vanguards and guardians of their cherished ideals. Every combat technique, spell, and cosmic empowerment that they
      master serves the enforcement of their code, allowing them to make their principles manifest across the Stardust Rhapsody.</p><p>Every Enforcer unlocks their defining power in a single monumental
      moment that changes their life forever. It could be a glorious stand against overwhelming odds, a stunning discovery at the end of a relentless pursuit, or even a quiet, personal sacrifice made in
      service of their deepest conviction. Whatever form it takes, this moment of dedication draws the attention of the cosmos, and they are forever changed as Enforcers of their chosen code.</p><p>This
      new purpose leads Enforcers to seek out places where their devotional code has been corrupted or forsaken. Some wander the galaxy as lone avengers, while others find strength in the fellowship of
      like-minded crews, orders, or movements. Whether standing alone or shoulder-to-shoulder with allies, all Enforcers are relentlessly driven to see their code upheld.</p>'
    chat: ''
