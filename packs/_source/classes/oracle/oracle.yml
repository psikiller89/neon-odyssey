system:
  description:
    value: '<h3>Core Oracle Traits</h3><table class="core-class-traits"><tbody><tr><th scope="row"><p>Primary Ability</p></th><td><p>Wisdom</p></td></tr><tr><th scope="row"><p>Hit Point Die</p></th><td><p>D8
      per Oracle level</p></td></tr><tr><th scope="row"><p>Saving Throw Proficiencies</p></th><td><p>Wisdom and Charisma</p></td></tr><tr><th scope="row"><p>Skill Proficiencies</p></th><td><p>Choose 2:
      History, Insight, Medicine, Persuasion, or Religion</p></td></tr><tr><th scope="row"><p>Weapon Proficiencies</p></th><td><p>Simple weapons</p></td></tr><tr><th scope="row"><p>Armor Training</p></th><td><p>Light
      and Medium armor and Shields</p></td></tr><tr><th scope="row"><p>Starting Equipment</p></th><td><p>Choose A or B: (A) Medium Armor Vest, Shield, Heavy Laser Pistol, Shock Sap, 2 Power Cells, Cosmic
      Symbol (relic), Acolyte’s Pack, and $320; or (B) $7,000</p></td></tr></tbody></table><p><strong>Primary Ability</strong> Wisdom <strong>Hit Point Die</strong> D8 per Oracle level <strong>Saving Throw  Proficiencies</strong>
      Wisdom and Charisma <strong>Skill Proficiencies</strong> <em>Choose 2:</em> History, Insight, Medicine, Persuasion, or Religion <strong>Weapon  Proficiencies</strong> Simple weapons <strong>Armor
      Training</strong> Light and Medium armor and Shields <strong>Starting  Equipment</strong> <em>Choose A or B:</em> (A) Medium Armor Vest, Shield, Heavy Laser Pistol, Shock Sap, 2 Power Cells, Cosmic
      Symbol (relic), Acolyte’s Pack, and $320; or (B) $7,000 Oracles see beyond the mundane to commune with the grand cosmic forces that influence the Stardust Rhapsody. Chosen by these higher powers,
      they call upon the magic of the realms of existence to perform what many would call miracles. They serve as conduits of this otherworldly power to shape the paths of destiny.</p><p>The exact nature
      of their power depends on which realm, entity, or force they commune with, often enigmatic and not straightforward in its manifestation. They often serve the will of their benefactor, but some simply
      draw upon this power to advance their own personal aims. The miraculous feats of Oracles increase in scale as their cosmic bond strengthens.</p><p>Sometimes, Oracles gather in churches, orders, sects,
      or other organizations to amplify their collective power. Others go on personal vision quests to better connect with the cosmos, interpreting the signs as best they can. No matter the approach, all
      should heed the tidings or warnings of an Oracle.</p>'
