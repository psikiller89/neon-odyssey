system:
  description:
    value: <p><em>Weave the Currents of Life and Death as One</em> The Harmonious are Oracles who deeply feel and commune with the Harmony flowing through all things, from the first spark of life to the
      final, dying breath. They push and pull the flow of its Vital and Somber aspects at once, weaving them together as a single, unified force to restore allies and wither foes. Some Oracles with this
      heightened sense of the essence of life and death become empathic and nurturing, while others grow distant to mortal concerns, seeing each life as just a single note in the grand scale of the Harmony.</p>
