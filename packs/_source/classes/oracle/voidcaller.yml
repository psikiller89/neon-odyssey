system:
  description:
    value: <p><em>Herald the Eldritch Horrors Beyond the Galaxy</em> Voidcallers are Oracles who call into the unknowable emptiness of the Abyssal Void and listen for when it whispers back. They open the
      way for eldritch entities from outside space and time to enter the galaxy and warp reality by offering their foes’ bodies and minds as a sacrificial meal. Most Voidcallers reach out to the infinite
      hunger of the behemoths of the Deep, but some find an indifferent or even strangely benevolent patron to serve.</p>
