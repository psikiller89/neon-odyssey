system:
  description:
    value: '<h3>Core Scoundrel Traits</h3><table class="core-class-traits"><tbody><tr><th scope="row"><p>Hit Point Die</p></th><td><p>D8 per Scoundrel level</p></td></tr><tr><th scope="row"><p>Saving Throw
      Proficiencies</p></th><td><p>Dexterity and Intelligence</p></td></tr><tr><th scope="row"><p>Skill Proficiencies</p></th><td><p>Choose 4: Acrobatics, Athletics, Computers, Deception, Insight, Intimidation,
      Investigation, Perception, Persuasion, Sleight of Hand, Stealth, or Technology</p></td></tr><tr><th scope="row"><p>Weapon Proficiencies</p></th><td><p>Simple weapons, and Martial weapons that have
      the Finesse or Light property</p></td></tr><tr><th scope="row"><p>Tool Proficiencies</p></th><td><p>Choose Bypass Tools or Spiking Deck</p></td></tr><tr><th scope="row"><p>Armor Training</p></th><td><p>Light
      armor</p></td></tr><tr><th scope="row"><p>Starting Equipment</p></th><td><p>Choose A or B: (A) Light Armor, 2 Combat Knives, Quickblade, Light Laser Pistol, Light Pistol, 20 Bullets, 4 Power Cells,
      Magazine, Bypass Tools or Spiking Deck chosen for the proficiency above, Intruder’s Pack, and $755; or (B) $6,000</p></td></tr></tbody></table><p><strong>Hit Point Die</strong> D8 per Scoundrel level
      <strong>Saving Throw  Proficiencies</strong> Dexterity and Intelligence <strong>Skill Proficiencies</strong> <em>Choose 4:</em> Acrobatics, Athletics, Computers, Deception, Insight, Intimidation,
      Investigation, Perception, Persuasion, Sleight of Hand, Stealth, or Technology <strong>Weapon  Proficiencies</strong> Simple weapons, and Martial weapons that have the Finesse or Light property <strong>Tool
      Proficiencies</strong> <em>Choose Bypass Tools or Spiking Deck</em> <strong>Armor Training</strong> Light armor <strong>Starting  Equipment</strong> <em>Choose A or B:</em> (A) Light Armor, 2 Combat
      Knives, Quickblade, Light Laser Pistol, Light Pistol, 20 Bullets, 4 Power Cells, Magazine, Bypass Tools or Spiking Deck chosen for the proficiency above, Intruder’s Pack, and $755; or (B) $6,000 Scoundrels
      use their sharp wits, daring physical feats, and subterfuge to strike foes where and when they are weakest, whether in a fight or across the negotiation table. Though they are known for incredible
      bouts of luck, the truth is, Scoundrels make their own fortune. Even so, many carry a lucky set of dice or other talisman.</p><p>They hone their guile and practical skills while keeping an eye out
      for every opportunity, never willing to let one pass without taking a cut for themselves. Many Scoundrels are highly persuasive fast talkers with a magnetic swagger, while others focus on subtler
      skills useful in sabotage or infiltration.</p><p>Scoundrels do whatever it takes to get the edge on their opponents in combat, not shying away from cheap tricks and underhanded tactics. They often
      rely on precision and subtlety, choosing to take the perfect shot or chance a lucky break to turn the tide in battle.</p><p>Most Scoundrels are individualists doing what they must to make their way
      in a dangerous galaxy. Some are drawn to the perks of a criminal life in the galactic underworld, while others attempt to make an honest living —as long as it suits them.</p>'
