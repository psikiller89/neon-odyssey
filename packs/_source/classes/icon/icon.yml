system:
  description:
    value: '<h3>Core Icon Traits</h3><table class="core-class-traits"><tbody><tr><th scope="row"><p>Hit Point Die</p></th><td><p>D8 per Icon level</p></td></tr><tr><th scope="row"><p>Saving Throw Proficiencies</p></th><td><p>Dexterity
      and Charisma</p></td></tr><tr><th scope="row"><p>Skill Proficiencies</p></th><td><p>Choose any 3 skills</p></td></tr><tr><th scope="row"><p>Weapon Proficiencies</p></th><td><p>Simple weapons</p></td></tr><tr><th
      scope="row"><p>Tool Proficiencies</p></th><td><p>Choose Artist’s Supplies or 3 Musician’s Instruments (see the Equipment section)</p></td></tr><tr><th scope="row"><p>Armor Training</p></th><td><p>Light
      armor</p></td></tr><tr><th scope="row"><p>Starting Equipment</p></th><td><p>Choose A or B: (A) Light Armor, Combat Knife, Light Laser Pistol, 2 Power Cells, choose Artist’s Supplies or Musician’s
      Instrument or Hypertech Component Pack, Performer’s Pack, and $760; or (B) $5,500</p></td></tr></tbody></table><p><strong>Hit Point Die</strong> D8 per Icon level <strong>Saving Throw  Proficiencies</strong>
      Dexterity and Charisma <strong>Skill Proficiencies</strong> <em>Choose any 3 skills</em> <strong>Weapon  Proficiencies</strong> Simple weapons <strong>Tool Proficiencies</strong> <em>Choose Artist’s
      Supplies or 3 Musician’s </em> <em>Instruments</em> (see the Equipment section) <strong>Armor Training</strong> Light armor <strong>Starting  Equipment</strong> <em>Choose A or B:</em> (A) Light Armor,
      Combat Knife, Light Laser Pistol, 2 Power Cells, choose Artist’s Supplies or Musician’s Instrument or Hypertech Component Pack, Performer’s Pack, and $760; or (B) $5,500 Icons are living voices of
      the Stardust Rhapsody, the grand cosmic melody that created and still echoes through the galaxy. Icons feel this song of creation—sometimes called the song of existence—deep within themselves, resonating
      with the galactic symphony to perform melodic magic. Their unique talent to perceive and weave the Rhapsody also allows them to directly touch the cosmic note within those around them, instilling
      them with uplifting hope and inspiration.</p><p>Every life lived, every story told, and every tune sung is a new note in the song of existence. As a result, most Icons spend much of their lives traveling
      across the Stardust Rhapsody to experience as much of its inspiring beauty as possible. They seek out strong connections with friends, loved ones, and allies that string together into a melody unique
      to them.</p><p>While many Icons are musicians, the song of creation answers to all forms of artistic expression including visual arts, dance, and spoken word. There are even those who harness its
      power as an activist, reporter, streamer, and other forms of influence and entertainment. No matter the form of expression, they seek to inspire others to add their voices to the great cosmic chorus.</p>'
