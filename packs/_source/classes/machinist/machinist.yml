system:
  description:
    value: '<h3>Core Machinist Traits</h3><table class="core-class-traits"><tbody><tr><th scope="row"><p>Primary Ability</p></th><td><p>Intelligence</p></td></tr><tr><th scope="row"><p>Hit Point Die</p></th><td><p>D8
      per Machinist level</p></td></tr><tr><th scope="row"><p>Saving Throw Proficiencies</p></th><td><p>Constitution and Intelligence</p></td></tr><tr><th scope="row"><p>Skill Proficiencies</p></th><td><p>Choose
      2: Arcana, Computers, History, Investigation, Medicine, Nature, Perception, Sleight of Hand, or Technology</p></td></tr><tr><th scope="row"><p>Weapon Proficiencies</p></th><td><p>Simple weapons</p></td></tr><tr><th
      scope="row"><p>Tool Proficiencies</p></th><td><p>Bypass Tools, Mechanic’s Tools, and one type of Crafter’s Tools of your choice</p></td></tr><tr><th scope="row"><p>Armor Training</p></th><td><p>Light
      and Medium armor and Shields</p></td></tr><tr><th scope="row"><p>Starting Equipment</p></th><td><p>Choose A or B: (A) Medium Armor Suit, Combat Knife, Laser Carbine, 2 Power Cells, Bypass Tools, Mechanic’s
      Tools, Technician’s Pack, and $320; or (B) $8,500</p></td></tr></tbody></table><ul><li><p>Gain the Machinist’s level 1 features, which are listed in the Machinist Features table. See the multiclassing
      rules in the<em> D&amp;D Beyond Basic Rules</em> to determine your available spell slots, adding half your Machinist levels (round up).</p></li></ul>'
