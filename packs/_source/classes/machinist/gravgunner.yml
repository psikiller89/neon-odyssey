system:
  description:
    value: <p><em>Weaponize Gravity with High-Tech Heavy Weaponry</em> Gravgunners are Machinists who specialize in exceedingly complex, advanced, and rare technology that manipulates the force of gravity
      and space itself. They utilize their discovery of a condensed singularity, miniaturized warp gate, or similar gravitational phenomenon to power a cutting-edge heavy weapon to blast foes with devastating,
      experimental gravitons capable of warping space or dematerializing their targets. Their impossibly heavy grav guns can only be lifted due to built-in anti-grav adaptations, and manipulating such a
      weapon is so complicated that none but Gravgunners themselves can even fire the weapons.</p>
